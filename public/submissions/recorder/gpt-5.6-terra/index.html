<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Recorder</title><style>*{box-sizing:border-box}body{margin:0;background:#101014;color:#fff;font-family:system-ui;min-height:100vh;display:grid;place-items:center}.app{width:min(92vw,460px);padding:30px;border-radius:28px;background:linear-gradient(145deg,#29292f,#151519);box-shadow:20px 25px 50px #0008}.top{display:flex;justify-content:space-between;color:#a9a9b3}.dot{color:#ff4b5c;font-size:22px}.time{font:700 64px ui-monospace;text-align:center;margin:24px 0}.wave{height:90px;display:flex;align-items:center;justify-content:center;gap:5px}.wave i{width:5px;height:12px;background:#ff5263;border-radius:9px;transition:.3s}.rec .wave i{animation:w .7s ease-in-out infinite alternate}.wave i:nth-child(3n){animation-delay:.2s}.wave i:nth-child(4n){animation-delay:.45s}@keyframes w{to{height:70px;box-shadow:0 0 12px #f45}}button{border:0;border-radius:50%;width:58px;height:58px;color:white;background:#33343b;font-weight:bold;cursor:pointer}.go{background:#ff5061;width:72px;height:72px}.controls{display:flex;justify-content:center;gap:18px;margin-top:18px}.summary{margin-top:22px;padding:14px;background:#ffffff0d;border-radius:12px;color:#babac4;display:none}.summary.show{display:block}</style><main class="app" id="app"><div class="top"><span id="state"><b class="dot">●</b> READY</span><span>VOICE NOTE</span></div><div class="time" id="time">00:00</div><div class="wave" id="wave"></div><div class="controls"><button id="stop">STOP</button><button class="go" id="go">START</button><button id="pause">PAUSE</button></div><div class="summary" id="sum"></div></main><script>for(let i=0;i<35;i++)wave.innerHTML+='<i></i>';let sec=0,run=false,t;let fmt=()=>String(sec/60|0).padStart(2,'0')+':'+String(sec%60).padStart(2,'0');function paint(){time.textContent=fmt();app.classList.toggle('rec',run);state.innerHTML=run?'<b class="dot">●</b> RECORDING':sec?'PAUSED':'<b class="dot">●</b> READY';go.textContent=run?'REC':'START'}function start(){if(!run){run=true;t=setInterval(()=>{sec++;paint()},1000);sum.classList.remove('show');paint()}}go.onclick=start;pause.onclick=()=>{if(run){run=false;clearInterval(t);paint()}};stop.onclick=()=>{if(!sec)return;if(confirm('停止并保存这段录音？')){run=false;clearInterval(t);sum.textContent='录音摘要 · 已保存 · 时长 '+fmt();sum.classList.add('show');sec=0;paint()}};paint()</script></html>
