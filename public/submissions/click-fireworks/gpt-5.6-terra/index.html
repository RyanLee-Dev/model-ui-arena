<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fireworks</title><style>html,body,canvas{margin:0;width:100%;height:100%;overflow:hidden;background:#050817}p{position:fixed;top:15px;width:100%;text-align:center;color:#c9d7ff;font:14px system-ui;letter-spacing:3px;pointer-events:none;text-shadow:0 0 10px #70a5ff}</style><canvas id="c"></canvas><p>点击夜空 · 点燃今夜</p><script>let x=c.getContext('2d'),ps=[];function size(){c.width=innerWidth*devicePixelRatio;c.height=innerHeight*devicePixelRatio;x.scale(devicePixelRatio,devicePixelRatio)}size();onresize=size;function boom(a,b){let hue=Math.random()*360;for(let i=0;i<90;i++){let q=Math.PI*2*i/90+(Math.random()-.5)*.15,v=2+Math.random()*5;ps.push({x:a,y:b,vx:Math.cos(q)*v,vy:Math.sin(q)*v,h:hue+Math.random()*40,l:1})}}addEventListener('pointerdown',e=>boom(e.clientX,e.clientY));function loop(){x.fillStyle='rgba(5,8,23,.18)';x.fillRect(0,0,innerWidth,innerHeight);ps=ps.filter(p=>p.l>.02);for(let p of ps){p.x+=p.vx;p.y+=p.vy;p.vy+=.045;p.vx*=.985;p.l*=.975;x.fillStyle=`hsla(${p.h},100%,65%,${p.l})`;x.shadowBlur=12;x.shadowColor=x.fillStyle;x.fillRect(p.x,p.y,2,2)}x.shadowBlur=0;requestAnimationFrame(loop)}boom(innerWidth/2,innerHeight/2);loop()</script></html>
