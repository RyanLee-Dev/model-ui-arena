<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>夜空庆典 · Fireworks</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden;background:#040711}
body{font-family:ui-sans-serif,system-ui,"PingFang SC","Microsoft YaHei",sans-serif}
canvas{display:block;position:fixed;inset:0;width:100%;height:100%;touch-action:none;cursor:crosshair}
.hint{position:fixed;top:22px;left:0;right:0;text-align:center;color:rgba(220,232,255,.65);
  font-size:13px;letter-spacing:.32em;pointer-events:none;animation:float 3s ease-in-out infinite}
@keyframes float{0%,100%{opacity:.45;transform:translateY(0)}50%{opacity:1;transform:translateY(4px)}}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div class="hint">点 击 夜 空 · 点 燃 烟 花</div>
<script>
const cv=document.getElementById('cv'),ctx=cv.getContext('2d');
let W=0,H=0,DPR=Math.min(devicePixelRatio||1,2);
const MAXP=4200,P=[],R=[],TW=[],PAL=[[18,96],[326,88],[278,94],[204,92],[46,95],[150,90]];
let sky=null;
function resize(){
  DPR=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;
  cv.width=W*DPR;cv.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0);
  buildSky();
}
function star(a,x,y,s){a.fillStyle='rgba(230,240,255,.9)';a.beginPath();a.arc(x,y,s,0,7);a.fill();}
function buildSky(){
  sky=document.createElement('canvas');sky.width=W*DPR;sky.height=H*DPR;
  const a=sky.getContext('2d');a.setTransform(DPR,0,0,DPR,0,0);
  const g=a.createLinearGradient(0,0,0,H);
  g.addColorStop(0,'#02040d');g.addColorStop(.55,'#0a1030');g.addColorStop(1,'#151a3e');
  a.fillStyle=g;a.fillRect(0,0,W,H);
  for(let i=0;i<110;i++){
    const x=Math.random()*W,y=Math.random()*H*.82,s=.4+Math.random()*1.3;
    star(a,x,y,s);if(Math.random()<.4)star(a,x,y,s*.4);
  }
  a.fillStyle='rgba(238,244,255,.92)';a.beginPath();a.arc(W*.82,H*.16,26,0,7);a.fill();
  a.fillStyle='rgba(4,8,20,.45)';a.beginPath();a.arc(W*.86,H*.15,20,0,7);a.fill();
  a.fillStyle='rgba(6,9,22,.9)';a.beginPath();
  a.moveTo(0,H);a.lineTo(0,H-H*.13);
  const n=14;
  for(let i=0;i<=n;i++){
    const x=i*W/n+Math.sin(i*7.3)*4,y=H-H*(.07+Math.abs(Math.sin(i*1.9))*.09+Math.random()*.03);
    a.lineTo(x,y);
  }
  a.lineTo(W,H);a.closePath();a.fill();
  a.fillStyle='rgba(255,214,110,.75)';
  for(let i=0;i<26;i++){const x=Math.random()*W;if(x<W*.16||x>W*.84)continue;
    a.fillRect(x,H-H*.1*Math.random(),1.4,2.6);}
}
function burst(x,y){
  const hue=PAL[Math.random()*PAL.length|0];
  const core=Math.random()<.25?'#fff':'hsl('+hue[0]+',100%,78%)';
  const n=70+Math.random()*50|0,base=Math.random()*Math.PI*2;
  for(let i=0;i<n;i++){
    if(P.length>=MAXP)return;
    const sp=2.2+Math.pow(Math.random(),.6)*6.4,a=base+i*Math.PI*2/n;
    P.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life:1,dec:.008+Math.random()*.012,
      h:Math.random()<.16?hue[0]:hue[0]+(Math.random()*28-14),r:.8+Math.random()*1.7,
      g:.045+Math.random()*.03});
  }
  for(let i=0;i<10;i++){
    const a=Math.random()*Math.PI*2,sp=Math.random()*2.4;
    TW.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life:1,h:hue[0]});
  }
  R.push({x,y,r:2,v:2.6+Math.random()*1.6,life:1});
}
function step(dt){
  ctx.drawImage(sky,0,0,W,H);
  for(let i=P.length-1;i>=0;i--){
    const p=P[i];
    p.life-=p.dec*dt;if(p.life<=0){P.splice(i,1);continue;}
    p.vy+=p.g*dt;p.vx*=.988;p.vy*=.988;p.x+=p.vx*dt;p.y+=p.vy*dt;
    const a=Math.max(0,p.life);
    ctx.fillStyle=`hsla(${p.h},92%,${58+22*p.life}%,${a})`;
    ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,7);ctx.fill();
  }
  for(let i=TW.length-1;i>=0;i--){
    const t=TW[i];t.life-=.016*dt;
    if(t.life<=0){TW.splice(i,1);continue;}
    t.x+=t.vx*dt;t.y+=t.vy*dt;t.vx*=.96;t.vy*=.96;
    const fl=.5+.5*Math.sin(performance.now()/42+i*9);
    ctx.fillStyle=`hsla(${t.h},95%,82%,${t.life*(.35+.65*fl)})`;
    ctx.fillRect(t.x-.7,t.y-.7,1.4,1.4);
  }
  for(let i=R.length-1;i>=0;i--){
    const r=R[i];r.life-=.028*dt;r.r+=r.v*dt;
    if(r.life<=0){R.splice(i,1);continue;}
    ctx.strokeStyle=`rgba(255,255,255,${r.life*.5})`;
    ctx.lineWidth=1.4;ctx.beginPath();ctx.arc(r.x,r.y,r.r,0,7);ctx.stroke();
  }
}
let last=0;
function frame(t){
  const dt=Math.min(2,(t-last)/16.7)||1;last=t;
  step(dt);requestAnimationFrame(frame);
}
addEventListener('pointerdown',e=>burst(e.clientX,e.clientY));
addEventListener('resize',resize);
resize();requestAnimationFrame(frame);
</script>
</body>
</html>
