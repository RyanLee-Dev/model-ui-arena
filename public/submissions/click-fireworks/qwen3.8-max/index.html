<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>点击放烟花 · 星夜花火会</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{overflow:hidden;background:linear-gradient(180deg,#0b1334 0%,#0a1130 36%,#060a1c 70%,#03040b 100%);font-family:-apple-system,"PingFang SC","Noto Sans SC",sans-serif;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
body::after{content:"";position:fixed;inset:0;z-index:2;pointer-events:none;background:radial-gradient(130% 70% at 50% 108%,rgba(98,76,152,.22),transparent 55%)}
.st{position:fixed;top:0;left:0;width:2px;height:2px;border-radius:50%;z-index:1;animation:tw 4.6s ease-in-out infinite;will-change:transform}
#s2{animation-duration:7.2s;animation-delay:-2.4s}
@keyframes tw{0%,100%{opacity:.35}50%{opacity:1}}
.moon{position:fixed;top:6vh;right:8vw;width:clamp(46px,8vw,64px);aspect-ratio:1;border-radius:50%;z-index:1;background:radial-gradient(circle at 36% 32%,#fffbe9,#f3e3b3 58%,#dcc389);box-shadow:0 0 34px 10px rgba(255,242,205,.28),0 0 110px 34px rgba(255,242,205,.1);animation:mf 9s ease-in-out infinite}
.moon::before{content:"";position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle at 62% 58%,rgba(186,156,102,.5) 0 7%,transparent 8%),radial-gradient(circle at 40% 70%,rgba(186,156,102,.4) 0 5%,transparent 6%),radial-gradient(circle at 70% 28%,rgba(186,156,102,.35) 0 4%,transparent 5%)}
@keyframes mf{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
#sky{position:fixed;left:0;right:0;bottom:0;width:100%;height:clamp(110px,24vh,200px);z-index:3}
.wa{animation:wf 3.6s ease-in-out infinite}
.wb{animation:wf 4.7s ease-in-out -1.8s infinite}
.wc{animation:wf 5.9s ease-in-out -3.1s infinite}
@keyframes wf{0%,100%{opacity:.22}50%{opacity:.95}}
.bc{animation:bc 1.6s ease-in-out infinite}
@keyframes bc{0%,100%{opacity:.15}55%{opacity:1}}
#fx{position:fixed;inset:0;z-index:4}
#fg{position:fixed;left:0;right:0;bottom:0;height:clamp(64px,15vh,130px);z-index:5;background:#020308;clip-path:polygon(0 100%,0 46%,5% 46%,5% 22%,8% 22%,8% 38%,13% 38%,13% 12%,15% 12%,15% 5%,16.5% 5%,16.5% 12%,18% 12%,18% 34%,24% 34%,24% 52%,31% 52%,31% 28%,34% 28%,34% 18%,36% 18%,36% 28%,39% 28%,39% 48%,47% 48%,47% 24%,52% 24%,52% 40%,59% 40%,59% 14%,60.5% 14%,60.5% 7%,61.5% 7%,61.5% 14%,63% 14%,63% 36%,70% 36%,70% 30%,77% 30%,77% 44%,84% 44%,84% 26%,88% 26%,88% 38%,94% 38%,94% 20%,100% 20%,100% 100%)}
#brand{position:fixed;top:calc(14px + env(safe-area-inset-top));left:18px;z-index:9;color:rgba(226,232,255,.55);font-size:12px;font-weight:300;letter-spacing:.34em;text-shadow:0 1px 6px rgba(0,0,0,.7)}
#hud{position:fixed;top:calc(12px + env(safe-area-inset-top));right:16px;z-index:9;display:flex;align-items:baseline;gap:7px;color:rgba(226,232,255,.72);font-size:11px;letter-spacing:.22em;font-variant-numeric:tabular-nums;text-shadow:0 1px 6px rgba(0,0,0,.7)}
#hud b{display:inline-block;font-size:21px;font-weight:600;letter-spacing:0;color:#ffd98a}
#hud.pop b{animation:pop .45s ease}
@keyframes pop{0%{transform:scale(1)}35%{transform:scale(1.4);color:#fff}100%{transform:scale(1)}}
#hint{position:fixed;left:0;right:0;top:37vh;z-index:9;text-align:center;pointer-events:none;color:rgba(236,241,255,.88);font-size:clamp(14px,3.6vw,19px);font-weight:300;letter-spacing:.42em;text-indent:.42em;text-shadow:0 0 18px rgba(160,180,255,.55),0 2px 8px rgba(0,0,0,.65);animation:br 3.4s ease-in-out infinite;transition:opacity 1.1s ease,transform 1.1s ease}
#hint small{display:block;margin-top:15px;font-size:10px;letter-spacing:.52em;color:rgba(190,200,235,.42)}
#hint.off{animation:none;opacity:0;transform:translateY(-14px)}
@keyframes br{0%,100%{opacity:.5}50%{opacity:1}}
@media (prefers-reduced-motion:reduce){.st,.moon,#hint{animation:none}}
</style>
</head>
<body>
<div class="st" id="s1"></div><div class="st" id="s2"></div>
<div class="moon"></div>
<svg id="sky" viewBox="0 0 1200 170" preserveAspectRatio="none" aria-hidden="true">
<path fill="#0c1330" d="M0 170V104h52V82h40V64h28v16h46V44h20l9-20 9 20h26v36h56V58h42v22h60V50h36v30h48V92h44V60h26V38h12v-9h6v9h12v22h28v32h62V72h46v26h66V60h38v40h76V88h50v-18h36v18h42V104H1200V170Z"/>
<path fill="#070b1e" d="M0 170v-38h64v-16h44v16h58V96h34v36h72v-22h52v22h66V88h40v44h78v-30h48v30h70v-24h44v24h82v-18h56v18h72v-28h46v28h68V118h46v52Z"/>
<g fill="#ffcf7e"><rect class="wa" x="14" y="120" width="4" height="5"/><rect class="wb" x="30" y="132" width="4" height="5"/><rect class="wc" x="64" y="100" width="4" height="5"/><rect class="wa" x="78" y="114" width="4" height="5"/><rect class="wb" x="232" y="98" width="4" height="5"/><rect class="wc" x="318" y="76" width="4" height="5"/><rect class="wa" x="332" y="94" width="4" height="5"/><rect class="wb" x="416" y="68" width="4" height="5"/><rect class="wc" x="430" y="88" width="4" height="5"/><rect class="wa" x="598" y="74" width="4" height="5"/><rect class="wb" x="640" y="106" width="4" height="5"/><rect class="wc" x="742" y="112" width="4" height="5"/><rect class="wa" x="782" y="122" width="4" height="5"/><rect class="wb" x="846" y="78" width="4" height="5"/><rect class="wc" x="894" y="112" width="4" height="5"/><rect class="wa" x="1052" y="118" width="4" height="5"/><rect class="wb" x="1130" y="126" width="4" height="5"/></g>
<g fill="#a8d4ff"><rect class="wc" x="500" y="106" width="4" height="5"/><rect class="wa" x="662" y="118" width="4" height="5"/><rect class="wb" x="966" y="102" width="4" height="5"/><rect class="wc" x="1088" y="132" width="4" height="5"/></g>
<circle class="bc" cx="557" cy="26" r="2.4" fill="#ff6272"/>
</svg>
<div id="fg"></div>
<div id="brand">星夜 · 花火会</div>
<div id="hud"><b id="cnt">0</b><span>次绽放</span></div>
<div id="hint">轻触任意位置 · 点亮庆典<small>TAP ANYWHERE · LIGHT THE NIGHT</small></div>
<canvas id="fx"></canvas>
<script>
'use strict';
const $=s=>document.querySelector(s);
const cv=$('#fx'),ctx=cv.getContext('2d'),hint=$('#hint'),hud=$('#hud'),cnt=$('#cnt'),s1=$('#s1'),s2=$('#s2');
let W,H,bursts=0,touched=false,AC=null,nextAmb=performance.now()+900;
function resize(){const d=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;
 cv.width=W*d;cv.height=H*d;cv.style.width=W+'px';cv.style.height=H+'px';ctx.setTransform(d,0,0,d,0,0);}
addEventListener('resize',resize);resize();
const PAL=[
 ['#ffd98a','#ffb84d','#fff2c9','#ff9a3d','#ffe9b0'],
 ['#ff6fb0','#ff9de0','#5ee6ff','#c86bff','#8ff7ff'],
 ['#59ffb0','#a5ffd0','#2fe0a0','#eafff2','#7dffc4'],
 ['#ff5a6e','#ff8f7a','#ffc46b','#ff7ad9','#ffd0a0'],
 ['#8fb7ff','#c9ddff','#5e8bff','#eaf2ff','#a5c8ff']];
const parts=[],rockets=[],MAX=800,G=0.05,RKG=0.07;
const rnd=(a,b)=>a+Math.random()*(b-a);
function boom(big){
 if(!AC)return;const t=AC.currentTime,o=AC.createOscillator(),g=AC.createGain();
 o.type='sine';o.frequency.setValueAtTime(big?140:210,t);o.frequency.exponentialRampToValueAtTime(42,t+0.5);
 g.gain.setValueAtTime(big?0.45:0.28,t);g.gain.exponentialRampToValueAtTime(0.001,t+0.55);
 o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+0.6);
}
function spawn(x,y,vx,vy,c,s,dec,tw,g,dr){
 if(parts.length>=MAX)parts.splice(0,parts.length-MAX+1);
 parts.push({x,y,vx,vy,c,s,dec,l:1,tw:tw?rnd(0,6.28):0,tf:rnd(9,22),g,dr});
}
function burst(x,y,pal,R){
 bursts++;cnt.textContent=bursts;
 hud.classList.remove('pop');void hud.offsetWidth;hud.classList.add('pop');
 boom(R>Math.min(W,H)*0.21);
 const n=70+(Math.random()*50|0),ring=Math.random()<0.16;
 for(let i=0;i<n;i++){
  const a=Math.random()*6.283,v=R/22*(ring?rnd(0.92,1.02):rnd(0.45,1));
  const tw=Math.random()<0.3,c=pal[Math.random()*pal.length|0];
  spawn(x,y,Math.cos(a)*v,Math.sin(a)*v,c,tw?rnd(0.9,1.5):rnd(1.4,2.6),tw?rnd(0.005,0.009):rnd(0.008,0.016),tw,G,0.955);
 }
 spawn(x,y,0,0,'#fff',Math.min(R*0.11,15),0.22,false,0,1);
}
function launch(x,ty){
 if(rockets.length>10)return;
 const pal=PAL[Math.random()*PAL.length|0],y=H+8,R=Math.min(W,H)*rnd(0.15,0.27);
 rockets.push({x:x+rnd(-12,12),y,ty,vy:-Math.sqrt(2*RKG*(y-ty))*rnd(1.03,1.13),vx:rnd(-0.4,0.4),pal,R});
}
function step(){
 requestAnimationFrame(step);
 const now=performance.now();
 ctx.globalCompositeOperation='destination-out';
 ctx.fillStyle='rgba(0,0,0,0.18)';ctx.fillRect(0,0,W,H);
 ctx.globalCompositeOperation='lighter';
 for(let i=rockets.length-1;i>=0;i--){const r=rockets[i];
  r.vy+=RKG;r.x+=r.vx;r.y+=r.vy;
  spawn(r.x+rnd(-1,1),r.y+rnd(0,4),rnd(-0.3,0.3),rnd(0.5,1.5),'#ffcf7a',rnd(0.8,1.4),0.05,false,0.02,0.94);
  ctx.fillStyle='#fff6dd';ctx.globalAlpha=1;
  ctx.beginPath();ctx.arc(r.x,r.y,2.2,0,6.283);ctx.fill();
  ctx.globalAlpha=0.25;ctx.beginPath();ctx.arc(r.x,r.y,6,0,6.283);ctx.fill();
  if(r.vy>-1.2||r.y<=r.ty){rockets.splice(i,1);burst(r.x,r.y,r.pal,r.R);}
 }
 for(let i=parts.length-1;i>=0;i--){const p=parts[i];
  p.vx*=p.dr;p.vy=p.vy*p.dr+p.g;p.x+=p.vx;p.y+=p.vy;p.l-=p.dec;
  if(p.l<=0){parts[i]=parts[parts.length-1];parts.pop();continue;}
  let a=p.l;if(p.tw)a*=Math.sin(now*0.01*p.tf+p.tw)>0?1:0.25;
  const r=p.s*(0.5+0.5*p.l);
  ctx.fillStyle=p.c;
  ctx.globalAlpha=a*0.22;ctx.beginPath();ctx.arc(p.x,p.y,r*2.6,0,6.283);ctx.fill();
  ctx.globalAlpha=a;ctx.beginPath();ctx.arc(p.x,p.y,r,0,6.283);ctx.fill();
 }
 ctx.globalAlpha=1;
 if(now>nextAmb&&parts.length<420){launch(rnd(W*0.12,W*0.88),rnd(H*0.16,H*0.42));nextAmb=now+rnd(2400,4800);}
}
step();
function tap(x,y){
 if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}
 if(AC&&AC.state==='suspended')AC.resume();
 launch(x,Math.max(60,y));
 if(!touched){touched=true;hint.classList.add('off');}
}
addEventListener('pointerdown',e=>tap(e.clientX,e.clientY));
if(!window.PointerEvent){
 addEventListener('touchstart',e=>tap(e.touches[0].clientX,e.touches[0].clientY),{passive:true});
 addEventListener('mousedown',e=>tap(e.clientX,e.clientY));
}
addEventListener('pointermove',e=>{
 const dx=e.clientX/W-0.5,dy=e.clientY/H-0.5;
 s1.style.transform='translate('+dx*-8+'px,'+dy*-5+'px)';
 s2.style.transform='translate('+dx*-16+'px,'+dy*-10+'px)';
});
[[s1,110],[s2,70]].forEach(([el,n])=>{
 const c=['#fff','#fff','#ffe9c9','#cfe2ff'],s=[];
 for(let i=0;i<n;i++)s.push((Math.random()*100).toFixed(1)+'vw '+(Math.random()*72).toFixed(1)+'vh 0 '+(Math.random()<0.8?0:1)+'px '+c[Math.random()*4|0]);
 el.style.boxShadow=s.join(',');
});
</script>
</body>
</html>
