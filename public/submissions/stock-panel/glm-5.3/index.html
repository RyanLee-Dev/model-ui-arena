<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>行情 · Stocks</title>
<!--
设计说明：
1. A 股配色语义（红涨绿跌），行情列表 + 主图联动：点选任一股票切换大图（面积渐变趋势 + 网格 + 昨收基准线）。
2. 假流式行情：每 1.1 秒随机游走更新价格并推送历史序列，价格数字与行背景闪烁红/绿，滚动 Ticker 同步跳动。
3. 风险提示：基于近 20 个样本的波动率自动计算「低/中/高波动」徽标，并在面板顶部给出图例说明。
4. 趋势图分两层：列表内嵌迷你 Sparkline，主图 60 点序列实时推进；390px 下单列自适应。
-->
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{min-height:100vh;background:radial-gradient(900px 480px at 80% -10%,#16233f,#0a0e18 55%),#0a0e18;color:#e7eef9;font-family:"SF Pro Text","PingFang SC",system-ui,sans-serif;padding:18px}
.wrap{max-width:960px;margin:0 auto}
.head{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:12px}
h1{font-size:20px;font-weight:700;letter-spacing:.12em}
.legend{font-size:12px;color:#8fa1bd}.legend i{font-style:normal;font-weight:700}
.up{color:#ff5a5f}.down{color:#2fd6a5}
.tape{overflow:hidden;white-space:nowrap;border-radius:12px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);margin-bottom:14px;mask-image:linear-gradient(90deg,transparent,#000 6%,#000 94%,transparent)}
.tape span{display:inline-block;padding:9px 0;font-size:13px;color:#aebcd2;animation:marq 26s linear infinite}
@keyframes marq{to{transform:translateX(-50%)}}
.grid{display:grid;grid-template-columns:1.15fr 1fr;gap:14px}
@media(max-width:720px){.grid{grid-template-columns:1fr}}
.panel{border-radius:18px;background:rgba(255,255,255,.055);border:1px solid rgba(255,255,255,.12);padding:16px}
.row{display:flex;align-items:center;gap:12px;padding:11px 10px;border-radius:14px;cursor:pointer;transition:background .2s;position:relative}
.row:hover{background:rgba(255,255,255,.07)}
.row.on{background:rgba(88,140,255,.14);outline:1px solid rgba(110,160,255,.4)}
.row.flash-u{animation:fu .7s}.row.flash-d{animation:fd .7s}
@keyframes fu{0%{background:rgba(255,80,80,.28)}to{background:rgba(88,140,255,.14)}}
@keyframes fd{0%{background:rgba(45,214,165,.24)}to{background:rgba(88,140,255,.14)}}
.nm{width:104px}.nm b{display:block;font-size:15px}.nm i{font-style:normal;font-size:11.5px;color:#7f90ab;letter-spacing:.05em}
.px{width:86px;text-align:right;font-variant-numeric:tabular-nums;font-size:16px;font-weight:700}
.ch{width:86px;text-align:right;font-variant-numeric:tabular-nums;font-size:13px;font-weight:600;line-height:1.35}
.spark{flex:1;min-width:0;height:34px}
.badge{display:inline-block;margin-top:3px;font-size:10.5px;padding:1.5px 7px;border-radius:99px;letter-spacing:.1em}
.b-low{background:rgba(47,214,165,.15);color:#2fd6a5}.b-mid{background:rgba(251,191,36,.16);color:#fbbf24}.b-high{background:rgba(255,90,95,.16);color:#ff5a5f}
.main-head{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:6px;gap:8px;flex-wrap:wrap}
.main-head .name{font-size:17px;font-weight:700;letter-spacing:.06em}
.big{font-size:34px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1}
.big em{font-style:normal;font-size:14px;font-weight:600;margin-left:8px}
svg.chart{width:100%;height:230px;display:block}
</style>
</head>
<body>
<div class="wrap">
  <div class="head">
    <h1>A 股实时监控 <span style="font-size:11px;color:#6f80a0;font-weight:400">MOCK 数据流 · 延迟 1.1s</span></h1>
    <div class="legend">基准色： <i class="up">■ 涨</i>&nbsp;&nbsp;<i class="down">■ 跌</i>&nbsp;&nbsp;投资有风险，数据仅为演示</div>
  </div>
  <div class="tape"><span id="tape"></span></div>
  <div class="grid">
    <div class="panel" id="list"></div>
    <div class="panel">
      <div class="main-head">
        <div><div class="name" id="mName">--</div><span class="badge" id="mBadge">--</span></div>
        <div style="text-align:right"><div class="big" id="mPx">--</div><div class="ch" id="mCh">--</div></div>
      </div>
      <svg class="chart" id="chart" viewBox="0 0 400 230" preserveAspectRatio="none"></svg>
    </div>
  </div>
</div>
<script>
const S=[
 {n:"贵州茅台",c:"600519",p:1462.5,d:1462.5,vol:.0035},
 {n:"宁德时代",c:"300750",p:238.8,d:238.8,vol:.007},
 {n:"比亚迪",c:"002594",p:255.4,d:255.4,vol:.006},
 {n:"中芯国际",c:"688981",p:84.62,d:84.62,vol:.009}];
S.forEach(s=>s.h=Array.from({length:40},()=>s.p*(1+(Math.random()-.5)*.012)));
let sel=0;
const $=id=>document.getElementById(id),NS="http://www.w3.org/2000/svg";
const cls=s=>s.p>=s.d?"up":"down",sign=s=>(s.p>=s.d?"+":"")+(s.p-s.d).toFixed(2),
      pct=s=>(s.p>=s.d?"+":"")+((s.p/s.d-1)*100).toFixed(2)+"%";
function spark(s){
  const w=110,h=34,mn=Math.min(...s.h),mx=Math.max(...s.h),rg=mx-mn||1;
  const pts=s.h.map((v,i)=>`${i*(w/(s.h.length-1))},${h-3-(v-mn)/rg*(h-6)}`).join(" ");
  const col=s.p>=s.d?"#ff5a5f":"#2fd6a5";
  return `<svg class="spark" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none"><polyline points="${pts}" fill="none" stroke="${col}" stroke-width="1.6" opacity=".9"/></svg>`;
}
function badgeOf(s){
  const a=s.h.slice(-20),m=a.reduce((x,y)=>x+y)/a.length,
        sd=Math.sqrt(a.reduce((x,y)=>x+(y-m)**2,0)/a.length)/m;
  return sd<.004?["b-low","低波动"]:sd<.008?["b-mid","中波动"]:["b-high","高波动"];
}
function renderList(){
  $("list").innerHTML=S.map((s,i)=>`
    <div class="row ${i===sel?"on":""}" data-i="${i}">
      <div class="nm"><b>${s.n}</b><i>${s.c}</i></div>
      ${spark(s)}
      <div class="px ${cls(s)}">${s.p.toFixed(2)}</div>
      <div class="ch ${cls(s)}">${sign(s)}<br>${pct(s)}</div>
    </div>`).join("");
  document.querySelectorAll(".row").forEach(r=>r.onclick=()=>{sel=+r.dataset.i;renderList();renderMain()});
}
function renderMain(){
  const s=S[sel],[bc,bt]=badgeOf(s);
  $("mName").textContent=`${s.n} · ${s.c}`;
  $("mBadge").className="badge "+bc;$("mBadge").textContent=bt;
  $("mPx").className="big "+cls(s);$("mPx").innerHTML=`${s.p.toFixed(2)}<em>${pct(s)}</em>`;
  $("mCh").className="ch "+cls(s);$("mCh").textContent=`${sign(s)}　${pct(s)}`;
  const svg=$("chart");svg.innerHTML="";
  const W=400,H=230,mn=Math.min(...s.h),mx=Math.max(...s.h),rg=mx-mn||1,y=v=>H-20-(v-mn)/rg*(H-46);
  const el=(t,a)=>{const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);svg.appendChild(e);return e};
  for(let i=0;i<=3;i++)el("line",{x1:0,x2:W,y1:18+i*(H-50)/3,y2:18+i*(H-50)/3,class:"g",stroke:"rgba(255,255,255,.09)"});
  if(s.d>mn&&s.d<mx){el("line",{x1:0,x2:W,y1:y(s.d),y2:y(s.d),stroke:"rgba(255,255,255,.35)","stroke-dasharray":"5 5"});
    const t=el("text",{x:6,y:y(s.d)-5,fill:"rgba(255,255,255,.6)","font-size":11});t.textContent="昨收 "+s.d.toFixed(2)}
  const pts=s.h.map((v,i)=>[i*(W/(s.h.length-1)),y(v)]);
  el("path",{d:`M0,${H} `+pts.map(p=>`L${p[0]},${p[1]}`).join(" ")+` L${W},${H} Z`,fill:cls(s)==="up"?"rgba(255,90,95,.16)":"rgba(47,214,165,.16)"});
  el("polyline",{points:pts.map(p=>p.join(",")).join(" "),fill:"none",stroke:cls(s)==="up"?"#ff5a5f":"#2fd6a5","stroke-width":2,"stroke-linejoin":"round"});
  const lp=pts[pts.length-1];
  el("circle",{cx:lp[0],cy:lp[1],r:4,fill:cls(s)==="up"?"#ff5a5f":"#2fd6a5"});
  const t2=el("text",{x:W-6,y:lp[1]-10,"text-anchor":"end",fill:"#dbe6f5","font-size":12,"font-weight":"700"});
  t2.textContent=s.p.toFixed(2);
}
function tick(){
  S.forEach((s,i)=>{
    const dir=Math.random(),chg=s.p*(dir<.5?-1:1)*s.vol*(.3+Math.random());
    s.p=Math.max(.01,s.p+chg);s.h.push(s.p);if(s.h.length>60)s.h.shift();
    s._chg=chg;
  });
  $("tape").innerHTML=(S.map(s=>`<b style="color:#c8d5e8">${s.n}</b> <span class="${cls(s)}">${s.p.toFixed(2)} ${pct(s)}</span>`).join("　·　")+"　·　").repeat(2);
  renderList();renderMain();
  S.forEach((s,i)=>{
    const row=document.querySelector(`.row[data-i="${i}"]`);
    if(row)row.classList.add(s._chg>=0?"flash-u":"flash-d");
  });
}
renderList();renderMain();tick();
setInterval(tick,1100);
</script>
</body>
</html>
