<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Market Pulse</title><style>*{box-sizing:border-box}body{margin:0;background:#0a0d14;color:#eef2ff;font-family:system-ui;min-height:100vh;display:grid;place-items:center}.panel{width:min(94vw,620px);background:#121722;border:1px solid #293248;border-radius:20px;padding:24px;box-shadow:0 25px 60px #0008}header{display:flex;justify-content:space-between;color:#aab4c7}h1{margin:8px 0 18px;font-size:25px}.live{color:#4ee59b}.row{display:grid;grid-template-columns:1.2fr 1fr .7fr;align-items:center;padding:17px 3px;border-top:1px solid #293044}.name b,.price{display:block}.price{font-size:20px;text-align:right}.change{text-align:right;font-weight:bold}.up{color:#42de95}.down{color:#ff6174}svg{width:100%;height:130px;margin:8px 0;background:#0d121d;border-radius:10px}.grid{stroke:#334055;stroke-width:1}.line{fill:none;stroke:#4ee59b;stroke-width:3;filter:drop-shadow(0 0 6px #3fdc92)}small{color:#8994a8}</style><main class="panel"><header><span>MARKET PULSE / CN</span><span class="live">● LIVE</span></header><h1>自选行情 <small id="stamp"></small></h1><svg viewBox="0 0 500 130"><path class="grid" d="M0 30H500M0 65H500M0 100H500"/><path class="line" id="chart" d="M0 100 L50 85 100 91 150 55 200 69 250 40 300 58 350 28 400 45 450 19 500 30"/></svg><div id="rows"></div></main><script>let s=[['ALPHA','128.42',1.83],['NOVA','76.18',-0.92],['ORBIT','314.90',2.46]];function draw(){rows.innerHTML=s.map((x,i)=>`<div class=row><div class=name><b>${x[0]}</b><small>${['科技','新能源','工业'][i]}</small></div><span class=price>¥${x[1]}</span><span class="change ${x[2]>0?'up':'down'}">${x[2]>0?'▲ +':'▼ '}${Math.abs(x[2]).toFixed(2)}%</span></div>`).join('');stamp.textContent='更新 '+new Date().toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'})}setInterval(()=>{s.forEach(x=>{x[2]+=((Math.random()-.5)*.14);x[1]=(parseFloat(x[1])*(1+(Math.random()-.5)*.003)).toFixed(2)});draw()},2200);draw()</script></html>
