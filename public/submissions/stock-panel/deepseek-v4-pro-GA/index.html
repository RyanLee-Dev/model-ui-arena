<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>股海瞭望 · Market Panel</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--up:#ff5c6c;--down:#3ddc97;--ink:#e9f1ff;--mut:#7f93bd;--line:rgba(127,147,189,.22)}
body{min-height:100vh;display:grid;place-items:center;padding:18px;color:var(--ink);
  background:radial-gradient(120% 90% at 50% 0%,#10182c,#060a14 60%);
  font-family:ui-sans-serif,system-ui,"PingFang SC","Microsoft YaHei",sans-serif}
.panel{width:min(94vw,390px);border-radius:24px;border:1px solid var(--line);padding:20px 18px 18px;
  background:linear-gradient(180deg,rgba(20,29,52,.94),rgba(9,14,28,.97));
  box-shadow:0 30px 70px rgba(0,0,0,.55)}
.head{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.head h1{font-size:16px;letter-spacing:.08em;font-weight:800}
.live{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--mut);letter-spacing:.14em}
.live i{width:7px;height:7px;border-radius:50%;background:#3ddc97;box-shadow:0 0 9px #3ddc97;animation:blink 1.6s infinite}
@keyframes blink{50%{opacity:.35}}
.tabs{display:flex;gap:6px;margin:12px 0 10px}
.tabs button{flex:1;border:1px solid var(--line);background:transparent;color:var(--mut);font-family:inherit;
  font-size:12px;padding:8px 0;border-radius:11px;cursor:pointer;transition:.25s}
.tabs button.on{color:var(--ink);border-color:rgba(90,140,255,.55);background:rgba(90,140,255,.14);font-weight:700}
.quote{display:flex;align-items:baseline;gap:12px;margin:4px 2px 8px}
.quote b{font-size:42px;font-weight:700;letter-spacing:-.01em;font-variant-numeric:tabular-nums}
.quote .chg{font-size:14px;font-weight:700;font-variant-numeric:tabular-nums;padding:4px 10px;border-radius:8px}
.up{color:var(--up)}.down{color:var(--down)}
.chg.up{background:rgba(255,92,108,.12)}.chg.down{background:rgba(61,220,151,.1)}
.tickfx{animation:flash .6s ease}
@keyframes flash{0%{opacity:1;transform:translateY(0)}35%{opacity:.25}100%{opacity:1;transform:translateY(0)}}
.chart{width:100%;height:118px;display:block}
.warn{display:none;align-items:center;gap:8px;margin:8px 2px 0;padding:9px 12px;border-radius:11px;font-size:12px;
  color:#ffd27a;background:rgba(255,180,70,.1);border:1px solid rgba(255,180,70,.3)}
.warn.show{display:flex;animation:flash .5s}
.list{margin-top:16px;display:flex;flex-direction:column;gap:10px}
.stock{display:grid;grid-template-columns:92px 1fr 76px 96px;gap:10px;align-items:center;padding:11px 12px;
  border-radius:15px;border:1px solid var(--line);background:rgba(255,255,255,.03);cursor:pointer;transition:.25s}
.stock:hover{background:rgba(90,140,255,.08)}
.stock.on{border-color:rgba(90,140,255,.5)}
.sname b{display:block;font-size:13px;letter-spacing:.02em}
.sname span{font-size:10px;color:var(--mut);letter-spacing:.1em}
.sprice{text-align:right;font-variant-numeric:tabular-nums;font-size:14px;font-weight:700}
.schg{text-align:right;font-size:11px;font-weight:700;font-variant-numeric:tabular-nums}
.spark{width:96px;height:34px;display:block}
.foot{display:flex;justify-content:space-between;margin-top:12px;font-size:10px;color:var(--mut);letter-spacing:.08em}
</style>
</head>
<body>
<main class="panel">
  <header class="head">
    <h1>股海瞭望</h1>
    <span class="live"><i></i>模拟实时</span>
  </header>
  <nav class="tabs" id="tabs"></nav>
  <div class="quote"><b id="price">--</b><span class="chg" id="chg">--</span></div>
  <svg class="chart" id="main" viewBox="0 0 354 118" preserveAspectRatio="none" aria-hidden="true">
    <defs><linearGradient id="gup" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="rgba(255,92,108,.28)"/><stop offset="100%" stop-color="rgba(255,92,108,0)"/>
    </linearGradient>
    <linearGradient id="gdn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="rgba(61,220,151,.28)"/><stop offset="100%" stop-color="rgba(61,220,151,0)"/>
    </linearGradient></defs>
    <g id="grid"></g><path id="area"></path><polyline id="line" fill="none" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"></polyline>
  </svg>
  <div class="warn" id="warn">⚠ 波动提示：<span id="warnTxt"></span></div>
  <section class="list" id="list"></section>
  <footer class="foot"><span>数据为本地 mock，仅用于演示</span><span id="clock">--:--:--</span></footer>
</main>
<script>
const STOCKS={
 NVDA:{name:'英伟达',base:186.4,vol:.35,hist:[]},
 TSLA:{name:'特斯拉',base:352.7,vol:.62,hist:[]},
 AAPL:{name:'苹果',base:244.1,vol:.24,hist:[]}
};
const keys=Object.keys(STOCKS);
const U='#ff5c6c',D='#3ddc97';
let cur='NVDA',prev=STOCKS[cur].base;
function seed(k){
  let v=STOCKS[k].base/1.04;const arr=[];
  for(let i=0;i<64;i++){
    v+=v*(Math.random()-.5)*STOCKS[k].vol*.18;
    arr.push(+v.toFixed(2));
  }
  STOCKS[k].hist=arr;
}
keys.forEach(seed);
const tabs=document.getElementById('tabs');
keys.forEach(k=>{
  const b=document.createElement('button');b.textContent=STOCKS[k].name;b.className=k===cur?'on':'';
  b.onclick=()=>{cur=k;tabs.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b));
    prev=STOCKS[cur].hist.at(-1);paint();};tabs.appendChild(b);
});
function paint(){
  const s=STOCKS[cur],h=s.hist;
  const last=h.at(-1),first=h[0],pct=(last/first-1)*100;
  const price=document.getElementById('price'),chg=document.getElementById('chg');
  price.textContent=last.toFixed(2);
  chg.textContent=`${pct>=0?'+':''}${pct.toFixed(2)}%`;
  const up=pct>=0;price.className='';chg.className='chg '+(up?'up':'down');
  price.style.color=up?U:D;
  document.getElementById('line').setAttribute('stroke',up?U:D);
  const min=Math.min(...h),max=Math.max(...h),sp=Math.max(.01,max-min);
  const X=i=>i*354/63,Y=v=>106-(v-min)/sp*96;
  document.getElementById('line').setAttribute('points',h.map((v,i)=>`${X(i).toFixed(1)},${Y(v).toFixed(1)}`).join(' '));
  document.getElementById('area').setAttribute('fill',up?'url(#gup)':'url(#gdn)');
  document.getElementById('area').setAttribute('d',`M0,${Y(h[0])}`+h.map((v,i)=>`L${X(i).toFixed(1)},${Y(v).toFixed(1)}`).join(' ')+`L354,118 L0,118 Z`);
  document.getElementById('grid').innerHTML=[20,55,90].map(y=>`<line x1="0" y1="${y}" x2="354" y2="${y}" stroke="rgba(127,147,189,.12)"/>`).join('');
  document.getElementById('list').innerHTML=keys.map(k=>{
    const a=STOCKS[k],la=a.hist.at(-1),fa=a.hist[0],pc=(la/fa-1)*100,u=pc>=0;
    const pts=a.hist.slice(-12).map((v,i)=>{
      const mn=Math.min(...a.hist.slice(-12)),mx=Math.max(...a.hist.slice(-12)),s2=Math.max(.01,mx-mn);
      return `${(i*96/11).toFixed(1)},${(34-(v-mn)/s2*30).toFixed(1)}`;
    }).join(' ');
    return `<div class="stock ${k===cur?'on':''}" data-k="${k}">
      <div class="sname"><b>${a.name}</b><span>${k}</span></div>
      <svg class="spark" viewBox="0 0 96 34" preserveAspectRatio="none"><polyline points="${pts}" fill="none" stroke="${u?U:D}" stroke-width="1.6"/></svg>
      <div class="sprice ${u?'up':'down'}">${la.toFixed(2)}</div>
      <div class="schg ${u?'up':'down'}">${pc>=0?'+':''}${pc.toFixed(2)}%</div>
    </div>`;
  }).join('');
  document.querySelectorAll('.stock').forEach(el=>el.onclick=()=>{
    cur=el.dataset.k;tabs.querySelectorAll('button').forEach((x,i)=>x.classList.toggle('on',keys[i]===cur));
    prev=STOCKS[cur].hist.at(-1);paint();
  });
  const hot=keys.map(k=>(STOCKS[k].hist.at(-1)/STOCKS[k].hist[0]-1)*100);
  const extreme=hot.reduce((m,v)=>Math.abs(v)>Math.abs(m)?v:m,0);
  const warn=document.getElementById('warn');
  if(Math.abs(extreme)>=2){
    warn.classList.add('show');
    const which=STOCKS[keys[hot.indexOf(extreme)]].name;
    document.getElementById('warnTxt').textContent=`${which} 近一小时波动 ${extreme.toFixed(1)}%，注意仓位风险`;
  }else warn.classList.remove('show');
}
function stream(){
  const s=STOCKS[cur],v=s.hist.at(-1);
  const n=+(v*(1+(Math.random()-.5)*s.vol*.022)).toFixed(2);
  s.hist.push(n);s.hist.shift();
  if(n!==prev){document.getElementById('price').classList.remove('tickfx');void document.getElementById('price').offsetWidth;
    document.getElementById('price').classList.add('tickfx');prev=n;}
  paint();
}
paint();
setInterval(stream,1400);
setInterval(()=>{
  const d=new Date(),p=n=>String(n).padStart(2,'0');
  document.getElementById('clock').textContent=`${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`;
},1000);
</script>
</body>
</html>
