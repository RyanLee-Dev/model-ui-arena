<!DOCTYPE html>
<!-- 设计说明：彭博终端风行情面板。深色磨砂底 + 细网格；红涨绿跌 ▲/▼ 一眼可辨，价格等宽数字不跳动；每行内嵌迷你走势，主图为选中标的平滑渐变面积图（网格+末点数值标注）；1.1s 假流式刷新，价格变动时整行短暂高亮闪烁；顶部实时徽章呼吸，底部波动风险按等级着色。 -->
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>行情监控面板</title>
<style>
:root{--bg:#0b0f18;--card:#121826;--card2:#0a0f1a;--ink:#e9eef8;--sub:#74809c;--up:#ff4d5e;--dn:#00c885;--line:rgba(255,255,255,.06)}
*{margin:0;box-sizing:border-box}
body{min-height:100vh;display:grid;place-items:center;background:radial-gradient(120% 120% at 50% 0%,#131a2b 0%,var(--bg) 60%);color:var(--ink);font-family:"SF Pro Display",-apple-system,"PingFang SC",sans-serif}
.panel{width:min(94vw,362px);border-radius:26px;background:linear-gradient(175deg,#161d2e,var(--card));padding:18px;border:1px solid var(--line);box-shadow:0 34px 80px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.06)}
.head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.head b{font-size:15px;letter-spacing:1px}
.live{display:flex;align-items:center;gap:7px;font-size:10px;color:var(--sub);letter-spacing:1px}
.live i{width:7px;height:7px;border-radius:50%;background:var(--dn);box-shadow:0 0 9px var(--dn);animation:bl 1.6s infinite}
@keyframes bl{50%{opacity:.25}}
.rows{display:flex;flex-direction:column;gap:8px;margin-bottom:14px}
.row{display:grid;grid-template-columns:1fr 62px 78px 92px;gap:6px;align-items:center;padding:10px 12px;border-radius:14px;background:rgba(255,255,255,.03);border:1px solid transparent;cursor:pointer;transition:.2s}
.row.on{border-color:rgba(255,255,255,.18);background:rgba(255,255,255,.06)}
.row.flash{animation:rowf .5s}
@keyframes rowf{30%{background:rgba(255,255,255,.13)}}
.row .nm{font-size:14px;font-weight:700}.row .cd{font-size:9.5px;color:var(--sub);letter-spacing:.5px}
.row .pr{font-size:14.5px;text-align:right;font-variant-numeric:tabular-nums;font-weight:700}
.row .chg{font-size:11px;text-align:right;font-variant-numeric:tabular-nums}
.row .chg small{display:block;color:var(--sub);font-size:9.5px}
.up{color:var(--up)}.dn{color:var(--dn)}
.chart-box{border-radius:18px;background:var(--card2);padding:14px 14px 10px;border:1px solid rgba(255,255,255,.05)}
.ch-head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:2px}
.ch-head b{font-size:13px;color:var(--sub);font-weight:600}
.ch-head span{font-size:20px;font-weight:800;font-variant-numeric:tabular-nums}
.ch-head small{font-size:11px;font-weight:700;margin-left:8px}
.chart{width:100%;height:128px;display:block}
.foot{display:flex;justify-content:space-between;align-items:center;margin-top:12px;font-size:10px;color:var(--sub)}
.risk{display:flex;gap:8px;align-items:center;padding:8px 12px;border-radius:12px;font-size:11px;background:rgba(255,186,60,.07);border:1px solid rgba(255,186,60,.18)}
.risk.lo{background:rgba(0,200,133,.06);border-color:rgba(0,200,133,.18)}
.risk.hi{background:rgba(255,77,94,.08);border-color:rgba(255,77,94,.25)}
.risk b{color:#ffc24b}.risk.lo b{color:var(--dn)}.risk.hi b{color:var(--up)}
.risk span{color:var(--sub)}
</style>
</head>
<body>
<div class="panel">
  <div class="head"><b>自选监控</b><span class="live"><i></i><span id="clock">盘中 · --:--:--</span></span></div>
  <div class="rows" id="rows"></div>
  <div class="chart-box">
    <div class="ch-head"><b id="chName">--</b><span><span id="chPrice">--</span><small id="chChg" class="up">▲ --</small></span></div>
    <svg class="chart" viewBox="0 0 300 128" id="chart"><defs><linearGradient id="ag" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4d8bff" stop-opacity=".5"/><stop offset="1" stop-color="#4d8bff" stop-opacity="0"/></linearGradient></defs></svg>
    <div class="foot"><span>模拟盘 · 1.1s 刷新</span><span id="vol">--</span></div>
  </div>
  <div class="risk lo" id="risk"><b>波动提示</b><span id="riskTxt">--</span></div>
</div>
<script>
const NS="http://www.w3.org/2000/svg",W=300,H=128;
const S={
"NVDA":{"cn":"英伟达","p":135.4,open:131.0,vol:"高",hist:[131,133,134,132,135,134,136]},
"AAPL":{"cn":"苹果","p":228.9,open:230.1,vol:"中",hist:[231,230,229,230,228,229,228]},
"TSLA":{"cn":"特斯拉","p":312.6,open:292.8,vol:"极高",hist:[295,301,298,308,305,310,314]},
"MSFT":{"cn":"微软","p":446.2,open:442.5,vol:"低",hist:[443,444,443,445,446,445,447]}};
const keys=Object.keys(S);let sel=0;
const riskMap={"低":["大盘震荡偏稳，风险可控","lo"],"中":["板块分化，注意午后回落",""],"高":["波动加剧，建议轻仓",""],"极高":["剧烈波动，严格止损勿追高","hi"]};
const rows=document.getElementById("rows"),chart=document.getElementById("chart"),
chName=document.getElementById("chName"),chPrice=document.getElementById("chPrice"),chChg=document.getElementById("chChg"),
risk=document.getElementById("risk"),riskTxt=document.getElementById("riskTxt"),vol=document.getElementById("vol");
const f2=v=>v.toFixed(2);
function mk(tag,at,par){const e=document.createElementNS(NS,tag);for(const k in at)e.setAttribute(k,at[k]);par.appendChild(e);return e}
function smoothPath(pts){let d=`M${pts[0][0]},${pts[0][1]}`;for(let i=0;i<pts.length-1;i++){const p0=pts[Math.max(0,i-1)],p1=pts[i],p2=pts[i+1],p3=pts[Math.min(pts.length-1,i+2)];
d+=`C${p1[0]+(p2[0]-p0[0])/6},${p1[1]+(p2[1]-p0[1])/6} ${p2[0]-(p3[0]-p1[0])/6},${p2[1]-(p3[1]-p1[1])/6} ${p2[0]},${p2[1]}`}return d}
function poly(vals,color,parent,w,h,area){
const min=Math.min(...vals),max=Math.max(...vals),r=max-min||1;
const pts=vals.map((v,i)=>[(i/(vals.length-1))*w,h-5-((v-min)/r)*(h-10)]);
const p=smoothPath(pts);
if(area)mk("path",{d:p+`L${w},${h}L0,${h}Z`,fill:"url(#ag)"},parent);
mk("path",{d:p,fill:"none",stroke:color,"stroke-width":2.4,"stroke-linecap":"round"},parent);
mk("circle",{cx:pts[pts.length-1][0],cy:pts[pts.length-1][1],r:4,fill:color,stroke:"#0a0f1a","stroke-width":2},parent);
return pts[pts.length-1]}
function renderRows(){
rows.innerHTML=keys.map((k,i)=>{const s=S[k],up=s.p>=s.open;
return `<div class="row${i===sel?" on":""}" data-i="${i}"><div><div class="nm">${s.cn}</div><div class="cd">${k}</div></div><svg viewBox="0 0 60 26" width="60" height="26"></svg><div class="pr ${up?"up":"dn"}">${f2(s.p)}</div><div class="chg ${up?"up":"dn"}">${up?"▲":"▼"} ${f2(Math.abs(s.p-s.open))}<small>${up?"+":"-"}${f2(Math.abs((s.p-s.open)/s.open*100))}%</small></div></div>`}).join("");
rows.querySelectorAll(".row").forEach(r=>r.onclick=()=>{sel=+r.dataset.i;renderRows();renderChart()});
rows.querySelectorAll(".row svg").forEach((svg,i)=>{const s=S[keys[i]],up=s.p>=s.open;poly(s.hist.slice(-12),up?"#ff4d5e":"#00c885",svg,60,26,false)})}
function renderChart(){
const s=S[keys[sel]],up=s.p>=s.open;
chName.textContent=`${s.cn} · ${keys[sel]}`;chPrice.textContent=f2(s.p);
chChg.textContent=`${up?"▲":"▼"} ${f2(Math.abs(s.p-s.open))} ${up?"+":"-"}${f2(Math.abs((s.p-s.open)/s.open*100))}%`;chChg.className=up?"up":"dn";
chart.innerHTML=chart.querySelector("defs").outerHTML;
for(let i=1;i<4;i++){const y=i*H/4;mk("line",{x1:0,x2:W,y1:y,y2:y,stroke:"rgba(255,255,255,.05)","stroke-width":1},chart)}
const pt=poly(s.hist,up?"#ff4d5e":"#00c885",chart,W,H,true);
mk("text",{x:pt[0]-6,y:pt[1]-8,"text-anchor":"middle",fill:up?"#ff4d5e":"#00c885","font-size":"10",stroke:"#0a0f1a","stroke-width":"3","paint-order":"stroke"},chart).textContent=f2(s.p);
const [riskCls,riskTxt2]=riskMap[s.vol];riskTxt.textContent=riskTxt2;risk.className="risk "+riskCls;
vol.textContent="波幅 "+f2((Math.max(...s.hist)-Math.min(...s.hist))/s.open*100)+"%";}
function tick(){
const d=new Date();document.getElementById("clock").textContent=`盘中 · ${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}:${String(d.getSeconds()).padStart(2,"0")}`;
keys.forEach(k=>{const s=S[k],old=s.p;s.p=Math.max(.01,s.p*(1+(Math.random()-.5)*.008));s.hist.push(s.p);if(s.hist.length>40)s.hist.shift();
if(Math.abs(s.p-old)>old*.002){const row=rows.querySelector(`[data-i="${keys.indexOf(k)}"]`);row&&(row.classList.remove("flash"),void row.offsetWidth,row.classList.add("flash"))}});
renderRows();renderChart()}
renderRows();renderChart();setInterval(tick,1100);
</script>
</body>
</html>
