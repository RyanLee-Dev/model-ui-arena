<!DOCTYPE html>
<!--
设计说明：星图行情终端。深色金融监控面板：主图区展示选中个股的实时分时面积图
（SVG 渐变 + 昨收虚线基线 + 脉冲最新点），下方四只标的列表行内嵌迷你走势 sparkline。
每 900ms 假流式随机游走刷新，价格红涨绿跌、涨跌闪烁提示，波动率自动标注高波动风险。
点击行可切换主图，底部常驻模拟数据免责声明。
-->
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>星图行情 · 实时监控</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{font-family:"SF Pro Display","PingFang SC",system-ui,sans-serif;display:flex;
  align-items:center;justify-content:center;background:#0a0e17;color:#e8ecf4;padding:12px}
.panel{width:min(94vw,420px);max-height:96vh;overflow-y:auto;background:linear-gradient(170deg,#121828,#0d111c);
  border:1px solid #222b40;border-radius:18px;padding:16px;box-shadow:0 24px 60px rgba(0,0,0,.55)}
header{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.logo{font-size:15px;font-weight:800;letter-spacing:.08em;
  background:linear-gradient(90deg,#ffb84d,#ff7847);-webkit-background-clip:text;background-clip:text;color:transparent}
.live{display:flex;align-items:center;gap:5px;font-size:11px;color:#7ee2a8;margin-left:auto;font-variant-numeric:tabular-nums}
.dot{width:7px;height:7px;border-radius:50%;background:#35d07f;box-shadow:0 0 8px #35d07f;animation:pul 1.1s infinite}
@keyframes pul{50%{opacity:.3}}
.hero{background:#161d30;border:1px solid #26304a;border-radius:14px;padding:14px;margin-bottom:12px}
.h-top{display:flex;align-items:baseline;gap:10px}
.h-name{font-size:15px;font-weight:700}
.h-code{font-size:11px;color:#7c88a5}
.chip{margin-left:auto;font-size:13px;font-weight:700;padding:3px 9px;border-radius:8px;font-variant-numeric:tabular-nums}
.up{color:#ff5f57}.dn{color:#3ddc84}
.chip.up{background:rgba(255,95,87,.14)}.chip.dn{background:rgba(61,220,132,.14)}
.price{font-size:34px;font-weight:700;font-variant-numeric:tabular-nums;margin-top:2px}
.chart{width:100%;height:120px;display:block;margin-top:8px}
.list{display:flex;flex-direction:column;gap:8px}
.row{display:flex;align-items:center;gap:10px;background:#141a2b;border:1px solid #232c44;
  border-radius:12px;padding:10px 12px;cursor:pointer;transition:.2s}
.row.cur{border-color:#ff9d47;background:#1b2338}
.r-id{min-width:74px}.r-nm{font-size:13px;font-weight:600}.r-cd{font-size:10px;color:#7c88a5;margin-top:2px}
.spark{width:72px;height:26px;flex:none}
.r-p{margin-left:auto;text-align:right;font-variant-numeric:tabular-nums}
.r-p b{font-size:14px;font-weight:700;display:block}
.r-p span{font-size:11px;font-weight:600}
.tag{font-size:9px;padding:2px 6px;border-radius:99px;margin-left:8px;vertical-align:1px}
.t-hi{color:#ffb84d;background:rgba(255,184,77,.15)}
.t-lo{color:#7c88a5;background:rgba(124,136,165,.15)}
@keyframes flashU{from{background:rgba(255,95,87,.22)}}
@keyframes flashD{from{background:rgba(61,220,132,.2)}}
.fu{animation:flashU .7s ease-out}.fd{animation:flashD .7s ease-out}
.note{margin-top:12px;font-size:10px;color:#5d6884;text-align:center;letter-spacing:.08em;line-height:1.6}
</style>
</head>
<body>
<div class="panel">
  <header><span class="logo">星图行情</span>
    <span class="live"><span class="dot"></span>LIVE <span id="clock">--:--:--</span></span></header>
  <div class="hero">
    <div class="h-top"><span class="h-name" id="hName">—</span><span class="h-code" id="hCode">—</span>
      <span class="chip up" id="hChip">+0.00%</span></div>
    <div class="price" id="hPrice">—</div>
    <svg class="chart" id="chart" preserveAspectRatio="none"></svg>
  </div>
  <div class="list" id="list"></div>
  <div class="note">数据为本地随机游走模拟 · 每秒刷新 · 不构成任何投资建议<br>STARMAP QUANT TERMINAL · DEMO FEED</div>
</div>
<script>
const $=s=>document.querySelector(s),R=Math.random;
const gauss=()=>((R()*2-1)+(R()*2-1))/2;
const STOCKS=[
 {nm:'贵州茅台',cd:'SH.600519',p:1462.0,vol:.0011},
 {nm:'宁德时代',cd:'SZ.300750',p:188.6,vol:.0022},
 {nm:'比亚迪',cd:'SZ.002594',p:243.5,vol:.0018},
 {nm:'中芯国际',cd:'SH.688981',p:52.8,vol:.0026}];
let sel=0;
STOCKS.forEach(s=>{
  s.base=s.p;s.open=s.p*(1-gauss()*.006);s.hist=[];
  let x=s.p*(1-(R()*.01-.005));
  for(let i=0;i<90;i++){x*=1+gauss()*s.vol*3;s.hist.push(x)}   // 预生成 90 个分时点
  s.p=s.hist[s.hist.length-1];
});
const fmtP=v=>v>=1000?v.toFixed(1):v.toFixed(2);
const pctOf=s=>(s.p/s.open-1)*100;
function volTag(s){
  const h=s.hist.slice(-20),ret=h.map((v,i)=>i?Math.log(v/h[i-1]):0),
        m=ret.reduce((a,b)=>a+b,0)/ret.length,
        sd=Math.sqrt(ret.reduce((a,b)=>a+(b-m)**2,0)/ret.length);
  return sd>.0035?['高波动','t-hi']:['平稳','t-lo'];
}
function renderList(){
  $('#list').innerHTML='';
  STOCKS.forEach((s,i)=>{
    const pc=pctOf(s),up=pc>=0,[tag,cls]=volTag(s),
          el=document.createElement('div'),
          sp=s.hist.filter((_,k)=>k%3===0),
          lo=Math.min(...sp),hi=Math.max(...sp)||1,
          pts=sp.map((v,k)=>`${k*3},${(23-(v-lo)/(hi-lo||1)*20).toFixed(1)}`).join(' ');
    el.className='row'+(i===sel?' cur':'');
    el.innerHTML=`<div class="r-id"><div class="r-nm">${s.nm}</div><div class="r-cd">${s.cd}</div></div>`+
      `<svg class="spark" viewBox="0 0 72 26" preserveAspectRatio="none" fill="none" stroke="${up?'#ff5f57':'#3ddc84'}" stroke-width="1.4"><polyline points="${pts}"/></svg>`+
      `<div class="r-p"><b>${fmtP(s.p)}</b><span class="${up?'up':'dn'}">${up?'▲':'▼'} ${Math.abs(pc).toFixed(2)}%<i class="tag ${cls}">${tag}</i></span></div>`;
    el.onclick=()=>{sel=i;renderAll()};
    $('#list').appendChild(el);
    if(s.flash){el.classList.add(s.flash>0?'fu':'fd');setTimeout(()=>el.classList.remove('fu','fd'),700)}
  });
}
function drawChart(){
  const s=STOCKS[sel],svg=$('#chart'),W=svg.clientWidth||380,H=120,pad=8,
        data=s.hist.slice(-70),lo=Math.min(...data,s.open),hi=Math.max(...data,s.open),rg=(hi-lo)||1,
        X=i=>i/(data.length-1)*W,Y=v=>pad+(hi-v)/rg*(H-pad*2),
        pts=data.map((v,i)=>`${X(i).toFixed(1)},${Y(v).toFixed(1)}`).join(' '),
        up=pctOf(s)>=0,col=up?'#ff5f57':'#3ddc84';
  svg.setAttribute('viewBox',`0 0 ${W} ${H}`);
  svg.innerHTML=`<defs><linearGradient id="ag" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="${col}" stop-opacity=".32"/><stop offset="1" stop-color="${col}" stop-opacity="0"/></linearGradient></defs>
    <line x1="0" y1="${Y(s.open)}" x2="${W}" y2="${Y(s.open)}" stroke="#5d6884" stroke-dasharray="3 4" stroke-width=".8"/>
    <polygon points="0,${H} ${pts} ${W},${H}" fill="url(#ag)"/>
    <polyline points="${pts}" fill="none" stroke="${col}" stroke-width="1.8" stroke-linejoin="round"/>
    <circle cx="${X(data.length-1)}" cy="${Y(data[data.length-1])}" r="3.4" fill="#fff" class="pp"/>
    <style>.pp{animation:pul 1.2s infinite}</style>`;
}
function renderHero(){
  const s=STOCKS[sel],pc=pctOf(s),up=pc>=0;
  $('#hName').textContent=s.nm;$('#hCode').textContent=s.cd+' · 分时';
  $('#hPrice').textContent=fmtP(s.p);
  const ch=$('#hChip');ch.className='chip '+(up?'up':'dn');
  ch.textContent=`${up?'▲':'▼'} ${Math.abs(pc).toFixed(2)}%`;
}
function tick(){
  STOCKS.forEach(s=>{
    const np=s.p*(1+gauss()*s.vol*3);
    s.flash=Math.sign(np-s.p)*(Math.random()<.85?1:0);
    s.p=np;s.hist.push(np);if(s.hist.length>110)s.hist.shift();
  });
  renderHero();renderList();drawChart();
  const d=new Date(),p=n=>String(n).padStart(2,'0');
  $('#clock').textContent=`${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`;
}
function renderAll(){renderHero();renderList();drawChart()}
renderAll();setInterval(tick,900);addEventListener('resize',drawChart);
</script>
</body>
</html>
