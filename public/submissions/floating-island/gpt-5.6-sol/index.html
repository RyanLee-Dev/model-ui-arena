const waterfallMat=new THREE.ShaderMaterial({transparent:true,side:THREE.DoubleSide,depthWrite:false,uniforms:{time:{value:0}},vertexShader:`uniform float time;varying float vY;varying float vN;void main(){vec3 p=position;vY=uv.y;vN=sin(uv.y*32.-time*6.+uv.x*8.);p.z+=vN*.055*(1.-uv.y);gl_Position=projectionMatrix*modelViewMatrix*vec4(p,1.);}`,fragmentShader:`varying float vY;varying float vN;void main(){float streak=smoothstep(.25,1.,abs(vN));vec3 c=mix(vec3(.32,.75,.86),vec3(.88,1.,1.),streak);float a=.42+streak*.3+smoothstep(.85,1.,1.-vY)*.2;gl_FragColor=vec4(c,a);}`}),mist=[],birds=[],sparks=[];function buildNature(){const fall=new THREE.Mesh(new THREE.PlaneGeometry(1.15,6.2,12,64),waterfallMat);fall.position.set(4.55,-.5,0);fall.rotation.y=-Math.PI/2;island.add(fall);for(let i=0;i<90;i++){const m=new THREE.Mesh(new THREE.IcosahedronGeometry(.025+rnd()*.04,0),new THREE.MeshBasicMaterial({color:0xdffcff,transparent:true,opacity:.7}));m.position.set(4.6+(rnd()-.5)*1.6,-3.6+rnd()*.9,(rnd()-.5)*1.5);scene.add(m);mist.push({m,v:new THREE.Vector3((rnd()-.5)*.7,rnd()*.5,(rnd()-.5)*.7),life:rnd()})}for(let i=0;i<9;i++){const b=new THREE.Group();for(let s of[-1,1]){const wing=new THREE.Mesh(new THREE.ConeGeometry(.06,.45,3),new THREE.MeshBasicMaterial({color:0x25323a}));wing.rotation.z=s*1.2;wing.position.x=s*.18;b.add(wing)}scene.add(b);birds.push({b,a:rnd()*6.28,r:8+rnd()*5,h:5+rnd()*4,spd:.16+rnd()*.17})}const fire=new THREE.PointLight(0xff7b32,6,5);fire.position.set(-1.9,2.8,1.35);island.add(fire);for(let i=0;i<24;i++){const m=new THREE.Mesh(new THREE.TetrahedronGeometry(.025+rnd()*.025),new THREE.MeshBasicMaterial({color:i%2?0xffb138:0xff5b29}));scene.add(m);sparks.push({m,life:rnd()})}for(let i=0;i<22;i++){const tree=new THREE.Group(),trunk=new THREE.Mesh(new THREE.CylinderGeometry(.05,.08,.5,7),wood),crown=new THREE.Mesh(new THREE.ConeGeometry(.28,.75,7),new THREE.MeshStandardMaterial({color:i%2?0x386d45:0x477b4a,flatShading:true}));crown.position.y=.55;tree.add(tr
