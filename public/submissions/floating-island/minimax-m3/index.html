<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>浮空岛 · Floating Island</title>
<style>
  :root {
    color-scheme: dark;
    --bg-0: #0c1a26;
    --fg: #f5e8c8;
    --accent: #ffd84a;
    --accent-2: #6af0ff;
    --dim: #b9a78a;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    overflow: hidden;
    background: linear-gradient(180deg, #2a5a8a, #0c1a26);
    color: var(--fg);
    font-family: ui-serif, Georgia, "Times New Roman", serif;
    -webkit-font-smoothing: antialiased;
  }
  #stage { position: fixed; inset: 0; }
  canvas { display: block; width: 100%; height: 100%; touch-action: none; }

  .panel {
    position: fixed;
    background: rgba(12, 26, 38, 0.65);
    border: 1px solid rgba(255, 216, 74, 0.25);
    border-radius: 12px;
    padding: 12px 14px;
    backdrop-filter: blur(12px);
    box-shadow: 0 14px 40px -16px rgba(255, 216, 74, 0.3);
    font-size: 12px;
    line-height: 1.6;
  }
  .panel h3 {
    margin: 0 0 8px;
    font-size: 11px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--accent);
  }
  .panel button {
    background: rgba(255, 216, 74, 0.1);
    color: var(--fg);
    border: 1px solid rgba(255, 216, 74, 0.3);
    border-radius: 6px;
    padding: 6px 10px;
    font: inherit;
    cursor: pointer;
  }
  .panel button:hover, .panel button:focus-visible { background: rgba(255, 216, 74, 0.22); outline: none; }
  .panel button[aria-pressed="true"] { background: rgba(255, 216, 74, 0.4); }
  .panel input[type="range"] { width: 130px; accent-color: var(--accent); }
  .panel label { display: flex; gap: 6px; align-items: center; color: var(--dim); }

  #controls { top: 14px; left: 14px; width: 280px; }
  #controls .group { margin-bottom: 10px; display: grid; gap: 6px; }
  #info { top: 14px; right: 14px; width: 260px; }
  #info .desc { color: var(--fg); font-size: 13px; line-height: 1.6; margin: 4px 0; }
  #info .meta { color: var(--dim); font-size: 11px; letter-spacing: 0.1em; }
  #help { bottom: 14px; left: 14px; font-size: 11px; color: var(--dim); }
  #help kbd {
    background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.15);
    border-radius: 4px; padding: 1px 5px;
    font-family: ui-monospace, monospace; color: var(--fg);
  }
  #time {
    position: fixed; bottom: 14px; right: 14px;
    color: var(--accent);
    font-family: ui-monospace, monospace;
    font-size: 11px;
    letter-spacing: 0.15em;
    background: rgba(12, 26, 38, 0.65);
    border: 1px solid rgba(255, 216, 74, 0.25);
    border-radius: 8px;
    padding: 6px 12px;
    text-shadow: 0 0 10px rgba(255, 216, 74, 0.5);
  }

  @media (max-width: 720px) {
    #info { width: calc(100vw - 28px); top: auto; bottom: 80px; right: 14px; }
    #controls { width: calc(100vw - 28px); }
    #help { display: none; }
  }

  #fallback {
    position: fixed; inset: 0;
    display: none; align-items: center; justify-content: center;
    background: var(--bg-0); color: var(--fg);
    padding: 24px; text-align: center;
  }
  #fallback.show { display: flex; }
  #fallback h1 { color: var(--accent); letter-spacing: 0.12em; }
  #fallback pre {
    text-align: left; background: rgba(0,0,0,.4); padding: 12px;
    border-radius: 8px; font-size: 11px; color: #ff5470;
    max-width: 520px; overflow: auto;
  }
</style>
</head>
<body>
<div id="stage"></div>

<aside id="controls" class="panel" aria-label="控制面板">
  <h3>浮空岛 · 控制台</h3>
  <div class="group">
    <label>时间 <input id="rTime" type="range" min="0" max="1" step="0.01" value="0.45" /> <span id="vTime">黄昏</span></label>
    <div class="row" style="display:flex;gap:6px;flex-wrap:wrap">
      <button id="btnDawn">黎明</button>
      <button id="btnNoon">正午</button>
      <button id="btnDusk" aria-pressed="true">黄昏</button>
      <button id="btnNight">夜晚</button>
    </div>
  </div>
  <div class="group">
    <label>粒子密度 <input id="rPart" type="range" min="0.2" max="1" step="0.05" value="1" /> <span id="vPart">1.0×</span></label>
    <label>相机速度 <input id="rCam" type="range" min="0" max="1.5" step="0.05" value="1" /> <span id="vCam">1.0</span></label>
    <label>种子 <input id="rSeed" type="range" min="0" max="1" step="0.01" value="0.42" /> <span id="vSeed">0.42</span></label>
  </div>
  <div class="group">
    <label><input id="cWater" type="checkbox" checked /> 瀑布</label>
    <label><input id="cBirds" type="checkbox" checked /> 飞鸟蝴蝶</label>
    <label><input id="cFire" type="checkbox" checked /> 火堆火星</label>
  </div>
</aside>

<aside id="info" class="panel" aria-live="polite">
  <h3>场景说明</h3>
  <div class="desc">一座漂浮在云海之上的微缩岛。岛上三座建筑、半悬瀑布与一只火堆，讲述关于"守望者"的简短故事。</div>
  <div class="meta">· 鼠标拖拽旋转 · 滚轮缩放</div>
  <div class="meta">· 切换时间滑杆看昼夜</div>
</aside>

<aside id="help" class="panel">
  <div><kbd>←</kbd>/<kbd>→</kbd> 旋转 &nbsp; <kbd>↑</kbd>/<kbd>↓</kbd> 俯仰</div>
  <div><kbd>+</kbd>/<kbd>-</kbd> 缩放 &nbsp; <kbd>1</kbd>-<kbd>4</kbd> 切换时间</div>
</aside>

<div id="time">TIME · DUSK</div>

<div id="fallback" role="alert">
  <div>
    <h1>三维环境暂不可用</h1>
    <p id="fbMsg">本页面需要 WebGL2 与 Three.js 0.181。</p>
    <pre id="fbTrace" hidden></pre>
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.181.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.181.0/examples/jsm/"
  }
}
</script>

<script type="module">
const FB = document.getElementById('fallback');
const FB_MSG = document.getElementById('fbMsg');
const FB_TRACE = document.getElementById('fbTrace');
function showFallback(msg, err) {
  FB_MSG.textContent = msg;
  if (err) { FB_TRACE.hidden = false; FB_TRACE.textContent = (err && err.stack) ? err.stack : String(err); }
  FB.classList.add('show');
}
function hasWebGL() { try { const c = document.createElement('canvas'); return !!(c.getContext('webgl2') || c.getContext('webgl')); } catch { return false; } }
if (!hasWebGL()) { showFallback('未检测到 WebGL。'); throw new Error('No WebGL'); }

let THREE, OrbitControls;
try {
  THREE = await import('three');
  ({ OrbitControls } = await import('three/addons/controls/OrbitControls.js'));
} catch (err) { showFallback('Three.js 加载失败。', err); throw err; }

const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
const stage = document.getElementById('stage');
const renderer = new THREE.WebGLRenderer({ antialias: !reduceMotion });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.shadowMap.enabled = !reduceMotion;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
stage.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x4a6a8a);
scene.fog = new THREE.FogExp2(0x6a8aac, 0.008);

const camera = new THREE.PerspectiveCamera(50, innerWidth / innerHeight, 0.1, 600);
camera.position.set(18, 14, 18);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 2, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.minDistance = 8;
controls.maxDistance = 60;
controls.maxPolarAngle = Math.PI * 0.49;
controls.touches = { ONE: THREE.TOUCH.ROTATE, TWO: THREE.TOUCH.DOLLY_PAN };

const hemi = new THREE.HemisphereLight(0xffd9a3, 0x443322, 0.55);
scene.add(hemi);
const sun = new THREE.DirectionalLight(0xffd9a3, 1.4);
sun.position.set(20, 25, 10);
sun.castShadow = !reduceMotion;
sun.shadow.mapSize.set(1024, 1024);
sun.shadow.camera.left = -20; sun.shadow.camera.right = 20;
sun.shadow.camera.top = 20; sun.shadow.camera.bottom = -20;
sun.shadow.camera.near = 0.5; sun.shadow.camera.far = 60;
sun.shadow.bias = -0.0005;
scene.add(sun);
const ambient = new THREE.AmbientLight(0xffffff, 0.15);
scene.add(ambient);

// ── Procedural noise ──────────────────────────────────────────
function noise2(x, z, seed) {
  const ix = Math.floor(x), iz = Math.floor(z);
  const fx = x - ix, fz = z - iz;
  const h = (a, b) => {
    const v = Math.sin(a * 374.5 + b * 91.3 + seed * 12.9) * 0.5 + 0.5;
    return v * v;
  };
  const a = h(ix, iz), b = h(ix + 1, iz), c = h(ix, iz + 1), d = h(ix + 1, iz + 1);
  const u = fx * fx * (3 - 2 * fx), v = fz * fz * (3 - 2 * fz);
  return (a * (1 - u) + b * u) * (1 - v) + (c * (1 - u) + d * u) * v;
}
function fbm(x, z, octaves, seed) {
  let v = 0, amp = 0.5, freq = 1;
  for (let i = 0; i < octaves; i++) {
    v += noise2(x * freq, z * freq, seed + i) * amp;
    amp *= 0.5; freq *= 2;
  }
  return v;
}

// time-of-day palette
const TOD = {
  dawn:    { sky: [0.4, 0.55, 0.7], fog: 0x8a9aac, sun: [1.0, 0.85, 0.7], sunPos: [-15, 8, 20], hemi: [1.0, 0.85, 0.7], amb: 0.25, time: 0.2 },
  noon:    { sky: [0.3, 0.55, 0.85], fog: 0x6a8aac, sun: [1.0, 0.95, 0.9], sunPos: [10, 25, 10], hemi: [0.9, 0.95, 1.0], amb: 0.4, time: 0.5 },
  dusk:    { sky: [0.45, 0.35, 0.55], fog: 0x6a4a5a, sun: [1.0, 0.6, 0.4], sunPos: [20, 6, -10], hemi: [1.0, 0.7, 0.6], amb: 0.2, time: 0.7 },
  night:   { sky: [0.05, 0.08, 0.15], fog: 0x0a0a1a, sun: [0.4, 0.4, 0.6], sunPos: [0, 5, 0], hemi: [0.2, 0.3, 0.5], amb: 0.08, time: 0 }
};
function lerp(a, b, t) { return a + (b - a) * t; }
function lerpColor(c1, c2, t) {
  return new THREE.Color(lerp(c1[0], c2[0], t), lerp(c1[1], c2[1], t), lerp(c1[2], c2[2], t));
}
function lerpTOD(t) {
  // t = 0..1: 0=night, 0.25=dawn, 0.5=noon, 0.75=dusk, 1=night
  const points = [TOD.night, TOD.dawn, TOD.noon, TOD.dusk, TOD.night];
  const tClamp = Math.max(0, Math.min(0.999, t));
  const i = Math.floor(tClamp * 4);
  const frac = (tClamp * 4) - i;
  const a = points[i], b = points[i + 1];
  return {
    sky: lerpColor(a.sky, b.sky, frac),
    sun: lerpColor(a.sun, b.sun, frac),
    sunPos: [
      lerp(a.sunPos[0], b.sunPos[0], frac),
      lerp(a.sunPos[1], b.sunPos[1], frac),
      lerp(a.sunPos[2], b.sunPos[2], frac)
    ],
    fog: new THREE.Color(lerpColor([((a.fog>>16)&255)/255, ((a.fog>>8)&255)/255, (a.fog&255)/255], [((b.fog>>16)&255)/255, ((b.fog>>8)&255)/255, (b.fog&255)/255], frac).getHex()),
    amb: lerp(a.amb, b.amb, frac)
  };
}
let currentTOD = lerpTOD(0.7);

// sky dome
const skyDome = new THREE.Mesh(
  new THREE.SphereGeometry(300, 32, 16),
  new THREE.ShaderMaterial({
    side: THREE.BackSide,
    depthWrite: false,
    uniforms: {
      uTime: { value: 0 },
      uTop: { value: new THREE.Color(0x4a78a8) },
      uBot: { value: new THREE.Color(0xeec090) }
    },
    vertexShader: `varying vec3 vP; void main(){vP=position;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);}`,
    fragmentShader: `
      varying vec3 vP;
      uniform vec3 uTop, uBot;
      uniform float uTime;
      float hash(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}
      float noise(vec2 p){
        vec2 i=floor(p),f=fract(p);float a=hash(i),b=hash(i+vec2(1,0)),c=hash(i+vec2(0,1)),d=hash(i+vec2(1,1));
        return mix(mix(a,b,f.x),mix(c,d,f.x),f.y);
      }
      void main(){
        vec3 dir=normalize(vP);
        float t=dir.y*0.5+0.5;
        vec3 col=mix(uBot,uTop,t);
        float c=noise(dir.xz*4.0+uTime*0.02)*0.18;
        col+=vec3(c*0.5);
        gl_FragColor=vec4(col,1.0);
      }
    `
  })
);
scene.add(skyDome);

// distant clouds
const cloudGroup = new THREE.Group();
for (let i = 0; i < 18; i++) {
  const g = new THREE.Group();
  for (let j = 0; j < 5; j++) {
    const puff = new THREE.Mesh(
      new THREE.SphereGeometry(3 + Math.random() * 2, 8, 6),
      new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.7, fog: true })
    );
    puff.position.set((Math.random() - 0.5) * 5, Math.random() * 1, (Math.random() - 0.5) * 3);
    g.add(puff);
  }
  const a = Math.random() * Math.PI * 2;
  const r = 40 + Math.random() * 60;
  g.position.set(Math.cos(a) * r, -15 + Math.random() * 30, Math.sin(a) * r);
  g.userData.speed = 0.1 + Math.random() * 0.3;
  cloudGroup.add(g);
}
scene.add(cloudGroup);

// ── Island main body ──────────────────────────────────────────
const ISLAND_R = 8;
const SEG = 48;
const islandGeo = new THREE.CylinderGeometry(ISLAND_R, ISLAND_R * 0.5, 8, SEG, 6);
const ipos = islandGeo.attributes.position;
let currentSeed = 0.42;
function buildIsland(seed) {
  currentSeed = seed;
  for (let i = 0; i < ipos.count; i++) {
    const x = ipos.getX(i), y = ipos.getY(i), z = ipos.getZ(i);
    const r = Math.hypot(x, z);
    if (y > 0) {
      const n = fbm(x * 0.4, z * 0.4, 4, seed);
      ipos.setY(i, y + n * 1.2);
      const flatten = Math.max(0, 1 - r / (ISLAND_R * 0.7));
      ipos.setY(i, ipos.getY(i) - flatten * 1.2);
    }
    if (y < 0) {
      const taper = 1 - (-y) / 8;
      ipos.setX(i, x * (1 - 0.8 * (1 - taper)));
      ipos.setZ(i, z * (1 - 0.8 * (1 - taper)));
      const n = fbm(x * 0.6, z * 0.6, 3, seed);
      ipos.setY(i, y + (n - 0.5) * 0.8 * taper);
    }
    if (y > 3) {
      const pull = Math.min(1, (y - 3) / 5);
      ipos.setX(i, x * (1 - pull * 0.3));
      ipos.setZ(i, z * (1 - pull * 0.3));
    }
  }
  islandGeo.computeVertexNormals();
  const colors = new Float32Array(ipos.count * 3);
  const grassTop = new THREE.Color(0x4a7a3a);
  const grassMid = new THREE.Color(0x6a8b3f);
  const rock = new THREE.Color(0x7a5a3a);
  const darkRock = new THREE.Color(0x3a2a1a);
  for (let i = 0; i < ipos.count; i++) {
    const y = ipos.getY(i);
    const x = ipos.getX(i), z = ipos.getZ(i);
    const r = Math.hypot(x, z);
    let c;
    if (y > 1) {
      const noise = fbm(x * 0.8, z * 0.8, 4, seed + 0.3);
      c = new THREE.Color().lerpColors(grassMid, grassTop, noise);
      if (noise < 0.4) c.lerp(rock, 0.5);
    } else if (y > -2) {
      const tt = (y + 2) / 3;
      c = new THREE.Color().lerpColors(rock, grassMid, tt);
      if (r > 7) c.lerp(darkRock, 0.3);
    } else {
      const tt = Math.max(0, (y + 8) / 6);
      c = new THREE.Color().lerpColors(darkRock, rock, tt);
    }
    colors[i * 3] = c.r; colors[i * 3 + 1] = c.g; colors[i * 3 + 2] = c.b;
  }
  islandGeo.setAttribute('color', new THREE.BufferAttribute(colors, 3));
}
buildIsland(currentSeed);
const islandMat = new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 0.9, metalness: 0.0, flatShading: false });
const island = new THREE.Mesh(islandGeo, islandMat);
island.position.y = -2;
island.castShadow = true;
island.receiveShadow = true;
scene.add(island);

function topY(x, z) {
  const r = Math.hypot(x, z);
  const n = fbm(x * 0.4, z * 0.4, 4, currentSeed) * 1.2;
  const flatten = Math.max(0, 1 - r / (ISLAND_R * 0.7));
  return n - flatten * 1.2;
}

// floating debris
const debrisList = [];
for (let i = 0; i < 8; i++) {
  const a = Math.random() * Math.PI * 2;
  const r = ISLAND_R + 0.5 + Math.random() * 1.5;
  const debris = new THREE.Mesh(
    new THREE.DodecahedronGeometry(0.2 + Math.random() * 0.3, 0),
    new THREE.MeshStandardMaterial({ color: 0x5a4028, roughness: 0.95, flatShading: true })
  );
  debris.position.set(Math.cos(a) * r, -6 - Math.random() * 4, Math.sin(a) * r);
  debris.rotation.set(Math.random() * Math.PI, Math.random() * Math.PI, Math.random() * Math.PI);
  debris.userData.basePos = debris.position.clone();
  debris.userData.rotSpeed = 0.1 + Math.random() * 0.2;
  debris.userData.bobPhase = Math.random() * Math.PI * 2;
  scene.add(debris);
  debrisList.push(debris);
}

// ── Grass tufts ───────────────────────────────────────────────
const tuftMat = new THREE.MeshStandardMaterial({ color: 0x6a8b3f, roughness: 0.8, flatShading: true });
function grassTuft(x, z) {
  const g = new THREE.Group();
  for (let i = 0; i < 5; i++) {
    const blade = new THREE.Mesh(new THREE.ConeGeometry(0.04, 0.3 + Math.random() * 0.15, 4), tuftMat);
    blade.position.set((Math.random() - 0.5) * 0.2, 0.15, (Math.random() - 0.5) * 0.2);
    blade.rotation.z = (Math.random() - 0.5) * 0.3;
    g.add(blade);
  }
  g.position.set(x, topY(x, z) + 0.05, z);
  scene.add(g);
  return g;
}
const tufts = [];
for (let i = 0; i < 50; i++) {
  const a = Math.random() * Math.PI * 2;
  const r = Math.random() * (ISLAND_R * 0.85);
  const x = Math.cos(a) * r, z = Math.sin(a) * r;
  if (Math.hypot(x, z) < 1.5) continue;
  tufts.push(grassTuft(x, z));
}

// ── Buildings ──────────────────────────────────────────────────
function buildCabin(x, z) {
  const g = new THREE.Group();
  const base = new THREE.Mesh(new THREE.BoxGeometry(1.2, 1.0, 1.0),
    new THREE.MeshStandardMaterial({ color: 0x8a6248, roughness: 0.85, flatShading: true }));
  base.position.y = 0.5;
  base.castShadow = true; base.receiveShadow = true;
  g.add(base);
  const roof = new THREE.Mesh(new THREE.ConeGeometry(0.9, 0.6, 4),
    new THREE.MeshStandardMaterial({ color: 0x6a3030, roughness: 0.7 }));
  roof.position.y = 1.3;
  roof.rotation.y = Math.PI / 4;
  roof.castShadow = true;
  g.add(roof);
  const door = new THREE.Mesh(new THREE.BoxGeometry(0.3, 0.5, 0.05),
    new THREE.MeshStandardMaterial({ color: 0x3a2010, emissive: 0xffaa55, emissiveIntensity: 0.6 }));
  door.position.set(0, 0.5, 0.51);
  g.add(door);
  const win = new THREE.Mesh(new THREE.BoxGeometry(0.25, 0.25, 0.05),
    new THREE.MeshStandardMaterial({ color: 0xffcc88, emissive: 0xffcc88, emissiveIntensity: 1.2, transparent: true, opacity: 0.95 }));
  win.position.set(0.4, 0.7, 0.51);
  g.add(win);
  const chim = new THREE.Mesh(new THREE.BoxGeometry(0.18, 0.45, 0.18),
    new THREE.MeshStandardMaterial({ color: 0x5a4030, roughness: 0.9 }));
  chim.position.set(-0.4, 1.5, -0.2);
  chim.castShadow = true;
  g.add(chim);
  g.position.set(x, topY(x, z) + 0.02, z);
  g.rotation.y = Math.random() * Math.PI * 2;
  scene.add(g);
  return g;
}
function buildTower(x, z) {
  const g = new THREE.Group();
  const stone = new THREE.Mesh(
    new THREE.CylinderGeometry(0.45, 0.55, 3.2, 12),
    new THREE.MeshStandardMaterial({ color: 0x9a8870, roughness: 0.92, flatShading: true })
  );
  stone.position.y = 1.6;
  stone.castShadow = true; stone.receiveShadow = true;
  g.add(stone);
  const roof = new THREE.Mesh(new THREE.ConeGeometry(0.55, 0.7, 12),
    new THREE.MeshStandardMaterial({ color: 0x4a2820, roughness: 0.7 }));
  roof.position.y = 3.5;
  roof.castShadow = true;
  g.add(roof);
  const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.02, 0.02, 0.6, 6),
    new THREE.MeshStandardMaterial({ color: 0x4a3020, roughness: 0.6 }));
  pole.position.y = 4.1;
  g.add(pole);
  const flag = new THREE.Mesh(new THREE.PlaneGeometry(0.3, 0.2),
    new THREE.MeshStandardMaterial({ color: 0xff5050, emissive: 0xff5050, emissiveIntensity: 0.6, side: THREE.DoubleSide }));
  flag.position.set(0.15, 4.2, 0);
  g.add(flag);
  for (const yy of [0.8, 1.6, 2.4]) {
    const slit = new THREE.Mesh(new THREE.BoxGeometry(0.12, 0.3, 0.06),
      new THREE.MeshStandardMaterial({ color: 0xffcc66, emissive: 0xffcc66, emissiveIntensity: 1.4 }));
    slit.position.set(0, yy, 0.46);
    g.add(slit);
  }
  g.position.set(x, topY(x, z) + 0.02, z);
  scene.add(g);
  return g;
}
function buildBridge(x1, z1, x2, z2) {
  const g = new THREE.Group();
  const len = Math.hypot(x2 - x1, z2 - z1);
  const ang = Math.atan2(z2 - z1, x2 - x1);
  const planks = 8;
  for (let i = 0; i < planks; i++) {
    const plank = new THREE.Mesh(new THREE.BoxGeometry(0.3, 0.06, len / planks + 0.05),
      new THREE.MeshStandardMaterial({ color: 0x6a4830, roughness: 0.85 }));
    const t = (i + 0.5) / planks - 0.5;
    plank.position.set(t * len * Math.cos(ang), -t * len * Math.sin(ang) * 0.05 + Math.sin(t * Math.PI) * 0.4, t * len * Math.sin(ang));
    plank.castShadow = true;
    g.add(plank);
  }
  const ropeMat = new THREE.MeshStandardMaterial({ color: 0x3a2818, roughness: 0.9 });
  for (const yy of [0.4, -0.4]) {
    const rope = new THREE.Mesh(new THREE.CylinderGeometry(0.02, 0.02, len, 6), ropeMat);
    rope.position.set(len / 2 * Math.cos(ang), yy, len / 2 * Math.sin(ang));
    rope.rotation.z = Math.PI / 2 - ang;
    g.add(rope);
  }
  g.position.set((x1 + x2) / 2, 0.5, (z1 + z2) / 2);
  g.rotation.y = -ang;
  scene.add(g);
}
buildCabin(2.5, 1.0);
buildCabin(-1.5, 2.5);
buildTower(0, -2.5);
buildBridge(2.5, 1.0, -1.5, 2.5);

function buildPath(points, width = 0.3) {
  const pts = points.map(p => new THREE.Vector3(p[0], p[1] + 0.02, p[2]));
  const curve = new THREE.CatmullRomCurve3(pts);
  const geo = new THREE.TubeGeometry(curve, 20, width, 6, false);
  const tube = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({ color: 0x8a7058, roughness: 0.95 }));
  tube.receiveShadow = true;
  scene.add(tube);
}
buildPath([[2.5, topY(2.5, 1.0), 1.0], [1, topY(1, 0.5), 0.5], [0, topY(0, 0), 0], [-1.5, topY(-1.5, 2.5), 2.5]]);
buildPath([[0, topY(0, 0), 0], [0, topY(0, -2.5), -2.5]]);

// ── Waterfall ─────────────────────────────────────────────────
const WATERFALL_HEIGHT = 5;
const waterfallGeo = new THREE.PlaneGeometry(1.5, WATERFALL_HEIGHT, 1, 32);
const waterfallMat = new THREE.ShaderMaterial({
  transparent: true,
  depthWrite: false,
  side: THREE.DoubleSide,
  uniforms: { uTime: { value: 0 }, uVisible: { value: 1.0 } },
  vertexShader: `
    uniform float uTime;
    varying vec2 vUv;
    varying float vFlow;
    void main(){
      vUv = uv;
      vec3 p = position;
      float yOffset = mod(uTime * 1.5 + (1.0 - uv.y) * 2.0, 2.0);
      vFlow = yOffset;
      gl_Position = projectionMatrix * modelViewMatrix * vec4(p, 1.0);
    }
  `,
  fragmentShader: `
    varying vec2 vUv;
    varying float vFlow;
    uniform float uTime;
    uniform float uVisible;
    float hash(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}
    float noise(vec2 p){
      vec2 i=floor(p),f=fract(p);float a=hash(i),b=hash(i+vec2(1,0)),c=hash(i+vec2(0,1)),d=hash(i+vec2(1,1));
      return mix(mix(a,b,f.x),mix(c,d,f.x),f.y);
    }
    float fbm(vec2 p){float v=0.,a=0.5;for(int i=0;i<4;i++){v+=noise(p)*a;a*=0.5;p*=2.;}return v;}
    void main(){
      vec2 uv = vUv;
      float n = fbm(vec2(uv.x * 8.0, uv.y * 4.0 + vFlow));
      float n2 = fbm(vec2(uv.x * 16.0 + 10.0, uv.y * 8.0 + vFlow * 1.3));
      float mask = smoothstep(0.3, 0.9, n) * (1.0 - n2 * 0.5);
      float edgeFade = smoothstep(0.0, 0.05, uv.x) * smoothstep(1.0, 0.95, uv.x);
      float topFade = smoothstep(1.0, 0.85, uv.y);
      vec3 base = vec3(0.6, 0.85, 0.95);
      vec3 foam = vec3(0.95, 1.0, 1.0);
      vec3 col = mix(base, foam, mask);
      float alpha = mask * 0.85 * edgeFade * topFade * uVisible;
      if (uv.y < 0.05) alpha *= 1.5;
      gl_FragColor = vec4(col, alpha);
    }
  `
});
const waterfall = new THREE.Mesh(waterfallGeo, waterfallMat);
waterfall.position.set(ISLAND_R - 0.4, -WATERFALL_HEIGHT / 2 + 1, -1.5);
waterfall.rotation.y = -Math.PI / 2;
scene.add(waterfall);
const mistGeo = new THREE.BufferGeometry();
const mistCount = 80;
const mistPos = new Float32Array(mistCount * 3);
for (let i = 0; i < mistCount; i++) {
  mistPos[i * 3] = (Math.random() - 0.5) * 2;
  mistPos[i * 3 + 1] = -3 + Math.random() * 0.5;
  mistPos[i * 3 + 2] = -1.5 + (Math.random() - 0.5) * 0.5;
}
mistGeo.setAttribute('position', new THREE.BufferAttribute(mistPos, 3));
const mist = new THREE.Points(mistGeo, new THREE.PointsMaterial({
  size: 0.4, color: 0xeeffff, transparent: true, opacity: 0.6,
  sizeAttenuation: true, depthWrite: false, blending: THREE.AdditiveBlending
}));
scene.add(mist);
const pool = new THREE.Mesh(
  new THREE.CircleGeometry(1.5, 32),
  new THREE.MeshStandardMaterial({ color: 0x4488aa, roughness: 0.4, metalness: 0.5, transparent: true, opacity: 0.7 })
);
pool.rotation.x = -Math.PI / 2;
pool.position.set(ISLAND_R + 0.8, -3.5, -1.5);
scene.add(pool);

// ── Fire & sparks ─────────────────────────────────────────────
const fireGroup = new THREE.Group();
fireGroup.position.set(-2, topY(-2, -2) + 0.05, -2);
scene.add(fireGroup);
for (let i = 0; i < 4; i++) {
  const log = new THREE.Mesh(
    new THREE.CylinderGeometry(0.08, 0.1, 0.4, 6),
    new THREE.MeshStandardMaterial({ color: 0x4a2818, roughness: 0.95 })
  );
  log.rotation.z = Math.PI / 2;
  log.rotation.x = Math.PI / 6 * (i - 2) * 0.5;
  log.position.y = Math.cos(i * 0.5) * 0.06;
  fireGroup.add(log);
}
const flameMat = new THREE.MeshBasicMaterial({ color: 0xff7733, transparent: true, opacity: 0.85, depthWrite: false, blending: THREE.AdditiveBlending });
const flame = new THREE.Mesh(new THREE.ConeGeometry(0.25, 0.6, 8), flameMat);
flame.position.y = 0.3;
fireGroup.add(flame);
const flameGlow = new THREE.PointLight(0xff7733, 1.5, 4);
flameGlow.position.y = 0.4;
fireGroup.add(flameGlow);
const sparksGeo = new THREE.BufferGeometry();
const SP_COUNT = 60;
const spPos = new Float32Array(SP_COUNT * 3);
const spVel = new Float32Array(SP_COUNT * 3);
for (let i = 0; i < SP_COUNT; i++) {
  spPos[i * 3] = fireGroup.position.x + (Math.random() - 0.5) * 0.3;
  spPos[i * 3 + 1] = fireGroup.position.y + 0.2;
  spPos[i * 3 + 2] = fireGroup.position.z + (Math.random() - 0.5) * 0.3;
  spVel[i * 3] = (Math.random() - 0.5) * 0.3;
  spVel[i * 3 + 1] = 0.5 + Math.random() * 0.6;
  spVel[i * 3 + 2] = (Math.random() - 0.5) * 0.3;
}
sparksGeo.setAttribute('position', new THREE.BufferAttribute(spPos, 3));
const sparks = new THREE.Points(sparksGeo, new THREE.PointsMaterial({
  size: 0.15, color: 0xffaa55, transparent: true, opacity: 0.9,
  blending: THREE.AdditiveBlending, depthWrite: false, sizeAttenuation: true
}));
scene.add(sparks);

// ── Birds / butterflies ───────────────────────────────────────
const birds = [];
for (let i = 0; i < 8; i++) {
  const b = new THREE.Group();
  const body = new THREE.Mesh(new THREE.ConeGeometry(0.05, 0.2, 4),
    new THREE.MeshStandardMaterial({ color: 0x222222, flatShading: true }));
  body.rotation.z = Math.PI / 2;
  b.add(body);
  const wingL = new THREE.Mesh(new THREE.PlaneGeometry(0.18, 0.06),
    new THREE.MeshStandardMaterial({ color: 0x222222, side: THREE.DoubleSide, flatShading: true }));
  wingL.position.x = -0.1;
  b.add(wingL);
  const wingR = wingL.clone();
  wingR.position.x = 0.1;
  b.add(wingR);
  const a = Math.random() * Math.PI * 2;
  const r = 4 + Math.random() * 4;
  b.position.set(Math.cos(a) * r, 6 + Math.random() * 3, Math.sin(a) * r);
  scene.add(b);
  birds.push({
    mesh: b, wingL, wingR,
    center: new THREE.Vector3(Math.cos(a) * r, 6 + Math.random() * 3, Math.sin(a) * r),
    radius: 1 + Math.random(),
    speed: 0.3 + Math.random() * 0.5,
    phase: Math.random() * Math.PI * 2,
    yPhase: Math.random() * Math.PI * 2
  });
}

const butterflies = [];
for (let i = 0; i < 6; i++) {
  const b = new THREE.Mesh(
    new THREE.PlaneGeometry(0.12, 0.08),
    new THREE.MeshStandardMaterial({ color: Math.random() > 0.5 ? 0xff66aa : 0x66ddff, side: THREE.DoubleSide, transparent: true, opacity: 0.9, emissive: 0xaa4488, emissiveIntensity: 0.4 })
  );
  b.position.set((Math.random() - 0.5) * 5, 2 + Math.random() * 2, (Math.random() - 0.5) * 5);
  scene.add(b);
  butterflies.push({ mesh: b, phase: Math.random() * Math.PI * 2, speed: 0.5 + Math.random() });
}

// ── Distant islands ───────────────────────────────────────────
for (let i = 0; i < 5; i++) {
  const a = (i / 5) * Math.PI * 2 + Math.random() * 0.3;
  const r = 80 + Math.random() * 30;
  const g = new THREE.CylinderGeometry(4 + Math.random() * 2, 1, 6 + Math.random() * 4, 8);
  const m = new THREE.MeshStandardMaterial({ color: 0x4a6a48, roughness: 0.95, flatShading: true });
  const mi = new THREE.Mesh(g, m);
  mi.position.set(Math.cos(a) * r, -8, Math.sin(a) * r);
  scene.add(mi);
}

// ── UI ────────────────────────────────────────────────────────
const rTime = document.getElementById('rTime');
const vTime = document.getElementById('vTime');
const rPart = document.getElementById('rPart');
const vPart = document.getElementById('vPart');
const rCam = document.getElementById('rCam');
const vCam = document.getElementById('vCam');
const rSeed = document.getElementById('rSeed');
const vSeed = document.getElementById('vSeed');
const cWater = document.getElementById('cWater');
const cBirds = document.getElementById('cBirds');
const cFire = document.getElementById('cFire');
const btnDawn = document.getElementById('btnDawn');
const btnNoon = document.getElementById('btnNoon');
const btnDusk = document.getElementById('btnDusk');
const btnNight = document.getElementById('btnNight');
const timeLabel = document.getElementById('time');

let partScale = 1;
let camSpeed = 1;
function setTOD(t) {
  rTime.value = t;
  vTime.textContent = ['夜晚', '黎明', '黎明', '正午', '正午', '黄昏', '黄昏', '夜晚'][Math.round(t * 8)] || '—';
}
function setTime(t) {
  currentTOD = lerpTOD(t);
  sun.color.copy(currentTOD.sun);
  sun.position.set(currentTOD.sunPos[0], currentTOD.sunPos[1], currentTOD.sunPos[2]);
  hemi.color.copy(new THREE.Color(...currentTOD.sky).lerp(new THREE.Color(...currentTOD.sun), 0.3));
  hemi.groundColor = new THREE.Color(0x2a1a14);
  ambient.intensity = currentTOD.amb;
  scene.background = currentTOD.sky.clone().multiplyScalar(1.5);
  scene.fog.color.copy(currentTOD.fog);
  skyDome.material.uniforms.uTop.value.copy(currentTOD.sky);
  skyDome.material.uniforms.uBot.value.copy(currentTOD.sun);
  const todNames = ['NIGHT', 'DAWN', 'NOON', 'DUSK'];
  const ti = Math.round(t * 4) % 4;
  timeLabel.textContent = 'TIME · ' + todNames[ti];
  // window glow dim in day
  const dayBlend = Math.max(0, Math.min(1, (t > 0.4 && t < 0.85) ? 1 - Math.abs((t - 0.625) / 0.225) : 0));
  scene.traverse(obj => {
    if (obj.material && obj.material.emissive && obj.userData?.isWindow) {
      obj.material.emissiveIntensity = 0.4 + dayBlend * 1.0;
    }
  });
}
rTime.addEventListener('input', () => setTOD(parseFloat(rTime.value)));
rPart.addEventListener('input', () => { partScale = parseFloat(rPart.value); vPart.textContent = partScale.toFixed(2) + '×'; });
rCam.addEventListener('input', () => { camSpeed = parseFloat(rCam.value); vCam.textContent = camSpeed.toFixed(2); });
rSeed.addEventListener('input', () => { currentSeed = parseFloat(rSeed.value); vSeed.textContent = currentSeed.toFixed(2); buildIsland(currentSeed); });
cWater.addEventListener('change', () => { waterfallMat.uniforms.uVisible.value = cWater.checked ? 1 : 0; mist.visible = cWater.checked; pool.visible = cWater.checked; });
cBirds.addEventListener('change', () => { birds.forEach(b => b.mesh.visible = cBirds.checked); butterflies.forEach(b => b.mesh.visible = cBirds.checked); });
cFire.addEventListener('change', () => { fireGroup.visible = cFire.checked; sparks.visible = cFire.checked; });

btnDawn.addEventListener('click', () => setTime(0.25));
btnNoon.addEventListener('click', () => setTime(0.5));
btnDusk.addEventListener('click', () => setTime(0.75));
btnNight.addEventListener('click', () => setTime(0));
[btnDawn, btnNoon, btnDusk, btnNight].forEach(b => b.addEventListener('click', () => {
  [btnDawn, btnNoon, btnDusk, btnNight].forEach(bb => bb.setAttribute('aria-pressed', 'false'));
  b.setAttribute('aria-pressed', 'true');
}));

addEventListener('keydown', (e) => {
  if (e.key === '1') btnDawn.click();
  if (e.key === '2') btnNoon.click();
  if (e.key === '3') btnDusk.click();
  if (e.key === '4') btnNight.click();
});
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

// mark windows
fireGroup.traverse(o => { if (o.material?.emissive) o.userData.isWindow = true; });
scene.traverse(o => {
  if (o.material && o.material.emissive && (o.material.color.r > 0.9 && o.material.emissiveIntensity > 0.5)) {
    o.userData.isWindow = true;
  }
});

setTime(0.7);

// ── Main loop ──────────────────────────────────────────────────
function frame() {
  const dt = Math.min(performance.now() - (frame.lastT || performance.now()), 50) / 1000;
  frame.lastT = performance.now();
  const t = (frame.t = (frame.t || 0) + dt) * camSpeed;

  skyDome.material.uniforms.uTime.value = t;
  waterfallMat.uniforms.uTime.value = t;

  // cloud drift
  cloudGroup.children.forEach(c => {
    c.position.x += c.userData.speed * dt;
    if (c.position.x > 150) c.position.x = -150;
  });

  // debris bobbing
  debrisList.forEach(d => {
    d.rotation.x += d.userData.rotSpeed * dt;
    d.rotation.y += d.userData.rotSpeed * 0.5 * dt;
    d.position.y = d.userData.basePos.y + Math.sin(t * 0.7 + d.userData.bobPhase) * 0.2;
  });

  // waterfall mist
  if (cWater.checked) {
    for (let i = 0; i < mistCount; i++) {
      mistPos[i * 3 + 1] += dt * 0.3 * partScale;
      mistPos[i * 3] += Math.sin(t + i) * 0.005 * partScale;
      if (mistPos[i * 3 + 1] > -1.5) {
        mistPos[i * 3] = (Math.random() - 0.5) * 2;
        mistPos[i * 3 + 1] = -3;
        mistPos[i * 3 + 2] = -1.5 + (Math.random() - 0.5) * 0.5;
      }
    }
    mistGeo.attributes.position.needsUpdate = true;
  }

  // flame flicker
  flame.scale.set(0.9 + Math.sin(t * 12) * 0.1, 1 + Math.sin(t * 15) * 0.15, 0.9 + Math.cos(t * 11) * 0.1);
  flameMat.opacity = 0.7 + Math.sin(t * 20) * 0.15;

  // sparks
  if (cFire.checked) {
    for (let i = 0; i < SP_COUNT; i++) {
      spPos[i * 3] += spVel[i * 3] * dt;
      spPos[i * 3 + 1] += spVel[i * 3 + 1] * dt;
      spPos[i * 3 + 2] += spVel[i * 3 + 2] * dt;
      spVel[i * 3 + 1] -= dt * 1.5;
      if (spPos[i * 3 + 1] < fireGroup.position.y) {
        spPos[i * 3] = fireGroup.position.x + (Math.random() - 0.5) * 0.3;
        spPos[i * 3 + 1] = fireGroup.position.y + 0.2;
        spPos[i * 3 + 2] = fireGroup.position.z + (Math.random() - 0.5) * 0.3;
        spVel[i * 3] = (Math.random() - 0.5) * 0.3;
        spVel[i * 3 + 1] = 0.5 + Math.random() * 0.6;
        spVel[i * 3 + 2] = (Math.random() - 0.5) * 0.3;
      }
    }
    sparksGeo.attributes.position.needsUpdate = true;
  }

  // birds
  if (cBirds.checked) {
    birds.forEach(b => {
      const a = b.phase + t * b.speed;
      b.mesh.position.set(
        b.center.x + Math.cos(a) * b.radius,
        b.center.y + Math.sin(t * 0.7 + b.yPhase) * 0.5,
        b.center.z + Math.sin(a) * b.radius
      );
      b.mesh.rotation.y = -a + Math.PI / 2;
      const flap = Math.sin(t * 18 + b.phase) * 0.5 + 0.5;
      b.wingL.rotation.y = -flap * 0.7;
      b.wingR.rotation.y = flap * 0.7;
    });
    butterflies.forEach(b => {
      b.mesh.position.x += Math.cos(b.phase + t * 0.5) * dt * 0.5;
      b.mesh.position.z += Math.sin(b.phase + t * 0.5) * dt * 0.5;
      b.mesh.position.y = 2.5 + Math.sin(t * 1.5 + b.phase) * 0.3;
      b.mesh.rotation.y = t * 1.5 + b.phase;
      const flap = (Math.sin(t * 16 + b.phase) + 1) * 0.5;
      b.mesh.scale.y = 0.5 + flap * 0.5;
    });
  }

  controls.update();
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
