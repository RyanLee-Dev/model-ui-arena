<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>日晷时钟</title>
<style>
:root{--bg1:#f3ead8;--bg2:#d9cbb0;--ink:#1a1610;--face:#fbf4e6;--gold:#b8894a;--hand:#1c1712;--sec:#8d2d18;--soft:#7d705e}
.dusk{--bg1:#3a2430;--bg2:#1a1016;--ink:#f6e7d4;--face:#3d2a34;--gold:#e0a15c;--hand:#f3e6d4;--sec:#ff8a5b;--soft:#c9ad96}
.night{--bg1:#10182c;--bg2:#070b14;--ink:#e9eef8;--face:#151c2c;--gold:#d4b07a;--hand:#e8edf6;--sec:#8bb4ff;--soft:#93a0b8}
*{box-sizing:border-box;margin:0}
html,body{height:100%;overflow:hidden}
body{color:var(--ink);font-family:"Iowan Old Style","Palatino Linotype","Songti SC",serif;background:radial-gradient(90% 70% at 50% -10%,color-mix(in oklab,var(--gold) 28%,transparent),transparent 55%),linear-gradient(180deg,var(--bg1),var(--bg2));transition:background 1.2s,color 1.2s}
canvas{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}
.wrap{position:relative;z-index:1;height:100%;display:grid;place-items:center;padding:24px 14px}
.card{width:min(390px,94vw);text-align:center}
.brand{font-family:ui-sans-serif,system-ui,sans-serif;font-size:10px;letter-spacing:.46em;color:var(--soft)}
.phase{margin:8px 0 22px;font-size:20px;letter-spacing:.36em}
.clock{position:relative;width:100%;aspect-ratio:1;border-radius:50%;
  background:
    repeating-conic-gradient(from 0deg,color-mix(in oklab,var(--face) 82%,var(--gold)) 0 1.2deg,var(--face) 0 3.6deg),
    radial-gradient(circle at 32% 28%,#fff8,transparent 36%);
  box-shadow:
    0 40px 80px color-mix(in oklab,var(--ink) 18%,transparent),
    0 0 0 1px color-mix(in oklab,var(--gold) 55%,transparent),
    inset 0 0 0 14px color-mix(in oklab,var(--face) 55%,#000),
    inset 0 0 0 15px var(--gold),
    inset 0 18px 40px #0002}
.clock:after{content:"";position:absolute;inset:10%;border-radius:50%;background:linear-gradient(150deg,#fff8 0 16%,transparent 40%);pointer-events:none;z-index:4}
.bezel{position:absolute;inset:-7px;border-radius:50%;border:1px solid color-mix(in oklab,var(--gold) 40%,transparent);opacity:.7;pointer-events:none}
.tick{position:absolute;left:50%;top:6.6%;width:1.5px;height:5.4%;background:var(--ink);transform-origin:50% 800%;border-radius:2px;opacity:.16}
.tick.h{width:3px;height:8.4%;opacity:.8;background:var(--gold);box-shadow:0 0 8px color-mix(in oklab,var(--gold) 40%,transparent)}
.hand{position:absolute;left:50%;bottom:50%;transform-origin:50% 100%;border-radius:20px 20px 4px 4px;z-index:3;filter:drop-shadow(0 4px 6px #0004)}
#hh{width:8px;height:27%;margin-left:-4px;background:linear-gradient(var(--hand),color-mix(in oklab,var(--hand) 70%,var(--gold)))}
#mm{width:4.5px;height:36%;margin-left:-2.25px;background:var(--hand)}
#ss{width:1.6px;height:40%;margin-left:-.8px;background:var(--sec)}
#ss:after{content:"";position:absolute;left:50%;top:100%;width:7px;height:11%;margin-left:-3.5px;background:var(--sec);border-radius:8px}
.cap{position:absolute;left:50%;top:50%;width:13px;height:13px;border-radius:50%;background:var(--gold);transform:translate(-50%,-50%);box-shadow:0 0 0 6px color-mix(in oklab,var(--face) 80%,var(--gold));z-index:5}
.num{position:absolute;font-size:18px;opacity:.55;z-index:2}
.n12{left:50%;top:15%;transform:translateX(-50%)}
.n6{left:50%;bottom:15%;transform:translateX(-50%)}
.n3{right:15%;top:50%;transform:translateY(-50%)}
.n9{left:15%;top:50%;transform:translateY(-50%)}
.window{position:absolute;right:24%;top:46%;min-width:34px;padding:3px 6px;border-radius:4px;background:color-mix(in oklab,var(--face) 70%,#000);border:1px solid color-mix(in oklab,var(--gold) 45%,transparent);font-family:ui-sans-serif,system-ui,sans-serif;font-size:11px;letter-spacing:.06em;z-index:2}
.digital{margin-top:26px}
.hm{font-size:52px;font-weight:400;letter-spacing:.1em;line-height:1;font-variant-numeric:tabular-nums}
.sec{color:var(--sec);font-size:22px;margin-left:8px;vertical-align:super}
.date{margin-top:10px;font-family:ui-sans-serif,system-ui,sans-serif;font-size:12px;letter-spacing:.1em;color:var(--soft)}
</style>
</head>
<body>
<canvas id="fx"></canvas>
<div class="wrap">
  <div class="card">
    <div class="brand">LUMEN · ATELIER</div>
    <div class="phase" id="phase">午前</div>
    <div class="clock" id="face">
      <i class="bezel"></i>
      <b class="cap"></b>
      <span class="num n12">12</span><span class="num n3">3</span><span class="num n6">6</span><span class="num n9">9</span>
      <span class="window" id="dom"></span>
    </div>
    <div class="digital">
      <div class="hm"><span id="hm">00:00</span><span class="sec" id="sec">00</span></div>
      <div class="date" id="date"></div>
    </div>
  </div>
</div>
<script>
const face=document.getElementById("face");
for(let i=0;i<60;i++){
  const t=document.createElement("i");
  t.className="tick"+(i%5?"":" h");
  t.style.transform=`rotate(${i*6}deg)`;
  face.appendChild(t);
}
["hh","mm","ss"].forEach(id=>{const d=document.createElement("div");d.id=id;d.className="hand";face.appendChild(d)});

const canvas=document.getElementById("fx"),ctx=canvas.getContext("2d");
let W,H,dust=[];
function resize(){
  const dpr=Math.min(devicePixelRatio||1,2);
  W=innerWidth;H=innerHeight;canvas.width=W*dpr;canvas.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);
  dust=Array.from({length:70},()=>({x:Math.random()*W,y:Math.random()*H,r:.6+Math.random()*1.8,a:.08+Math.random()*.35,s:.08+Math.random()*.25}));
}
addEventListener("resize",resize);resize();

const pad=n=>String(n).padStart(2,"0");
const slots=[[5,"清晨","dusk"],[11,"午前",""],[17,"黄昏","dusk"],[20,"夜晚","night"],[24,"深夜","night"]];
function frame(t){
  const d=new Date(),h=d.getHours(),m=d.getMinutes(),s=d.getSeconds()+d.getMilliseconds()/1000;
  hh.style.transform=`rotate(${(h%12+m/60)*30}deg)`;
  mm.style.transform=`rotate(${(m+s/60)*6}deg)`;
  ss.style.transform=`rotate(${s*6}deg)`;
  document.getElementById("hm").textContent=`${pad(h)}:${pad(m)}`;
  document.getElementById("sec").textContent=pad(d.getSeconds());
  document.getElementById("dom").textContent=d.getDate();
  document.getElementById("date").textContent=d.toLocaleDateString("zh-CN",{weekday:"long",month:"long",day:"numeric"});
  const slot=slots.find(x=>h<x[0]);
  document.getElementById("phase").textContent=slot[1];
  document.body.className=slot[2];
  ctx.clearRect(0,0,W,H);
  const night=slot[2]==="night";
  dust.forEach(p=>{
    p.y-=p.s;if(p.y<0)p.y=H;
    ctx.beginPath();
    ctx.fillStyle=night?`rgba(210,220,255,${p.a})`:`rgba(184,137,74,${p.a*.55})`;
    ctx.arc(p.x+Math.sin(t/900+p.x)*6,p.y,p.r,0,6.28);ctx.fill();
  });
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
