<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Chronos</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;font-family:system-ui;background:#08111f;color:#eef5ff;overflow:hidden}body:before{content:"";position:fixed;inset:-30%;background:radial-gradient(circle,#285a9b44,transparent 40%);animation:b 8s ease-in-out infinite}.card{text-align:center;z-index:1}.clock{width:min(70vw,330px);aspect-ratio:1;border:10px solid #dceaff;border-radius:50%;position:relative;box-shadow:0 0 0 8px #14233a,0 20px 70px #0008,inset 0 0 35px #1d91ff44;background:radial-gradient(circle,#182e4c,#07111f)}.tick{position:absolute;left:calc(50% - 2px);top:9px;height:18px;border-left:4px solid #9ec8ff;transform-origin:2px 156px}.hand{position:absolute;left:50%;bottom:50%;transform-origin:bottom;border-radius:9px}.h{height:75px;border-left:8px solid white}.m{height:111px;border-left:5px solid #8ec5ff}.s{height:130px;border-left:2px solid #ff5577;filter:drop-shadow(0 0 5px #f45)}.pin{position:absolute;inset:calc(50% - 8px);background:#ff5577;border:3px solid white;border-radius:50%}.digital{font:700 clamp(32px,10vw,52px) ui-monospace;margin:24px 0 7px;letter-spacing:3px}.date{color:#8eabc9;letter-spacing:3px}@keyframes b{50%{transform:scale(1.2);opacity:.5}}</style><main class="card"><div class="clock" id="c"><i class="hand h" id="h"></i><i class="hand m" id="m"></i><i class="hand s" id="s"></i><b class="pin"></b></div><div class="digital" id="d">00:00:00</div><div class="date" id="date"></div></main><script>for(let i=0;i<60;i++){let e=document.createElement('i');e.className='tick';e.style.transform=`rotate(${i*6}deg)`;e.style.height=i%5?'9px':'18px';c.append(e)}function go(){let n=new Date(),a=n.getHours(),b=n.getMinutes(),q=n.getSeconds()+n.getMilliseconds()/1e3;h.style.transform=`rotate(${a%12*30+b/2}deg)`;m.style.transform=`rotate(${b*6+q/10}deg)`;s.style.transform=`rotate(${q*6}deg)`;d.textContent=n.toLocaleTimeString('zh-CN',{hour12:false});date.textContent=n.toLocaleDateString('zh-CN',{weekday:'long',month:'long',day:'numeric'})}go();setInterval(go,100)</script></html>
