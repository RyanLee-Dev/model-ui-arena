<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>QWEN ATELIER · 时间工坊</title>
<style>
*{margin:0;box-sizing:border-box}
:root{--e:cubic-bezier(.33,.9,.25,1)}
html,body{height:100%}
body{font-family:-apple-system,"SF Pro Display","PingFang SC","Segoe UI",sans-serif;display:grid;place-items:center;overflow:hidden;color:var(--ink);-webkit-tap-highlight-color:transparent;transition:color 1.2s var(--e)}
::selection{background:var(--acc);color:#0b101f}
body.night{--ink:#e9eef8;--mut:#8d99b0;--acc:#8fd2ff;--face:rgba(150,182,232,.06);--ring:rgba(192,216,250,.17);--tk1:rgba(208,228,252,.6);--tk2:rgba(208,228,252,.24);--card:rgba(14,19,33,.55);--line:rgba(192,216,250,.15)}
body.day{--ink:#33302a;--mut:#8b8170;--acc:#a97e3a;--face:rgba(255,255,255,.55);--ring:rgba(92,77,46,.2);--tk1:rgba(72,61,40,.6);--tk2:rgba(72,61,40,.22);--card:rgba(255,253,247,.62);--line:rgba(92,77,46,.15)}
.sky{position:fixed;inset:0;z-index:-3;opacity:0;transition:opacity 1.8s ease;pointer-events:none}
body.night .sky.n,body.day .sky.d{opacity:1}
.sky.n{background:radial-gradient(130% 95% at 78% -12%,#1b2649 0%,#0b1226 45%,#04060d 100%)}
.sky.d{background:radial-gradient(130% 100% at 76% -10%,#fff8e9 0%,#f4ead5 48%,#e6dabf 100%)}
.glow{position:fixed;z-index:-2;border-radius:50%;filter:blur(70px);pointer-events:none;animation:breathe 9s ease-in-out infinite alternate}
.g1{width:48vmin;height:48vmin;top:-14vmin;right:-10vmin;background:radial-gradient(circle,var(--acc),transparent 68%);opacity:.5;transition:background 1.2s}
.g2{width:64vmin;height:64vmin;bottom:-24vmin;left:-16vmin;background:radial-gradient(circle,rgba(122,144,205,.55),transparent 70%);animation-delay:-4.5s;transition:background 1.2s}
body.day .g1{opacity:.32}
body.day .g2{background:radial-gradient(circle,rgba(216,180,112,.55),transparent 70%)}
@keyframes breathe{from{transform:scale(1);opacity:.3}to{transform:scale(1.15);opacity:.62}}
.moon{position:fixed;top:9vh;right:11vw;width:72px;height:72px;border-radius:50%;z-index:-2;opacity:0;transition:opacity 1.8s;background:radial-gradient(circle at 34% 30%,#fdfbf4,#ccd4e6 62%,#9db0d2);box-shadow:0 0 42px 8px rgba(198,220,255,.3),0 0 130px 44px rgba(150,186,255,.13)}
body.night .moon{opacity:.95}
.moon::after{content:"";position:absolute;inset:0;border-radius:50%;background:radial-gradient(9px 9px at 30% 44%,rgba(118,134,166,.5),transparent 62%),radial-gradient(6px 6px at 58% 28%,rgba(118,134,166,.45),transparent 62%),radial-gradient(12px 12px at 63% 66%,rgba(118,134,166,.4),transparent 62%)}
.star{position:fixed;z-index:-3;border-radius:50%;background:#dce8ff;opacity:.15;animation:tw var(--d) ease-in-out var(--dl) infinite alternate;pointer-events:none}
@keyframes tw{to{opacity:.9;transform:scale(1.6)}}
body.day .star{display:none}
.card{width:min(92vw,432px);padding:clamp(20px,5vw,32px) clamp(18px,4.5vw,30px) clamp(16px,4vw,24px);border-radius:26px;background:var(--card);border:1px solid var(--line);backdrop-filter:blur(22px) saturate(1.5);-webkit-backdrop-filter:blur(22px) saturate(1.5);box-shadow:0 34px 80px -24px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.14),0 0 110px -36px var(--acc);animation:rise .9s var(--e) both;transition:background 1.2s,border-color 1.2s,box-shadow 1.2s,transform .6s var(--e)}
.card:hover{transform:translateY(-3px)}
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){.card{background:rgba(18,24,40,.93)}body.day .card{background:rgba(252,248,240,.95)}}
@keyframes rise{from{opacity:0;transform:translateY(28px) scale(.97)}}
.row{display:flex;justify-content:space-between;align-items:center;font-size:10px;letter-spacing:.3em;text-transform:uppercase;color:var(--mut);transition:color 1.2s}
.chip{display:inline-flex;align-items:center;gap:7px;padding:5px 11px 5px 9px;border:1px solid var(--line);border-radius:99px;font-size:9px;letter-spacing:.24em}
.chip i{width:6px;height:6px;border-radius:50%;background:var(--acc);box-shadow:0 0 9px var(--acc);animation:pulse 2.6s ease-in-out infinite;transition:background 1.2s,box-shadow 1.2s}
@keyframes pulse{50%{opacity:.3}}
.dial{display:block;width:min(76vw,308px);margin:clamp(14px,3.5vw,22px) auto clamp(8px,2.5vw,14px);filter:drop-shadow(0 20px 32px rgba(0,0,0,.35))}
.dial text{font-family:inherit}
.tm{fill:none;stroke:var(--tk2)}.th{fill:none;stroke:var(--tk1)}
.num{fill:var(--ink);font-size:24px;font-weight:300;letter-spacing:1px;transition:fill 1.2s}
.num.a{fill:var(--acc)}
.brand{fill:var(--ink);font-size:11px;font-weight:500;letter-spacing:4.5px;transition:fill 1.2s}
.sub{fill:var(--mut);font-size:7px;letter-spacing:5px;transition:fill 1.2s}
.micro{fill:var(--mut);font-size:6px;letter-spacing:3px}
.hard{filter:drop-shadow(0 5px 7px rgba(0,0,0,.38))}
#hs{filter:drop-shadow(0 0 5px var(--acc))}
.digital{text-align:center}
.time{display:flex;justify-content:center;align-items:baseline;font-size:clamp(54px,16vw,78px);font-weight:200;line-height:1;font-variant-numeric:tabular-nums;letter-spacing:.01em;text-shadow:0 0 34px color-mix(in srgb,var(--acc) 28%,transparent)}
.sec{font-size:.4em;font-weight:300;color:var(--acc);margin-left:7px;font-variant-numeric:tabular-nums;transition:color 1.2s}
.date{margin-top:11px;font-size:10.5px;letter-spacing:.3em;text-transform:uppercase;color:var(--mut);font-variant-numeric:tabular-nums;transition:color 1.2s}
.foot{margin-top:clamp(14px,3.5vw,20px);padding-top:13px;border-top:1px solid var(--line);font-size:8.5px;letter-spacing:.24em}
@media (max-height:620px){.dial{width:min(50vw,188px)}.time{font-size:clamp(34px,9vh,52px)}}
@media (prefers-reduced-motion:reduce){.glow,.chip i,.star{animation:none}.card:hover{transform:none}}
</style>
</head>
<body class="night">
<div class="sky n"></div><div class="sky d"></div>
<div class="glow g1"></div><div class="glow g2"></div><div class="moon"></div>
<main class="card">
<div class="row"><span>Local Time · 本地时间</span><span class="chip"><i></i><span id="mode">NIGHT</span></span></div>
<svg class="dial" viewBox="0 0 400 400" aria-hidden="true">
<defs>
<linearGradient id="mt" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f0f4fa"/><stop offset=".5" stop-color="#8e9cb2"/><stop offset="1" stop-color="#e6ebf4"/></linearGradient>
<radialGradient id="gl" cx=".5" cy=".28" r=".75"><stop offset="0" stop-color="#fff" stop-opacity=".15"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
</defs>
<circle cx="200" cy="200" r="197" fill="none" stroke="var(--ring)" stroke-width="1.4"/>
<circle id="arc" cx="200" cy="200" r="194" fill="none" stroke="var(--acc)" stroke-width="1.6" opacity=".45" stroke-linecap="round" stroke-dasharray="1219" stroke-dashoffset="1219" transform="rotate(-90 200 200)"/>
<circle cx="200" cy="200" r="189" fill="var(--face)" stroke="var(--ring)" stroke-width="1"/>
<circle class="tm" cx="200" cy="200" r="172" stroke-width="9" stroke-dasharray="1.3 16.712" stroke-dashoffset=".65"/>
<circle class="th" cx="200" cy="200" r="172" stroke-width="18" stroke-dasharray="3.1 86.959" stroke-dashoffset="1.55"/>
<text class="num a" x="200" y="69" text-anchor="middle">12</text>
<text class="num" x="340" y="208" text-anchor="middle">3</text>
<text class="num" x="200" y="348" text-anchor="middle">6</text>
<text class="num" x="60" y="208" text-anchor="middle">9</text>
<text class="brand" x="200" y="143" text-anchor="middle">QWEN ATELIER</text>
<text class="sub" x="202" y="158" text-anchor="middle">高级制表工坊</text>
<text class="micro" x="200" y="263" text-anchor="middle">CAL. Q-3.8 · CHRONOMÈTRE</text>
<g class="hard"><rect id="hh" x="196" y="112" width="8" height="98" rx="4" fill="url(#mt)"/><rect id="mh" x="197.5" y="66" width="5" height="146" rx="2.5" fill="url(#mt)"/></g>
<g id="hs"><rect x="199" y="56" width="2" height="190" rx="1" fill="var(--acc)"/><circle cx="200" cy="240" r="7" fill="none" stroke="var(--acc)" stroke-width="2"/></g>
<circle cx="200" cy="200" r="9" fill="url(#mt)" stroke="rgba(0,0,0,.35)"/><circle cx="200" cy="200" r="3.6" fill="var(--acc)"/><circle cx="200" cy="200" r="1.3" fill="#0b101f"/>
<ellipse cx="200" cy="116" rx="150" ry="64" fill="url(#gl)"/>
</svg>
<div class="digital"><div class="time"><span id="tt">--:--</span><span class="sec" id="ss">:--</span></div>
<div class="date" id="dd">—</div></div>
<div class="row foot"><span>Calibre Q-3.8 · 21 600 VPH</span><span id="tz">UTC</span></div>
<noscript><div class="date">需要启用 JavaScript · JavaScript required</div></noscript>
</main>
<script>
const $=s=>document.querySelector(s),P=n=>String(n).padStart(2,"0");
const eH=$("#hh"),eM=$("#mh"),eS=$("#hs"),eA=$("#arc"),eT=$("#tt"),eSec=$("#ss"),eD=$("#dd"),eMode=$("#mode"),B=document.body;
const W=["SUNDAY","MONDAY","TUESDAY","WEDNESDAY","THURSDAY","FRIDAY","SATURDAY"],M=["JAN","FEB","MAR","APR","MAY","JUN","JUL","AUG","SEP","OCT","NOV","DEC"];
for(let i=0;i<64;i++){const s=document.createElement("i");s.className="star";const z=(0.6+Math.random()*1.5).toFixed(2);s.style.cssText=`left:${(Math.random()*100).toFixed(1)}vw;top:${(Math.random()*100).toFixed(1)}vh;width:${z}px;height:${z}px;--d:${(2.2+Math.random()*4).toFixed(1)}s;--dl:${(Math.random()*5).toFixed(1)}s`;B.appendChild(s)}
const o=-new Date().getTimezoneOffset();$("#tz").textContent="UTC"+(o<0?"−":"+")+P(Math.floor(Math.abs(o)/60))+(Math.abs(o)%60?":"+P(Math.abs(o)%60):"");
let lastS=-1,lastD="";
function paint(d){const h=d.getHours(),day=h>=6&&h<18;
B.classList.toggle("day",day);B.classList.toggle("night",!day);
const md=day?"DAY":"NIGHT";if(eMode.textContent!==md)eMode.textContent=md;
const t=P(h)+":"+P(d.getMinutes());if(eT.textContent!==t)eT.textContent=t;
eSec.textContent=":"+P(d.getSeconds());
const ds=W[d.getDay()]+" · "+P(d.getDate())+" "+M[d.getMonth()]+" "+d.getFullYear();if(ds!==lastD){lastD=ds;eD.textContent=ds}}
function hands(h,m,s){eS.setAttribute("transform",`rotate(${s*6} 200 200)`);eM.setAttribute("transform",`rotate(${m*6} 200 200)`);eH.setAttribute("transform",`rotate(${h*30} 200 200)`);eA.setAttribute("stroke-dashoffset",1219*(1-s/60))}
if(matchMedia("(prefers-reduced-motion:reduce)").matches){const f=()=>{const d=new Date(),s=d.getSeconds();hands((d.getHours()%12)+d.getMinutes()/60,d.getMinutes()+s/60,s);paint(d)};f();setInterval(f,1000)}
else{(function tick(){const d=new Date(),s=d.getSeconds()+d.getMilliseconds()/1e3,m=d.getMinutes()+s/60;hands((d.getHours()%12)+m/60,m,s);if(d.getSeconds()!==lastS){lastS=d.getSeconds();paint(d)}requestAnimationFrame(tick)})()}
</script>
</body>
</html>
