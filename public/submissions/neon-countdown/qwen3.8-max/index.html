<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NEON COUNTDOWN · 霓虹倒计时</title>
<style>
*{margin:0;box-sizing:border-box}
:root{--c1:#00f0ff;--c2:#ff2bd6;--beat:0;--pop:0;--hot:0}
body.hot{--c1:#ff2b57;--c2:#ff3d9a;--hot:1}
body.calm{--c1:#ffd28a;--c2:#6ef0ff;--hot:0}
html,body{height:100%}
body{background:#04060f radial-gradient(130% 90% at 50% -12%,#0c1130 0%,#04060f 58%);color:#eaf6ff;overflow:hidden;user-select:-webkit-user-select:none;-webkit-user-select:none;font-family:-apple-system,"SF Pro Display","PingFang SC","Helvetica Neue",sans-serif;-webkit-font-smoothing:antialiased}
.mono{font-family:"SF Mono",ui-monospace,Menlo,Consolas,monospace}
.layer{position:fixed;inset:0;pointer-events:none}
.glow{background:radial-gradient(48% 40% at 50% 40%,rgba(0,240,255,.20),transparent 70%);opacity:calc(.55 + var(--beat)*.45);transform:scale(calc(1 + var(--beat)*.06))}
body.hot .glow{background:radial-gradient(48% 40% at 50% 40%,rgba(255,45,110,.28),transparent 70%)}
body.calm .glow{background:radial-gradient(52% 44% at 50% 40%,rgba(255,210,138,.17),transparent 70%)}
.grid{top:auto;height:52%;--gc:rgba(0,240,255,.16);transform:perspective(560px) rotateX(63deg);transform-origin:50% 0;background:repeating-linear-gradient(0deg,var(--gc) 0 1px,transparent 1px 64px),repeating-linear-gradient(90deg,var(--gc) 0 1px,transparent 1px 64px),linear-gradient(transparent,rgba(0,240,255,.09));animation:roll 1.5s linear infinite;-webkit-mask-image:linear-gradient(#000 55%,transparent);mask-image:linear-gradient(#000 55%,transparent)}
body.hot .grid{--gc:rgba(255,45,110,.24);animation-duration:.45s}
body.calm .grid{--gc:rgba(255,210,138,.13);animation-duration:4s}
@keyframes roll{to{background-position:0 64px,0 0,0 0}}
.vig{box-shadow:inset 0 0 160px 30px rgba(2,3,10,.92),inset 0 0 90px rgba(0,240,255,.08);opacity:calc(.78 + var(--hot)*var(--beat)*.22)}
body.hot .vig{box-shadow:inset 0 0 160px 34px rgba(12,2,7,.94),inset 0 0 120px rgba(255,45,110,.22)}
.flash{background:radial-gradient(circle at 50% 42%,rgba(255,255,255,.95),rgba(255,255,255,0) 62%);opacity:0}
body.done .flash{animation:flash .85s ease-out}
@keyframes flash{0%{opacity:1}100%{opacity:0}}
.wave{position:fixed;left:50%;top:44%;width:36px;height:36px;margin:-18px 0 0 -18px;border:3px solid var(--c1);border-radius:50%;opacity:0;pointer-events:none;z-index:4}
.w2{border-color:var(--c2)}
body.done .wave{animation:wave 1.15s cubic-bezier(.2,.7,.3,1) forwards}
body.done .w2{animation-delay:.16s}
@keyframes wave{0%{opacity:.95;transform:scale(.2)}100%{opacity:0;transform:scale(17)}}
.hud{position:fixed;top:0;left:0;right:0;z-index:5;display:flex;justify-content:space-between;padding:17px 22px;font-size:10px;letter-spacing:.38em;text-transform:uppercase;color:#7f9cc4}
.hud b{color:var(--c1);font-weight:600}
main{position:relative;z-index:2;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px;padding-top:24px}
.ringbox{position:relative;width:min(86vw,440px,62vh);aspect-ratio:1;display:grid;place-items:center}
svg.ring{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg) scale(calc(1 + var(--beat)*.014))}
.track{fill:none;stroke:rgba(120,160,220,.10);stroke-width:7}
#prog{fill:none;stroke:url(#grad);stroke-width:7;stroke-linecap:round;stroke-dasharray:829.4;filter:drop-shadow(0 0 6px var(--c1)) drop-shadow(0 0 16px var(--c2))}
#grad stop{transition:stop-color .5s}
body.hot #grad stop:nth-of-type(1){stop-color:#ff2450}
body.hot #grad stop:nth-of-type(2){stop-color:#ff2bd6}
body.hot #grad stop:nth-of-type(3){stop-color:#ff8a3d}
body.calm #grad stop:nth-of-type(1){stop-color:#ffd28a}
body.calm #grad stop:nth-of-type(2){stop-color:#6ef0ff}
body.calm #grad stop:nth-of-type(3){stop-color:#ffffff}
#ticks line{stroke:rgba(130,170,230,.16);stroke-width:2;stroke-linecap:round}
#ticks line.on{stroke:var(--c1);stroke-width:3}
.ripple{position:absolute;inset:6%;border-radius:50%;border:2px solid var(--c1);opacity:0;pointer-events:none}
.ripple.go{animation:rip .9s cubic-bezier(.2,.7,.3,1)}
@keyframes rip{0%{opacity:.7;transform:scale(.82)}100%{opacity:0;transform:scale(1.28)}}
.numbox{display:grid;place-items:center;transform:scale(calc(1 + var(--pop)*.12))}
#digit{font-size:clamp(7rem,26vw,16rem);font-weight:800;line-height:1;letter-spacing:-.04em;font-variant-numeric:tabular-nums;color:#f2ffff;text-shadow:0 0 8px var(--c1),0 0 24px var(--c1),0 0 60px var(--c1),0 0 120px var(--c2)}
body.hot #digit{color:#fff5f7}
body.calm #digit{color:#fff8ec}
#digit.slam{animation:slam .5s cubic-bezier(.2,1.6,.3,1)}
@keyframes slam{0%{transform:scale(1.32);opacity:.35;filter:brightness(2.6)}35%{opacity:1;filter:brightness(1.5)}55%{opacity:.7}100%{transform:scale(1);filter:brightness(1)}}
.status{text-align:center;min-height:76px;display:flex;flex-direction:column;gap:12px;align-items:center}
.micro{font-size:11px;letter-spacing:.5em;text-indent:.5em;text-transform:uppercase;color:#8fb0d8}
#copy{font-size:clamp(1.4rem,5vw,2.2rem);font-weight:700;letter-spacing:.18em;color:#fff;opacity:0;transform:translateY(14px);text-shadow:0 0 14px var(--c1),0 0 44px var(--c2)}
body.done #copy{opacity:1;transform:none;transition:.6s .25s cubic-bezier(.2,.9,.3,1)}
#restart{cursor:pointer;font:600 12px/1 "SF Mono",ui-monospace,monospace;letter-spacing:.32em;text-transform:uppercase;color:var(--c1);background:rgba(6,12,24,.6);border:1px solid var(--c1);border-radius:999px;padding:14px 24px 14px 20px;display:inline-flex;align-items:center;gap:10px;opacity:0;pointer-events:none;transform:translateY(12px);transition:.35s}
body.done #restart{opacity:1;pointer-events:auto;transform:none;transition:.45s .9s}
#restart:hover{color:#04121a;background:var(--c1);box-shadow:0 0 18px var(--c1),0 0 46px var(--c2)}
body.done #restart:hover{transform:translateY(-2px)}
#restart:active{transform:scale(.96)}
#restart svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
#fx{position:fixed;inset:0;z-index:6;pointer-events:none}
@media (max-height:560px){#digit{font-size:22vh}}
@media (prefers-reduced-motion:reduce){.grid{animation:none}.numbox,.glow,svg.ring{transform:none}}
</style>
</head>
<body>
<div class="layer glow"></div>
<div class="layer grid"></div>
<div class="layer vig"></div>
<div class="layer flash"></div>
<div class="wave"></div><div class="wave w2"></div>
<canvas id="fx"></canvas>
<header class="hud mono"><span>NEON COUNTDOWN <b>//</b> 霓虹倒计时</span><span>T-MINUS <b>10S</b> · AUTO</span></header>
<main>
  <div class="ringbox">
    <svg class="ring" viewBox="0 0 300 300" aria-hidden="true">
      <defs>
        <linearGradient id="grad" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#00f0ff"/><stop offset=".55" stop-color="#7a5cff"/><stop offset="1" stop-color="#ff2bd6"/>
        </linearGradient>
      </defs>
      <circle class="track" cx="150" cy="150" r="132"/>
      <circle id="prog" cx="150" cy="150" r="132"/>
      <g id="ticks"></g>
    </svg>
    <div class="ripple" id="rip"></div>
    <div class="numbox"><div id="digit">10</div></div>
  </div>
  <div class="status">
    <div class="micro" id="micro">COUNTDOWN · 进行中</div>
    <div id="copy">TIME'S UP · 完成</div>
  </div>
  <button id="restart" type="button"><svg viewBox="0 0 24 24"><path d="M23 4v6h-6"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>Restart · 重新开始</button>
</main>
<script>
(()=>{"use strict";
const $=s=>document.querySelector(s),body=document.body,D=$("#digit"),prog=$("#prog"),
ticks=$("#ticks"),rip=$("#rip"),mic=$("#micro"),btn=$("#restart"),
cv=$("#fx"),cx=cv.getContext("2d");
const TOTAL=10,CIRC=2*Math.PI*132;
let end=0,last=TOTAL+1,done=false,rid=0,litN=-1,parts=[],pf=false;
{let s="";for(let i=0;i<60;i++){const a=i/60*Math.PI*2,sa=Math.sin(a),ca=Math.cos(a),r1=i%5?141:136,r2=148;
s+='<line x1="'+(150-sa*r1).toFixed(1)+'" y1="'+(150-ca*r1).toFixed(1)+'" x2="'+(150-sa*r2).toFixed(1)+'" y2="'+(150-ca*r2).toFixed(1)+'"/>';}
ticks.innerHTML=s;}
const tickEls=[...ticks.children];
const retrig=(el,c)=>{el.classList.remove(c);void el.offsetWidth;el.classList.add(c)};
const fit=()=>{const d=Math.min(devicePixelRatio||1,2);cv.width=innerWidth*d;cv.height=innerHeight*d;cx.setTransform(d,0,0,d,0,0)};
addEventListener("resize",fit);fit();
function beat(s){D.textContent=s;retrig(D,"slam");retrig(rip,"go");
if(s<=3&&s>0)mic.textContent="FINAL SEQUENCE · 最后冲刺";}
function finish(){done=true;body.classList.add("done");mic.textContent="COMPLETE · 任务完成";
burst(160);setTimeout(()=>body.classList.add("calm"),1500);}
function frame(now){
const rem=Math.max(0,(end-now)/1000),sec=Math.ceil(rem-1e-4);
prog.style.strokeDashoffset=(CIRC*(1-rem/TOTAL)).toFixed(1);
const e=(1-(rem%1))%1,hot=rem<=3&&rem>0;
if(hot&&!done)body.classList.add("hot");
const b=Math.exp(-4.2*((e*(hot?2:1))%1)),p=Math.exp(-7*e)*(hot?1.55:1);
body.style.setProperty("--beat",b.toFixed(3));body.style.setProperty("--pop",p.toFixed(3));
const lit=Math.min(60,Math.floor((TOTAL-rem)*6+1e-4));
if(lit!==litN){litN=lit;for(let i=0;i<60;i++)tickEls[i].classList.toggle("on",i<lit);}
if(sec!==last){last=sec;beat(sec);}
if(rem<=0&&!done){finish();return;}
rid=requestAnimationFrame(frame);}
function burst(n){
const ox=innerWidth/2,oy=innerHeight*.42,cols=["#ffffff","#00f0ff","#ff2bd6","#ffd28a","#ff2450"];
for(let i=0;i<n;i++){const a=Math.random()*6.283,v=2+Math.random()*9;
parts.push({x:ox,y:oy,vx:Math.cos(a)*v,vy:Math.sin(a)*v-2,l:1,d:.008+Math.random()*.014,r:1+Math.random()*2.6,c:cols[i%5]});}
if(!pf){pf=true;requestAnimationFrame(pstep);}}
function pstep(){
cx.clearRect(0,0,innerWidth,innerHeight);parts=parts.filter(q=>(q.l-=q.d)>0);
for(const q of parts){q.x+=q.vx;q.y+=q.vy;q.vy+=.12;q.vx*=.985;
cx.globalAlpha=Math.max(q.l,0);cx.fillStyle=q.c;cx.shadowColor=q.c;cx.shadowBlur=12;
cx.beginPath();cx.arc(q.x,q.y,q.r,0,6.283);cx.fill();}
cx.globalAlpha=1;cx.shadowBlur=0;
if(parts.length)requestAnimationFrame(pstep);else{pf=false;cx.clearRect(0,0,innerWidth,innerHeight);}}
function start(){
cancelAnimationFrame(rid);done=false;last=TOTAL+1;litN=-1;
for(const t of tickEls)t.classList.remove("on");
body.classList.remove("done","hot","calm");
prog.style.strokeDashoffset="0";mic.textContent="COUNTDOWN · 进行中";
end=performance.now()+TOTAL*1000;rid=requestAnimationFrame(frame);}
btn.addEventListener("click",start);
start();
})();
</script>
</body>
</html>
