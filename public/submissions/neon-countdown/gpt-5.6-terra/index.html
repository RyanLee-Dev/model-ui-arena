<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>10</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#05020d;color:#fff;font-family:system-ui;overflow:hidden}.orb{width:min(78vw,390px);aspect-ratio:1;border-radius:50%;display:grid;place-items:center;background:conic-gradient(#ff32cf var(--p),#281142 0);padding:12px;box-shadow:0 0 60px #ff23c688}.inner{width:100%;height:100%;border-radius:50%;background:#090312;display:grid;place-items:center;text-align:center}.num{font:900 clamp(120px,42vw,220px) system-ui;line-height:.8;text-shadow:0 0 15px #fff,0 0 45px #ff26d3;animation:pulse .85s infinite}.label{letter-spacing:5px;color:#b19dff;margin-top:18px}button{margin-top:35px;padding:12px 24px;border:1px solid #ff70dd;border-radius:25px;background:#ff29c922;color:white;letter-spacing:2px;cursor:pointer}.done .num{color:#ffe96b;animation:boom .4s infinite alternate}.done{box-shadow:0 0 130px #ffdb51}@keyframes pulse{50%{transform:scale(1.09);filter:brightness(1.8)}}@keyframes boom{to{transform:scale(1.16) rotate(2deg)}}</style><main><div class="orb" id="orb"><div class="inner"><div><div class="num" id="num">10</div><div class="label" id="label">IGNITION SEQUENCE</div></div></div></div><center><button onclick="start()">RESTART</button></center></main><script>let n,t;function start(){clearInterval(t);n=10;orb.classList.remove('done');tick();t=setInterval(()=>{n--;tick();if(n===0)clearInterval(t)},1000)}function tick(){num.textContent=n;orb.style.setProperty('--p',`${(10-n)*36}deg`);if(n<4&&n>0)label.textContent='FINAL COUNTDOWN';if(!n){orb.classList.add('done');label.textContent='LIFTOFF · COMPLETE'}}start()</script></html>
