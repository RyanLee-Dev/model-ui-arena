<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEON PULSE · 霓虹倒计时</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{display:flex;align-items:center;justify-content:center;overflow:hidden;background:#05030c;
    font-family:"Avenir Next",system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;color:#eaf2ff}
  .stage{position:fixed;inset:0;pointer-events:none;
    background:radial-gradient(60% 55% at 50% 46%,rgba(56,120,255,.16),transparent 70%),
               radial-gradient(45% 40% at 50% 50%,rgba(168,85,247,.12),transparent 72%)}
  body.hot .stage{background:radial-gradient(60% 55% at 50% 46%,rgba(255,60,92,.22),transparent 70%),
               radial-gradient(45% 40% at 50% 50%,rgba(255,140,60,.14),transparent 72%)}
  .grid{position:fixed;inset:0;pointer-events:none;opacity:.5;
    background:linear-gradient(rgba(80,140,255,.05) 1px,transparent 1px),
               linear-gradient(90deg,rgba(80,140,255,.05) 1px,transparent 1px);
    background-size:44px 44px;mask-image:radial-gradient(70% 70% at 50% 50%,#000 30%,transparent 100%)}
  .flash{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none}
  .flash.on{animation:fl .45s ease-out}
  @keyframes fl{0%{opacity:.28}100%{opacity:0}}
  .core{position:relative;width:min(88vw,420px);text-align:center}
  .label{font-size:11px;letter-spacing:.5em;text-indent:.5em;color:#7f8ab0;margin-bottom:26px}
  .ring-wrap{position:relative;width:min(76vw,330px);margin:0 auto}
  svg{display:block;width:100%;height:auto}
  .track{fill:none;stroke:rgba(120,140,200,.14);stroke-width:10}
  .prog{fill:none;stroke:url(#nGrad);stroke-width:10;stroke-linecap:round;
    filter:drop-shadow(0 0 10px rgba(90,180,255,.85));transition:stroke .4s}
  body.hot .prog{filter:drop-shadow(0 0 12px rgba(255,80,100,.9))}
  .tickL{stroke:rgba(140,160,220,.25);stroke-width:2}
  .tickL.on{stroke:#8be9ff;filter:drop-shadow(0 0 4px #8be9ff)}
  body.hot .tickL.on{stroke:#ff5c76;filter:drop-shadow(0 0 4px #ff5c76)}
  .num{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
  #n{font-size:clamp(84px,26vw,124px);font-weight:200;line-height:1;font-variant-numeric:tabular-nums;
    text-shadow:0 0 14px rgba(120,210,255,.9),0 0 46px rgba(80,140,255,.65),0 0 90px rgba(140,90,255,.4)}
  body.hot #n{text-shadow:0 0 14px rgba(255,120,140,.95),0 0 46px rgba(255,60,92,.7),0 0 90px rgba(255,120,60,.45)}
  #n.pop{animation:pop .5s cubic-bezier(.2,.9,.3,1.4)}
  @keyframes pop{0%{transform:scale(1.28);filter:brightness(1.8)}100%{transform:scale(1)}}
  .sub{font-size:11px;letter-spacing:.4em;text-indent:.4em;color:#8b96c0;margin-top:12px}
  .ring{position:absolute;left:50%;top:50%;width:80%;height:80%;transform:translate(-50%,-50%);
    border:2px solid rgba(140,220,255,.75);border-radius:50%;opacity:0;pointer-events:none}
  .ring.on{animation:pw .9s ease-out}
  @keyframes pw{0%{opacity:.85;transform:translate(-50%,-50%) scale(.62)}100%{opacity:0;transform:translate(-50%,-50%) scale(1.25)}}
  body.hot .ring{border-color:rgba(255,110,130,.8)}
  #done{display:none}
  #done h2{font-size:34px;font-weight:300;letter-spacing:.24em;text-shadow:0 0 24px rgba(140,255,200,.8)}
  #done p{font-size:12px;color:#93a0c6;letter-spacing:.3em;margin-top:14px}
  #restart{margin-top:26px;padding:13px 44px;border-radius:99px;border:1px solid rgba(140,220,255,.5);
    background:linear-gradient(180deg,rgba(80,160,255,.22),rgba(80,120,255,.08));color:#dff4ff;
    font-size:14px;letter-spacing:.3em;text-indent:.3em;cursor:pointer;transition:.25s;
    box-shadow:0 0 24px rgba(90,170,255,.35),inset 0 1px 0 rgba(255,255,255,.2)}
  #restart:hover{box-shadow:0 0 40px rgba(120,200,255,.6);transform:translateY(-1px)}
  canvas{position:fixed;inset:0;pointer-events:none}
</style>
</head>
<body>
  <div class="stage"></div><div class="grid"></div><div class="flash" id="flash"></div>
  <canvas id="fx"></canvas>
  <main class="core">
    <p class="label">NEON PULSE COUNTDOWN</p>
    <div class="ring-wrap">
      <svg viewBox="0 0 300 300">
        <defs><linearGradient id="nGrad" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#4ce0ff"/><stop offset=".55" stop-color="#7a8cff"/><stop offset="1" stop-color="#c46bff"/>
        </linearGradient></defs>
        <circle class="track" cx="150" cy="150" r="128"/>
        <g id="ticks"></g>
        <circle class="prog" id="prog" cx="150" cy="150" r="128" transform="rotate(-90 150 150)"/>
      </svg>
      <div class="ring" id="ring"></div>
      <div class="num"><p id="n">10</p><p class="sub" id="sub">准备 · READY</p></div>
    </div>
    <div id="done"><h2>0 · 倒计时完成</h2><p>TIME'S UP · MISSION COMPLETE</p>
      <button id="restart">重 新 开 始</button></div>
  </main>
<script>
  const $ = (id) => document.getElementById(id);
  const cv = $("fx"), ctx = cv.getContext("2d");
  const C = 2 * Math.PI * 128, TOTAL = 10000;
  $("prog").style.strokeDasharray = C;
  const ticks = $("ticks");                                  // 10 格刻度
  for (let i = 0; i < 10; i++) {
    const a = (i / 10) * 2 * Math.PI - Math.PI / 2;
    const l = document.createElementNS("http://www.w3.org/2000/svg", "line");
    l.setAttribute("x1", 150 + 112 * Math.cos(a)); l.setAttribute("y1", 150 + 112 * Math.sin(a));
    l.setAttribute("x2", 150 + 104 * Math.cos(a)); l.setAttribute("y2", 150 + 104 * Math.sin(a));
    l.setAttribute("class", "tickL"); ticks.appendChild(l);
  }
  let AC = null;
  function beep(f, t = .07, type = "square", g = .05) {       // WebAudio 节拍音
    try { AC = AC || new (window.AudioContext || window.webkitAudioContext)();
      const o = AC.createOscillator(), v = AC.createGain();
      o.type = type; o.frequency.value = f; v.gain.value = g;
      v.gain.exponentialRampToValueAtTime(1e-4, AC.currentTime + t);
      o.connect(v); v.connect(AC.destination); o.start(); o.stop(AC.currentTime + t); } catch (e) {}
  }
  let parts = [];
  function burst() {
    const w = innerWidth, h = innerHeight;
    for (let i = 0; i < 190; i++) {
      const a = Math.random() * 6.29, sp = 2 + Math.random() * 9;
      parts.push({ x: w / 2, y: h / 2, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
        life: 1, c: `hsl(${150 + Math.random() * 180},95%,66%)`, r: 1 + Math.random() * 2.6 });
    }
  }
  function size() { cv.width = innerWidth; cv.height = innerHeight; }
  size(); addEventListener("resize", size);
  function fxLoop() {
    ctx.clearRect(0, 0, cv.width, cv.height);
    ctx.globalCompositeOperation = "lighter";
    for (let i = parts.length - 1; i >= 0; i--) {
      const p = parts[i];
      p.x += p.vx; p.y += p.vy; p.vy += .06; p.vx *= .985; p.vy *= .985; p.life -= .012;
      if (p.life <= 0) { parts.splice(i, 1); continue; }
      ctx.globalAlpha = p.life; ctx.fillStyle = p.c;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 6.29); ctx.fill();
    }
    ctx.globalAlpha = 1; ctx.globalCompositeOperation = "source-over";
    requestAnimationFrame(fxLoop);
  }
  requestAnimationFrame(fxLoop);
  let t0 = null, lastSec = 10, ended = false, raf;
  const re = (el, cls) => { el.classList.remove(cls); void el.offsetWidth; el.classList.add(cls); };
  function loop(now) {
    if (t0 === null) t0 = now;
    const left = Math.max(0, TOTAL - (now - t0));
    $("prog").style.strokeDashoffset = C * (1 - left / TOTAL);
    const sec = Math.ceil(left / 1000);
    if (sec !== lastSec) {
      lastSec = sec;
      $("n").textContent = sec; re($("n"), "pop"); re($("ring"), "on"); re($("flash"), "on");
      [...ticks.children].forEach((t, i) => t.classList.toggle("on", i >= sec));
      const hot = sec <= 3 && sec > 0;
      document.body.classList.toggle("hot", hot);
      $("sub").textContent = hot ? "冲刺 · FINAL LAP" : "推进 · RUNNING";
      if (sec > 0) beep(hot ? 920 : 620, .06, "square", hot ? .07 : .04);
    }
    if (left <= 0 && !ended) { finish(); return; }
    raf = requestAnimationFrame(loop);
  }
  function finish() {
    ended = true; document.body.classList.remove("hot");
    $("n").textContent = "0"; $("sub").textContent = "完成 · DONE";
    beep(1240, .4, "triangle", .09); setTimeout(() => beep(1860, .5, "triangle", .07), 130);
    burst(); setTimeout(burst, 260);
    $("done").style.display = "block";
    document.querySelector(".num").style.display = "none";
  }
  $("restart").onclick = () => {
    parts = []; t0 = null; lastSec = 11; ended = false;
    $("done").style.display = "none"; document.querySelector(".num").style.display = "flex";
    $("prog").style.strokeDashoffset = 0; beep(760, .08, "sine", .05);
    cancelAnimationFrame(raf); raf = requestAnimationFrame(loop);
  };
  raf = requestAnimationFrame(loop);                          // 加载后自动运行
</script>
</body>
</html>
