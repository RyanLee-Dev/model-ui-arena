<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>NEON 10 · 最炫倒计时</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--a:#00e5ff;--b:#ff2ec4;--fg:#eaf6ff;--bg:#04040c}
body[data-mode=danger]{--a:#ff3b3b;--b:#ffa62e}
body[data-mode=done]{--a:#31ffbe;--b:#7cffcb}
html,body{height:100%;overflow:hidden}
body{background:radial-gradient(120% 90% at 50% 40%,#0d1030,var(--bg) 70%);color:var(--fg);display:grid;place-items:center;
  font-family:-apple-system,"SF Pro Display","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  -webkit-tap-highlight-color:transparent;user-select:none;transition:background .5s}
.floor{position:fixed;left:-25%;right:-25%;bottom:0;height:46vh;perspective:220px;opacity:.5;pointer-events:none}
.floor i{position:absolute;inset:0;transform:rotateX(74deg);transform-origin:bottom;
  background:repeating-linear-gradient(90deg,transparent 0 38px,color-mix(in srgb,var(--a) 55%,transparent) 38px 39px),
             repeating-linear-gradient(0deg,transparent 0 34px,color-mix(in srgb,var(--b) 40%,transparent) 34px 35px);
  animation:run 2.4s linear infinite;transition:background .5s}
@keyframes run{to{background-position:0 34px,0 34px}}
canvas{position:fixed;inset:0;width:100%;height:100%;z-index:1;pointer-events:none}
.stage{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;gap:18px;padding:20px}
body[data-mode=danger] .stage{animation:shake .42s ease-in-out infinite}
@keyframes shake{0%,100%{transform:translate(0,0)}25%{transform:translate(-3px,1px)}50%{transform:translate(2px,-2px)}75%{transform:translate(-1px,2px)}}
.ring{position:relative;width:min(300px,80vw);aspect-ratio:1}
.ring svg{width:100%;height:100%;overflow:visible;transform:rotate(-90deg);filter:drop-shadow(0 0 14px color-mix(in srgb,var(--a) 70%,transparent))}
.tick{stroke:rgba(255,255,255,.16);transition:stroke .18s,opacity .18s}
.tick.on{stroke:var(--b);opacity:1}
.num{position:absolute;inset:0;display:grid;place-items:center;font-size:min(150px,42vw);font-weight:800;line-height:1;
  letter-spacing:-.04em;font-variant-numeric:tabular-nums;color:#fff;
  text-shadow:0 0 8px #fff,0 0 26px var(--a),0 0 54px var(--a),0 0 96px var(--b)}
.num.pop{animation:pop .42s cubic-bezier(.2,1.5,.4,1)}
@keyframes pop{0%{transform:scale(1.34);filter:brightness(2.1)}100%{transform:scale(1);filter:none}}
.wave{position:absolute;inset:0;border-radius:50%;border:2px solid var(--a);opacity:0;pointer-events:none}
.wave.go{animation:wave .85s ease-out}
@keyframes wave{0%{transform:scale(.86);opacity:.85}100%{transform:scale(1.5);opacity:0}}
.cap{font-size:12px;letter-spacing:.42em;text-indent:.42em;color:color-mix(in srgb,var(--a) 80%,#fff);text-transform:uppercase;
  text-shadow:0 0 16px var(--a);height:16px}
.bar{width:min(300px,80vw);height:6px;border-radius:99px;background:rgba(255,255,255,.10);overflow:hidden}
.bar i{display:block;height:100%;width:100%;border-radius:99px;background:linear-gradient(90deg,var(--a),var(--b));
  box-shadow:0 0 18px var(--a)}
.done{height:20px;opacity:0;transform:translateY(8px) scale(.94);transition:.45s cubic-bezier(.2,1.4,.4,1);
  font-size:16px;font-weight:800;letter-spacing:.36em;text-indent:.36em;white-space:nowrap;color:#fff;text-shadow:0 0 22px var(--a)}
.done.show{opacity:1;transform:none}
button{appearance:none;border:1px solid color-mix(in srgb,var(--a) 60%,transparent);background:rgba(255,255,255,.06);color:var(--fg);
  font:inherit;font-size:13px;font-weight:700;letter-spacing:.2em;padding:12px 28px;border-radius:99px;cursor:pointer;
  backdrop-filter:blur(8px);transition:.2s;box-shadow:0 0 22px color-mix(in srgb,var(--a) 30%,transparent) inset}
button:hover{background:color-mix(in srgb,var(--a) 22%,transparent)}
button:active{transform:scale(.95)}
</style>
</head>
<body data-mode="run">
<div class="floor"><i></i></div>
<canvas id="fx"></canvas>
<main class="stage">
  <div class="ring">
    <svg viewBox="0 0 300 300">
      <circle cx="150" cy="150" r="118" fill="none" stroke="rgba(255,255,255,.08)" stroke-width="10"/>
      <circle id="prog" cx="150" cy="150" r="118" fill="none" stroke="url(#g)" stroke-width="10" stroke-linecap="round"
              stroke-dasharray="741.4" stroke-dashoffset="0"/>
      <g id="ticks" stroke-width="3" stroke-linecap="round"></g>
      <defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="var(--a)"/><stop offset="1" stop-color="var(--b)"/></linearGradient></defs>
    </svg>
    <div class="num" id="num">10</div>
    <div class="wave" id="wave"></div>
  </div>
  <div class="cap" id="cap">seconds remaining</div>
  <div class="done" id="done">时 间 到</div>
  <div class="bar"><i id="fill"></i></div>
  <button id="restart">RESTART</button>
</main>
<script>
(function(){
  const $=id=>document.getElementById(id), NS="http://www.w3.org/2000/svg";
  const TOTAL=10, C=741.4, TICKS=48;
  const tickEls=[];
  for(let i=0;i<TICKS;i++){                          // 环外刻度，随进度逐格点亮
    const a=(i/TICKS)*6.2832, l=document.createElementNS(NS,"line");
    l.setAttribute("x1",150+Math.cos(a)*130);l.setAttribute("y1",150+Math.sin(a)*130);
    l.setAttribute("x2",150+Math.cos(a)*(i%4?138:143));l.setAttribute("y2",150+Math.sin(a)*(i%4?138:143));
    l.setAttribute("class","tick");$("ticks").appendChild(l);tickEls.push(l);
  }

  const cv=$("fx"),ctx=cv.getContext("2d");let W,H;
  function fit(){const d=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;
    cv.width=W*d;cv.height=H*d;ctx.setTransform(d,0,0,d,0,0);}
  addEventListener("resize",fit);fit();

  let parts=[],rings=[],end=0,running=false,lastShown=-1;
  const rnd=(a,b)=>a+Math.random()*(b-a);
  function burst(){                                   // 结束瞬间：粒子爆发 + 三道冲击波
    const cx=W/2,cy=H/2-Math.min(40,H*.06);
    for(let i=0;i<220;i++){
      const a=Math.random()*6.2832,s=rnd(1.5,11)*Math.sqrt(Math.random());
      parts.push({x:cx,y:cy,vx:Math.cos(a)*s,vy:Math.sin(a)*s,l:1,d:rnd(.005,.013),
        h:rnd(150,190),sz:rnd(1.8,4.4)});
    }
    [0,150,320].forEach(t=>setTimeout(()=>rings.push({x:cx,y:cy,r:10,l:1}),t));
  }
  function paintFx(dt){
    ctx.clearRect(0,0,W,H);
    ctx.globalCompositeOperation="lighter";
    for(let i=parts.length-1;i>=0;i--){
      const p=parts[i];p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=.09*dt;p.vx*=.985;p.vy*=.985;p.l-=p.d*dt;
      if(p.l<=0){parts.splice(i,1);continue;}
      ctx.fillStyle="hsla("+p.h+",100%,"+(60+p.l*35)+"%,"+p.l+")";
      ctx.beginPath();ctx.arc(p.x,p.y,p.sz*(.4+p.l),0,6.2832);ctx.fill();
    }
    for(let i=rings.length-1;i>=0;i--){
      const r=rings[i];r.r+=13*dt;r.l-=.016*dt;
      if(r.l<=0){rings.splice(i,1);continue;}
      ctx.strokeStyle="rgba(120,255,220,"+r.l*.75+")";ctx.lineWidth=3*r.l+.6;
      ctx.beginPath();ctx.arc(r.x,r.y,r.r,0,6.2832);ctx.stroke();
    }
    ctx.globalCompositeOperation="source-over";
  }

  function start(){
    end=performance.now()+TOTAL*1000;running=true;lastShown=-1;
    parts=[];rings=[];document.body.dataset.mode="run";
    $("done").classList.remove("show");$("cap").textContent="seconds remaining";
  }
  let prev=performance.now();
  function loop(now){
    const dt=Math.min(2.5,(now-prev)/16.6667);prev=now;
    const left=running?Math.max(0,(end-now)/1000):0;
    const shown=Math.ceil(left-1e-4);
    const frac=left/TOTAL;
    $("prog").setAttribute("stroke-dashoffset",C*(1-frac));
    $("fill").style.width=(frac*100).toFixed(2)+"%";
    const lit=Math.round((1-frac)*TICKS);
    tickEls.forEach((el,i)=>el.classList.toggle("on",i<lit));
    if(shown!==lastShown){
      lastShown=shown;
      $("num").textContent=Math.max(0,shown);
      $("num").classList.remove("pop");void $("num").offsetWidth;$("num").classList.add("pop");
      $("wave").classList.remove("go");void $("wave").offsetWidth;$("wave").classList.add("go");
      if(running&&shown<=3&&shown>0)document.body.dataset.mode="danger";  // 最后 3 秒进入紧张态
    }
    if(running&&left<=0){
      running=false;document.body.dataset.mode="done";
      $("num").textContent="0";$("cap").textContent="mission complete";
      $("done").classList.add("show");burst();
    }
    paintFx(dt);
    requestAnimationFrame(loop);
  }
  $("restart").onclick=start;
  start();requestAnimationFrame(loop);
})();
</script>
</body>
</html>
