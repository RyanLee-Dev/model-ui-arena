<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>十秒点火 · Neon Countdown</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{min-height:100vh;display:grid;place-items:center;overflow:hidden;background:#05060f;color:#e9f4ff;
  font-family:ui-sans-serif,system-ui,"PingFang SC","Microsoft YaHei",sans-serif;
  transition:background .6s ease}
body.hot{background:#0b0408}
.stage{position:relative;display:grid;justify-items:center;gap:26px;padding:20px}
.halo{position:absolute;width:min(92vmin,460px);aspect-ratio:1;border-radius:50%;top:50%;left:50%;
  transform:translate(-50%,-58%);background:radial-gradient(circle,rgba(64,190,255,.14),transparent 65%);
  animation:breathe 1s ease-in-out infinite}
.hot .halo{background:radial-gradient(circle,rgba(255,64,92,.18),transparent 65%)}
@keyframes breathe{0%,100%{transform:translate(-50%,-58%)scale(1)}50%{transform:translate(-50%,-58%)scale(1.05)}}
.ringbox{position:relative;width:min(88vmin,420px);aspect-ratio:1}
svg.ring{width:100%;height:100%;transform:rotate(-90deg)}
.track{fill:none;stroke:rgba(140,180,255,.12);stroke-width:3}
.prog{fill:none;stroke:#3ecbff;stroke-width:6;stroke-linecap:round;filter:drop-shadow(0 0 10px #3ecbff)}
.hot .prog{stroke:#ff4d6d;filter:drop-shadow(0 0 12px #ff4d6d)}
.digit{position:absolute;inset:0;display:grid;place-items:center;font-weight:800;
  font-size:clamp(120px,38vmin,200px);line-height:1;letter-spacing:-.04em;font-variant-numeric:tabular-nums;
  color:#eaf7ff;text-shadow:0 0 18px #5fd4ff,0 0 60px rgba(80,200,255,.65);
  transition:text-shadow .3s}
.hot .digit{color:#ffd9e0;text-shadow:0 0 18px #ff5c78,0 0 70px rgba(255,70,100,.8)}
.digit.pulse{animation:tick .45s cubic-bezier(.2,.9,.3,1.4)}
@keyframes tick{0%{transform:scale(1)}35%{transform:scale(1.12)}100%{transform:scale(1)}}
.hot .digit.pulse{animation:tickHot .45s cubic-bezier(.2,.9,.3,1.4)}
@keyframes tickHot{0%{transform:scale(1)rotate(-1.5deg)}35%{transform:scale(1.18)rotate(1.5deg)}100%{transform:scale(1)}}
.bar{width:min(88vmin,420px);height:6px;border-radius:3px;background:rgba(140,180,255,.12);overflow:hidden}
.bar i{display:block;height:100%;width:100%;border-radius:3px;background:linear-gradient(90deg,#3ecbff,#7ce0ff);
  box-shadow:0 0 14px #3ecbff;transform-origin:left;transition:transform .2s linear}
.hot .bar i{background:linear-gradient(90deg,#ff4d6d,#ff9a6d);box-shadow:0 0 14px #ff4d6d}
.hint{font-size:12px;letter-spacing:.5em;color:#7f95c8;margin-top:-10px}
.flash{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none}
.flash.go{animation:fl .28s ease-out}
@keyframes fl{0%{opacity:.16}100%{opacity:0}}
.btn{border:1px solid rgba(140,180,255,.4);background:rgba(90,150,255,.1);color:#bfe0ff;font-family:inherit;
  font-size:14px;letter-spacing:.3em;padding:12px 30px;border-radius:999px;cursor:pointer;transition:.3s}
.btn:hover{background:rgba(90,150,255,.22)}
.done-text{position:absolute;inset:0;display:none;place-items:center;font-weight:800;letter-spacing:.2em;
  font-size:clamp(34px,10vmin,56px);color:#ffd27a;text-shadow:0 0 24px rgba(255,180,80,.8)}
.stage.done .done-text{display:grid;animation:boom .6s cubic-bezier(.2,.9,.3,1.3)}
@keyframes boom{0%{transform:scale(.4);opacity:0}100%{transform:scale(1);opacity:1}}
.burst{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.burst i{position:absolute;left:50%;top:52%;width:7px;height:7px;border-radius:50%;
  animation:fly 1.5s cubic-bezier(.1,.7,.3,1) forwards}
@keyframes fly{0%{transform:translate(0,0)scale(1);opacity:1}100%{transform:translate(var(--dx),var(--dy))scale(.2);opacity:0}}
</style>
</head>
<body>
<div class="burst" id="burst"></div>
<div class="flash" id="flash"></div>
<main class="stage" id="stage">
  <div class="halo"></div>
  <div class="ringbox">
    <svg class="ring" viewBox="0 0 200 200" aria-hidden="true">
      <circle class="track" cx="100" cy="100" r="90"></circle>
      <circle class="prog" id="prog" cx="100" cy="100" r="90" stroke-dasharray="565.5" stroke-dashoffset="0"></circle>
    </svg>
    <div class="digit" id="digit">10</div>
    <div class="done-text">点火 · 发射</div>
  </div>
  <div class="bar"><i id="bar"></i></div>
  <div class="hint">T - MINUS</div>
  <button class="btn" id="btn">重新开始</button>
</main>
<script>
const TOTAL=10,digit=document.getElementById('digit'),prog=document.getElementById('prog');
const bar=document.getElementById('bar'),stage=document.getElementById('stage');
const flash=document.getElementById('flash'),burst=document.getElementById('burst');
const C=2*Math.PI*90;
let start=0,lastTick=-1,raf=0;
function burstFx(){
  burst.innerHTML='';
  const colors=['#ffd166','#ff6b81','#7ce0ff','#9b8cff','#ff9a6d'];
  for(let i=0;i<64;i++){
    const s=document.createElement('i'),a=Math.random()*Math.PI*2,d=90+Math.random()*260;
    s.style.background=colors[i%colors.length];
    s.style.setProperty('--dx',Math.cos(a)*d+'px');
    s.style.setProperty('--dy',(Math.sin(a)*d-60)+'px');
    s.style.animationDelay=(Math.random()*.12)+'s';
    s.style.transform='scale('+(.6+Math.random()*1.4)+')';
    burst.appendChild(s);
  }
  setTimeout(()=>burst.innerHTML='',1800);
}
function frame(t){
  const left=Math.max(0,TOTAL-(t-start)/1000);
  const cur=Math.ceil(left);
  const hot=left<=3&&left>0;
  document.body.classList.toggle('hot',hot);
  prog.style.strokeDashoffset=(C*(1-left/TOTAL)).toFixed(2);
  bar.style.transform=`scaleX(${(left/TOTAL).toFixed(4)})`;
  if(cur!==lastTick){
    lastTick=cur;
    digit.textContent=cur;
    digit.classList.remove('pulse');void digit.offsetWidth;digit.classList.add('pulse');
    flash.classList.remove('go');void flash.offsetWidth;flash.classList.add('go');
  }
  if(left<=0){
    stage.classList.add('done');digit.style.visibility='hidden';
    prog.style.strokeDashoffset=C;
    burstFx();flash.classList.remove('go');void flash.offsetWidth;flash.classList.add('go');
    return;
  }
  raf=requestAnimationFrame(frame);
}
function run(){
  cancelAnimationFrame(raf);
  stage.classList.remove('done');digit.style.visibility='visible';
  document.body.classList.remove('hot');
  lastTick=-1;start=performance.now();
  requestAnimationFrame(frame);
}
document.getElementById('btn').addEventListener('click',run);
run();
</script>
</body>
</html>
