<!DOCTYPE html>
<!-- 设计说明：赛博霓虹倒计时。背景旋转光锥 + 暗格透视营造舞台感；SVG 光环由分段刻度轨道 + 辉光进度弧 + 随剩余时间行进的亮点组成；数字超大号多层霓虹阴影，每秒弹跳+光环脉冲；剩余进度同步驱动背景色相；最后 3 秒切换红色警报、数字抖动、刻度加速闪烁；归零瞬间光环扩散 + 30 粒迸射火花 + LAUNCH 文案，Restart 玻璃按钮重现。 -->
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>最炫倒计时</title>
<style>
:root{--c1:#22d3ee;--c2:#a78bfa}
*{margin:0;box-sizing:border-box}
body{min-height:100vh;display:grid;place-items:center;overflow:hidden;background:#070814;color:#fff;font-family:"SF Pro Display",-apple-system,"PingFang SC",sans-serif}
.cone{position:fixed;inset:-40%;background:repeating-conic-gradient(from 0deg,transparent 0 9deg,rgba(34,211,238,.05) 9deg 10deg);animation:spin 40s linear infinite}
.grid{position:fixed;inset:0;background:linear-gradient(rgba(120,160,255,.07) 1px,transparent 1px) 0 0/100% 44px,linear-gradient(90deg,rgba(120,160,255,.05) 1px,transparent 1px) 0 0/44px 100%;mask-image:radial-gradient(circle at 50% 42%,#000 0%,transparent 75%)}
@keyframes spin{to{transform:rotate(360deg)}}
.wrap{position:relative;text-align:center;z-index:1}
.ring-box{position:relative;width:236px;height:236px;margin:0 auto}
svg{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
.track{fill:none;stroke:rgba(255,255,255,.1);stroke-width:6;stroke-dasharray:2 7;stroke-linecap:round}
.bar{fill:none;stroke:var(--c1);stroke-width:6;stroke-linecap:round;stroke-dasharray:628.3;stroke-dashoffset:0;filter:drop-shadow(0 0 10px var(--c1));transition:stroke-dashoffset 1s linear,stroke .5s}
.head{fill:#fff;filter:drop-shadow(0 0 8px var(--c1));transform-origin:118px 118px;transition:stroke .5s,filter .5s}
.num{position:absolute;inset:0;display:grid;place-items:center;font-size:104px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:2px;text-shadow:0 0 14px var(--c1),0 0 44px var(--c2),0 0 90px var(--c1);transition:text-shadow .5s}
.num.pop{animation:pop .3s}@keyframes pop{40%{transform:scale(1.28)}}
body.tense{--c1:#ff3355;--c2:#ff8a5c}
body.tense .num{animation:shk .17s infinite}
@keyframes shk{0%,100%{transform:translate(0)}25%{transform:translate(-2.5px,1.5px)}75%{transform:translate(2.5px,-1.5px)}}
.label{margin-top:16px;font-size:14px;letter-spacing:8px;color:rgba(255,255,255,.6);text-shadow:0 0 18px rgba(120,160,255,.6)}
.restart{margin-top:30px;padding:13px 36px;border-radius:999px;border:1px solid rgba(255,255,255,.3);background:rgba(255,255,255,.07);color:#fff;font-size:15px;font-weight:700;letter-spacing:3px;cursor:pointer;opacity:0;pointer-events:none;transform:translateY(10px);transition:.45s;backdrop-filter:blur(12px);font-family:inherit}
.restart.show{opacity:1;pointer-events:auto;transform:none}
.restart:hover{background:rgba(255,255,255,.92);color:#0a0b16}
.spark{position:absolute;left:50%;top:50%;width:9px;height:9px;margin:-4.5px;border-radius:50%;background:var(--bg);pointer-events:none;animation:fly var(--d) ease-out forwards;z-index:3}
@keyframes fly{to{transform:translate(var(--x),var(--y)) scale(.12);opacity:0}}
.halo{position:absolute;left:50%;top:50%;width:10px;height:10px;margin:-5px;border-radius:50%;border:3px solid #fff;opacity:0;pointer-events:none;animation:halo .95s ease-out forwards;z-index:2}
@keyframes halo{to{transform:scale(15);opacity:0}}
</style>
</head>
<body>
<div class="cone"></div>
<div class="grid"></div>
<div class="wrap">
  <div class="ring-box">
    <svg viewBox="0 0 236 236">
      <circle class="track" cx="118" cy="118" r="100"/>
      <circle class="bar" id="bar" cx="118" cy="118" r="100"/>
      <circle class="head" id="head" cx="218" cy="118" r="7"/>
    </svg>
    <div class="num" id="num">10</div>
  </div>
  <div class="label" id="label">准备发射</div>
  <button class="restart" id="restart">⟳ 重新开始</button>
</div>
<script>
const C=628.3,bar=document.getElementById("bar"),head=document.getElementById("head"),
num=document.getElementById("num"),label=document.getElementById("label"),restart=document.getElementById("restart");
const box=document.querySelector(".ring-box");
let end=performance.now()+10000,state="run",lastSec=10;
function flash(){num.classList.remove("pop");void num.offsetWidth;num.classList.add("pop")}
function finish(){state="done";num.textContent="0";bar.style.strokeDashoffset=C;label.textContent="LAUNCH !";
document.body.classList.remove("tense");
const halo=document.createElement("i");halo.className="halo";box.appendChild(halo);setTimeout(()=>halo.remove(),1000);
for(let i=0;i<30;i++){const s=document.createElement("i");s.className="spark";const a=Math.random()*7,r=74+Math.random()*60,d=(.7+Math.random()*.9)+"s";
s.style.setProperty("--x",Math.cos(a)*r+"px");s.style.setProperty("--y",Math.sin(a)*r+"px");
s.style.setProperty("--bg",`hsl(${Math.random()*360} 100% 66%)`);s.style.setProperty("--d",d);box.appendChild(s);setTimeout(()=>s.remove(),1600)}
restart.classList.add("show")}
function loop(now){
if(state==="run"){const rem=Math.max(0,end-now),sec=Math.ceil(rem/1000);
const ang=(1-rem/10000)*360;
head.setAttribute("transform",`rotate(${ang} 118 118)`);
if(sec!==lastSec){lastSec=sec;if(sec<=0){finish()}else{flash();bar.style.strokeDashoffset=(C*(1-sec/10)).toFixed(1);label.textContent=sec<=3?"最后冲刺…":"倒计时中";document.body.classList.toggle("tense",sec<=3)}}
num.textContent=Math.max(sec,0)}
requestAnimationFrame(loop)}
restart.onclick=()=>{state="run";lastSec=10;end=performance.now()+10000;num.textContent="10";bar.style.strokeDashoffset=0;head.setAttribute("transform","rotate(0 118 118)");label.textContent="准备发射";document.body.classList.remove("tense");restart.classList.remove("show")};
requestAnimationFrame(loop);
</script>
</body>
</html>
