<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>完整书架 · The Complete Shelf</title>
<style>
  :root {
    color-scheme: dark;
    --bg-0: #0d0a08;
    --bg-1: #1c1411;
    --fg: #f5ebd9;
    --dim: #b9a78a;
    --accent: #d8a35a;
    --accent-2: #6af0ff;
    --good: #88e29a;
    --warn: #ffd84a;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    overflow: hidden;
    background: linear-gradient(180deg, var(--bg-0), var(--bg-1));
    color: var(--fg);
    font-family: ui-serif, Georgia, "Times New Roman", serif;
    -webkit-font-smoothing: antialiased;
  }
  #stage { position: fixed; inset: 0; }
  canvas { display: block; width: 100%; height: 100%; touch-action: none; }

  .panel {
    position: fixed;
    background: rgba(20, 14, 10, 0.78);
    border: 1px solid rgba(216, 163, 90, 0.25);
    border-radius: 12px;
    padding: 12px 14px;
    backdrop-filter: blur(12px);
    box-shadow: 0 14px 40px -16px rgba(216, 163, 90, 0.4);
    font-size: 12px;
    line-height: 1.6;
  }
  .panel h3 {
    margin: 0 0 8px;
    font-size: 11px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--accent);
  }
  .panel button {
    background: rgba(216, 163, 90, 0.1);
    color: var(--fg);
    border: 1px solid rgba(216, 163, 90, 0.3);
    border-radius: 6px;
    padding: 6px 10px;
    font: inherit;
    cursor: pointer;
  }
  .panel button:hover, .panel button:focus-visible { background: rgba(216, 163, 90, 0.22); outline: none; }

  #info { top: 14px; right: 14px; width: 280px; }
  #info .title { font-size: 18px; font-style: italic; color: var(--accent); margin-bottom: 4px; }
  #info .author { color: var(--dim); font-size: 11px; letter-spacing: 0.15em; text-transform: uppercase; }
  #info .blurb { margin-top: 8px; color: var(--fg); font-size: 13px; line-height: 1.55; }
  #info .meta { margin-top: 8px; display: flex; gap: 8px; flex-wrap: wrap; }
  #info .chip {
    background: rgba(216, 163, 90, 0.12);
    border: 1px solid rgba(216, 163, 90, 0.3);
    padding: 2px 8px;
    border-radius: 99px;
    font-size: 10px;
    color: var(--accent);
    letter-spacing: 0.12em;
    text-transform: uppercase;
  }

  #nav { bottom: 14px; left: 50%; transform: translateX(-50%); display: flex; gap: 8px; align-items: center; }
  #nav button { font-size: 18px; min-width: 44px; }
  #nav .pos { display: flex; gap: 6px; }
  #nav .pos span {
    width: 8px; height: 8px; border-radius: 50%;
    background: rgba(216, 163, 90, 0.25);
    transition: background .25s, transform .25s;
  }
  #nav .pos span.active { background: var(--accent); transform: scale(1.4); }

  #help { bottom: 14px; left: 14px; font-size: 11px; color: var(--dim); }
  #help kbd {
    background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.12);
    border-radius: 4px; padding: 1px 5px;
    font-family: ui-monospace, monospace; color: var(--fg);
  }
  #state { top: 14px; left: 14px; font-size: 11px; }
  #state .badge {
    background: rgba(216, 163, 90, 0.12);
    border: 1px solid rgba(216, 163, 90, 0.3);
    border-radius: 99px;
    padding: 4px 12px;
    color: var(--accent);
    letter-spacing: 0.15em;
    text-transform: uppercase;
  }

  @media (max-width: 720px) {
    #info { width: calc(100vw - 28px); top: auto; bottom: 90px; right: 14px; }
    #nav { bottom: 6px; }
    #help { display: none; }
    #state { top: 8px; left: 8px; }
  }

  #fallback {
    position: fixed; inset: 0;
    display: none; align-items: center; justify-content: center;
    background: linear-gradient(180deg, var(--bg-0), var(--bg-1));
    color: var(--fg); padding: 24px; text-align: center;
  }
  #fallback.show { display: flex; }
  #fallback h1 { font-size: 22px; color: var(--accent); letter-spacing: 0.12em; }
  #fallback pre {
    text-align: left; background: rgba(0,0,0,.4); padding: 12px;
    border-radius: 8px; font-size: 11px; color: var(--bad);
    max-width: 520px; overflow: auto;
  }
</style>
</head>
<body>
<div id="stage"></div>

<aside id="state" class="panel">
  <span class="badge" id="stateLabel">书架浏览</span>
</aside>

<aside id="info" class="panel" aria-live="polite">
  <div class="title" id="bTitle">书名</div>
  <div class="author" id="bAuthor">作者</div>
  <p class="blurb" id="bBlurb">…</p>
  <div class="meta" id="bMeta"></div>
</aside>

<aside id="nav" class="panel" aria-label="导航">
  <button id="btnPrev" aria-label="上一册">‹</button>
  <div class="pos" id="pos"></div>
  <button id="btnNext" aria-label="下一册">›</button>
</aside>

<aside id="help" class="panel">
  <div><kbd>←</kbd>/<kbd>→</kbd> 翻页 &nbsp; <kbd>Space</kbd> 进入/退出阅读</div>
  <div>滚轮切换书籍 · 点击书进入阅读 · 拖动书页翻页</div>
</aside>

<div id="fallback" role="alert">
  <div>
    <h1>三维环境暂不可用</h1>
    <p id="fbMsg">本页面需要 WebGL2 与 Three.js 0.181。</p>
    <pre id="fbTrace" hidden></pre>
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.181.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.181.0/examples/jsm/"
  }
}
</script>

<script type="module">
const FB = document.getElementById('fallback');
const FB_MSG = document.getElementById('fbMsg');
const FB_TRACE = document.getElementById('fbTrace');
function showFallback(msg, err) {
  FB_MSG.textContent = msg;
  if (err) { FB_TRACE.hidden = false; FB_TRACE.textContent = (err && err.stack) ? err.stack : String(err); }
  FB.classList.add('show');
}
function hasWebGL() { try { const c = document.createElement('canvas'); return !!(c.getContext('webgl2') || c.getContext('webgl')); } catch { return false; } }
if (!hasWebGL()) { showFallback('未检测到 WebGL。'); throw new Error('No WebGL'); }

let THREE, OrbitControls;
try {
  THREE = await import('three');
  ({ OrbitControls } = await import('three/addons/controls/OrbitControls.js'));
} catch (err) { showFallback('Three.js 加载失败。', err); throw err; }

const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
const stage = document.getElementById('stage');
const renderer = new THREE.WebGLRenderer({ antialias: !reduceMotion });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.shadowMap.enabled = !reduceMotion;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
stage.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0d0a08);
scene.fog = new THREE.FogExp2(0x0d0a08, 0.06);

const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.05, 100);
camera.position.set(0, 0.6, 3.6);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 0.4, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.minDistance = 0.6;
controls.maxDistance = 5;
controls.minPolarAngle = Math.PI * 0.18;
controls.maxPolarAngle = Math.PI * 0.55;
controls.minAzimuthAngle = -Math.PI * 0.3;
controls.maxAzimuthAngle =  Math.PI * 0.3;

// lights
scene.add(new THREE.HemisphereLight(0xfff1d2, 0x1c1411, 0.55));
const lamp = new THREE.PointLight(0xffe0b3, 1.6, 8, 1.4);
lamp.position.set(0.6, 1.6, 1.4);
lamp.castShadow = !reduceMotion;
lamp.shadow.mapSize.set(1024, 1024);
scene.add(lamp);
const fill = new THREE.PointLight(0x6af0ff, 0.4, 5);
fill.position.set(-1.0, 0.8, 0.8);
scene.add(fill);

// ground (wood floor)
const floor = new THREE.Mesh(
  new THREE.PlaneGeometry(20, 20),
  new THREE.MeshStandardMaterial({ color: 0x1a120c, roughness: 0.85 })
);
floor.rotation.x = -Math.PI / 2;
floor.position.y = -0.5;
floor.receiveShadow = true;
scene.add(floor);

// procedural wood texture for shelf
function makeWoodTexture(size = 256) {
  const c = document.createElement('canvas');
  c.width = c.height = size;
  const g = c.getContext('2d');
  g.fillStyle = '#3a261a';
  g.fillRect(0, 0, size, size);
  // wood grain
  for (let i = 0; i < 80; i++) {
    const y = Math.random() * size;
    g.strokeStyle = `rgba(${30 + Math.random() * 30}, ${18 + Math.random() * 18}, ${10 + Math.random() * 12}, ${0.3 + Math.random() * 0.4})`;
    g.lineWidth = 0.5 + Math.random() * 1.2;
    g.beginPath();
    g.moveTo(0, y);
    for (let x = 0; x <= size; x += 4) {
      g.lineTo(x, y + Math.sin(x * 0.02 + i) * 4 + Math.random() * 0.6);
    }
    g.stroke();
  }
  // knots
  for (let i = 0; i < 4; i++) {
    const x = Math.random() * size, y = Math.random() * size;
    const grad = g.createRadialGradient(x, y, 0, x, y, 8 + Math.random() * 8);
    grad.addColorStop(0, 'rgba(20,10,5,0.7)');
    grad.addColorStop(1, 'rgba(20,10,5,0)');
    g.fillStyle = grad;
    g.beginPath();
    g.arc(x, y, 12, 0, Math.PI * 2);
    g.fill();
  }
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
}
function makeClothTexture(c1, c2, size = 256) {
  const c = document.createElement('canvas');
  c.width = c.height = size;
  const g = c.getContext('2d');
  g.fillStyle = c1;
  g.fillRect(0, 0, size, size);
  // weave dots
  for (let y = 0; y < size; y += 2) {
    for (let x = 0; x < size; x += 2) {
      const v = (Math.sin(x * 0.6) * Math.cos(y * 0.6) + 1) * 0.5;
      g.fillStyle = `rgba(${parseInt(c2.slice(1,3),16)}, ${parseInt(c2.slice(3,5),16)}, ${parseInt(c2.slice(5,7),16)}, ${v * 0.18})`;
      g.fillRect(x, y, 1, 1);
    }
  }
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
}
function makePaperTexture(size = 128) {
  const c = document.createElement('canvas');
  c.width = c.height = size;
  const g = c.getContext('2d');
  g.fillStyle = '#f3ead2';
  g.fillRect(0, 0, size, size);
  for (let i = 0; i < 200; i++) {
    g.fillStyle = `rgba(${100 + Math.random() * 50}, ${80 + Math.random() * 40}, ${50 + Math.random() * 30}, ${0.05 + Math.random() * 0.1})`;
    g.fillRect(Math.random() * size, Math.random() * size, 1, 1);
  }
  // subtle horizontal lines (page rule)
  g.strokeStyle = 'rgba(140, 110, 70, 0.18)';
  g.lineWidth = 0.5;
  for (let y = 16; y < size; y += 18) {
    g.beginPath();
    g.moveTo(8, y); g.lineTo(size - 8, y);
    g.stroke();
  }
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
}
function makeFoilTexture(pattern = 'lines', size = 256) {
  const c = document.createElement('canvas');
  c.width = c.height = size;
  const g = c.getContext('2d');
  g.fillStyle = 'rgba(0,0,0,0)';
  g.fillRect(0, 0, size, size);
  g.translate(size / 2, size / 2);
  if (pattern === 'lines') {
    for (let i = -8; i <= 8; i++) {
      g.strokeStyle = `rgba(255, 215, 120, ${0.6 - Math.abs(i) * 0.05})`;
      g.lineWidth = 1;
      g.beginPath();
      g.moveTo(-size, i * 12); g.lineTo(size, i * 12);
      g.stroke();
    }
  } else if (pattern === 'arc') {
    for (let i = 1; i < 10; i++) {
      g.strokeStyle = `rgba(255, 215, 120, ${0.4 - i * 0.03})`;
      g.lineWidth = 1;
      g.beginPath();
      g.arc(0, 0, i * 16, 0, Math.PI * 2);
      g.stroke();
    }
  } else if (pattern === 'diamond') {
    g.strokeStyle = 'rgba(255, 215, 120, 0.6)';
    g.lineWidth = 1.5;
    g.beginPath();
    for (let i = 0; i < 6; i++) {
      const a = i * Math.PI / 3;
      g.moveTo(0, 0);
      g.lineTo(Math.cos(a) * size * 0.45, Math.sin(a) * size * 0.45);
    }
    g.stroke();
    g.beginPath();
    for (let i = 0; i < 6; i++) {
      const a = i * Math.PI / 3;
      g.moveTo(Math.cos(a) * 30, Math.sin(a) * 30);
      g.lineTo(Math.cos(a) * size * 0.4, Math.sin(a) * size * 0.4);
    }
    g.stroke();
  } else if (pattern === 'spiral') {
    g.strokeStyle = 'rgba(255, 215, 120, 0.7)';
    g.lineWidth = 1;
    g.beginPath();
    for (let t = 0; t < Math.PI * 8; t += 0.05) {
      const r = t * 6;
      const x = Math.cos(t) * r;
      const y = Math.sin(t) * r;
      if (t === 0) g.moveTo(x, y); else g.lineTo(x, y);
    }
    g.stroke();
  } else if (pattern === 'star') {
    g.strokeStyle = 'rgba(255, 215, 120, 0.65)';
    g.lineWidth = 1.2;
    g.beginPath();
    for (let i = 0; i < 5; i++) {
      const a = i * Math.PI * 2 / 5 - Math.PI / 2;
      const a2 = a + Math.PI / 5;
      g.moveTo(0, 0);
      g.lineTo(Math.cos(a) * size * 0.4, Math.sin(a) * size * 0.4);
      g.moveTo(0, 0);
      g.lineTo(Math.cos(a2) * size * 0.18, Math.sin(a2) * size * 0.18);
    }
    g.stroke();
    g.beginPath();
    g.arc(0, 0, size * 0.22, 0, Math.PI * 2);
    g.stroke();
  } else if (pattern === 'wave') {
    g.strokeStyle = 'rgba(255, 215, 120, 0.65)';
    g.lineWidth = 1.5;
    for (let row = -2; row <= 2; row++) {
      g.beginPath();
      for (let x = -size; x <= size; x += 2) {
        const y = row * 28 + Math.sin(x * 0.06) * 12;
        if (x === -size) g.moveTo(x, y); else g.lineTo(x, y);
      }
      g.stroke();
    }
  } else if (pattern === 'rune') {
    g.strokeStyle = 'rgba(255, 215, 120, 0.7)';
    g.lineWidth = 1.6;
    g.beginPath();
    g.moveTo(-40, -40); g.lineTo(40, 40);
    g.moveTo(40, -40); g.lineTo(-40, 40);
    g.moveTo(0, -50); g.lineTo(0, 50);
    g.moveTo(-50, 0); g.lineTo(50, 0);
    g.stroke();
    g.beginPath();
    g.arc(0, 0, 20, 0, Math.PI * 2);
    g.stroke();
  }
  g.setTransform(1, 0, 0, 1, 0, 0);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
}

// ── Book definitions ─────────────────────────────────────────────────
const BOOK_DEFS = [
  {
    title: '被遗忘的星座地图',
    author: '阿斯特里昂·维恩',
    blurb: '一份在冻原灯塔下发现的羊皮卷，记录了 47 颗已被遗忘命名的恒星。这是关于记忆、命名与光的科普随笔。',
    cover: '#3a5a4d', cloth: '#2a3a30', pattern: 'arc',
    tags: ['科普', '随笔', '天文'], height: 0.32
  },
  {
    title: '钟表匠的十二次失约',
    author: '海莲·布兰琪',
    blurb: '一位在喀尔巴阡山区修钟的老妇人，把十二次未赴的约会藏在十二座表的齿轮里。',
    cover: '#7d2f3a', cloth: '#5a1f28', pattern: 'spiral',
    tags: ['小说', '历史', '机械'], height: 0.30
  },
  {
    title: '深海的回声学',
    author: '诺亚·夸梅',
    blurb: '鲸歌如何在水中传播、变形、被听见。海洋声学跨学科论文集。',
    cover: '#1c3a5a', cloth: '#0e2238', pattern: 'wave',
    tags: ['海洋', '声学', '论文'], height: 0.34
  },
  {
    title: '灯塔守望者的食谱',
    author: '伊薇特·科尔',
    blurb: '12 座灯塔、47 道菜、92 个故事。这是给孤独者的睡前读物。',
    cover: '#b58a3c', cloth: '#8a6228', pattern: 'star',
    tags: ['生活', '饮食', '散文'], height: 0.28
  },
  {
    title: '程序化美学论',
    author: '李·所罗门',
    blurb: '探讨算法、艺术与可计算设计之间的边界。附大量 JS / GLSL 片段。',
    cover: '#5a3a72', cloth: '#3e2552', pattern: 'diamond',
    tags: ['设计', '算法', '艺术'], height: 0.31
  },
  {
    title: '铁轨上的诗人',
    author: '陈·序',
    blurb: '从满洲里到里斯本，12 位铁路诗人与他们的车厢手稿。',
    cover: '#4a3826', cloth: '#2e2117', pattern: 'lines',
    tags: ['诗', '旅行', '口述'], height: 0.29
  },
  {
    title: '失乐园的拓片学',
    author: '梅拉妮·徐',
    blurb: '以拓片方式重读十七世纪失传的素描，神秘而优雅。',
    cover: '#2f2a3a', cloth: '#1c1828', pattern: 'rune',
    tags: ['艺术', '历史', '神秘'], height: 0.33
  }
];

// ── Shelf ─────────────────────────────────────────────────────────────
const shelfGroup = new THREE.Group();
scene.add(shelfGroup);

const woodTex = makeWoodTexture(512);
woodTex.repeat.set(2, 1);
const woodMat = new THREE.MeshStandardMaterial({ map: woodTex, roughness: 0.78, metalness: 0.05 });

const SHELF_Y = -0.35;
const shelfBase = new THREE.Mesh(new THREE.BoxGeometry(3.6, 0.06, 0.5), woodMat);
shelfBase.position.set(0, SHELF_Y, 0);
shelfBase.castShadow = true;
shelfBase.receiveShadow = true;
shelfGroup.add(shelfBase);
const shelfTop = new THREE.Mesh(new THREE.BoxGeometry(3.6, 0.04, 0.5), woodMat);
shelfTop.position.set(0, SHELF_Y + 0.5, 0);
shelfTop.castShadow = true;
shelfTop.receiveShadow = true;
shelfGroup.add(shelfTop);
const shelfBack = new THREE.Mesh(new THREE.BoxGeometry(3.6, 0.5, 0.04), woodMat);
shelfBack.position.set(0, SHELF_Y + 0.25, -0.23);
shelfBack.receiveShadow = true;
shelfGroup.add(shelfBack);
// side panels
[-1.78, 1.78].forEach(x => {
  const side = new THREE.Mesh(new THREE.BoxGeometry(0.04, 0.5, 0.5), woodMat);
  side.position.set(x, SHELF_Y + 0.25, 0);
  side.castShadow = true;
  shelfGroup.add(side);
});
// contact shadow plane under shelf
const shadowPlane = new THREE.Mesh(
  new THREE.PlaneGeometry(4, 1.2),
  new THREE.ShadowMaterial({ opacity: 0.4 })
);
shadowPlane.rotation.x = -Math.PI / 2;
shadowPlane.position.y = SHELF_Y + 0.001;
shadowPlane.receiveShadow = true;
shelfGroup.add(shadowPlane);

// ── Books ────────────────────────────────────────────────────────────
const books = [];
const SHELF_LEN = 3.4;
const totalW = BOOK_DEFS.reduce((s, b) => s + 0.30, 0);
let cursor = -totalW / 2;
for (let i = 0; i < BOOK_DEFS.length; i++) {
  const def = BOOK_DEFS[i];
  const w = 0.28;
  const h = def.height;
  const d = 0.18;
  const book = new THREE.Group();
  book.userData = { def, idx: i, w, h, d, hoverOpen: 0, open: 0, pageFlip: 0 };
  book.position.set(cursor + w / 2, SHELF_Y + 0.03 + h / 2, -0.02);
  cursor += w + 0.02;
  // contact shadow
  const bs = new THREE.Mesh(
    new THREE.PlaneGeometry(w, d),
    new THREE.ShadowMaterial({ opacity: 0.4 })
  );
  bs.rotation.x = -Math.PI / 2;
  bs.position.set(cursor - w / 2 - 0.01, SHELF_Y + 0.04, 0.09);
  bs.receiveShadow = true;
  shelfGroup.add(bs);

  // cloth cover material (procedural texture)
  const clothTex = makeClothTexture(def.cover, def.cloth, 128);
  clothTex.repeat.set(2, 3);
  const coverMat = new THREE.MeshStandardMaterial({ map: clothTex, roughness: 0.7, metalness: 0.05 });

  // back cover
  const back = new THREE.Mesh(new THREE.BoxGeometry(w, h, 0.012), coverMat);
  back.position.set(0, 0, -d / 2 + 0.006);
  back.castShadow = true;
  back.receiveShadow = true;
  book.add(back);

  // page block
  const paperTex = makePaperTexture(256);
  const pageMat = new THREE.MeshStandardMaterial({ map: paperTex, roughness: 0.95, metalness: 0.0 });
  const pages = new THREE.Mesh(new THREE.BoxGeometry(w - 0.018, h - 0.018, d - 0.014), pageMat);
  pages.castShadow = true;
  pages.receiveShadow = true;
  book.add(pages);

  // spine (wraps the binding)
  const spine = new THREE.Mesh(new THREE.BoxGeometry(0.018, h, d), coverMat);
  spine.position.set(-w / 2 + 0.009, 0, 0);
  spine.castShadow = true;
  book.add(spine);

  // front cover (rotates around left edge for opening)
  const frontPivot = new THREE.Group();
  frontPivot.position.set(-w / 2, 0, d / 2 - 0.006);
  book.add(frontPivot);
  const front = new THREE.Mesh(new THREE.BoxGeometry(w, h, 0.012), coverMat);
  front.position.set(w / 2, 0, 0);
  front.castShadow = true;
  front.receiveShadow = true;
  frontPivot.add(front);

  // foil pattern on front cover
  const foilTex = makeFoilTexture(def.pattern, 256);
  const foilMat = new THREE.MeshStandardMaterial({
    map: foilTex,
    transparent: true,
    roughness: 0.3,
    metalness: 0.85,
    emissive: 0x442200,
    emissiveIntensity: 0.15
  });
  const foil = new THREE.Mesh(new THREE.PlaneGeometry(w * 0.7, h * 0.7), foilMat);
  foil.position.set(w / 2, 0, 0.0065);
  frontPivot.add(foil);

  // spine label text (procedural canvas)
  const labelCanvas = document.createElement('canvas');
  labelCanvas.width = 256; labelCanvas.height = 64;
  const lg = labelCanvas.getContext('2d');
  lg.fillStyle = def.cover;
  lg.fillRect(0, 0, 256, 64);
  lg.fillStyle = '#e8c87a';
  lg.font = 'italic 28px Georgia, serif';
  lg.textAlign = 'center';
  lg.textBaseline = 'middle';
  lg.fillText(def.title.split('').slice(0, 6).join(''), 128, 32);
  lg.strokeStyle = 'rgba(255, 220, 130, 0.6)';
  lg.lineWidth = 1;
  lg.strokeRect(2, 2, 252, 60);
  const labelTex = new THREE.CanvasTexture(labelCanvas);
  labelTex.colorSpace = THREE.SRGBColorSpace;
  const label = new THREE.Mesh(
    new THREE.PlaneGeometry(0.012, h * 0.85),
    new THREE.MeshStandardMaterial({ map: labelTex, roughness: 0.4, metalness: 0.5, emissive: 0x331a00, emissiveIntensity: 0.1 })
  );
  label.position.set(-w / 2 + 0.013, 0, 0);
  label.rotation.y = Math.PI / 2;
  book.add(label);

  // gold bands top/bottom
  const bandGeo = new THREE.PlaneGeometry(0.012, 0.02);
  const bandMat = new THREE.MeshStandardMaterial({ color: 0xd8a35a, roughness: 0.3, metalness: 0.9 });
  for (const y of [h * 0.4, -h * 0.4]) {
    const b1 = new THREE.Mesh(bandGeo, bandMat);
    b1.position.set(-w / 2 + 0.013, y, 0);
    b1.rotation.y = Math.PI / 2;
    book.add(b1);
  }

  // bookmark ribbon
  const ribbonGeo = new THREE.PlaneGeometry(0.018, h * 0.45);
  const ribbonMat = new THREE.MeshStandardMaterial({ color: 0x8a2222, roughness: 0.6, side: THREE.DoubleSide });
  const ribbon = new THREE.Mesh(ribbonGeo, ribbonMat);
  ribbon.position.set(w * 0.25, h * 0.1, d / 2 - 0.008);
  book.add(ribbon);

  // page corner curl (one page that flips on open)
  const pageGeo = new THREE.PlaneGeometry(w * 0.95, h * 0.95, 1, 12);
  const pageFlipPivot = new THREE.Group();
  pageFlipPivot.position.set(-w / 2 + 0.018, 0, 0);
  book.add(pageFlipPivot);
  const page = new THREE.Mesh(pageGeo, pageMat);
  page.position.set(w * 0.95 / 2 + 0.001, 0, d / 2 - 0.02);
  page.castShadow = true;
  pageFlipPivot.add(page);

  shelfGroup.add(book);
  books.push({ book, def, frontPivot, page, pageFlipPivot });
}

// ── State machine ────────────────────────────────────────────────────
const state = {
  mode: 'shelf', // shelf | inspect | reading | closing
  focus: 0,      // index of focused book
  // animated params
  target: { rot: 0, open: 0, zoom: 0, lift: 0 }, // 0..1
  current: { rot: 0, open: 0, zoom: 0, lift: 0 },
  hover: { active: false, idx: -1 },
  pageTurnT: 0, // for animated page flip
  pageSide: 1
};

// initial: all books facing camera
const camFocus = new THREE.Vector3(0, SHELF_Y + 0.28, 0);
camera.position.set(0, 0.6, 3.6);
controls.target.copy(camFocus);

// ── UI ────────────────────────────────────────────────────────────────
const bTitle = document.getElementById('bTitle');
const bAuthor = document.getElementById('bAuthor');
const bBlurb = document.getElementById('bBlurb');
const bMeta = document.getElementById('bMeta');
const stateLabel = document.getElementById('stateLabel');
const btnPrev = document.getElementById('btnPrev');
const btnNext = document.getElementById('btnNext');
const posEl = document.getElementById('pos');

// build position markers
const posSpans = [];
for (let i = 0; i < BOOK_DEFS.length; i++) {
  const s = document.createElement('span');
  s.setAttribute('role', 'button');
  s.setAttribute('aria-label', `第 ${i + 1} 册`);
  s.addEventListener('click', () => focusBook(i));
  posEl.appendChild(s);
  posSpans.push(s);
}

function updateInfo(i) {
  const d = BOOK_DEFS[i];
  bTitle.textContent = d.title;
  bAuthor.textContent = d.author;
  bBlurb.textContent = d.blurb;
  bMeta.innerHTML = '';
  for (const t of d.tags) {
    const c = document.createElement('span');
    c.className = 'chip';
    c.textContent = t;
    bMeta.appendChild(c);
  }
  d.height; // height is internal
  posSpans.forEach((s, idx) => s.classList.toggle('active', idx === i));
}
function focusBook(i) {
  state.focus = i;
  state.target.zoom = 1;
  updateInfo(i);
  // animate cam target
}
function setMode(m) {
  state.mode = m;
  stateLabel.textContent = ({ shelf: '书架浏览', inspect: '检视', reading: '阅读', closing: '合上中' })[m];
}

btnPrev.addEventListener('click', () => focusBook((state.focus - 1 + books.length) % books.length));
btnNext.addEventListener('click', () => focusBook((state.focus + 1) % books.length));
updateInfo(0);

// scroll to navigate
addEventListener('wheel', (e) => {
  if (state.mode !== 'shelf') return;
  if (e.deltaY > 0) btnNext.click();
  else btnPrev.click();
  e.preventDefault();
}, { passive: false });

// hover detection
const raycaster = new THREE.Raycaster();
const mouse = new THREE.Vector2();
renderer.domElement.addEventListener('pointermove', (e) => {
  mouse.x = (e.clientX / innerWidth) * 2 - 1;
  mouse.y = -(e.clientY / innerHeight) * 2 + 1;
});
renderer.domElement.addEventListener('pointerleave', () => {
  state.hover = { active: false, idx: -1 };
});
renderer.domElement.addEventListener('pointerdown', (e) => {
  mouse.x = (e.clientX / innerWidth) * 2 - 1;
  mouse.y = -(e.clientY / innerHeight) * 2 + 1;
  raycaster.setFromCamera(mouse, camera);
  for (let i = 0; i < books.length; i++) {
    const m = books[i].book.children;
    for (const c of m) {
      if (c.isMesh) {
        const hit = raycaster.intersectObject(c, false);
        if (hit.length && state.mode === 'shelf') {
          focusBook(i);
          setMode('inspect');
          state.target.zoom = 1;
          state.target.rot = 1;
          state.target.lift = 1;
          setTimeout(() => setMode('reading'), 700);
          return;
        }
      }
    }
  }
});

// keyboard
addEventListener('keydown', (e) => {
  if (e.key === 'ArrowRight') btnNext.click();
  if (e.key === 'ArrowLeft') btnPrev.click();
  if (e.code === 'Space') {
    if (state.mode === 'shelf') {
      setMode('inspect');
      state.target.rot = 1;
      state.target.lift = 1;
      setTimeout(() => setMode('reading'), 700);
    } else {
      setMode('closing');
      state.target.rot = 0;
      state.target.lift = 0;
      setTimeout(() => { setMode('shelf'); state.target.zoom = 0; }, 700);
    }
    e.preventDefault();
  }
});

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

// ── Animation loop ────────────────────────────────────────────────────
const clock = new THREE.Clock();
function frame() {
  const dt = Math.min(clock.getDelta(), 0.05);

  // hover detection (raycast books front)
  raycaster.setFromCamera(mouse, camera);
  let hoveredIdx = -1;
  for (let i = 0; i < books.length; i++) {
    const front = books[i].book.children.find(c => c.isMesh && c.geometry.parameters.width > 0.27);
    if (front && raycaster.intersectObject(front).length) { hoveredIdx = i; break; }
  }
  state.hover = { active: hoveredIdx >= 0, idx: hoveredIdx };

  // smooth toward targets
  const k = 1 - Math.pow(0.001, dt);
  state.current.rot += (state.target.rot - state.current.rot) * k;
  state.current.open += (state.target.open - state.current.open) * k;
  state.current.zoom += (state.target.zoom - state.current.zoom) * k;
  state.current.lift += (state.target.lift - state.current.lift) * k;

  // auto-trigger open when reading
  state.target.open = state.mode === 'reading' ? 1 : 0;

  // layout: arrange books on shelf; focused book gets lift + rotation
  books.forEach(({ book, def, frontPivot, page, pageFlipPivot }, i) => {
    const isFocus = (i === state.focus);
    const hover = (state.hover.idx === i);
    // base shelf pose: lined up
    // We re-position each frame to allow smooth transitions
    const idx = i;
    const w = book.userData.w;
    const h = book.userData.h;
    const totalW = books.reduce((s, b) => s + b.book.userData.w + 0.02, -0.02);
    const baseStart = -totalW / 2;
    let x = baseStart;
    for (let k = 0; k < idx; k++) x += books[k].book.userData.w + 0.02;
    x += w / 2;
    // shelf pose position
    const shelfX = x;
    const shelfY = SHELF_Y + 0.03 + h / 2;
    const shelfZ = -0.02;
    // lift pose: book floats forward and up, rotates to face camera
    const liftX = isFocus ? shelfX : shelfX;
    const liftY = isFocus ? SHELF_Y + 0.03 + h / 2 + 0.15 : shelfY;
    const liftZ = isFocus ? 0.4 : shelfZ;
    const ax = shelfX * (1 - state.current.lift) + liftX * state.current.lift;
    const ay = shelfY * (1 - state.current.lift) + liftY * state.current.lift;
    const az = shelfZ * (1 - state.current.lift) + liftZ * state.current.lift;
    book.position.set(ax, ay, az);
    // rotate to face camera when lifted
    const baseRotY = (isFocus && state.current.lift > 0.01) ? Math.PI / 2 * state.current.lift : 0;
    // smoothly interpolate
    book.rotation.y += (baseRotY - book.rotation.y) * k;
    // gentle hover tilt
    const tilt = hover && state.mode === 'shelf' ? 0.08 : 0;
    book.rotation.z += ((isFocus ? 0 : tilt) - book.rotation.z) * k;

    // front cover open
    const openTarget = isFocus ? state.current.open : 0;
    const openAmt = isFocus ? openTarget : 0;
    frontPivot.rotation.z += (-Math.PI * 0.95 * openAmt - frontPivot.rotation.z) * k;
    // page flip
    if (isFocus && state.mode === 'reading') {
      state.pageTurnT += dt * 0.3;
      const t = (Math.sin(state.pageTurnT) + 1) / 2;
      pageFlipPivot.rotation.y = t * Math.PI * 0.6;
      page.material.opacity = 1;
    } else {
      pageFlipPivot.rotation.y += (0 - pageFlipPivot.rotation.y) * k;
    }
  });

  // camera focus
  const focusBook = books[state.focus].book;
  const targetPos = new THREE.Vector3();
  focusBook.getWorldPosition(targetPos);
  if (state.current.zoom > 0.01) {
    targetPos.z += 0.2;
    targetPos.y += 0.05;
  }
  controls.target.lerp(targetPos, 0.08);

  controls.update();
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
