<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OPTIKOR GX-9000 PRO · 拟物复刻单反相机 · 纯 SVG 手绘</title>
<style>
  :root{
    --serif: Georgia, 'Times New Roman', 'Songti SC', 'SimSun', serif;
    --sans: 'Avenir Next', 'Helvetica Neue', 'Segoe UI', system-ui, -apple-system, sans-serif;
    --mono: ui-monospace, 'SF Mono', Menlo, Consolas, 'Courier New', monospace;
    --ink:#c9cdd2; --dim:#6d747c; --accent:#c8342a;
  }
  *{ box-sizing:border-box; margin:0; padding:0; }
  html,body{ height:100%; }
  body{
    font-family: var(--sans);
    color: var(--ink);
    background:
      radial-gradient(120% 85% at 50% 30%, #26292f 0%, #17191d 36%, #0c0d10 66%, #060709 100%);
    min-height:100vh;
    display:grid; place-items:center;
    overflow-x:hidden;
    -webkit-font-smoothing:antialiased;
  }
  /* 暗角 */
  body::before{
    content:""; position:fixed; inset:0; pointer-events:none;
    background: radial-gradient(90% 75% at 50% 42%, rgba(0,0,0,0) 55%, rgba(0,0,0,.55) 100%);
  }

  .stage{ position:relative; width:min(1060px, 96vw); padding: clamp(10px,2.5vh,28px) 0 8px; }

  /* 桌面反光带 */
  .stage::after{
    content:""; position:absolute; left:8%; right:8%; bottom:14.5%; height:130px;
    background: radial-gradient(60% 100% at 50% 0%, rgba(186,196,210,.055), rgba(186,196,210,0) 75%);
    pointer-events:none;
  }

  /* 取景框四角 */
  .corner{ position:absolute; width:20px; height:20px; opacity:.6; pointer-events:none; }
  .corner.tl{ top:6px; left:2px;  border-top:1px solid #454b53; border-left:1px solid #454b53; }
  .corner.tr{ top:6px; right:2px; border-top:1px solid #454b53; border-right:1px solid #454b53; }
  .corner.bl{ bottom:6px; left:2px;  border-bottom:1px solid #3c424a; border-left:1px solid #3c424a; }
  .corner.br{ bottom:6px; right:2px; border-bottom:1px solid #3c424a; border-right:1px solid #3c424a; }

  .edge{
    position:absolute; top:50%; writing-mode:vertical-rl; font-family:var(--mono);
    font-size:9px; letter-spacing:.42em; color:#525860; opacity:.85; pointer-events:none;
    user-select:none;
  }
  .edge.left { left:6px;  transform:translateY(-50%) rotate(180deg); }
  .edge.right{ right:6px; transform:translateY(-50%); }

  .rig{ display:block; }
  .rig svg{ display:block; width:100%; height:auto; }

  /* 入场:一次性轻微落定 */
  .rig{ animation: settle 1s cubic-bezier(.22,.75,.25,1) both; }
  @keyframes settle{ from{ opacity:0; transform:translateY(16px) scale(.992);} to{ opacity:1; transform:none; } }

  /* 玻璃高光缓慢漂移(嵌套在指针瞄准层之内) */
  #specDrift{ animation: drift 16s ease-in-out infinite alternate; transform-origin:333px 520px; }
  @keyframes drift{ from{ transform:rotate(-3.2deg);} to{ transform:rotate(4.2deg);} }

  /* 快门按压 */
  #shutterBtn{ transition: transform .07s ease; }
  #shutterG.pressed #shutterBtn{ transform:translateY(2.6px); }
  #shutterG{ cursor:pointer; }
  #dialG{ cursor:pointer; }
  #dialG:hover .dial-sheen{ opacity:.5; }
  .dial-sheen{ opacity:0; transition:opacity .35s ease; }

  /* 快门触发:光圈收缩 + 镜面闪光 + 机身微震 */
  #cameraAll.kick{ animation: kick .16s ease-out; }
  @keyframes kick{ 40%{ transform:translateY(1.6px);} }
  #irisG{ transform-box:fill-box; transform-origin:center; }
  #irisG.snap{ animation: irisSnap .3s cubic-bezier(.3,.1,.3,1); }
  @keyframes irisSnap{ 42%{ transform:scale(.84);} }
  #flashGlint{ opacity:0; }
  #flashGlint.pop{ animation: glintPop .34s ease-out; }
  @keyframes glintPop{ 18%{ opacity:.75;} 100%{ opacity:0;} }

  /* ---------- 铭牌 ---------- */
  .plate{ text-align:center; margin-top:clamp(2px,1vh,10px); position:relative; z-index:2;
          animation:settle 1s .12s cubic-bezier(.22,.75,.25,1) both; }
  .plate .rule{
    display:flex; align-items:center; justify-content:center; gap:14px;
    color:#3f454d; font-family:var(--mono); font-size:9px; letter-spacing:.4em;
  }
  .plate .rule::before, .plate .rule::after{
    content:""; height:1px; width:min(150px,26vw);
    background:linear-gradient(90deg, rgba(90,98,108,0), #454c55);
  }
  .plate .rule::after{ background:linear-gradient(90deg,#454c55, rgba(90,98,108,0)); }
  .plate .diamond{ width:5px; height:5px; background:var(--accent); transform:rotate(45deg); flex:none;
                   box-shadow:0 0 8px rgba(200,52,42,.55); }
  .plate .overline{ margin-top:12px; font-family:var(--mono); font-size:10px; letter-spacing:.42em; color:#7d848c; }
  .plate h1{
    margin-top:6px; font-family:var(--serif); font-weight:400;
    font-size:clamp(20px,3.4vw,29px); letter-spacing:.24em; color:#e9e6de; text-indent:.24em;
  }
  .plate h1 em{ font-style:normal; color:#d5d9de; }
  .plate h1 .pro{ color:#e0564a; }
  .plate .sub{ margin-top:7px; font-size:12px; letter-spacing:.28em; color:#8a9199; }
  .plate .hint{ margin-top:13px; font-family:var(--mono); font-size:10.5px; letter-spacing:.14em; color:#697079; }
  .plate .hint b{ color:#a8563f; font-weight:400; }
  .plate .hint .dot{ display:inline-block; width:7px; height:7px; border-radius:50%;
                     background:#a8563f; box-shadow:0 0 7px rgba(168,86,63,.6);
                     vertical-align:middle; margin-left:3px; }
  .plate .hint .sep{ margin:0 .8em; color:#3d434b; }

  @media (max-width:560px){
    .edge{ display:none; }
    .plate .sub{ letter-spacing:.16em; font-size:11px; }
    .plate .hint .sep{ display:none; }
    .plate .hint{ line-height:2; }
  }
  @media (prefers-reduced-motion:reduce){
    *,#specDrift{ animation:none !important; transition:none !important; }
  }
</style>
</head>

    <p class="hint">点击模式转盘可旋转 <span class="sep">/</span> 按下快门,听听光圈的呼吸 <i class="dot"></i></p>

<script>
(function(){
  "use strict";
  var reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  /* ---------------- 模式转盘:沿椭圆轨道定位字标,点击旋转 30° ---------------- */
  var CX = 945, CY = 296, RX = 40, RY = 13.5;
  var MODES = [["M",0],["Av",-40],["Tv",-80],["P",-120],["AUTO",-160]];
  var labels = Array.prototype.slice.call(document.querySelectorAll("#dialLabels text"));
  var offset = 0, dialAnim = 0;

  function setDial(o){
    for (var i = 0; i < labels.length; i++){
      var deg = MODES[i][1] + o;
      var a = deg * Math.PI / 180;
      var x = CX + RX * Math.sin(a);
      var y = CY + RY * Math.cos(a);
      var depth = (Math.cos(a) + 1) / 2;              /* 1 = 最前, 0 = 最后 */
      var el = labels[i];
      el.setAttribute("x", x.toFixed(1));
      el.setAttribute("y", (y + 4).toFixed(1));
      el.setAttribute("opacity", (0.35 + 0.65 * depth).toFixed(2));
      el.setAttribute("font-size", (8.8 + 4.2 * depth).toFixed(1));
      var n = ((deg % 360) + 360) % 360;
      var front = (n < 22 || n > 338);
      el.setAttribute("fill", front ? "#f3eee3" : "#8f959c");
    }
  }
  function easeOutBack(t){ var c1 = 1.18, c3 = c1 + 1; return 1 + c3*Math.pow(t-1,3) + c1*Math.pow(t-1,2); }
  function rotateDial(){
    var from = offset, to = offset + 30, t0 = null;
    if (reduce){ offset = to; setDial(offset); return; }
    cancelAnimationFrame(dialAnim);
    function step(ts){
      if (t0 === null) t0 = ts;
      var t = Math.min(1, (ts - t0) / 430);
      offset = from + (to - from) * easeOutBack(t);
      setDial(offset);
      if (t < 1) dialAnim = requestAnimationFrame(step); else offset = to;
    }
    dialAnim = requestAnimationFrame(step);
  }
  var dialG = document.getElementById("dialG");
  dialG.addEventListener("click", rotateDial);
  dialG.addEventListener("keydown", function(e){
    if (e.key === "Enter" || e.key === " "){ e.preventDefault(); rotateDial(); }
  });
  setDial(0);

  /* ---------------- 快门:按压 + 光圈收缩 + 镜面闪光 + 机身微震 ---------------- */
  var shutterG = document.getElementById("shutterG");
  var cam = document.getElementById("cameraAll");
  var iris = document.getElementById("irisG");
  var flash = document.getElementById("flashGlint");

  function fire(){
    iris.classList.remove("snap"); flash.classList.remove("pop"); cam.classList.remove("kick");
    void document.body.offsetWidth;                     /* 重触发动画 */
    iris.classList.add("snap"); flash.classList.add("pop");
    if (!reduce) cam.classList.add("kick");
  }
  shutterG.addEventListener("pointerdown", function(){ shutterG.classList.add("pressed"); });
  window.addEventListener("pointerup", function(){ shutterG.classList.remove("pressed"); });
  shutterG.addEventListener("click", fire);
  shutterG.addEventListener("keydown", function(e){
    if (e.key === "Enter" || e.key === " "){
      e.preventDefault();
      shutterG.classList.add("pressed");
      setTimeout(function(){ shutterG.classList.remove("pressed"); fire(); }, 90);
    }
  });

  /* ---------------- 玻璃高光随指针轻微偏转(悬停微交互) ---------------- */
  if (!reduce){
    var rig = document.getElementById("rig");
    var aim = document.getElementById("specAim");
    var target = 0, cur = 0, running = false;
    rig.addEventListener("pointermove", function(e){
      var r = rig.getBoundingClientRect();
      var nx = (e.clientX - r.left) / r.width - 0.5;
      target = Math.max(-5, Math.min(5, nx * 9));
      if (!running){ running = true; requestAnimationFrame(loop); }
    });
    function loop(){
      cur += (target - cur) * 0.07;
      aim.setAttribute("transform", "rotate(" + cur.toFixed(2) + " 333 520)");
      if (Math.abs(target - cur) > 0.05){ requestAnimationFrame(loop); } else { running = false; }
    }
  }
})();
</script>
