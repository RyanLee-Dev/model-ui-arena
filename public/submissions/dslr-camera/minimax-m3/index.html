<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>DSLR · ARENA 6D Mark II</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overflow:hidden;background:#0a0a0a}
  body{
    display:flex;align-items:center;justify-content:center;
    background:radial-gradient(ellipse at 50% 30%,#1a1a1c 0%,#050505 80%);
    font-family:"Helvetica Neue","PingFang SC",sans-serif;perspective:1200px;
  }
  .stage{position:relative;width:min(96vmin,720px);aspect-ratio:1.2;display:flex;align-items:center;justify-content:center}
  .surface{
    position:absolute;bottom:8%;left:5%;right:5%;height:30px;
    background:linear-gradient(180deg,#222 0%,#0a0a0a 60%,transparent 100%);
    border-radius:50%;filter:blur(8px);opacity:.7;
  }
  svg{width:100%;height:auto;display:block;filter:drop-shadow(0 30px 30px #000a)}
  .info{position:fixed;top:16px;left:16px;color:#fffa;font-size:11px;letter-spacing:3px;font-family:serif;opacity:.7;line-height:1.6}
  .info b{color:#ff4040;font-weight:600;letter-spacing:1px}
  .info .row{display:flex;gap:10px}
  .info .dot{width:8px;height:8px;border-radius:50%;background:#ff4040;box-shadow:0 0 10px #ff4040;display:inline-block;margin-right:6px;animation:pulse 1.6s infinite}
  @keyframes pulse{50%{opacity:.4}}
</style>
</head>
<body>
<div class="info">
  <div class="row"><span class="dot"></span><b>ARENA 6D Mark II · 3/4 view</b></div>
  <div>Mock replica · pure SVG · no bitmap</div>
  <div>Mode dial · click to rotate</div>
</div>
<div class="stage">
  <svg viewBox="0 0 720 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- BODY GRADIENTS -->
    <linearGradient id="bodyMain" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#3a3a3c"/><stop offset=".3" stop-color="#1c1c1e"/>
      <stop offset=".7" stop-color="#0e0e10"/><stop offset="1" stop-color="#050507"/>
    </linearGradient>
    <linearGradient id="bodyTop" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#5a5a5c"/><stop offset=".5" stop-color="#2a2a2c"/><stop offset="1" stop-color="#101012"/>
    </linearGradient>
    <linearGradient id="gripTex" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#1a1a1c"/><stop offset=".5" stop-color="#3a3a3c"/><stop offset="1" stop-color="#0e0e10"/>
    </linearGradient>
    <linearGradient id="lensBody" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#1a1a1c"/><stop offset=".3" stop-color="#3a3a3c"/>
      <stop offset=".7" stop-color="#1a1a1c"/><stop offset="1" stop-color="#050507"/>
    </linearGradient>
    <linearGradient id="lensRing" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#0a0a0c"/><stop offset=".3" stop-color="#444446"/>
      <stop offset=".7" stop-color="#2a2a2c"/><stop offset="1" stop-color="#08080a"/>
    </linearGradient>
    <!-- METAL -->
    <linearGradient id="metalRing" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#c8c8cc"/><stop offset=".3" stop-color="#f0f0f4"/>
      <stop offset=".7" stop-color="#9a9a9e"/><stop offset="1" stop-color="#4a4a4e"/>
    </linearGradient>
    <linearGradient id="metalHot" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#3a3a3c"/><stop offset=".5" stop-color="#888"/><stop offset="1" stop-color="#1a1a1c"/>
    </linearGradient>
    <radialGradient id="lensGlass" cx=".4" cy=".4">
      <stop offset="0" stop-color="#3a4a6a"/><stop offset=".4" stop-color="#101830"/><stop offset=".7" stop-color="#050a18"/><stop offset="1" stop-color="#000"/>
    </radialGradient>
    <radialGradient id="lensRefl" cx=".5" cy=".5">
      <stop offset="0" stop-color="#ffffffaa"/><stop offset=".4" stop-color="#5cb6ff44"/><stop offset="1" stop-color="#0000"/>
    </radialGradient>
    <linearGradient id="topPlate" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#7a7a7c"/><stop offset=".4" stop-color="#3a3a3c"/><stop offset="1" stop-color="#101012"/>
    </linearGradient>
    <linearGradient id="dialTop" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#0a0a0c"/><stop offset=".5" stop-color="#222224"/><stop offset="1" stop-color="#0a0a0c"/>
    </linearGradient>
    <linearGradient id="viewfinder" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#222"/><stop offset=".5" stop-color="#444"/><stop offset="1" stop-color="#1a1a1c"/>
    </linearGradient>
    <linearGradient id="rubberGrip" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#0a0a0a"/><stop offset=".5" stop-color="#2a2a2a"/><stop offset="1" stop-color="#080808"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#222"/><stop offset=".5" stop-color="#333"/><stop offset="1" stop-color="#111"/>
    </linearGradient>

    <filter id="softShadow"><feGaussianBlur stdDeviation="6"/></filter>
    <pattern id="gripPattern" patternUnits="userSpaceOnUse" width="6" height="6" patternTransform="rotate(45)">
      <rect width="6" height="6" fill="#1a1a1c"/>
      <rect width="2" height="6" fill="#2a2a2a"/>
    </pattern>
  </defs>

  <!-- ground shadow -->
  <ellipse cx="360" cy="540" rx="280" ry="22" fill="#000" opacity=".55" filter="url(#softShadow)"/>

  <!-- ============ LENS (3/4 perspective ellipse) ============ -->
  <g transform="translate(190 360)">
    <!-- lens mount shadow -->
    <ellipse cx="0" cy="0" rx="118" ry="78" fill="#000" opacity=".5" filter="url(#softShadow)"/>
    <!-- outer barrel back -->
    <ellipse cx="0" cy="0" rx="118" ry="78" fill="url(#bodyMain)"/>
    <!-- grippy focus ring -->
    <ellipse cx="-30" cy="0" rx="110" ry="72" fill="url(#lensRing)"/>
    <ellipse cx="-30" cy="0" rx="100" ry="66" fill="url(#lensBody)"/>
    <!-- vertical ridges on focus ring -->
    <g fill="#00000040">
      <ellipse cx="-30" cy="0" rx="100" ry="66" fill="none" stroke="#00000060" stroke-width="1"/>
    </g>
    <g stroke="#0a0a0a" stroke-width="1" opacity=".6">
      <line x1="-130" y1="-2" x2="-130" y2="2"/>
      <line x1="-126" y1="-8" x2="-126" y2="8"/>
      <line x1="-120" y1="-14" x2="-120" y2="14"/>
      <line x1="-110" y1="-22" x2="-110" y2="22"/>
      <line x1="-95" y1="-32" x2="-95" y2="32"/>
      <line x1="-75" y1="-44" x2="-75" y2="44"/>
      <line x1="-50" y1="-56" x2="-50" y2="56"/>
    </g>
    <g stroke="#ffffff22" stroke-width=".6">
      <line x1="-129" y1="-2" x2="-129" y2="2"/>
      <line x1="-125" y1="-8" x2="-125" y2="8"/>
      <line x1="-119" y1="-14" x2="-119" y2="14"/>
      <line x1="-109" y1="-22" x2="-109" y2="22"/>
      <line x1="-94" y1="-32" x2="-94" y2="32"/>
      <line x1="-74" y1="-44" x2="-74" y2="44"/>
      <line x1="-49" y1="-56" x2="-49" y2="56"/>
    </g>

    <!-- middle ring (zoom) -->
    <ellipse cx="20" cy="0" rx="84" ry="56" fill="url(#metalRing)"/>
    <ellipse cx="20" cy="0" rx="80" ry="52" fill="url(#lensBody)"/>
    <!-- zoom ridges -->
    <g stroke="#0a0a0a" stroke-width="1" opacity=".6">
      <line x1="100" y1="-4" x2="100" y2="4"/>
      <line x1="95" y1="-12" x2="95" y2="12"/>
      <line x1="88" y1="-22" x2="88" y2="22"/>
      <line x1="76" y1="-32" x2="76" y2="32"/>
      <line x1="60" y1="-40" x2="60" y2="40"/>
      <line x1="42" y1="-46" x2="42" y2="46"/>
    </g>

    <!-- red ring -->
    <ellipse cx="60" cy="0" rx="68" ry="44" fill="none" stroke="#d62828" stroke-width="3"/>
    <ellipse cx="60" cy="0" rx="68" ry="44" fill="none" stroke="#ff5050" stroke-width=".6" opacity=".7"/>

    <!-- distance scale ring -->
    <ellipse cx="70" cy="0" rx="56" ry="36" fill="url(#metalRing)"/>
    <ellipse cx="70" cy="0" rx="52" ry="33" fill="#0a0a0a"/>
    <!-- distance markings -->
    <g fill="#ffffff" font-family="serif" font-size="6">
      <text x="76" y="-22">∞</text><text x="74" y="-10">10</text><text x="72" y="2">5</text><text x="70" y="14">3</text><text x="68" y="26">1.5</text>
    </g>
    <g stroke="#ffd66b" stroke-width="1" fill="none">
      <line x1="68" y1="-30" x2="74" y2="-30"/>
      <line x1="64" y1="-22" x2="72" y2="-22"/>
      <line x1="62" y1="-12" x2="70" y2="-12"/>
    </g>

    <!-- front glass element -->
    <ellipse cx="86" cy="0" rx="42" ry="28" fill="url(#lensGlass)"/>
    <ellipse cx="86" cy="0" rx="38" ry="24" fill="#050810"/>
    <!-- inner concentric circles -->
    <ellipse cx="86" cy="0" rx="32" ry="20" fill="none" stroke="#1a2030" stroke-width="1"/>
    <ellipse cx="86" cy="0" rx="26" ry="16" fill="none" stroke="#2a3040" stroke-width="1"/>
    <ellipse cx="86" cy="0" rx="20" ry="12" fill="#0a1018"/>
    <!-- reflection -->
    <ellipse cx="78" cy="-8" rx="14" ry="6" fill="#ffffff66" transform="rotate(-25 78 -8)"/>
    <ellipse cx="92" cy="6" rx="8" ry="3" fill="#5cb6ff55" transform="rotate(-15 92 6)"/>
    <!-- subtle blue tint -->
    <ellipse cx="86" cy="0" rx="42" ry="28" fill="#5cb6ff10"/>
  </g>

  <!-- ============ BODY ============ -->
  <g>
    <!-- BODY bottom shadow -->
    <rect x="260" y="320" width="400" height="200" rx="20" fill="#000" opacity=".4" filter="url(#softShadow)"/>

    <!-- BODY main shell -->
    <path d="M260 220 Q260 200 280 200 L640 200 Q660 200 660 220 L660 460 Q660 480 640 480 L280 480 Q260 480 260 460 Z" fill="url(#bodyMain)"/>
    <!-- BODY top highlight strip -->
    <path d="M270 210 L650 210" stroke="#5a5a5c" stroke-width="2" opacity=".5"/>

    <!-- side perspective edge (right side darkening for 3/4) -->
    <path d="M620 200 L640 200 Q660 200 660 220 L660 460 Q660 480 640 480 L620 480 Z" fill="#00000044"/>

    <!-- GRIP on right side (3/4 view shows it prominent) -->
    <path d="M580 200 Q620 200 640 220 L640 460 Q620 480 580 480 Z" fill="url(#gripPattern)"/>
    <path d="M580 200 Q620 200 640 220 L640 460 Q620 480 580 480 Z" fill="none" stroke="#000" stroke-width="1.5"/>
    <!-- grip highlight -->
    <path d="M584 210 Q612 210 632 226 L632 466 Q612 482 584 482" fill="none" stroke="#ffffff14" stroke-width="1"/>

    <!-- Pentaprism / viewfinder hump -->
    <path d="M380 200 L380 130 Q380 110 400 110 L500 110 Q520 110 520 130 L520 200 Z" fill="url(#bodyTop)"/>
    <!-- pentaprism top -->
    <path d="M380 130 Q380 110 400 110 L500 110 Q520 110 520 130 L518 130 Q518 112 500 112 L400 112 Q382 112 382 130 Z" fill="url(#topPlate)"/>
    <!-- hot shoe (metal contacts) -->
    <rect x="420" y="118" width="60" height="14" rx="1" fill="#0a0a0c"/>
    <rect x="422" y="120" width="56" height="10" rx="0" fill="url(#metalHot)"/>
    <g fill="#d4af37">
      <rect x="425" y="122" width="3" height="6"/><rect x="432" y="122" width="3" height="6"/>
      <rect x="439" y="122" width="3" height="6"/><rect x="446" y="122" width="3" height="6"/>
      <rect x="453" y="122" width="3" height="6"/><rect x="460" y="122" width="3" height="6"/>
      <rect x="467" y="122" width="3" height="6"/><rect x="474" y="122" width="3" height="6"/>
    </g>

    <!-- Viewfinder eyepiece -->
    <rect x="430" y="98" width="40" height="22" rx="3" fill="url(#viewfinder)"/>
    <rect x="432" y="100" width="36" height="18" rx="2" fill="#0a0a0c"/>
    <ellipse cx="450" cy="109" rx="14" ry="5" fill="#000"/>
    <ellipse cx="450" cy="109" rx="10" ry="3" fill="#1a1a30"/>

    <!-- MODE DIAL (left of top plate) -->
    <g transform="translate(330 175)" id="modeDial">
      <ellipse cx="0" cy="0" rx="32" ry="14" fill="#000" opacity=".4" filter="url(#softShadow)"/>
      <ellipse cx="0" cy="0" rx="32" ry="14" fill="url(#dialTop)"/>
      <ellipse cx="0" cy="-2" rx="30" ry="12" fill="url(#dialTop)"/>
      <!-- ridges around dial -->
      <g stroke="#0a0a0a" stroke-width="1" fill="none">
        <line x1="-30" y1="-3" x2="-30" y2="-1"/>
        <line x1="-26" y1="-7" x2="-26" y2="-5"/>
        <line x1="-20" y1="-10" x2="-20" y2="-8"/>
        <line x1="-12" y1="-12" x2="-12" y2="-10"/>
        <line x1="-4" y1="-13" x2="-4" y2="-11"/>
        <line x1="4" y1="-13" x2="4" y2="-11"/>
        <line x1="12" y1="-12" x2="12" y2="-10"/>
        <line x1="20" y1="-10" x2="20" y2="-8"/>
        <line x1="26" y1="-7" x2="26" y2="-5"/>
        <line x1="30" y1="-3" x2="30" y2="-1"/>
      </g>
      <ellipse cx="0" cy="-2" rx="28" ry="10" fill="#1a1a1c"/>
      <!-- mode markings -->
      <g fill="#ffd66b" font-family="serif" font-size="7" text-anchor="middle">
        <text x="-22" y="-7">M</text><text x="-12" y="-9">Av</text><text x="-2" y="-10">Tv</text>
        <text x="10" y="-9">P</text><text x="20" y="-7">A+</text>
      </g>
      <g fill="#fff" font-family="serif" font-size="6" text-anchor="middle">
        <text x="-26" y="-3">B</text><text x="26" y="-3">SCN</text>
      </g>
      <!-- dial pointer -->
      <path d="M0 -14 L-3 -8 L3 -8 Z" fill="#ff4040"/>
    </g>

    <!-- Top LCD info panel -->
    <rect x="370" y="160" width="120" height="30" rx="3" fill="#1a2a30" stroke="#3a4a50" stroke-width=".5"/>
    <rect x="372" y="162" width="116" height="26" rx="2" fill="#0a1a18"/>
    <g fill="#5cb6ff" font-family="monospace" font-size="9" text-anchor="middle">
      <text x="430" y="178">1/200  f/4.0</text>
    </g>
    <g fill="#22c089" font-family="monospace" font-size="6" text-anchor="middle">
      <text x="430" y="186">ISO 400  ●  ●●</text>
    </g>

    <!-- SHUTTER BUTTON (top of grip) -->
    <g transform="translate(610 200)">
      <ellipse cx="0" cy="0" rx="22" ry="14" fill="url(#bodyTop)"/>
      <ellipse cx="0" cy="-2" rx="18" ry="11" fill="url(#metalRing)"/>
      <ellipse cx="0" cy="-3" rx="14" ry="8" fill="#2a2a2c"/>
      <ellipse cx="0" cy="-4" rx="10" ry="6" fill="#1a1a1c"/>
      <ellipse cx="0" cy="-4" rx="6" ry="3" fill="#0a0a0a"/>
    </g>

    <!-- power switch around shutter -->
    <g transform="translate(610 220)">
      <rect x="-18" y="-4" width="36" height="12" rx="6" fill="#0a0a0c"/>
      <rect x="-16" y="-2" width="32" height="8" rx="4" fill="#2a2a2c"/>
      <text x="14" y="3" font-size="6" fill="#ffd66b" text-anchor="middle">ON</text>
      <text x="-14" y="3" font-size="6" fill="#888" text-anchor="middle">OFF</text>
      <circle cx="10" cy="1" r="3" fill="#ff4040"/>
    </g>

    <!-- Top dial (front command) -->
    <g transform="translate(560 215)">
      <ellipse cx="0" cy="0" rx="18" ry="9" fill="url(#dialTop)"/>
      <ellipse cx="0" cy="-1" rx="16" ry="7" fill="#1a1a1c"/>
      <g stroke="#0a0a0a" stroke-width=".8">
        <line x1="-16" y1="-1" x2="-16" y2="1"/><line x1="-12" y1="-3" x2="-12" y2="3"/>
        <line x1="-6" y1="-5" x2="-6" y2="5"/><line x1="0" y1="-6" x2="0" y2="6"/>
        <line x1="6" y1="-5" x2="6" y2="5"/><line x1="12" y1="-3" x2="12" y2="3"/>
      </g>
    </g>

    <!-- AF assist light / self-timer -->
    <circle cx="540" cy="160" r="6" fill="#d4af37" opacity=".7"/>
    <circle cx="540" cy="160" r="4" fill="#fff5d0"/>
    <circle cx="540" cy="160" r="2" fill="#ff5050"/>

    <!-- FRONT PANEL details -->
    <!-- brand (mock) -->
    <text x="290" y="280" font-family="serif" font-size="22" font-weight="700" fill="#ffd66b" letter-spacing="3">ARENA</text>
    <text x="380" y="280" font-family="serif" font-size="14" font-weight="600" fill="#ffd66b" letter-spacing="2">6D Mark II</text>
    <!-- self timer / drive mode dial -->
    <circle cx="295" cy="430" r="18" fill="url(#dialTop)"/>
    <circle cx="295" cy="430" r="14" fill="#1a1a1c"/>
    <g stroke="#0a0a0a" stroke-width=".8">
      <line x1="295" y1="416" x2="295" y2="420"/><line x1="295" y1="440" x2="295" y2="444"/>
      <line x1="280" y1="430" x2="284" y2="430"/><line x1="306" y1="430" x2="310" y2="430"/>
    </g>
    <text x="295" y="434" font-size="6" fill="#fff" text-anchor="middle">DRIVE</text>
    <!-- depth-of-field preview button -->
    <circle cx="350" cy="450" r="9" fill="url(#bodyTop)"/>
    <circle cx="350" cy="450" r="6" fill="#0a0a0c"/>
    <text x="350" y="453" font-size="5" fill="#ffd66b" text-anchor="middle">DOF</text>

    <!-- LENS MOUNT area (visible behind lens) -->
    <ellipse cx="370" cy="370" rx="100" ry="65" fill="#0a0a0c" opacity=".5"/>
    <!-- lens release button -->
    <circle cx="270" cy="370" r="6" fill="#d62828"/>
    <circle cx="270" cy="370" r="4" fill="#ff5050"/>

    <!-- side panel joints / port cover (right side of body) -->
    <rect x="600" y="350" width="40" height="80" rx="4" fill="#1a1a1c" opacity=".7"/>

    <!-- back screen area (mostly behind body, hint only via body curve) -->
    <rect x="380" y="280" width="200" height="160" rx="4" fill="#0a0a0c" opacity=".2"/>

    <!-- BODY micro details -->
    <!-- vent grills -->
    <g stroke="#0a0a0a" stroke-width="1">
      <line x1="280" y1="240" x2="320" y2="240"/><line x1="280" y1="244" x2="320" y2="244"/>
      <line x1="280" y1="248" x2="320" y2="248"/>
    </g>

    <!-- speaker / mic dot -->
    <g fill="#0a0a0a">
      <circle cx="500" cy="248" r="1.4"/><circle cx="506" cy="248" r="1.4"/><circle cx="512" cy="248" r="1.4"/>
      <circle cx="500" cy="254" r="1.4"/><circle cx="506" cy="254" r="1.4"/><circle cx="512" cy="254" r="1.4"/>
    </g>

    <!-- strap eyelet left -->
    <g transform="translate(255 250)">
      <circle cx="0" cy="0" r="6" fill="none" stroke="#888" stroke-width="2"/>
      <circle cx="0" cy="0" r="3" fill="#0a0a0a"/>
    </g>
    <g transform="translate(660 250)">
      <circle cx="0" cy="0" r="6" fill="none" stroke="#888" stroke-width="2"/>
      <circle cx="0" cy="0" r="3" fill="#0a0a0a"/>
    </g>

    <!-- strap dangling -->
    <path d="M255 252 Q220 270 200 310" stroke="#3a2a18" stroke-width="6" fill="none" stroke-linecap="round"/>
    <path d="M255 252 Q220 270 200 310" stroke="#5a4028" stroke-width="2" fill="none" stroke-linecap="round" opacity=".5"/>
    <path d="M660 252 Q700 270 720 310" stroke="#3a2a18" stroke-width="6" fill="none" stroke-linecap="round"/>
    <path d="M660 252 Q700 270 720 310" stroke="#5a4028" stroke-width="2" fill="none" stroke-linecap="round" opacity=".5"/>

    <!-- subtle specular highlight on body top -->
    <path d="M280 218 Q400 212 540 218" stroke="#ffffff14" stroke-width="2" fill="none"/>
    <path d="M380 142 Q450 138 520 142" stroke="#ffffff22" stroke-width="1.5" fill="none"/>

    <!-- ambient occlusion / contact shadow under body -->
    <ellipse cx="460" cy="490" rx="220" ry="10" fill="#000" opacity=".5"/>
  </g>
</svg>
</div>
<script>
(()=>{
  const dial=document.getElementById('modeDial');
  let ang=0;
  dial.style.cursor='pointer';
  dial.addEventListener('click',()=>{
    ang=(ang+45)%360;
    dial.setAttribute('transform',`translate(330 175) rotate(${ang})`);
  });
})();
</script>
</body>
</html>
