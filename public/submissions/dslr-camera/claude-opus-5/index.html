<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ORCA D7 mark II · 拟物单反复刻</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{min-height:100svh;display:grid;place-items:center;align-content:center;gap:18px;padding:20px;
  background:radial-gradient(120% 80% at 50% 34%,#2b2f38 0%,#14161c 46%,#08090d 100%);
  font-family:-apple-system,"SF Pro Display","PingFang SC","Microsoft YaHei",system-ui,sans-serif;color:#8e97a6}
.stage{width:min(1000px,100%)}
svg{display:block;width:100%;height:auto}
.cap{text-align:center;font-size:12px;letter-spacing:.34em;text-transform:uppercase}
.cap b{color:#e6ebf3;font-weight:600;letter-spacing:.2em}
/* 玻璃镜面反光缓慢流动；模式转盘可点击换挡（不破坏静态首帧） */
@keyframes drift{0%,100%{transform:translate(0,0)}50%{transform:translate(3px,-2px)}}
#glassSheen{animation:drift 7s ease-in-out infinite}
#dialCap{cursor:pointer;transition:transform .28s cubic-bezier(.3,1.5,.5,1)}
.hint{font-size:11px;letter-spacing:.18em;opacity:.6}
</style>
</head>
<body>
<div class="stage">
<!--
  3/4 视角由一次真实的三维正交投影给出（绕 Y 轴 -38°，再俯视 12°）：
      sx = 500 + 3*( 0.788X - 0.616Z )
      sy = 380 + 3*(-0.978Y - 0.128X - 0.164Z )
  于是三个可见面各自对应一个仿射矩阵，面内元素用「真圆 / 真矩形」绘制后由矩阵压成正确的椭圆与平行四边形，
  镜头正圆自然成椭圆，绝不靠手调形状凑透视。全部图形为手绘 SVG，无位图 / base64 / emoji / 现成图标。
-->
<svg viewBox="150 140 640 450" role="img" aria-label="3/4 视角单反相机拟物插画">
<defs>
  <!-- ===== 材质渐变 ===== -->
  <linearGradient id="topFace" x1="0" y1="0" x2=".8" y2="1">
    <stop offset="0" stop-color="#6a717d"/><stop offset=".45" stop-color="#474d58"/><stop offset="1" stop-color="#2f343d"/>
  </linearGradient>
  <linearGradient id="frontFace" x1="0" y1="0" x2=".35" y2="1">
    <stop offset="0" stop-color="#4c525c"/><stop offset=".5" stop-color="#33383f"/><stop offset="1" stop-color="#22262c"/>
  </linearGradient>
  <linearGradient id="sideFace" x1="0" y1="0" x2="1" y2=".6">
    <stop offset="0" stop-color="#2c3038"/><stop offset=".6" stop-color="#1c1f25"/><stop offset="1" stop-color="#101216"/>
  </linearGradient>
  <linearGradient id="gripG" x1="0" y1="0" x2="1" y2=".3">
    <stop offset="0" stop-color="#3e434c"/><stop offset=".42" stop-color="#2a2e35"/>
    <stop offset=".78" stop-color="#191c21"/><stop offset="1" stop-color="#0e1014"/>
  </linearGradient>
  <linearGradient id="prismF" x1="0" y1="0" x2=".4" y2="1">
    <stop offset="0" stop-color="#555b66"/><stop offset="1" stop-color="#2a2e35"/>
  </linearGradient>
  <linearGradient id="prismT" x1="0" y1="0" x2=".7" y2="1">
    <stop offset="0" stop-color="#767d8a"/><stop offset="1" stop-color="#3d434d"/>
  </linearGradient>
  <!-- 镜筒圆柱明暗：沿轴向截面方向铺色，两端暗、上偏亮，userSpaceOnUse 使各段共用同一光照 -->
  <linearGradient id="barrel" gradientUnits="userSpaceOnUse" x1="-22.5" y1="-26.6" x2="-5.5" y2="22.6">
    <stop offset="0" stop-color="#191b1f"/><stop offset=".06" stop-color="#33373d"/>
    <stop offset=".26" stop-color="#4d525a"/><stop offset=".52" stop-color="#6b717b"/>
    <stop offset=".68" stop-color="#9aa2ad"/><stop offset=".82" stop-color="#565b63"/><stop offset="1" stop-color="#26282d"/>
  </linearGradient>
  <linearGradient id="metal" gradientUnits="userSpaceOnUse" x1="-22.5" y1="-26.6" x2="-5.5" y2="22.6">
    <stop offset="0" stop-color="#2a2d33"/><stop offset=".2" stop-color="#6e7681"/>
    <stop offset=".46" stop-color="#aab2bd"/><stop offset=".62" stop-color="#e8edf4"/>
    <stop offset=".74" stop-color="#828a95"/><stop offset="1" stop-color="#31343a"/>
  </linearGradient>
  <linearGradient id="rubber" gradientUnits="userSpaceOnUse" x1="-22.5" y1="-26.6" x2="-5.5" y2="22.6">
    <stop offset="0" stop-color="#0e0f12"/><stop offset=".3" stop-color="#23262b"/>
    <stop offset=".62" stop-color="#3b4047"/><stop offset=".8" stop-color="#212429"/><stop offset="1" stop-color="#0c0d10"/>
  </linearGradient>
  <linearGradient id="redRing" gradientUnits="userSpaceOnUse" x1="-22.5" y1="-26.6" x2="-5.5" y2="22.6">
    <stop offset="0" stop-color="#5a0d16"/><stop offset=".45" stop-color="#c5202f"/>
    <stop offset=".66" stop-color="#ff5a68"/><stop offset="1" stop-color="#6b111b"/>
  </linearGradient>
  <radialGradient id="glass" cx="38%" cy="30%" r="78%">
    <stop offset="0" stop-color="#2b3f6b"/><stop offset=".32" stop-color="#101a33"/>
    <stop offset=".62" stop-color="#0a1226"/><stop offset=".88" stop-color="#111c33"/><stop offset="1" stop-color="#243357"/>
  </radialGradient>
  <radialGradient id="coating" cx="62%" cy="72%" r="60%">
    <stop offset="0" stop-color="#7a3fd0" stop-opacity=".55"/><stop offset=".5" stop-color="#2a6ad0" stop-opacity=".22"/>
    <stop offset="1" stop-color="#1a8f7a" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="dialTop" x1=".1" y1="0" x2=".9" y2="1">
    <stop offset="0" stop-color="#7d848f"/><stop offset=".5" stop-color="#4a4f58"/><stop offset="1" stop-color="#2c3037"/>
  </linearGradient>
  <linearGradient id="shoeG" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#9aa2ad"/><stop offset=".5" stop-color="#5b626c"/><stop offset="1" stop-color="#2f343b"/>
  </linearGradient>
  <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#0a0b0f" stop-opacity=".85"/><stop offset="1" stop-color="#0a0b0f" stop-opacity="0"/>
  </linearGradient>
  <!-- 蒙皮颗粒：细密圆点，纯矢量，替代位图纹理 -->
  <pattern id="leather" width="3" height="3" patternUnits="userSpaceOnUse" patternTransform="rotate(18)">
    <circle cx=".8" cy=".8" r=".42" fill="#0d0f13" opacity=".6"/>
    <circle cx="2.2" cy="2.1" r=".36" fill="#0d0f13" opacity=".5"/>
    <circle cx="1" cy="2.4" r=".24" fill="#7d8593" opacity=".22"/>
  </pattern>
  <pattern id="gripDots" width="4" height="4" patternUnits="userSpaceOnUse" patternTransform="rotate(-14)">
    <circle cx="1" cy="1" r=".72" fill="#05060a" opacity=".65"/>
    <circle cx="3" cy="3" r=".72" fill="#05060a" opacity=".65"/>
    <circle cx="1" cy="1" r=".3" fill="#98a1ae" opacity=".25"/>
  </pattern>
  <filter id="softShadow" x="-40%" y="-40%" width="180%" height="180%">
    <feGaussianBlur stdDeviation="16"/>
  </filter>
  <filter id="tinyShadow" x="-60%" y="-60%" width="220%" height="220%">
    <feDropShadow dx="3" dy="4" stdDeviation="3" flood-color="#000" flood-opacity=".6"/>
  </filter>
  <filter id="bodyShadow" x="-30%" y="-30%" width="170%" height="180%">
    <feDropShadow dx="10" dy="16" stdDeviation="12" flood-color="#000" flood-opacity=".55"/>
  </filter>
  <clipPath id="glassClip"><circle cx="-64" cy="15.3" r="20"/></clipPath>
</defs>

<!-- ===== 台面接触影 ===== -->
<ellipse cx="470" cy="556" rx="290" ry="42" fill="#000" opacity=".55" filter="url(#softShadow)"/>
<ellipse cx="330" cy="520" rx="120" ry="26" fill="#000" opacity=".5" filter="url(#softShadow)"/>
<rect x="0" y="560" width="1000" height="160" fill="url(#floor)" opacity=".5"/>

<g filter="url(#bodyShadow)">
  <!-- ===== 机身：顶面 / 正面 / 右侧面（三面各由投影矩阵生成） ===== -->
  <!-- 顶面：局部坐标 (X,Z)，y=40 平面 -->
  <g transform="matrix(2.364,-0.384,-1.848,-0.492,500,262.6)">
    <path d="M-70 -34 h126 a4 4 0 0 1 4 4 v60 a4 4 0 0 1 -4 4 h-126 a4 4 0 0 1 -4 -4 v-60 a4 4 0 0 1 4 -4 z" fill="url(#topFace)"/>
    <path d="M-70 -34 h126 a4 4 0 0 1 4 4 v6 h-134 v-6 a4 4 0 0 1 4 -4 z" fill="#7c838f" opacity=".22"/>
  </g>
  <!-- 右侧面：局部坐标 (Z,Y)，x=58 平面 -->
  <g transform="matrix(-1.848,-0.492,0,-2.934,637.1,357.7)">
    <path d="M-34 -40 h68 a4 4 0 0 1 4 4 v72 a4 4 0 0 1 -4 4 h-68 a4 4 0 0 1 -4 -4 v-72 a4 4 0 0 1 4 -4 z" fill="url(#sideFace)"/>
    <path d="M-30 -34 h60 v64 h-60 z" fill="url(#leather)" opacity=".5"/>
    <rect x="-26" y="-14" width="16" height="26" rx="3" fill="#0b0d11" opacity=".8"/>
    <rect x="-24" y="-12" width="12" height="22" rx="2" fill="none" stroke="#575d67" stroke-width=".8" opacity=".7"/>
  </g>
  <!-- 正面：局部坐标 (X,Y)，z=34 平面 -->
  <g transform="matrix(2.364,-0.384,0,-2.934,437.2,363.3)">
    <path d="M-72 -40 h124 a8 8 0 0 1 8 8 v64 a8 8 0 0 1 -8 8 h-124 a8 8 0 0 1 -8 -8 v-64 a8 8 0 0 1 8 -8 z" fill="url(#frontFace)"/>
    <path d="M-72 -40 h124 a8 8 0 0 1 8 8 v64 a8 8 0 0 1 -8 8 h-124 a8 8 0 0 1 -8 -8 v-64 a8 8 0 0 1 8 -8 z" fill="url(#leather)" opacity=".65"/>
    <path d="M-76 -34 a8 8 0 0 1 6 -6 v72 a8 8 0 0 1 -6 -6 z" fill="#8b939f" opacity=".18"/>
    <!-- 卡口周围的塑料环台 -->
    <circle cx="-14" cy="-2" r="31" fill="#1a1d22"/>
    <circle cx="-14" cy="-2" r="31" fill="none" stroke="#5b616b" stroke-width=".9" opacity=".5"/>
    <!-- 镜头释放钮 -->
    <g transform="translate(24,-6)">
      <rect x="-5" y="-9" width="10" height="18" rx="4" fill="#15181d" stroke="#5c626c" stroke-width=".7"/>
      <rect x="-3" y="-7" width="6" height="14" rx="3" fill="#3a3f47"/>
    </g>
    <!-- AF 辅助灯 + 麦克风孔 -->

      <circle r="5.4" fill="#0d0f13" stroke="#5c626c" stroke-width=".7"/>
      <circle r="3.6" fill="#7b1f16"/><circle r="3.6" fill="none" stroke="#d2523f" stroke-width=".6" opacity=".7"/>
      <circle cx="-1.2" cy="-1.4" r="1.1" fill="#ffb2a0" opacity=".8"/>
    </g>
    <g fill="#0b0d11" opacity=".8">
      <circle cx="40" cy="-26" r="1.1"/><circle cx="44" cy="-27" r="1.1"/><circle cx="48" cy="-28" r="1.1"/>
    </g>
    <!-- 自创品牌与型号（非真实厂商） -->
    <text x="-64" y="30" font-size="5.6" font-weight="700" letter-spacing="1" fill="#ccd3dd" opacity=".92"
          transform="scale(1,-1)">D7 mark II</text>
    <text x="-64" y="23" font-size="3" font-weight="600" letter-spacing=".7" fill="#8b93a0" opacity=".85"
          transform="scale(1,-1)">FULL FRAME · 45.7MP</text>
  </g>

  <!-- ===== 五棱镜军舰头 ===== -->
  <path d="M374.2 265.6 L 464 251 L 460.9 185.8 L 399.5 195.8 Z" fill="url(#prismF)"/>
  <path d="M464 251 L 541.7 271.6 L 516.4 200.6 L 460.9 185.8 Z" fill="#20242a"/>
  <path d="M399.5 195.8 L 460.9 185.8 L 516.4 200.6 L 455 210.6 Z" fill="url(#prismT)"/>
  <path d="M374.2 265.6 L 464 251 L 460.9 185.8 L 399.5 195.8 Z" fill="url(#leather)" opacity=".25"/>
  <path d="M399.5 195.8 L 460.9 185.8" stroke="#aeb6c2" stroke-width="1.6" opacity=".55" fill="none"/>
  <path d="M460.9 185.8 L 516.4 200.6" stroke="#8992a0" stroke-width="1.2" opacity=".35" fill="none"/>
  <text transform="matrix(2.364,-0.384,0,-2.934,437.2,363.3) translate(-27,50) scale(1,-1)"
        font-size="6" font-weight="800" letter-spacing="1.4" fill="#e4eaf3">ORCA</text>
  <!-- 热靴：位于军舰头顶面 y=64 -->
  <g transform="matrix(2.364,-0.384,-1.848,-0.492,500,192.2)">
    <path d="M-28 -9 h22 a2 2 0 0 1 2 2 v14 a2 2 0 0 1 -2 2 h-22 a2 2 0 0 1 -2 -2 v-14 a2 2 0 0 1 2 -2 z" fill="#15181c"/>
    <path d="M-29 -10 h4 v18 h-4 z" fill="url(#shoeG)"/>
    <path d="M-7 -10 h4 v18 h-4 z" fill="url(#shoeG)"/>
    <path d="M-25 -10 h18 v3 h-18 z" fill="url(#shoeG)" opacity=".9"/>
    <rect x="-22" y="-2" width="10" height="5" rx="1" fill="#2b3038"/>
    <g fill="#3d434c"><circle cx="-20" cy="0" r=".9"/><circle cx="-17" cy="0" r=".9"/><circle cx="-14" cy="0" r=".9"/></g>
  </g>

  <!-- ===== 握把：正面鼓包 + 明暗塑形（磨砂橡胶） ===== -->
  <g transform="matrix(2.364,-0.384,0,-2.934,437.2,363.3)">
    <path d="M30 -40 C 52 -41 66 -31 67 -12 C 68 8 59 28 44 38 L 30 38 Z" fill="url(#gripG)"/>
    <path d="M30 -40 C 52 -41 66 -31 67 -12 C 68 8 59 28 44 38 L 30 38 Z" fill="url(#gripDots)" opacity=".3"/>
    <ellipse cx="41" cy="-8" rx="9" ry="26" fill="#cfd8e4" opacity=".14" transform="rotate(-8 41 -8)"/>
    <path d="M58 -30 C 66 -20 67 -2 62 14 C 58 26 52 33 44 38 L 56 38 C 64 28 68 12 68 -6 C 68 -20 64 -30 58 -34 Z" fill="#05070a" opacity=".45"/>
    <path d="M30 -40 C 44 -40 52 -34 55 -22 C 58 -8 55 12 46 26 L 30 26 Z" fill="#4b515b" opacity=".38"/>
    <path d="M33 -37 C 50 -37 60 -28 61 -11 C 62 6 55 24 42 33" fill="none" stroke="#b7c0cc" stroke-width=".9" opacity=".35"/>
    <path d="M62 -18 C 65 -6 62 10 52 24" fill="none" stroke="#000" stroke-width="3.4" opacity=".3"/>
    <path d="M30 -40 C 34 -20 34 12 30 38" fill="none" stroke="#0a0c10" stroke-width="1.2" opacity=".55"/>
  </g>
  <!-- ===== 模式转盘（顶面 y=40，可点击转动） ===== -->
  <g transform="matrix(2.364,-0.384,-1.848,-0.492,500,262.6)">
    <circle cx="-54" cy="-6" r="17.5" fill="#0f1114"/>
    <g id="dialKnurl" fill="#3b4047"></g>
    <g id="dialCap" transform="translate(14.5,18.6)">
      <circle cx="-54" cy="-6" r="17" fill="url(#dialTop)"/>
      <circle cx="-54" cy="-6" r="17" fill="none" stroke="#9aa3b0" stroke-width=".7" opacity=".7"/>
      <circle cx="-54" cy="-6" r="10" fill="#252a31"/>
      <circle cx="-54" cy="-6" r="10" fill="none" stroke="#6d7681" stroke-width=".5" opacity=".8"/>
      <g id="dialMarks"></g>
      <path d="M-54 -21.6 l 2.6 4.4 h-5.2 z" fill="#f2f6fb"/>
    </g>
  </g>
  <!-- ===== 快门按钮 + 电源拨杆（握把顶部） ===== -->
  <g transform="matrix(2.364,-0.384,-1.848,-0.492,500,262.6)">
    <ellipse cx="47" cy="21" rx="11" ry="11" fill="#101317"/>
    <g transform="translate(8.7,11.2)">
      <circle cx="47" cy="21" r="10.4" fill="#2e333a"/>
      <circle cx="47" cy="21" r="10.4" fill="none" stroke="#767e8a" stroke-width=".8" opacity=".7"/>
      <circle cx="47" cy="21" r="6.4" fill="#585f69"/>
      <circle cx="47" cy="21" r="6.4" fill="none" stroke="#aab2be" stroke-width=".6"/>
      <ellipse cx="45" cy="18.6" rx="3" ry="2.2" fill="#c9d1dc" opacity=".55"/>
    </g>
    <path d="M33 30 a 16 16 0 0 1 6 -15 l 3 4 a 11 11 0 0 0 -4 11 z" fill="#1b1f24" stroke="#5f6772" stroke-width=".6"/>
  </g>

  <!-- ===== 背带环 ===== -->
  <g transform="translate(268,286) rotate(-9)">
    <rect x="-9" y="-5" width="18" height="10" rx="2.4" fill="#3c424b" stroke="#8992a0" stroke-width=".8"/>
    <rect x="-5.5" y="-2.4" width="11" height="5" rx="1.6" fill="#0d0f13"/>
  </g>

  <!-- ===== 镜头：同一局部坐标系里按 Δz 逐段外推（含卡口、变焦环、对焦环、红圈、前组） ===== -->
  <g transform="matrix(2.364,-0.384,0,-2.934,437.2,363.3)">
    <!-- 卡口金属环 Δz 0→5 -->
    <circle cx="-14" cy="-2" r="27" fill="#3a3f47"/>
    <path d="M-5.2 23.5 L -9.1 24.9 L -26.7 -26.4 L -22.8 -27.8 Z" fill="url(#metal)"/>
    <circle cx="-17.9" cy="-0.6" r="27" fill="url(#metal)"/>
    <circle cx="-17.9" cy="-0.6" r="23.5" fill="#14171b"/>
    <!-- 红色装饰环 Δz 5→11 -->
    <path d="M-9.4 22.9 L -14.1 24.5 L -31.4 -25.9 L -26.7 -27.4 Z" fill="url(#redRing)"/>
    <circle cx="-22.6" cy="1" r="26.4" fill="url(#redRing)"/>
    <circle cx="-22.6" cy="1" r="23" fill="#16191e"/>

    <path d="M-14.5 24.3 L -31 30 L -47.4 -18.6 L -30.9 -24.3 Z" fill="url(#rubber)"/>
    <g id="zoomRib"></g>
    <circle cx="-39" cy="6.6" r="26.6" fill="url(#rubber)"/>
    <!-- 刻度金属带 Δz 32→39 -->
    <path d="M-30.5 30.4 L -36 32.3 L -51.6 -14.5 L -46.1 -16.4 Z" fill="url(#metal)"/>
    <circle cx="-44.5" cy="8.5" r="25.6" fill="url(#metal)"/>
    <circle cx="-44.5" cy="8.5" r="22" fill="#1a1d22"/>
    <g id="distScale"></g>
    <!-- 对焦环（细密滚花）Δz 39→54 -->
    <path d="M-36.3 31.9 L -48 35.9 L -62.6 -6.6 L -50.9 -10.6 Z" fill="url(#rubber)"/>
    <g id="focusRib"></g>
    <circle cx="-56.2" cy="12.6" r="25.4" fill="url(#rubber)"/>
    <!-- 滤镜螺纹环 Δz 54→60 -->
    <path d="M-47.8 36 L -52.5 37.6 L -66.4 -3.4 L -61.7 -5 Z" fill="url(#metal)"/>
    <circle cx="-60.9" cy="14.2" r="24.4" fill="url(#metal)"/>
    <circle cx="-60.9" cy="14.2" r="21.4" fill="#101317"/>
    <g id="thread"></g>
    <!-- 前圈 Δz 60→64 -->
    <path d="M-52.6 37.3 L -55.7 38.4 L -68.4 1 L -65.3 -0.1 Z" fill="#2b3038"/>
    <circle cx="-64" cy="15.3" r="24" fill="#22262c"/>
    <circle cx="-64" cy="15.3" r="24" fill="none" stroke="#9aa2ae" stroke-width=".7" opacity=".55"/>
    <circle cx="-64" cy="15.3" r="21.4" fill="#0a0c10"/>
    <!-- 前组镜片：同心结构 + 镀膜 + 高光 -->

      <circle cx="-64" cy="15.3" r="12.6" fill="none" stroke="#3d5c92" stroke-width=".8" opacity=".4"/>
      <circle cx="-64" cy="15.3" r="8.2" fill="#060a14"/>
      <circle cx="-64" cy="15.3" r="8.2" fill="none" stroke="#2f4a7a" stroke-width=".7" opacity=".5"/>
      <circle cx="-64" cy="15.3" r="4" fill="#04060c"/>
      <g id="glassSheen">
        <ellipse cx="-70.5" cy="24" rx="12.6" ry="4.6" fill="#cfe0ff" opacity=".28" transform="rotate(-52 -70.5 24)"/>
        <ellipse cx="-68" cy="27" rx="5.6" ry="2.2" fill="#ffffff" opacity=".5" transform="rotate(-52 -68 27)"/>
        <ellipse cx="-57" cy="6" rx="6.4" ry="2.6" fill="#8fd6ff" opacity=".22" transform="rotate(-52 -57 6)"/>
        <circle cx="-55.6" cy="20" r="2.4" fill="#7affd9" opacity=".18"/>
        <circle cx="-60" cy="9" r="1.5" fill="#ffd9a0" opacity=".25"/>
      </g>
      <path d="M-84 15.3 a 20 20 0 0 0 20 20 a 20 20 0 0 0 14 -6 a 26 26 0 0 1 -34 -14 z" fill="#0a1730" opacity=".5"/>

    <text transform="translate(-47,25.5) rotate(-15) scale(1,-1)" font-size="2.5" font-weight="600"
          letter-spacing=".2" fill="#9aa2ae" opacity=".9">Ø77 · ASPH · NANO COAT</text>
  </g>
</g>
</svg>
</div>
<div class="cap"><b>ORCA D7 mark II</b> · 24-70mm f/2.8 <span class="hint">（点击模式转盘可换挡）</span></div>
<script>
// 仅用于批量生成重复的手绘细节：滚花筋条、转盘刻度、螺纹线；全部是 SVG 图形，无任何位图
(function(){
  const NS="http://www.w3.org/2000/svg";
  const el=(t,a)=>{const n=document.createElementNS(NS,t);for(const k in a)n.setAttribute(k,a[k]);return n;};
  // 镜头局部坐标：沿轴每 1 单位 Δz = (-0.7817, +0.2701)
  const AX=-0.7817, AY=0.2701;
  function ribs(id,cx,cy,r,z0,z1,count,color,w){
    const g=document.getElementById(id); if(!g) return;
    for(let i=0;i<count;i++){
      const a=(i/count)*Math.PI*2, px=Math.cos(a)*r, py=Math.sin(a)*r;
      // 只画朝向观察者的一侧筋条（背面被筒身遮挡）
      const face=Math.cos(a)*0.327+Math.sin(a)*0.945;
      if(face<-0.15) continue;
      const x1=cx+AX*z0+px, y1=cy+AY*z0+py, x2=cx+AX*z1+px, y2=cy+AY*z1+py;
      g.appendChild(el("line",{x1:x1.toFixed(2),y1:y1.toFixed(2),x2:x2.toFixed(2),y2:y2.toFixed(2),
        stroke:color,"stroke-width":w,"stroke-linecap":"round",opacity:(0.25+0.6*Math.max(0,face)).toFixed(2)}));
    }
  }
  ribs("zoomRib",-14,-2,26.6,11,32,40,"#05070a",1.5);
  ribs("zoomRib",-14,-2,26.6,11,32,40,"#79818d",0.5);
  ribs("focusRib",-14,-2,25.4,39,54,56,"#04060a",1.1);
  ribs("focusRib",-14,-2,25.4,39,54,56,"#6d757f",0.4);
  ribs("thread",-14,-2,22.6,54,60,30,"#0b0e12",0.7);

  // 对焦距离刻度：只画朝向观察者的上半弧（局部 +Y 在屏幕上朝上，故取 30°~120°）
  const ds=document.getElementById("distScale");
  ["∞","5","2","1","0.6","0.4"].forEach((t,i)=>{
    const a=(122-i*17)*Math.PI/180, r=25.6, z=35.5;
    const cx=-14+AX*z, cy=-2+AY*z;
    const x=cx+Math.cos(a)*r, y=cy+Math.sin(a)*r;
    ds.appendChild(el("line",{x1:x.toFixed(2),y1:y.toFixed(2),
      x2:(cx+Math.cos(a)*(r-2.4)).toFixed(2),y2:(cy+Math.sin(a)*(r-2.4)).toFixed(2),
      stroke:"#dfe5ee","stroke-width":".6",opacity:".85"}));
    const px=cx+Math.cos(a)*(r-5.6), py=cy+Math.sin(a)*(r-5.6);
    const tx=el("text",{x:"0",y:"0","font-size":"2.9","font-weight":"700",fill:"#e8eef6",
      "text-anchor":"middle",opacity:".9",transform:`translate(${px.toFixed(2)},${py.toFixed(2)}) scale(1,-1)`});
    tx.textContent=t; ds.appendChild(tx);
  });

  // 模式转盘：外圈滚花 + 档位刻度字
  const kn=document.getElementById("dialKnurl");
  for(let i=0;i<48;i++){
    const a=(i/48)*Math.PI*2, r0=17.4, r1=18.6;
    kn.appendChild(el("line",{x1:(-54+Math.cos(a)*r0).toFixed(2),y1:(-6+Math.sin(a)*r0).toFixed(2),
      x2:(-54+Math.cos(a)*r1).toFixed(2),y2:(-6+Math.sin(a)*r1).toFixed(2),stroke:"#767e8a","stroke-width":".7",opacity:".7"}));
  }
  const marks=document.getElementById("dialMarks"), MODES=["M","Av","Tv","P","AUTO","SCN","Vd","C1","C2","B"];
  MODES.forEach((m,i)=>{
    const a=(i/MODES.length)*Math.PI*2+Math.PI/2, r=13.8;   // 局部 +Y 朝上，指针在正上方
    const px=-54+Math.cos(a)*r, py=-6+Math.sin(a)*r;
    const t=el("text",{x:"0",y:"1.3","font-size":"4.2","font-weight":"800",fill:"#eef3fa",
      "text-anchor":"middle",transform:`translate(${px.toFixed(2)},${py.toFixed(2)}) scale(1,-1)`});
    t.textContent=m; marks.appendChild(t);
  });
  const cap=document.getElementById("dialCap");
  let step=0;
  cap.addEventListener("click",()=>{                     // 咔哒一挡：绕盘心旋转 36°
    step=(step+1)%MODES.length;
    cap.setAttribute("transform",`translate(14.5,18.6) rotate(${step*36} -54 -6)`);
  });
})();
</script>
</body>
</html>
