<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>HEXALAB / 六足步态研究台</title>
<style>
:root{color-scheme:dark;--cyan:#60e7ff;--amber:#ffbd55;--red:#ff5d6c;--panel:#09131bdd}*{box-sizing:border-box}body{margin:0;overflow:hidden;background:#03080c;color:#eafaff;font:12px ui-monospace,SFMono-Regular,Menlo,monospace}#stage{position:fixed;inset:0}.top{position:fixed;top:14px;left:14px;right:14px;display:flex;justify-content:space-between;gap:12px;pointer-events:none}.brand,.panel,.controls{background:linear-gradient(135deg,#0b1922e8,#061017d9);border:1px solid #244553;border-radius:14px;box-shadow:0 16px 50px #0009;backdrop-filter:blur(12px)}.brand{padding:13px 16px;pointer-events:auto}.brand b{font:700 18px system-ui;letter-spacing:.12em}.brand small{display:block;color:#79a6b7;margin-top:4px}.badge{color:#071014;background:var(--cyan);border-radius:99px;padding:3px 7px;margin-left:8px}.panel{width:300px;max-height:52vh;overflow:auto;padding:12px;pointer-events:auto}.panel h2{font:600 11px system-ui;letter-spacing:.15em;color:#7fb5c5;margin:0 0 8px}.leg{display:grid;grid-template-columns:31px 1fr 48px;gap:7px;padding:5px 2px;border-bottom:1px solid #17303a}.leg i{width:7px;height:7px;border-radius:50%;background:#5de99a;box-shadow:0 0 9px currentColor;margin-top:4px}.leg.swing i{background:var(--amber)}.leg.warn i{background:var(--red)}.angles{color:#8fb5c0}.controls{position:fixed;left:14px;bottom:14px;right:14px;padding:10px 12px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}.group{display:flex;align-items:center;gap:6px}.group label{color:#88aebc}.modes{display:flex;gap:4px;flex-wrap:wrap}button,select,input{accent-color:var(--cyan)}button,select{border:1px solid #285061;background:#0c202a;color:#dff9ff;border-radius:8px;padding:8px 10px;font:inherit;cursor:pointer}button:hover,button.active{background:#174150;border-color:#63dff2}button.primary{background:#d9fbff;color:#061116;font-weight:800}.readout{margin-left:auto;color:#81aab8}input[type=range]{width:92px}#status{position:fixed;left:50%;top:14px;transform:translateX(-50%);padding:7px 12px;background:#071117bd;border:1px solid #244653;border-radius:99px;color:#9bc8d5}.warnText{color:var(--red)!important}#fallback{display:none;position:fixed;inset:0;z-index:20;place-items:center;background:#050a0d;padding:24px;text-align:center}#fallback div{max-width:430px;padding:28px;border:1px solid #31505b;border-radius:18px;background:#0b151a}#fallback b{display:block;font:700 21px system-ui;margin-bottom:8px}.help{color:#7194a0}@media(max-width:720px){.panel{position:fixed;right:0;top:74px;width:220px;max-height:34vh}.brand{max-width:240px}.brand small{display:none}.controls{gap:7px}.readout{width:100%;margin:0}.top{right:8px;left:8px}.group label{display:none}button,select{padding:9px 8px}input[type=range]{width:76px}#status{top:76px;left:8px;transform:none}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style>
<script>window.__bootTimer=setTimeout(()=>{document.getElementById('fallback').style.display='grid'},6500)</script>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.181.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.181.0/examples/jsm/"}}</script></head>
<body><div id="stage"></div><div id="fallback" role="alert"><div><b>无法启动 3D 实验室</b><span>Three.js 未加载或当前设备不支持 WebGL。控制面板仍保留；请检查网络模块权限或启用硬件加速。</span></div></div>
<div class="top"><div class="brand"><b>HEXALAB <span class="badge">LIVE IK</span></b><small>六足机器人 · 支撑多边形 / 解析逆解</small></div><aside class="panel"><h2>LEG TELEMETRY · 关节遥测</h2><div id="legs"></div><div class="help" style="margin-top:9px">H / F / T = 髋 / 股 / 胫角度<br>绿色支撑 · 琥珀摆动 · 红色超限</div></aside></div>
<div id="status" role="status" aria-live="polite">系统待机 · 三点支撑稳定</div>
<div class="controls"><button id="run" class="primary" aria-label="开始或停止步态">START</button><div class="modes" aria-label="步态模式"><button data-mode="stand" class="active">站立</button><button data-mode="forward">前进 W</button><button data-mode="back">后退 S</button><button data-mode="left">横移 A</button><button data-mode="right">横移 D</button><button data-mode="turn">转向 ↻</button></div><div class="group"><label for="speed">速度</label><input id="speed" type="range" min="0.2" max="2.4" step=".1" value="1"></div><div class="group"><label for="lift">步高</label><input id="lift" type="range" min=".08" max=".55" step=".01" value=".27"></div><div class="group"><label for="height">机高</label><input id="height" type="range" min=".55" max="1.25" step=".01" value=".84"></div><div class="group"><label for="steer">转向</label><input id="steer" type="range" min="-1" max="1" step=".05" value="0"></div><span class="readout" id="readout">v 0.00 m/s · COM 安全裕量 100%</span></div>
<script type="module">
import * as THREE from 'three';import{OrbitControls}from'three/addons/controls/OrbitControls.js';
clearTimeout(window.__bootTimer);const fallback=document.getElementById('fallback');try{const c=document.createElement('canvas');if(!c.getContext('webgl2')&&!c.getContext('webgl'))throw Error('WebGL unavailable')}catch(e){fallback.style.display='grid';throw e}
const host=document.getElementById('stage'),scene=new THREE.Scene();scene.background=new THREE.Color(0x03090d);scene.fog=new THREE.FogExp2(0x03090d,.045);
const camera=new THREE.PerspectiveCamera(45,innerWidth/innerHeight,.05,80);camera.position.set(5.8,4.2,6.2);const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,1.8));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.outputColorSpace=THREE.SRGBColorSpace;host.appendChild(renderer.domElement);
const orbit=new OrbitControls(camera,renderer.domElement);orbit.target.set(0,.5,0);orbit.enableDamping=true;orbit.maxPolarAngle=1.47;orbit.minDistance=3;orbit.maxDistance=12;
scene.add(new THREE.HemisphereLight(0xa9eaff,0x14202a,1.3));const key=new THREE.DirectionalLight(0xffffff,3);key.position.set(4,7,3);key.castShadow=true;key.shadow.mapSize.set(1024,1024);scene.add(key);const rim=new THREE.PointLight(0x38cfff,15,10);rim.position.set(-3,2,-3);scene.add(rim);
const grid=new THREE.GridHelper(22,44,0x2a6170,0x122c34);scene.add(grid);const ground=new THREE.Mesh(new THREE.PlaneGeometry(22,22),new THREE.MeshStandardMaterial({color:0x071115,roughness:.92,metalness:.08}));ground.rotation.x=-Math.PI/2;ground.position.y=-.012;ground.receiveShadow=true;scene.add(ground);
const robot=new THREE.Group();scene.add(robot);const metal=new THREE.MeshStandardMaterial({color:0x54646b,metalness:.85,roughness:.23}),dark=new THREE.MeshStandardMaterial({color:0x10191e,metalness:.65,roughness:.3}),cyan=new THREE.MeshStandardMaterial({color:0x30bad1,emissive:0x063945,metalness:.7,roughness:.22}),rubber=new THREE.MeshStandardMaterial({color:0x090c0e,roughness:.9});
const body=new THREE.Mesh(new THREE.CapsuleGeometry(.72,1.25,6,16),metal);body.rotation.z=Math.PI/2;body.scale.z=.62;body.castShadow=true;robot.add(body);const deck=new THREE.Mesh(new THREE.BoxGeometry(1.55,.18,1.06),dark);deck.position.y=.21;deck.castShadow=true;robot.add(deck);for(let x of[-.58,0,.58]){const vent=new THREE.Mesh(new THREE.BoxGeometry(.28,.045,.8),cyan);vent.position.set(x,.32,0);robot.add(vent)}
function cylBetween(a,b,r,mat){const m=new THREE.Mesh(new THREE.CylinderGeometry(r,r,1,10),mat);const d=new THREE.Vector3().subVectors(b,a);m.position.copy(a).add(b).multiplyScalar(.5);m.scale.y=d.length();m.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),d.clone().normalize());m.castShadow=true;return m}
const bases=[[-.62,.0,.54],[0,.0,.65],[.62,.0,.54],[-.62,.0,-.54],[0,.0,-.65],[.62,.0,-.54]];const names=['LF','LM','LR','RF','RM','RR'],legs=[];const L1=.82,L2=.94;
for(let i=0;i<6;i++){const g=new THREE.Group();robot.add(g);const servo=new THREE.Mesh(new THREE.CylinderGeometry(.18,.18,.22,16),cyan);servo.rotation.x=Math.PI/2;g.add(servo);const foot=new THREE.Mesh(new THREE.CylinderGeometry(.13,.18,.09,14),rubber);foot.castShadow=true;const targetRing=new THREE.Mesh(new THREE.RingGeometry(.14,.18,20),new THREE.MeshBasicMaterial({color:0x55eaff,transparent:true,opacity:.35,side:THREE.DoubleSide}));targetRing.rotation.x=-Math.PI/2;robot.add(targetRing);legs.push({g,servo,segments:[],foot,targetRing,phase:i%2?0:.5,angles:[0,0,0],warn:false,target:new THREE.Vector3()});robot.add(foot)}
const supportGeo=new THREE.BufferGeometry(),supportLine=new THREE.LineLoop(supportGeo,new THREE.LineBasicMaterial({color:0x55f3a2,transparent:true,opacity:.8}));scene.add(supportLine);const com=new THREE.Mesh(new THREE.CylinderGeometry(.045,.045,1,12),new THREE.MeshBasicMaterial({color:0xffdb60,transparent:true,opacity:.55}));scene.add(com);
const state={run:false,mode:'stand',t:0};const baseFeet=bases.map(([x,y,z])=>new THREE.Vector3(x*1.8,0,z*2.05));
function setMode(m){state.mode=m;document.querySelectorAll('[data-mode]').forEach(b=>b.classList.toggle('active',b.dataset.mode===m));document.getElementById('status').textContent=`模式：${{stand:'站立',forward:'前进',back:'后退',left:'左横移',right:'右横移',turn:'原地转向'}[m]} · tripod gait 已同步`}
document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>setMode(b.dataset.mode));document.getElementById('run').onclick=()=>{state.run=!state.run;document.getElementById('run').textContent=state.run?'STOP':'START';document.getElementById('run').classList.toggle('primary',!state.run);document.getElementById('status').textContent=state.run?'步态运行 · 实时足端 IK':'系统暂停 · 保持足端约束'};
const keyMap={w:'forward',arrowup:'forward',s:'back',arrowdown:'back',a:'left',arrowleft:'left',d:'right',arrowright:'right',q:'turn',e:'turn'};addEventListener('keydown',e=>{const m=keyMap[e.key.toLowerCase()];if(m){setMode(m);state.run=true;document.getElementById('run').textContent='STOP'}});addEventListener('keyup',e=>{if(keyMap[e.key.toLowerCase()]&&e.key.toLowerCase()!=='q'&&e.key.toLowerCase()!=='e')setMode('stand')});
function updateLeg(i,dt){const leg=legs[i],base=new THREE.Vector3(...bases[i]);base.y=0;const p=(state.t*Number(speed.value)+leg.phase)%1;const swing=p<.5&&state.run&&state.mode!=='stand';const q=swing?p/.5:(p-.5)/.5;const liftV=Number(lift.value);let dx=0,dz=0,turn=Number(steer.value);const stride=.54;let k=swing?(q-.5)*2:(.5-q)*2;if(state.mode==='forward')dx=k*stride;if(state.mode==='back')dx=-k*stride;if(state.mode==='left')dz=k*stride;if(state.mode==='right')dz=-k*stride;if(state.mode==='turn'||Math.abs(turn)>.05){const s=(i<3?1:-1);dx+=k*stride*.45*s*(state.mode==='turn'?1:turn);dz+=k*stride*.25*(i%3-1)*(state.mode==='turn'?1:turn)}const foot=baseFeet[i].clone();foot.x+=dx;foot.z+=dz;foot.y=swing?Math.sin(q*Math.PI)*liftV:0;leg.target.copy(foot);leg.targetRing.position.set(foot.x,.012,foot.z);
const hip=base.clone();const local=foot.clone().sub(hip);const yaw=Math.atan2(local.z,local.x);const radial=Math.hypot(local.x,local.z)-.22;const vertical=local.y-Number(height.value);const dist=Math.hypot(radial,vertical);leg.warn=dist>L1+L2||dist<Math.abs(L1-L2);const d=THREE.MathUtils.clamp(dist,.08,L1+L2-.005);const knee=Math.PI-Math.acos(THREE.MathUtils.clamp((L1*L1+L2*L2-d*d)/(2*L1*L2),-1,1));const shoulder=Math.atan2(vertical,radial)+Math.acos(THREE.MathUtils.clamp((L1*L1+d*d-L2*L2)/(2*L1*d),-1,1));const joint=new THREE.Vector3(hip.x+Math.cos(yaw)*Math.cos(shoulder)*L1,hip.y+Math.sin(shoulder)*L1,hip.z+Math.sin(yaw)*Math.cos(shoulder)*L1);leg.angles=[yaw,shoulder,knee];while(leg.segments.length){robot.remove(leg.segments.pop())}leg.g.position.copy(hip);leg.segments=[cylBetween(hip,joint,.075,dark),cylBetween(joint,foot,.065,metal)];leg.segments.forEach(s=>robot.add(s));leg.foot.position.copy(foot);leg.foot.rotation.y=yaw;leg.foot.position.y+=.035;leg.servo.material=leg.warn?new THREE.MeshStandardMaterial({color:0xff334e,emissive:0x55000b}):cyan;return{swing,foot}}
function updatePanel(results){const el=document.getElementById('legs');el.innerHTML=legs.map((l,i)=>`<div class="leg ${results[i].swing?'swing':''} ${l.warn?'warn':''}"><i></i><b>${names[i]}</b><span class="angles">${l.angles.map(a=>(a*57.3).toFixed(0)).join('° / ')}°</span></div>`).join('');const warnings=legs.filter(l=>l.warn).length;document.getElementById('status').classList.toggle('warnText',warnings>0);if(warnings)document.getElementById('status').textContent=`警告：${warnings} 条腿超出可达包络`}
const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;let last=performance.now(),uiTick=0;function frame(now){requestAnimationFrame(frame);let dt=Math.min(.04,(now-last)/1000);last=now;if(reduced)dt=Math.min(dt,.012);if(state.run)state.t+=dt*.55;robot.position.y=Number(height.value);const results=legs.map((_,i)=>updateLeg(i,dt));const stance=results.filter(r=>!r.swing).map(r=>new THREE.Vector3(r.foot.x,.022,r.foot.z));if(stance.length>=3){supportGeo.setFromPoints(stance);supportGeo.attributes.position.needsUpdate=true}com.position.set(0,Number(height.value)/2,0);com.scale.y=Number(height.value);if((uiTick++%8)===0)updatePanel(results);const moving=state.run&&state.mode!=='stand';document.getElementById('readout').textContent=`v ${moving?(Number(speed.value)*.23).toFixed(2):'0.00'} m/s · COM 安全裕量 ${legs.some(l=>l.warn)?'低':'82%'}`;orbit.update();renderer.render(scene,camera)}requestAnimationFrame(frame);
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});window.__arenaReady=true;
</script></body></html>
