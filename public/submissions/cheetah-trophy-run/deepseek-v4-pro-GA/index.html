<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>绝杀 · 冠军之夜</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{min-height:100vh;display:grid;place-items:center;background:radial-gradient(120% 100% at 50% 0%,#101a38 0%,#05070f 70%);padding:16px}
.poster{width:min(100%,1180px);height:auto;display:block;border-radius:18px;
  box-shadow:0 40px 100px rgba(0,0,0,.6)}
.c{transform-box:fill-box;transform-origin:center;animation:sway 6s ease-in-out infinite}
@keyframes sway{0%,100%{transform:rotate(var(--r))translateY(0)}50%{transform:rotate(var(--r))translateY(14px)}}
.glint{animation:glintP 3.2s ease-in-out infinite}
@keyframes glintP{0%,82%,100%{opacity:.55}88%{opacity:1}94%{opacity:.5}}
.beam{animation:beamP 7s ease-in-out infinite}
@keyframes beamP{0%,100%{opacity:.75}50%{opacity:1}}
.tick{animation:tickP 1.6s steps(2) infinite}
@keyframes tickP{50%{opacity:.35}}
</style>
</head>

<script>
// 星空、观众与纸屑用 JS 撒点，保持主体为内联 SVG 手绘
const stars=document.getElementById('stars');
for(let i=0;i<70;i++){
  const c=document.createElementNS('http://www.w3.org/2000/svg','circle');
  c.setAttribute('cx',Math.random()*1200);c.setAttribute('cy',Math.random()*400);
  c.setAttribute('r',(Math.random()*1.5+.3).toFixed(2));
  c.setAttribute('fill','rgba(255,255,255,'+(Math.random()*.7+.25).toFixed(2)+')');
  stars.appendChild(c);
}
const cols=['#ffd76a','#ff9f6a','#7cd7ff','#ff7c9b','#a8ffc9','#e8ecf7','#c9a6ff'];
function crowd(sel,y0,y1,n){
  const g=document.getElementById(sel);
  for(let i=0;i<n;i++){
    const c=document.createElementNS('http://www.w3.org/2000/svg','circle');
    const x=Math.random()*1200,y=y0+Math.random()*(y1-y0);
    c.setAttribute('cx',x);c.setAttribute('cy',y);
    c.setAttribute('r',(Math.random()*2.6+1.2).toFixed(1));
    c.setAttribute('fill',cols[i%cols.length]);c.setAttribute('opacity',(Math.random()*.45+.35).toFixed(2));
    g.appendChild(c);
  }
}
crowd('crowd',440,570,260);
crowd('crowd2',575,695,180);
const conf=document.getElementById('confetti');
for(let i=0;i<46;i++){
  const e=document.createElementNS('http://www.w3.org/2000/svg',Math.random()<.5?'rect':'circle');
  const x=220+Math.random()*860,y=90+Math.random()*470;
  e.setAttribute('x',x);e.setAttribute('y',y);
  e.setAttribute('width',7);e.setAttribute('height',10);
  e.setAttribute('r',4.5);
  e.setAttribute('cx',x);e.setAttribute('cy',y);
  e.setAttribute('fill',cols[i%cols.length]);
  e.setAttribute('class','c');
  e.style.setProperty('--r',(Math.random()*360-180)+'deg');
  e.style.animationDelay=(-Math.random()*6)+'s';
  e.style.animationDuration=(4+Math.random()*4)+'s';
  conf.appendChild(e);
}
</script>
</body>
</html>
