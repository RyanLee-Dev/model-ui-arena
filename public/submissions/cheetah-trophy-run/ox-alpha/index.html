<!DOCTYPE html>
<!--
设计说明：《绝杀加冕》—— 拟人猎豹高举大力神杯冲刺的冠军海报（纯手绘内联 SVG）。
分层：夜空灯塔 → 双层观众席 → 广告围挡 → 透视草皮 → 速度残影/速度线 →
猎豹（连续躯干剪影 + 大头猫科面部 + 泪痕 + 斑点 + 环纹长尾 + 蹬地后腿）
→ 双臂屈肘高举大力神杯（绿玛瑙双层底座 / 双人托举浮雕 / 金色地球）
→ 金色彩带雨、比分牌 90+7' / 3:2、滚动足球与草痕、海报字。
全部形状手绘：渐变 + 滤镜 + 裁剪路径；CSS 仅驱动彩带摆动与速度线流动。
-->
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>绝杀加冕 · CHEETAH TROPHY RUN</title>
<style>
*{margin:0;padding:0}
body{min-height:100vh;background:#06091b;display:flex;align-items:center;justify-content:center;padding:12px;
  font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif}
svg{width:min(94vw,560px);height:auto;display:block;border-radius:14px;box-shadow:0 30px 80px rgba(0,0,0,.6)}
.confetti{animation:sway 4.2s ease-in-out infinite alternate;transform-origin:center}
.confetti.c2{animation-duration:5.6s}.confetti.c3{animation-duration:3.4s}
@keyframes sway{from{transform:translateY(-5px) rotate(-3deg)}to{transform:translateY(6px) rotate(4deg)}}
.speed{stroke-dasharray:30 40;animation:dash 1s linear infinite}
@keyframes dash{to{stroke-dashoffset:-140}}
.gleam{animation:glin 4.2s ease-in-out infinite}
@keyframes glin{0%,70%,100%{opacity:.25}80%{opacity:.95}}
</style>
</head>
<body>
<svg viewBox="0 0 900 1240" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="猎豹高举奖杯冲刺的冠军海报">
<defs>

    <stop offset="0" stop-color="#cfe0ff" stop-opacity=".55"/><stop offset="1" stop-color="#cfe0ff" stop-opacity="0"/>

  </linearGradient>
  <linearGradient id="goldV" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#ffefb0"/><stop offset=".35" stop-color="#f6bd42"/><stop offset=".7" stop-color="#b06e12"/><stop offset="1" stop-color="#8a520d"/>
  </linearGradient>
  <linearGradient id="goldH" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#8a550e"/><stop offset=".3" stop-color="#f7c247"/><stop offset=".62" stop-color="#fff0b4"/><stop offset="1" stop-color="#a86910"/>
  </linearGradient>
  <radialGradient id="globeG" cx=".35" cy=".28" r="1.05">

  <radialGradient id="cupGlow" cx=".5" cy=".45" r=".55">

  </radialGradient>
  <radialGradient id="ballG" cx=".35" cy=".3" r="1">

    <circle cx="15" cy="2" r="2.1" fill="#8fd0ff"/><circle cx="7" cy="9.5" r="2.1" fill="#ff9bb0"/>
    <circle cx="1" cy="8" r="2" fill="#b7ffd9"/>

  <clipPath id="torsoClip"><use href="#torsoPath"/></clipPath>

    C540,616 478,656 444,700
    C418,730 398,748 386,758
    C352,782 338,822 360,854
    C376,878 408,888 438,878
    C458,871 472,856 482,838
    C514,800 560,768 596,736
    C622,714 638,690 644,664
    C652,632 648,612 636,600 Z"/>
</defs>

<!-- ═══ 背景：夜空 · 灯塔 · 光束 ═══ -->
<rect width="900" height="1240" fill="url(#skyG)"/>

<!-- ═══ 大力神杯（双层绿座 + 双人托举浮雕 + 金球，整体右上让出头部空间）═══ -->
<g id="trophy" transform="translate(48,-64)">

  <!-- 爪掌（扣住底座左侧下沿，四趾搭在座身上）-->
