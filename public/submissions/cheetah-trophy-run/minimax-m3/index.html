<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>猎豹举杯 · 冲刺</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overflow:hidden;background:#0a0612;font-family:"Cinzel","PingFang SC",serif}
  body{display:flex;align-items:center;justify-content:center;background:radial-gradient(ellipse at 50% 30%,#3b1f4d 0%,#0a0612 70%)}
  .frame{width:min(96vmin,860px);aspect-ratio:1;position:relative}
  svg{width:100%;height:100%;display:block;overflow:visible;filter:drop-shadow(0 24px 40px #0008)}
  .vignette{position:absolute;inset:0;background:radial-gradient(ellipse at center,transparent 50%,#000000aa 100%);pointer-events:none}
  .title{position:absolute;top:4%;left:50%;transform:translateX(-50%);font-family:"Cinzel",serif;font-size:clamp(14px,2.4vmin,24px);letter-spacing:8px;color:#ffd66b;text-shadow:0 0 20px #ffd66b,0 0 40px #ff7c2a66;font-weight:700}
  .subtitle{position:absolute;top:11%;left:50%;transform:translateX(-50%);font-size:clamp(9px,1.4vmin,13px);letter-spacing:6px;color:#fff8;font-weight:300;text-transform:uppercase}
  .scoreboard{position:absolute;bottom:6%;right:6%;padding:10px 18px;border-radius:12px;background:#0a0612cc;border:2px solid #ffd66b;color:#ffd66b;font-family:"Courier New",monospace;font-size:clamp(13px,1.8vmin,18px);letter-spacing:3px;display:flex;flex-direction:column;align-items:center;line-height:1.2;box-shadow:0 0 24px #ffd66b66}
  .scoreboard .t{color:#fff;font-size:.7em;letter-spacing:4px;opacity:.8}
  .scoreboard .v{color:#ffd66b;font-size:1.6em;font-weight:700;text-shadow:0 0 10px #ffd66b}
  .grass-strip{position:absolute;bottom:0;left:0;right:0;height:14%;background:linear-gradient(180deg,transparent,#2a5b1f 30%,#1a3d12);clip-path:polygon(0 100%,100% 100%,100% 0,0 30%)}
  .stage-light{position:absolute;inset:0;background:radial-gradient(circle at 50% 0%,#ffd66b22 0%,transparent 40%);pointer-events:none;mix-blend-mode:screen;animation:pulse 3s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:.5}50%{opacity:.95}}
  .runner{animation:leap 1.6s ease-in-out infinite}
  @keyframes leap{0%,100%{transform:translateY(0)}50%{transform:translateY(-1.4%)}}
  .confetti i{position:absolute;width:6px;height:12px;background:var(--c,#ffd66b);top:-5vh;animation:fall linear infinite}
  @keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
</style>
</head>
<body>
<div class="frame">
  <div class="stage-light"></div>
  <div class="title">CHAMPIONS</div>
  <div class="subtitle">Final · Stoppage Time · Glory</div>
  <svg viewBox="0 0 800 800">
    <defs>
      <!-- gradients -->
      <linearGradient id="bgSky" x1="0" x2="0" y1="0" y2="1">
        <stop offset="0" stop-color="#ff7c2a"/><stop offset=".5" stop-color="#a8236d"/><stop offset="1" stop-color="#2a1448"/>
      </linearGradient>
      <linearGradient id="cheetah" x1="0" x2="1" y1="0" y2="1">
        <stop offset="0" stop-color="#f5c378"/><stop offset=".5" stop-color="#e09842"/><stop offset="1" stop-color="#a8651e"/>
      </linearGradient>
      <linearGradient id="cheetahDark" x1="0" x2="0" y1="0" y2="1">
        <stop offset="0" stop-color="#7a4a18"/><stop offset="1" stop-color="#3d2410"/>
      </linearGradient>
      <linearGradient id="gold" x1="0" x2="1" y1="0" y2="1">
        <stop offset="0" stop-color="#fff2a8"/><stop offset=".4" stop-color="#ffd66b"/><stop offset=".7" stop-color="#c89b3c"/><stop offset="1" stop-color="#7c5a16"/>
      </linearGradient>
      <linearGradient id="goldHi" x1="0" x2="0" y1="0" y2="1">
        <stop offset="0" stop-color="#ffffffaa"/><stop offset=".5" stop-color="#ffffff33"/><stop offset="1" stop-color="#ffffff00"/>
      </linearGradient>
      <linearGradient id="grassG" x1="0" x2="0" y1="0" y2="1">
        <stop offset="0" stop-color="#3a8b2a"/><stop offset="1" stop-color="#1a3d12"/>
      </linearGradient>
      <radialGradient id="ballG" cx=".4" cy=".4">
        <stop offset="0" stop-color="#ffffff"/><stop offset=".5" stop-color="#dddddd"/><stop offset="1" stop-color="#666"/>
      </radialGradient>
      <radialGradient id="spot" cx=".5" cy=".5">
        <stop offset="0" stop-color="#ffd66b88"/><stop offset="1" stop-color="#ffd66b00"/>
      </radialGradient>
      <!-- speed streak -->
      <linearGradient id="streak" x1="0" x2="1" y1="0" y2="0">
        <stop offset="0" stop-color="#ffd66b" stop-opacity="0"/><stop offset="1" stop-color="#ffd66b" stop-opacity=".7"/>
      </linearGradient>
      <filter id="blur1"><feGaussianBlur stdDeviation="2"/></filter>
      <filter id="blur2"><feGaussianBlur stdDeviation="6"/></filter>
    </defs>

    <!-- sky -->
    <rect width="800" height="800" fill="url(#bgSky)"/>
    <!-- spotlights -->
    <ellipse cx="200" cy="200" rx="280" ry="180" fill="url(#spot)"/>
    <ellipse cx="600" cy="200" rx="280" ry="180" fill="url(#spot)"/>
    <ellipse cx="400" cy="160" rx="320" ry="220" fill="url(#spot)" opacity=".7"/>

    <!-- stadium crowd silhouettes -->
    <g opacity=".55" fill="#1a0a2e">
      <path d="M0 480 L80 440 L120 460 L160 430 L200 470 L260 440 L300 470 L360 430 L420 470 L500 440 L560 470 L620 430 L680 470 L800 440 L800 540 L0 540 Z"/>
      <g fill="#0a0420">
        <circle cx="60" cy="430" r="10"/><circle cx="100" cy="425" r="10"/><circle cx="140" cy="430" r="10"/><circle cx="180" cy="425" r="10"/>
        <circle cx="220" cy="430" r="10"/><circle cx="260" cy="425" r="10"/><circle cx="300" cy="430" r="10"/><circle cx="340" cy="425" r="10"/>
        <circle cx="380" cy="430" r="10"/><circle cx="420" cy="425" r="10"/><circle cx="460" cy="430" r="10"/><circle cx="500" cy="425" r="10"/>
        <circle cx="540" cy="430" r="10"/><circle cx="580" cy="425" r="10"/><circle cx="620" cy="430" r="10"/><circle cx="660" cy="425" r="10"/>
        <circle cx="700" cy="430" r="10"/><circle cx="740" cy="425" r="10"/>
      </g>
    </g>

    <!-- ribbons -->
    <g opacity=".5" stroke-linecap="round" fill="none" stroke-width="3">
      <path d="M-20 100 Q200 60 400 120 T820 80" stroke="#ffd66b"/>
      <path d="M-20 140 Q200 100 400 160 T820 120" stroke="#ff6ec7"/>
      <path d="M-20 180 Q200 140 400 200 T820 160" stroke="#5cb6ff"/>
    </g>

    <!-- ground -->
    <path d="M0 580 L800 540 L800 800 L0 800 Z" fill="url(#grassG)"/>
    <!-- grass tufts -->
    <g stroke="#2a5b1f" stroke-width="2" fill="none" opacity=".8">
      <path d="M40 600 L70 580"/><path d="M50 605 L80 585"/><path d="M120 595 L150 575"/><path d="M680 565 L720 545"/><path d="M730 570 L770 550"/>
    </g>

    <!-- speed streaks behind runner -->
    <g class="runner">
      <g opacity=".7">
        <rect x="60" y="380" width="120" height="3" rx="2" fill="url(#streak)"/>
        <rect x="40" y="420" width="180" height="2" rx="1" fill="url(#streak)"/>
        <rect x="20" y="460" width="220" height="2" rx="1" fill="url(#streak)"/>
        <rect x="60" y="500" width="140" height="3" rx="2" fill="url(#streak)"/>
        <rect x="40" y="540" width="200" height="2" rx="1" fill="url(#streak)"/>
      </g>

      <!-- dust kicked up -->
      <g fill="#ffd66b" opacity=".4">
        <circle cx="220" cy="600" r="22" filter="url(#blur2)"/>
        <circle cx="160" cy="620" r="16" filter="url(#blur2)"/>
        <circle cx="100" cy="640" r="12" filter="url(#blur2)"/>
      </g>

      <!-- CHEETAH BODY -->
      <g transform="translate(440 480)">
        <!-- back legs (rear, planted/pushing off) -->
        <path d="M-10 60 Q-40 100 -90 130 Q-130 145 -150 130 Q-120 110 -80 95 Q-50 75 -10 50 Z" fill="url(#cheetahDark)"/>
        <path d="M-10 50 Q-50 80 -110 110 Q-140 118 -150 105 Q-110 90 -60 65 Z" fill="url(#cheetah)" opacity=".7"/>
        <!-- rear haunch -->
        <path d="M0 0 Q-50 -10 -100 30 Q-130 50 -120 70 Q-90 50 -50 30 Q-20 20 5 10 Z" fill="url(#cheetah)"/>
        <!-- tail sweeping back -->
        <path d="M-90 30 Q-180 -10 -280 5 Q-330 12 -360 30 Q-310 22 -260 30 Q-200 40 -150 50 Q-120 55 -90 50 Z" fill="url(#cheetah)" stroke="#7a4a18" stroke-width="1"/>
        <path d="M-180 -5 Q-220 -8 -260 -2 Q-300 5 -340 18" stroke="#3d2410" stroke-width="1.5" fill="none"/>
        <!-- tail tip -->
        <ellipse cx="-340" cy="22" rx="20" ry="14" fill="#3d2410"/>

        <!-- main body (long lean) -->
        <path d="M-10 10 Q40 -20 110 -10 Q170 0 200 30 Q210 60 180 80 Q140 90 80 90 Q20 90 -10 80 Q-40 70 -40 40 Q-40 15 -10 10 Z" fill="url(#cheetah)"/>

        <!-- spots -->
        <g fill="#3d2410">
          <ellipse cx="20" cy="20" rx="3" ry="2"/><ellipse cx="40" cy="40" rx="3" ry="2.4"/><ellipse cx="60" cy="18" rx="2.5" ry="2"/>
          <ellipse cx="80" cy="38" rx="3" ry="2.4"/><ellipse cx="100" cy="22" rx="2.5" ry="2"/><ellipse cx="120" cy="40" rx="3" ry="2.2"/>
          <ellipse cx="140" cy="24" rx="2.8" ry="2"/><ellipse cx="160" cy="44" rx="3" ry="2.2"/><ellipse cx="35" cy="60" rx="2.5" ry="1.8"/>
          <ellipse cx="70" cy="65" rx="2.5" ry="1.8"/><ellipse cx="115" cy="62" rx="2.5" ry="1.8"/><ellipse cx="155" cy="60" rx="2.5" ry="1.8"/>
          <ellipse cx="50" cy="78" rx="2" ry="1.5"/><ellipse cx="100" cy="80" rx="2" ry="1.5"/><ellipse cx="140" cy="80" rx="2" ry="1.5"/>
        </g>

        <!-- chest/belly highlight -->
        <path d="M10 60 Q70 88 150 78 Q170 70 160 55 Q110 70 50 64 Z" fill="#f5d6a0" opacity=".7"/>

        <!-- front leg (bent, planted) -->
        <path d="M150 60 Q165 110 145 160 Q138 175 150 178 Q165 165 175 130 Q180 100 175 60 Z" fill="url(#cheetahDark)"/>
        <!-- front leg paw -->
        <ellipse cx="155" cy="178" rx="14" ry="6" fill="#3d2410"/>

        <!-- second front leg raised forward -->
        <path d="M170 60 Q200 50 230 60 Q250 70 245 90 Q220 80 195 85 Q175 90 170 80 Z" fill="url(#cheetah)" />
        <!-- raised paw -->
        <ellipse cx="240" cy="80" rx="11" ry="6" fill="#3d2410" transform="rotate(15 240 80)"/>

        <!-- HEAD + NECK -->
        <g transform="translate(195 -8)">
          <!-- neck -->
          <path d="M-15 10 Q-30 0 -50 0 L-30 30 L-5 25 Z" fill="url(#cheetah)"/>
          <!-- skull -->
          <path d="M0 0 Q-10 -50 30 -60 Q70 -65 90 -40 Q100 -20 90 0 Q80 18 50 22 Q15 22 0 10 Z" fill="url(#cheetah)"/>
          <!-- spots on head -->
          <g fill="#3d2410">
            <ellipse cx="20" cy="-30" rx="2.5" ry="2"/><ellipse cx="50" cy="-40" rx="3" ry="2.2"/>
            <ellipse cx="70" cy="-20" rx="2.5" ry="2"/>
          </g>
          <!-- ears -->
          <path d="M0 -50 Q-8 -70 8 -75 Q20 -68 14 -50 Z" fill="url(#cheetah)"/>
          <path d="M5 -56 Q4 -64 12 -68" stroke="#ff6ec7" stroke-width="3" fill="none" stroke-linecap="round"/>
          <path d="M65 -50 Q75 -70 90 -65 Q92 -50 80 -42 Z" fill="url(#cheetah)"/>
          <path d="M72 -55 Q80 -64 86 -58" stroke="#ff6ec7" stroke-width="3" fill="none" stroke-linecap="round"/>

          <!-- face: black tear marks -->
          <path d="M28 -20 Q26 -8 30 8 Q34 -2 32 -16 Z" fill="#1a0a04"/>
          <path d="M52 -20 Q56 -8 54 8 Q48 -2 50 -16 Z" fill="#1a0a04"/>

          <!-- eye -->
          <ellipse cx="34" cy="-8" rx="5" ry="6" fill="#fff"/>
          <circle cx="35" cy="-7" r="3" fill="#3d2410"/>
          <circle cx="35" cy="-7" r="1.6" fill="#1a0a04"/>
          <circle cx="36" cy="-9" r="1" fill="#fff"/>

          <!-- snout / nose -->
          <path d="M65 5 Q80 8 88 0 Q90 12 78 18 Q66 18 60 12 Z" fill="#fff5e0"/>
          <path d="M70 4 Q80 0 85 6 Q80 12 72 10 Z" fill="#1a0a04"/>
          <!-- mouth -->
          <path d="M70 14 Q75 20 82 18" stroke="#1a0a04" stroke-width="1.5" fill="none" stroke-linecap="round"/>
          <!-- whiskers -->
          <g stroke="#fff" stroke-width="1" fill="none" opacity=".7" stroke-linecap="round">
            <path d="M55 10 L20 4"/><path d="M55 14 L18 14"/><path d="M55 18 L20 24"/>
          </g>
          <!-- jaw highlight -->
          <path d="M30 10 Q50 22 80 16" stroke="#f5d6a0" stroke-width="2" fill="none" opacity=".7"/>
        </g>

        <!-- ARMS holding trophy up -->
        <g>
          <!-- left arm raised -->
          <path d="M180 30 Q200 -10 215 -50 Q220 -70 235 -80" stroke="url(#cheetah)" stroke-width="14" fill="none" stroke-linecap="round"/>
          <!-- right arm raised -->
          <path d="M170 35 Q190 0 220 -45 Q235 -75 250 -85" stroke="url(#cheetah)" stroke-width="14" fill="none" stroke-linecap="round"/>
          <!-- paws -->
          <ellipse cx="232" cy="-82" rx="9" ry="6" fill="#3d2410" transform="rotate(-30 232 -82)"/>
          <ellipse cx="252" cy="-86" rx="9" ry="6" fill="#3d2410" transform="rotate(-15 252 -86)"/>
        </g>

        <!-- TROPHY (FIFA-style: gold cup + globe + figures + green base) -->
        <g transform="translate(235 -110)">
          <!-- glow halo behind trophy -->
          <circle cx="0" cy="0" r="60" fill="#ffd66b" opacity=".25" filter="url(#blur2)"/>

          <!-- cup body (rounded) -->
          <path d="M-22 -30 Q-30 0 -22 30 Q-15 50 0 55 Q15 50 22 30 Q30 0 22 -30 Q15 -45 0 -45 Q-15 -45 -22 -30 Z" fill="url(#gold)"/>
          <!-- cup rim -->
          <ellipse cx="0" cy="-30" rx="22" ry="6" fill="#fff2a8"/>
          <ellipse cx="0" cy="-28" rx="22" ry="3" fill="#c89b3c"/>
          <!-- handles -->
          <path d="M-22 -20 Q-40 -10 -34 8 Q-30 18 -20 16" stroke="url(#gold)" stroke-width="6" fill="none"/>
          <path d="M22 -20 Q40 -10 34 8 Q30 18 20 16" stroke="url(#gold)" stroke-width="6" fill="none"/>
          <!-- globe -->
          <circle cx="0" cy="14" r="20" fill="url(#gold)"/>
          <g stroke="#7c5a16" stroke-width="1" fill="none" opacity=".6">
            <ellipse cx="0" cy="14" rx="20" ry="6"/>
            <ellipse cx="0" cy="14" rx="20" ry="12"/>
            <line x1="-20" y1="14" x2="20" y2="14"/>
            <line x1="0" y1="-6" x2="0" y2="34"/>
            <path d="M-14 0 Q-6 -2 0 0 Q6 2 14 0" />
            <path d="M-14 28 Q-6 30 0 28 Q6 26 14 28" />
          </g>
          <!-- two figures embracing -->
          <g fill="#7c5a16" opacity=".8">
            <path d="M-6 8 Q-8 14 -6 22 L-2 22 L-2 14 Q-2 10 -6 8 Z"/>
            <path d="M6 8 Q8 14 6 22 L2 22 L2 14 Q2 10 6 8 Z"/>
          </g>
          <!-- base -->
          <rect x="-26" y="36" width="52" height="8" rx="2" fill="url(#gold)"/>
          <rect x="-30" y="44" width="60" height="6" rx="2" fill="#7c5a16"/>
          <!-- engraving plate -->
          <rect x="-16" y="46" width="32" height="6" rx="1" fill="#1a0a04"/>
          <text x="0" y="51" font-size="5" fill="#ffd66b" text-anchor="middle" font-family="serif" font-weight="700">CHAMPIONS · FINAL</text>
          <!-- highlights -->
          <path d="M-16 -20 Q-18 0 -10 22" stroke="url(#goldHi)" stroke-width="6" fill="none" stroke-linecap="round"/>
        </g>

        <!-- motion energy ribbons -->
        <g opacity=".5">
          <path d="M180 70 Q120 80 60 110" stroke="#ffd66b" stroke-width="2" fill="none"/>
          <path d="M180 90 Q100 100 30 140" stroke="#ff6ec7" stroke-width="1.6" fill="none"/>
        </g>
      </g>
    </g>

    <!-- football in foreground -->
    <g transform="translate(680 640) rotate(15)">
      <circle cx="0" cy="0" r="36" fill="url(#ballG)"/>
      <g fill="#1a0a04">
        <polygon points="0,-14 6,-6 14,-9 8,-2 16,4 8,7 6,16 -2,11 -10,15 -7,6 -14,2 -6,-3 -10,-10 -2,-9"/>
        <polygon points="-14,8 -7,12 -3,18 -10,18 -16,14"/>
        <polygon points="14,8 7,12 3,18 10,18 16,14"/>
      </g>
      <ellipse cx="-8" cy="-10" rx="6" ry="4" fill="#ffffffcc"/>
    </g>

    <!-- grass details -->
    <g stroke="#2a5b1f" stroke-width="2" fill="none" opacity=".7">
      <path d="M260 660 L280 640"/><path d="M270 665 L290 645"/><path d="M310 670 L330 650"/>
      <path d="M380 690 L400 670"/><path d="M420 700 L440 680"/><path d="M520 700 L540 680"/>
      <path d="M620 720 L640 700"/>
    </g>
  </svg>

  <div class="scoreboard">
    <span class="t">90+7'</span>
    <span class="v">3 : 2</span>
    <span class="t">FULL TIME</span>
  </div>
  <div class="vignette"></div>
</div>
</body>
</html>
