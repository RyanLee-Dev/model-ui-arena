<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>GOLDEN SPRINT · 猎豹托举大力神杯</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{min-height:100svh;display:grid;place-items:center;padding:16px;background:#05070e;
  font-family:-apple-system,"SF Pro Display","PingFang SC","Microsoft YaHei",system-ui,sans-serif}
.poster{width:min(900px,100%);border-radius:18px;overflow:hidden;
  box-shadow:0 34px 90px rgba(0,0,0,.75),0 0 0 1px rgba(255,210,130,.16)}
svg{display:block;width:100%;height:auto}
/* 动效：聚光灯呼吸 / 彩带飘落 / 足球滚动 / 速度线推进 / 杯身高光扫掠 / 星火闪烁——首帧即完整构图 */
@keyframes beam{0%,100%{opacity:.18}50%{opacity:.40}}
@keyframes fall{to{transform:translateY(1360px) rotate(760deg)}}
@keyframes roll{to{transform:rotate(360deg)}}
@keyframes dash{to{stroke-dashoffset:-260}}
@keyframes sheen{0%{transform:translateX(-150px)}55%,100%{transform:translateX(210px)}}
@keyframes twinkle{0%,100%{opacity:.2;transform:scale(.65)}50%{opacity:1;transform:scale(1.2)}}
.beam{animation:beam 5s ease-in-out infinite}
.beam:nth-of-type(2){animation-delay:-1.7s}.beam:nth-of-type(3){animation-delay:-3.1s}
.conf{animation:fall linear infinite}
.ball{transform-box:fill-box;transform-origin:center;animation:roll 1.15s linear infinite}
.speed{stroke-dasharray:74 44;animation:dash 1.1s linear infinite}
.sheen{animation:sheen 4.6s ease-in-out infinite}
.spark{transform-box:fill-box;transform-origin:center;animation:twinkle 2.4s ease-in-out infinite}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>
<main class="poster">
<svg viewBox="0 0 900 1200" role="img" aria-label="猎豹高举大力神杯冲刺夺冠海报">
<title>90+7 分钟绝杀夺冠：猎豹托举金杯冲刺</title>
<defs>
  <!-- ========== 渐变与滤镜 ========== -->
  <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#04081a"/><stop offset=".5" stop-color="#0d1836"/><stop offset="1" stop-color="#17264e"/>
  </linearGradient>
  <radialGradient id="glow" cx="52%" cy="30%" r="62%">
    <stop offset="0" stop-color="#5b8ae0" stop-opacity=".5"/><stop offset="1" stop-color="#5b8ae0" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="beamG" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#dbe9ff" stop-opacity=".6"/><stop offset="1" stop-color="#dbe9ff" stop-opacity="0"/>
  </linearGradient>
  <linearGradient id="pitch" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#1d7a44"/><stop offset="1" stop-color="#0a3f22"/>
  </linearGradient>
  <linearGradient id="belly" x1=".2" y1="0" x2=".8" y2="1">
    <stop offset="0" stop-color="#fff6e2" stop-opacity=".9"/><stop offset=".55" stop-color="#ffdf9e" stop-opacity=".25"/>
    <stop offset="1" stop-color="#a85f0d" stop-opacity=".45"/>
  </linearGradient>
  <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#fff6cf"/><stop offset=".24" stop-color="#ffd469"/>
    <stop offset=".5" stop-color="#bd8014"/><stop offset=".72" stop-color="#ffe28f"/><stop offset="1" stop-color="#9c6510"/>
  </linearGradient>
  <linearGradient id="gold2" x1="0" y1="1" x2="1" y2="0">
    <stop offset="0" stop-color="#a56d11"/><stop offset=".45" stop-color="#ffd977"/><stop offset="1" stop-color="#fff8de"/>
  </linearGradient>
  <radialGradient id="globeG" cx="33%" cy="28%" r="80%">
    <stop offset="0" stop-color="#fff9dd"/><stop offset=".48" stop-color="#ffcd57"/><stop offset="1" stop-color="#8f5f0c"/>
  </radialGradient>
  <linearGradient id="jerseyG" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#2a4c8f"/><stop offset=".55" stop-color="#16305e"/><stop offset="1" stop-color="#0a1a38"/>
  </linearGradient>
  <linearGradient id="speedG" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="320" y2="0">
    <stop offset="0" stop-color="#ffd27f" stop-opacity="0"/><stop offset="1" stop-color="#ffd27f" stop-opacity=".9"/>
  </linearGradient>
  <linearGradient id="rimG" gradientUnits="userSpaceOnUse" x1="400" y1="0" x2="620" y2="0">
    <stop offset="0" stop-color="#fff3cc" stop-opacity="0"/><stop offset="1" stop-color="#fff3cc" stop-opacity=".55"/>
  </linearGradient>
  <linearGradient id="boardG" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#122242"/><stop offset="1" stop-color="#060c1c"/>
  </linearGradient>
  <filter id="soft" x="-45%" y="-45%" width="190%" height="190%"><feGaussianBlur stdDeviation="16"/></filter>
  <filter id="softS" x="-45%" y="-45%" width="190%" height="190%"><feGaussianBlur stdDeviation="5"/></filter>
  <filter id="drop" x="-30%" y="-30%" width="170%" height="170%">
    <feDropShadow dx="-6" dy="18" stdDeviation="14" flood-color="#01100a" flood-opacity=".6"/>
  </filter>
  <filter id="goldGlow" x="-60%" y="-60%" width="220%" height="220%">
    <feGaussianBlur stdDeviation="12" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>

  <!-- ========== 猎豹骨架：肢体用圆头粗描边，只定义一次；本体 / 遮罩 / 残影三处复用 ==========
       未设 stroke，颜色由引用处的父级 g 提供，避免 currentColor 无法承载渐变的问题 -->
  <g id="rig" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M352 690 C 262 656 168 664 118 716 C 84 752 88 812 128 838" stroke-width="30"/>  <!-- 尾根→尾中 -->
    <path d="M128 838 C 150 850 176 842 186 822" stroke-width="17"/>                          <!-- 尾尖 -->
    <path d="M366 676 L 286 800" stroke-width="70"/>                                          <!-- 后大腿（蹬地） -->
    <path d="M286 800 L 232 892" stroke-width="42"/>                                          <!-- 后小腿 -->
    <path d="M232 892 L 186 924" stroke-width="26"/>                                          <!-- 后脚掌 -->
    <path d="M378 664 L 492 646" stroke-width="66"/>                                          <!-- 前大腿（提膝） -->
    <path d="M492 646 L 470 772" stroke-width="40"/>                                          <!-- 前小腿 -->
    <path d="M470 772 L 520 796" stroke-width="26"/>                                          <!-- 前脚掌（腾空） -->
    <path d="M370 672 L 452 478" stroke-width="122"/>                                         <!-- 躯干（前倾） -->
    <path d="M452 478 L 476 416" stroke-width="76"/>                                          <!-- 颈 -->
    <path d="M448 490 L 520 418 L 578 322" stroke-width="30"/>                                <!-- 远侧手臂 -->
    <path d="M466 476 L 556 424 L 634 340" stroke-width="34"/>                                <!-- 近侧手臂 -->
  </g>
  <mask id="furMask"><g stroke="#fff" fill="none"><use href="#rig"/><use href="#head"/></g></mask>

  <!-- ========== 猫科头部：颅骨 + 吻部 + 耳朵（细节另绘于上层） ========== -->
  <g id="head" transform="translate(470,382) rotate(-14)">
    <ellipse cx="0" cy="0" rx="56" ry="50"/>
    <ellipse cx="52" cy="14" rx="38" ry="30"/>
    <path d="M-30 -40 C -46 -70 -40 -92 -18 -88 C 0 -84 6 -62 4 -42 Z"/>
    <path d="M20 -46 C 12 -78 26 -96 46 -88 C 62 -80 62 -58 52 -42 Z"/>
  </g>

  <!-- ========== 大力神杯：绿色底座 + 双人托举螺旋 + 地球 ========== -->
  <g id="trophy">
    <ellipse cx="0" cy="212" rx="50" ry="12" fill="#05240f" opacity=".65"/>
    <path d="M-46 176 h92 a10 10 0 0 1 10 10 v12 a10 10 0 0 1 -10 10 h-92 a10 10 0 0 1 -10 -10 v-12 a10 10 0 0 1 10 -10 z" fill="#17683d"/>
    <rect x="-50" y="170" width="100" height="8" rx="3" fill="url(#gold2)"/>
    <path d="M-40 138 h80 a10 10 0 0 1 10 10 v14 a8 8 0 0 1 -8 8 h-84 a8 8 0 0 1 -8 -8 v-14 a10 10 0 0 1 10 -10 z" fill="#1f8a4f"/>
    <path d="M-40 138 h80 a10 10 0 0 1 10 10 v3 h-100 v-3 a10 10 0 0 1 10 -10 z" fill="#33b169"/>
    <rect x="-44" y="130" width="88" height="9" rx="3" fill="url(#gold)"/>
    <!-- 双人托举：两条对称螺旋带，中间留出标志性镂空 -->
    <g fill="url(#gold)">
      <path d="M-6 130 C -30 106 -46 74 -38 40 C -32 12 -16 -8 4 -18 L 4 6 C -8 14 -20 30 -22 50 C -25 78 -12 104 8 124 Z"/>
      <path d="M6 130 C 30 106 46 74 38 40 C 32 12 16 -8 -4 -18 L -4 6 C 8 14 20 30 22 50 C 25 78 12 104 -8 124 Z" opacity=".9"/>
      <path d="M-26 -6 C -20 -22 -6 -30 6 -28 L 4 -8 C -4 -10 -14 -4 -18 6 Z"/>
      <path d="M26 -6 C 20 -22 6 -30 -6 -28 L -4 -8 C 4 -10 14 -4 18 6 Z" opacity=".9"/>
    </g>
    <circle cx="-22" cy="-26" r="11" fill="url(#gold2)"/>
    <circle cx="22" cy="-26" r="11" fill="url(#gold2)"/>
    <!-- 地球 -->
    <circle cx="0" cy="-70" r="44" fill="url(#globeG)"/>
    <g fill="none" stroke="#8a5c0d" stroke-width="1.8" opacity=".6">
      <ellipse cx="0" cy="-70" rx="44" ry="16"/><ellipse cx="0" cy="-70" rx="44" ry="31"/>
      <ellipse cx="0" cy="-70" rx="16" ry="44"/><ellipse cx="0" cy="-70" rx="31" ry="44"/><path d="M-44 -70 h88"/>
    </g>
    <path d="M-28 -88 c 10 -6 17 2 25 -2 c 8 -4 13 3 17 0 l -2 13 c -8 6 -17 0 -25 4 c -9 4 -13 -4 -19 -2 z" fill="#b8830f" opacity=".5"/>
    <path d="M-20 -52 c 8 2 11 7 19 7 c 6 0 9 -4 15 -2 l -4 11 c -9 4 -15 -2 -23 -2 c -5 0 -7 4 -11 2 z" fill="#b8830f" opacity=".45"/>
    <ellipse cx="-15" cy="-85" rx="12" ry="8" fill="#fffbe8" opacity=".7" transform="rotate(-24 -15 -85)"/>
    <g clip-path="url(#trophyClip)"><rect class="sheen" x="-130" y="-120" width="40" height="350" fill="#fff" opacity=".2"/></g>
  </g>
  <clipPath id="trophyClip"><path d="M-70 -118 h140 v336 h-140 z"/></clipPath>
  <clipPath id="posterClip"><rect width="900" height="1200"/></clipPath>
</defs>

<g clip-path="url(#posterClip)">
  <!-- ========== 夜空与场馆 ========== -->
  <rect width="900" height="1200" fill="url(#sky)"/>
  <rect width="900" height="1200" fill="url(#glow)"/>
  <g>
    <rect x="56" y="50" width="140" height="16" rx="6" fill="#0e1a34"/>
    <rect x="704" y="50" width="140" height="16" rx="6" fill="#0e1a34"/>
    <g fill="#ffeeb8">
      <circle cx="80" cy="58" r="7"/><circle cx="108" cy="58" r="7"/><circle cx="136" cy="58" r="7"/><circle cx="164" cy="58" r="7"/>
      <circle cx="728" cy="58" r="7"/><circle cx="756" cy="58" r="7"/><circle cx="784" cy="58" r="7"/><circle cx="812" cy="58" r="7"/>

  </g>
  <polygon class="beam" points="122,62 40,720 320,720" fill="url(#beamG)"/>
  <polygon class="beam" points="770,62 580,720 880,720" fill="url(#beamG)"/>
  <polygon class="beam" points="450,36 300,730 640,730" fill="url(#beamG)" opacity=".16"/>

  <!-- ========== 观众席 ========== -->

    <path d="M0 296 L 900 236 L 900 690 L 0 730 Z" fill="#0a1226"/>
    <path d="M0 296 L 900 236 L 900 266 L 0 326 Z" fill="#17284d"/>
    <g fill="#1c2d55">

  </g>

  <!-- ========== 草皮 ========== -->
  <g>
    <path d="M0 726 L 900 686 L 900 1200 L 0 1200 Z" fill="url(#pitch)"/>
    <g opacity=".45" fill="#0c522c">
      <path d="M40 706 L 150 702 L 250 1200 L 20 1200 Z"/>
      <path d="M380 690 L 490 686 L 640 1200 L 460 1200 Z"/>
      <path d="M720 686 L 830 682 L 900 1200 L 830 1200 Z"/>

    <path d="M0 726 L 900 686 L 900 700 L 0 740 Z" fill="#41b06c" opacity=".45"/>
    <path d="M0 872 C 250 840 640 836 900 866" fill="none" stroke="#eafff2" stroke-width="5" opacity=".22"/>
    <ellipse cx="330" cy="946" rx="230" ry="42" fill="#052a15" opacity=".5" filter="url(#soft)"/>
  </g>

  <!-- ========== 比分牌 ========== -->
  <g transform="translate(52,92)" filter="url(#drop)">
    <rect width="300" height="152" rx="18" fill="url(#boardG)" stroke="#3f5f9e" stroke-width="2"/>
    <rect x="14" y="14" width="272" height="36" rx="10" fill="#060d1e" opacity=".7"/>
    <text x="32" y="40" font-size="22" font-weight="700" fill="#ffd97a" letter-spacing="4">FINAL</text>
    <text x="268" y="40" font-size="23" font-weight="800" fill="#ff6b6b" text-anchor="end" letter-spacing="2">90+7'</text>
    <text x="34" y="106" font-size="27" font-weight="800" fill="#a8bfe6" letter-spacing="2">CHT</text>
    <text x="150" y="112" font-size="52" font-weight="900" fill="#fff" text-anchor="middle" letter-spacing="3">3:2</text>
    <text x="266" y="106" font-size="27" font-weight="800" fill="#8ea4c9" text-anchor="end" letter-spacing="2">RVL</text>
    <text x="150" y="140" font-size="16" font-weight="700" fill="#7f97c4" text-anchor="middle" letter-spacing="5">补时绝杀 · WINNER</text>
  </g>

  <!-- ========== 速度线与残影 ========== -->
  <g stroke="url(#speedG)" stroke-linecap="round" fill="none" opacity=".8">
    <path class="speed" d="M18 470 H 300" stroke-width="7"/>
    <path class="speed" d="M0 552 H 252" stroke-width="5" style="animation-delay:-.35s"/>
    <path class="speed" d="M36 630 H 300" stroke-width="8" style="animation-delay:-.7s"/>
    <path class="speed" d="M0 706 H 214" stroke-width="4" style="animation-delay:-.2s"/>
    <path class="speed" d="M54 782 H 300" stroke-width="6" style="animation-delay:-.55s"/>
    <path class="speed" d="M8 856 H 246" stroke-width="5" style="animation-delay:-.9s"/>
  </g>
  <g stroke="#ffcf7a" fill="#ffcf7a" opacity=".085"><use href="#rig" transform="translate(-168,20)"/><use href="#head" transform="translate(-168,20)"/></g>
  <g stroke="#ffc25e" fill="#ffc25e" opacity=".14"><use href="#rig" transform="translate(-88,10)"/><use href="#head" transform="translate(-88,10)"/></g>

  <!-- ========== 猎豹本体 ========== -->
  <g filter="url(#drop)">
    <g stroke="#eda23a" fill="#eda23a"><use href="#rig"/><use href="#head"/></g>
    <!-- 明暗 / 腹部浅色 / 斑点：统统被 furMask 裁进身体轮廓 -->
    <g mask="url(#furMask)">
      <rect width="900" height="1200" fill="url(#belly)" opacity=".85"/>
      <ellipse cx="392" cy="622" rx="118" ry="76" fill="#fff0cd" opacity=".55" transform="rotate(-56 392 622)"/>
      <ellipse cx="470" cy="392" rx="52" ry="42" fill="#fff4dc" opacity=".5"/>
      <rect width="900" height="1200" fill="url(#rimG)" opacity=".5"/>
      <g id="spots" fill="#2b1a0d"></g>
      <path d="M150 838 c 22 16 46 12 60 -8 l 12 14 c -20 26 -54 28 -78 8 z" fill="#2b1a0d" opacity=".95"/>
      <!-- 冠军战袍：沿躯干轴线画，被遮罩自动裁成合身版型 -->
      <g>
        <path d="M374 668 L 452 480" stroke="url(#jerseyG)" stroke-width="126" fill="none"/>
        <path d="M436 512 L 462 486" stroke="#ffd166" stroke-width="120" fill="none" opacity=".95"/>
        <path d="M382 656 L 458 486" stroke="#3a63aa" stroke-width="16" fill="none" opacity=".5"/>
        <text x="412" y="596" font-size="52" font-weight="900" fill="#ffd166" text-anchor="middle"
              transform="rotate(-24 412 596)">10</text>
      </g>
    </g>
  </g>

  <!-- ========== 头部细节 ========== -->
  <g transform="translate(470,382) rotate(-14)">
    <path d="M-30 -40 C -46 -70 -40 -92 -18 -88 C 0 -84 6 -62 4 -42 Z" fill="#d9862a"/>
    <path d="M-26 -46 C -37 -68 -32 -83 -17 -80 C -4 -77 -1 -62 -2 -48 Z" fill="#5f3113"/>
    <path d="M20 -46 C 12 -78 26 -96 46 -88 C 62 -80 62 -58 52 -42 Z" fill="#f2ab3d"/>
    <path d="M24 -50 C 18 -74 28 -87 43 -81 C 55 -76 55 -60 48 -48 Z" fill="#6b3a16"/>
    <ellipse cx="6" cy="-8" rx="44" ry="38" fill="#ffc55e" opacity=".45"/>
    <ellipse cx="52" cy="14" rx="38" ry="30" fill="#ffeccb"/>
    <ellipse cx="30" cy="26" rx="26" ry="20" fill="#ffe0b0" opacity=".7"/>
    <!-- 眼 + 眉骨 -->
    <path d="M8 -18 C 20 -30 44 -28 52 -14 C 40 -2 16 -2 8 -18 Z" fill="#fff8e8"/>
    <ellipse cx="34" cy="-16" rx="11" ry="12" fill="#c8811b"/>
    <ellipse cx="34" cy="-16" rx="4.6" ry="11" fill="#160c04"/>
    <circle cx="38" cy="-21" r="3.4" fill="#fff"/>
    <path d="M2 -26 C 16 -42 44 -40 56 -24" stroke="#7c4315" stroke-width="5" fill="none" stroke-linecap="round"/>
    <!-- 猎豹标志性黑色泪痕：眼角直落嘴角 -->
    <path d="M24 -2 C 26 18 32 36 44 48 L 33 53 C 19 41 13 20 13 0 Z" fill="#1b1006"/>
    <path d="M46 2 C 48 16 52 27 60 35 L 53 40 C 42 32 37 20 36 4 Z" fill="#1b1006" opacity=".55"/>
    <!-- 鼻 / 张口怒吼 -->
    <path d="M72 4 c 12 -4 22 0 24 6 c -6 8 -20 9 -28 3 z" fill="#2a1409"/>
    <path d="M84 16 c -2 10 -10 15 -20 15" stroke="#2a1409" stroke-width="3.4" fill="none" stroke-linecap="round"/>
    <path d="M56 30 C 72 32 86 28 94 20 C 92 46 72 58 52 48 Z" fill="#63121f"/>
    <path d="M60 32 l 10 -2 l 3 10 z" fill="#fff"/><path d="M86 26 l 8 -5 l 1 10 z" fill="#fff"/>
    <path d="M62 46 C 74 50 84 46 90 38 C 88 50 72 58 60 52 Z" fill="#e2617a"/>
    <g fill="#3a2410" opacity=".85">
      <circle cx="58" cy="6" r="2.2"/><circle cx="66" cy="0" r="2"/><circle cx="54" cy="16" r="2"/>
    </g>
    <g stroke="#fff3da" stroke-width="1.8" opacity=".55" fill="none">
      <path d="M84 6 c 18 -8 34 -10 48 -8"/><path d="M86 16 c 18 0 32 6 44 14"/>
    </g>
    <g fill="#2b1a0d" opacity=".9">
      <ellipse cx="-30" cy="-16" rx="9" ry="7"/><ellipse cx="-8" cy="-34" rx="8" ry="6"/>
      <ellipse cx="-34" cy="10" rx="8" ry="6"/><ellipse cx="-12" cy="16" rx="7" ry="5.5"/>
      <ellipse cx="14" cy="-40" rx="7" ry="5.5"/><ellipse cx="-46" cy="-2" rx="7" ry="5.5"/>
    </g>
  </g>

  <!-- ========== 双爪与奖杯 ========== -->
  <g>
    <!-- 远侧爪：先画，藏在杯身之后 -->
    <g transform="rotate(-46 578 322)">
      <ellipse cx="578" cy="322" rx="25" ry="19" fill="#d98a26"/>
      <g fill="#c87d1e"><ellipse cx="594" cy="311" rx="8" ry="6"/><ellipse cx="598" cy="322" rx="8" ry="6"/><ellipse cx="594" cy="333" rx="8" ry="6"/></g>
    </g>
    <g filter="url(#goldGlow)"><use href="#trophy" transform="translate(626,168) scale(.92)"/></g>
    <!-- 近侧爪：压在杯座上，肉垫 + 趾节 + 爪尖 -->
    <g transform="rotate(-24 634 340)">
      <ellipse cx="634" cy="340" rx="28" ry="21" fill="#f0a233"/>
      <ellipse cx="628" cy="342" rx="17" ry="12" fill="#ffe0b0" opacity=".55"/>
      <g fill="#ffb84a" stroke="#c07a18" stroke-width="1.6">
        <ellipse cx="656" cy="326" rx="9.5" ry="7"/><ellipse cx="661" cy="340" rx="9.5" ry="7"/><ellipse cx="656" cy="354" rx="9.5" ry="7"/>
      </g>
      <g stroke="#fff6e0" stroke-width="2.4" fill="none" stroke-linecap="round" opacity=".9">
        <path d="M664 322 l 7 -3"/><path d="M669 339 l 8 0"/><path d="M664 358 l 7 3"/>
      </g>
      <ellipse cx="620" cy="328" rx="7" ry="9" fill="#e0942c" transform="rotate(-30 620 328)"/>
    </g>
  </g>

  <!-- ========== 彩带 / 星火 / 草屑 ========== -->
  <g id="confetti"></g>
  <g id="sparks" fill="#fff6cf"></g>
  <g id="divots"></g>

  <!-- ========== 滚动足球 ========== -->
  <g transform="translate(742,978)">
    <ellipse cx="4" cy="46" rx="44" ry="11" fill="#03301a" opacity=".55" filter="url(#softS)"/>
    <g class="ball">
      <circle r="42" fill="#fbfdff"/><circle r="42" fill="none" stroke="#c9d6e4" stroke-width="2"/>
      <path d="M0 -20 l 19 14 l -7 22 h-24 l -7 -22 z" fill="#16203a"/>

<script>
// 观众 / 彩带 / 星火 / 草屑 / 皮毛斑点由脚本批量生成：固定种子伪随机，构图每次一致
(function(){
  const NS="http://www.w3.org/2000/svg";
  let seed=20260725;
  const rnd=()=>((seed=seed*48271%2147483647)/2147483647);
  const el=(t,a)=>{const n=document.createElementNS(NS,t);for(const k in a)n.setAttribute(k,a[k]);return n;};
  const add=(p,t,a)=>p.appendChild(el(t,a));

  // 斑点沿骨架线段分布，随身体轴线走向排列，越靠肢体末端越小
  const SEG=[[352,690,118,716,13],[118,716,186,822,9],[366,676,286,800,26],[286,800,232,892,15],
             [378,664,492,646,24],[492,646,470,772,14],[370,672,452,478,44],[452,478,476,416,24]];
  const spots=document.getElementById("spots");
  for(const [x1,y1,x2,y2,hw] of SEG){
    const len=Math.hypot(x2-x1,y2-y1), n=Math.max(4,Math.round(len/26));
    const ux=(x2-x1)/len, uy=(y2-y1)/len;
    for(let i=0;i<n;i++){
      const t=(i+.5)/n+(rnd()-.5)*.12, off=(rnd()*2-1)*hw*.86;
      const x=x1+(x2-x1)*t-uy*off, y=y1+(y2-y1)*t+ux*off, r=4.5+rnd()*7*(hw/44+.45);
      add(spots,"ellipse",{cx:x.toFixed(1),cy:y.toFixed(1),rx:r.toFixed(1),ry:(r*.78).toFixed(1),
        transform:`rotate(${(rnd()*180).toFixed(0)} ${x.toFixed(1)} ${y.toFixed(1)})`,opacity:(.82+rnd()*.18).toFixed(2)});
    }
  }

  const crowd=document.getElementById("crowd");
  for(let row=0;row<9;row++){
    const y=316+row*44;
    for(let i=0;i<45;i++){
      const x=10+i*20+rnd()*8, yy=y-58*(x/900)+rnd()*6, hot=rnd();
      add(crowd,"circle",{cx:x.toFixed(1),cy:yy.toFixed(1),r:(5.4-row*.16).toFixed(2),
        fill:hot>.95?"#fff4c8":hot>.88?"#7d93c8":"#2b3d66",opacity:hot>.95?.95:.5});
    }
  }
  const conf=document.getElementById("confetti");
  for(let i=0;i<66;i++){
    const x=rnd()*900, w=6+rnd()*10, h=12+rnd()*20;
    const g=el("g",{class:"conf",style:`animation-duration:${(5+rnd()*7).toFixed(2)}s;animation-delay:${(-rnd()*12).toFixed(2)}s`});
    add(g,"rect",{x:x.toFixed(1),y:(-40-rnd()*300).toFixed(1),width:w.toFixed(1),height:h.toFixed(1),rx:2,
      fill:["#ffd166","#ffe9a8","#f6b93b","#fff3cd","#e8a020"][(rnd()*5)|0],
      opacity:(.55+rnd()*.45).toFixed(2),transform:`rotate(${(rnd()*90-45).toFixed(1)} ${x.toFixed(1)} 0)`});
    conf.appendChild(g);
  }
  const sparks=document.getElementById("sparks");
  for(let i=0;i<28;i++)
    add(sparks,"circle",{class:"spark",cx:(rnd()*900).toFixed(1),cy:(110+rnd()*740).toFixed(1),
      r:(1.4+rnd()*2.6).toFixed(1),style:`animation-delay:${(-rnd()*3).toFixed(2)}s`});
  const divots=document.getElementById("divots");
  for(let i=0;i<24;i++){                      // 蹬地掀起的草屑，集中在后脚附近
    const x=140+rnd()*260, y=850+rnd()*110, a=(rnd()*360).toFixed(0);
    add(divots,"path",{d:`M${x.toFixed(1)} ${y.toFixed(1)} l ${(6+rnd()*10).toFixed(1)} ${(-4-rnd()*8).toFixed(1)} l 3 6 z`,
      fill:rnd()>.4?"#35a862":"#6d4a22",opacity:(.5+rnd()*.5).toFixed(2),
      transform:`rotate(${a} ${x.toFixed(1)} ${y.toFixed(1)})`});
  }
})();
</script>
