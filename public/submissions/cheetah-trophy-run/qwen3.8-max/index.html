<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FINAL · 绝杀夺冠 — 猎豹托举大力神杯冲刺</title>
<style>
  :root{
    --gold:#e8c15f; --gold-deep:#b9924a; --amber:#ffb43a; --ink:#05070d;
    --display:"Haettenschweiler","Arial Narrow","Impact","Franklin Gothic Medium",sans-serif;
    --serif:Georgia,"Times New Roman","Songti SC","SimSun",serif;
    --mono:"Courier New","Menlo","Consolas",monospace;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{background:var(--ink)}
  body{
    min-height:100vh;
    padding:34px 14px 48px;
    background-color:#05070d;
    background-image:
      radial-gradient(1200px 620px at 50% -12%, rgba(216,168,60,.11), transparent 62%),
      radial-gradient(900px 540px at 88% 108%, rgba(14,92,52,.14), transparent 60%),
      radial-gradient(760px 460px at 4% 78%, rgba(44,66,116,.16), transparent 60%),
      radial-gradient(rgba(255,255,255,.022) 1px, transparent 1px);
    background-size:auto,auto,auto,22px 22px;
    font-family:var(--serif);
    color:#c7cede;
  }
  .stage{max-width:780px;margin:0 auto}

  /* ---- masthead strip ---- */
  .masthead{
    display:flex;align-items:flex-end;justify-content:space-between;gap:12px;
    padding:0 6px 14px;flex-wrap:wrap;
  }
  .masthead .overline{
    display:block;font-family:var(--mono);font-size:10px;letter-spacing:.42em;
    color:#8b94a8;text-transform:uppercase;margin-bottom:6px;
  }
  .masthead h1{
    font-family:var(--display);font-weight:400;
    font-size:clamp(26px,5.6vw,34px);letter-spacing:.06em;line-height:1;
    color:var(--gold);text-shadow:0 0 22px rgba(232,193,95,.28);
  }
  .masthead h1 i{font-style:normal;color:#5d6780;margin:0 .18em}
  .masthead .zh{font-family:var(--serif);font-size:.72em;letter-spacing:.34em;color:#f0d489;margin-left:.3em}
  .chip{
    font-family:var(--mono);font-size:11px;letter-spacing:.14em;color:#ffd479;
    border:1px solid rgba(232,193,95,.42);border-radius:3px;padding:5px 10px;
    background:rgba(232,193,95,.06);white-space:nowrap;
  }

  /* ---- poster card + frame ---- */
  .card{
    background:#0b1220;border:1px solid rgba(212,175,90,.42);border-radius:6px;
    padding:12px;
    box-shadow:0 30px 80px rgba(0,0,0,.66),0 4px 18px rgba(0,0,0,.5),0 0 60px rgba(190,140,50,.07);
    transition:transform .35s ease,box-shadow .35s ease;
  }
  .card:hover{
    transform:translateY(-3px);
    box-shadow:0 40px 96px rgba(0,0,0,.7),0 6px 22px rgba(0,0,0,.55),0 0 80px rgba(210,160,60,.12);
  }
  .frame{border:1px solid rgba(212,175,90,.26);border-radius:3px;background:#070d18;padding:8px}
  svg{display:block;width:100%;height:auto;border-radius:2px}

  /* ---- caption strip ---- */
  .caption{
    display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap;
    padding:13px 6px 0;
  }
  .caption .l{font-size:12.5px;letter-spacing:.12em;color:#98a2b8}
  .caption .l b{color:#d9b968;font-weight:400}
  .caption .r{font-family:var(--mono);font-size:12px;letter-spacing:.18em;color:var(--amber)}

  /* ---- CSS motion (opacity/color only; transforms use SMIL) ---- */
  @keyframes shimmer{from{opacity:.42}to{opacity:.85}}
  @keyframes blink{0%,49%{opacity:1}50%,100%{opacity:.12}}
  @keyframes pulse{0%,100%{opacity:.95}50%{opacity:.35}}
  @keyframes tw{from{opacity:.14}to{opacity:.8}}
  @keyframes driftA{0%{transform:translateY(-26px);opacity:0}12%{opacity:.95}78%{opacity:.9}100%{transform:translateY(168px);opacity:0}}
  @keyframes driftB{0%{transform:translateY(-40px);opacity:0}14%{opacity:.85}80%{opacity:.8}100%{transform:translateY(132px);opacity:0}}
  @keyframes driftC{0%{transform:translateY(-18px);opacity:0}10%{opacity:.9}75%{opacity:.85}100%{transform:translateY(196px);opacity:0}}
  #speed-lines{animation:shimmer 4.6s ease-in-out infinite alternate}
  .blink{animation:blink 1s steps(1) infinite}
  .livedot{animation:pulse 1.6s ease-in-out infinite}
  .tw{animation:tw 3.2s ease-in-out infinite alternate}
  .dA{animation:driftA 7s linear infinite}
  .dB{animation:driftB 9.4s linear infinite}
  .dC{animation:driftC 11.5s linear infinite}

  @media (max-width:430px){
    body{padding:20px 8px 32px}
    .card{padding:8px}.frame{padding:5px}
    .masthead h1{letter-spacing:.04em}
  }
  @media (prefers-reduced-motion:reduce){
    *{animation:none !important;transition:none !important}
  }
</style>
</head>
<body>
<div class="stage">

<script>
(function(){
  var svg = document.querySelector('svg');
  var reduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (reduced){ if (svg && svg.pauseAnimations) svg.pauseAnimations(); return; }

  /* gentle additive golden drift — SVG layer stays a complete poster without it */
  var host = document.getElementById('confetti-dyn');
  if (!host) return;
  var NS = 'http://www.w3.org/2000/svg';
  var palette = ['#f7d778','#e9b93b','#fff3c8','#d9a53f','#2fae6a','#d64541'];
  var classes = ['dA','dB','dC'];
  for (var i = 0; i < 22; i++){
    var g = document.createElementNS(NS,'g');
    g.setAttribute('class', classes[i % 3]);
    g.style.animationDelay = (-(Math.random()*11)).toFixed(2)+'s';
    var r = document.createElementNS(NS,'rect');
    var x = 60 + Math.random()*1080, y = 160 + Math.random()*950;
    var w = 9 + Math.random()*6, h = 5 + Math.random()*4;
    r.setAttribute('x', x.toFixed(0)); r.setAttribute('y', y.toFixed(0));
    r.setAttribute('width', w.toFixed(1)); r.setAttribute('height', h.toFixed(1));
    r.setAttribute('fill', palette[i % palette.length]);
    r.setAttribute('transform','rotate('+((Math.random()*140-70)|0)+' '+(x+w/2).toFixed(0)+' '+(y+h/2).toFixed(0)+')');
    g.appendChild(r); host.appendChild(g);
  }
})();
</script>
