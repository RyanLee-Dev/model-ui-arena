<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>冠军之夜 · 猎豹举杯</title>
<!--
设计说明：
1. 决赛之夜叙事：补时第 90+7 分钟绝杀 3:2 后的夺冠瞬间——猎豹双爪高举大力神杯沿草皮冲刺，金色彩带漫天、聚光灯汇聚、看台闪光灯闪烁。
2. 猎豹识别特征齐备：黑色泪痕、实体与环状斑点、流线型躯干、猫科圆耳头部、长尾后摆成动势弧线；奔跑姿态身体前倾、后腿蹬地。
3. 奖杯关键识别点：金色杯身、地球球体（经纬线）、双人托举轮廓、绿色底座，金属渐变 + 辉光滤镜强化质感。
4. 分层结构：sky / stands / lights / scoreboard / pitch / confetti / speedlines / ghost / cheetah / trophy / ball / grass 全部独立成组并语义命名，CSS 驱动彩带飘落、闪光灯、光束呼吸、足球滚动与速度线流动。
-->
<style>
*{margin:0;padding:0}
body{min-height:100vh;display:grid;place-items:center;background:#05070f;font-family:"PingFang SC",system-ui,sans-serif;padding:12px}
svg{width:min(96vw,1100px);height:auto;display:block;border-radius:18px;box-shadow:0 30px 90px rgba(0,0,0,.6)}
.cf{animation:cfFall linear infinite}
@keyframes cfFall{from{transform:translateY(-60px) rotate(0)}to{transform:translateY(560px) rotate(520deg)}}
.flash{animation:flash 2.6s ease-out infinite}
@keyframes flash{0%,72%,100%{opacity:0}74%{opacity:1}78%{opacity:.1}82%{opacity:.9}90%{opacity:0}}
.beam{animation:beam 5s ease-in-out infinite alternate;transform-origin:top center}
@keyframes beam{from{opacity:.45}to{opacity:.85}}
.sl{stroke-dasharray:60 46;animation:slMove 1.1s linear infinite}
@keyframes slMove{to{stroke-dashoffset:-106}}
.trophyGlow{animation:tg 2.8s ease-in-out infinite alternate}
@keyframes tg{from{opacity:.55}to{opacity:1}}
.ballRoll{animation:ballRoll 3.4s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:center}
@keyframes ballRoll{from{transform:translateX(0) rotate(0)}to{transform:translateX(150px) rotate(660deg)}}
.spark4{animation:spark4 1.8s ease-in-out infinite alternate}
@keyframes spark4{from{opacity:.25;transform:scale(.8)}to{opacity:1;transform:scale(1.15)}}
.live{animation:live 1.2s ease-in-out infinite}
@keyframes live{0%,100%{opacity:1}50%{opacity:.25}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>
<svg viewBox="0 0 1200 800" role="img" aria-label="猎豹高举大力神杯在球场冲刺的冠军海报">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a1030"/><stop offset=".45" stop-color="#132052"/><stop offset="1" stop-color="#1d3a6e"/>
    </linearGradient>
    <linearGradient id="grass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1e7a3c"/><stop offset=".5" stop-color="#1a6a34"/><stop offset="1" stop-color="#0f4d24"/>
    </linearGradient>
    <linearGradient id="fur" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f7c469"/><stop offset=".55" stop-color="#e8a23e"/><stop offset="1" stop-color="#c97f26"/>
    </linearGradient>
    <linearGradient id="furDark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d99a34"/><stop offset="1" stop-color="#a96a1c"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#fff3c4"/><stop offset=".35" stop-color="#f9d34c"/><stop offset=".7" stop-color="#e3a92c"/><stop offset="1" stop-color="#b47d16"/>
    </linearGradient>
    <radialGradient id="globe" cx=".35" cy=".3" r="1">
      <stop offset="0" stop-color="#9fe0ff"/><stop offset=".45" stop-color="#3d9be0"/><stop offset="1" stop-color="#15508f"/>
    </radialGradient>
    <linearGradient id="coneL" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0" stop-color="#fff8e0" stop-opacity=".5"/><stop offset="1" stop-color="#fff8e0" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="vig" cx=".5" cy=".45" r=".85">
      <stop offset=".55" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".5"/>
    </radialGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="6"/></filter>
    <filter id="glowGold" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="crowd" width="34" height="16" patternUnits="userSpaceOnUse">
      <rect width="34" height="16" fill="#0d1733"/>
      <circle cx="5" cy="5" r="2.3" fill="#c8cbe0" opacity=".8"/><circle cx="16" cy="9" r="2.1" fill="#e0b48a" opacity=".7"/>
      <circle cx="27" cy="4" r="2.4" fill="#8aa4d8" opacity=".8"/><circle cx="11" cy="13" r="2" fill="#d88f8f" opacity=".6"/>
      <circle cx="31" cy="12" r="2" fill="#cfe3ff" opacity=".7"/>
    </pattern>
    <clipPath id="ledClip"><rect x="0" y="356" width="1200" height="26"/></clipPath>
  </defs>

  <!-- ======================= 天空与场馆 ======================= -->
  <g id="sky"><rect width="1200" height="800" fill="url(#sky)"/>

    </g>
  </g>

  <g id="stands">
    <path d="M0,330 L1200,190 L1200,356 L0,382 Z" fill="#0c1631"/>
    <path d="M0,330 L1200,190 L1200,356 L0,382 Z" fill="url(#crowd)" opacity=".85"/>
    <path d="M0,382 L1200,356 L1200,386 L0,406 Z" fill="#101d3f"/>

      <circle class="flash" cx="612" cy="306" r="3.2" style="animation-delay:2s"/>

      <circle class="flash" cx="252" cy="318" r="2.6" style="animation-delay:2.4s"/>

    <g clip-path="url(#ledClip)">

      <text x="1210" y="374" fill="#37e08a" font-family="Menlo,monospace" font-size="15" letter-spacing="6" id="ledText">CHAMPIONS FINAL · 决赛之夜 · 90+7' 绝杀 3:2 · CHAMPIONS FINAL · 决赛之夜 · 90+7' 绝杀 3:2 ·
        <animate attributeName="x" from="1210" to="-1130" dur="18s" repeatCount="indefinite"/>
      </text>
    </g>
  </g>

  <!-- 比分牌：90+7' / 3:2 -->
  <g id="scoreboard" transform="translate(64,64)">

    <rect x="0" y="0" width="252" height="34" rx="14" fill="#132441"/>
    <circle class="live" cx="20" cy="17" r="5" fill="#ff5252"/>
    <text x="36" y="23" fill="#cfe0ff" font-size="14" letter-spacing="4" font-weight="600">FINAL · 决赛</text>
    <text x="16" y="92" fill="#ffd766" font-family="Menlo,Consolas,monospace" font-size="44" font-weight="700">90+7'</text>
    <text x="150" y="92" fill="#ffffff" font-family="Menlo,Consolas,monospace" font-size="44" font-weight="700">3:2</text>
    <rect x="16" y="108" width="96" height="24" rx="12" fill="rgba(255,82,82,.16)" stroke="rgba(255,110,110,.7)"/>

  <!-- 聚光灯塔与光束 -->
  <g id="lights">

      <polygon points="128,120 96,236 330,640 470,300" fill="url(#coneL)" filter="url(#soft)" opacity=".5"/>
      <rect x="92" y="86" width="72" height="34" rx="6" fill="#1a2748" stroke="#3b517e"/>
      <g fill="#fff6d8"><circle cx="106" cy="103" r="6"/><circle cx="124" cy="103" r="6"/><circle cx="142" cy="103" r="6"/><circle cx="158" cy="103" r="5"/></g>
      <rect x="122" y="120" width="10" height="90" fill="#16213d"/>
    </g>
    <g class="beam">
      <polygon points="1072,96 1104,212 830,620 700,290" fill="url(#coneL)" filter="url(#soft)" opacity=".5"/>
      <rect x="1036" y="62" width="72" height="34" rx="6" fill="#1a2748" stroke="#3b517e"/>
      <g fill="#fff6d8"><circle cx="1050" cy="79" r="6"/><circle cx="1068" cy="79" r="6"/><circle cx="1086" cy="79" r="6"/><circle cx="1102" cy="79" r="5"/></g>
      <rect x="1066" y="96" width="10" height="90" fill="#16213d"/>

  <!-- 金色彩带 -->

    <rect class="cf" x="840" y="96" width="6" height="12" fill="#ffffff" style="animation-duration:8.4s;animation-delay:-6.8s"/>
    <rect class="cf" x="928" y="200" width="7" height="13" fill="#ffd257" style="animation-duration:5.6s;animation-delay:-.6s" transform="rotate(-14 928 200)"/>
    <rect class="cf" x="1010" y="120" width="6" height="12" fill="#7cc4ff" style="animation-duration:7.1s;animation-delay:-3.6s"/>
    <rect class="cf" x="1096" y="180" width="7" height="12" fill="#ff6b6b" style="animation-duration:6.6s;animation-delay:-2.4s" transform="rotate(16 1096 180)"/>
    <rect class="cf" x="1152" y="88" width="6" height="13" fill="#ffd257" style="animation-duration:7.9s;animation-delay:-5.2s"/>

    <rect class="cf" x="392" y="130" width="7" height="12" fill="#ffd257" style="animation-duration:7.3s;animation-delay:-4.1s" transform="rotate(-22 392 130)"/>
    <rect class="cf" x="508" y="196" width="6" height="12" fill="#ffffff" style="animation-duration:8.2s;animation-delay:-7s"/>
    <rect class="cf" x="610" y="52" width="7" height="13" fill="#7cc4ff" style="animation-duration:5.9s;animation-delay:-.9s" transform="rotate(12 610 52)"/>
    <rect class="cf" x="712" y="150" width="6" height="12" fill="#ffd257" style="animation-duration:7.6s;animation-delay:-5.7s"/>
    <rect class="cf" x="880" y="150" width="7" height="12" fill="#ff6b6b" style="animation-duration:6.4s;animation-delay:-2.8s" transform="rotate(-20 880 150)"/>
    <rect class="cf" x="972" y="66" width="6" height="12" fill="#ffffff" style="animation-duration:8.6s;animation-delay:-6.3s"/>
    <rect class="cf" x="1058" y="216" width="7" height="13" fill="#ffd257" style="animation-duration:6.8s;animation-delay:-1.4s"/>
  </g>

  <!-- ======================= 草皮 ======================= -->
  <g id="pitch">
    <path d="M0,406 L1200,382 L1200,800 L0,800 Z" fill="url(#grass)"/>
    <g fill="#ffffff" opacity=".22">

    <ellipse cx="620" cy="652" rx="270" ry="24" fill="#062d13" opacity=".55" filter="url(#soft)"/>
  </g>

  <!-- 速度残影与速度线 -->
  <g id="speedlines" stroke-linecap="round">
    <line class="sl" x1="150" y1="382" x2="430" y2="392" stroke="#ffe9a8" stroke-width="4" opacity=".8"/>
    <line class="sl" x1="90" y1="440" x2="400" y2="448" stroke="#ffffff" stroke-width="3" opacity=".55" style="animation-duration:1.4s"/>
    <line class="sl" x1="190" y1="498" x2="440" y2="500" stroke="#ffe9a8" stroke-width="3.5" opacity=".7" style="animation-duration:.95s"/>
    <line class="sl" x1="120" y1="552" x2="380" y2="548" stroke="#ffffff" stroke-width="2.6" opacity=".5" style="animation-duration:1.6s"/>

  <path id="ghost" d="M810,395 C790,378 730,382 590,414 C548,424 498,436 484,472 C470,506 520,500 574,492 C640,482 740,462 788,462 C824,458 846,428 838,410 Z

    transform="translate(-96,12)" fill="#0a1830" opacity=".38" filter="url(#soft)"/>

  <!-- ======================= 猎豹（主角） ======================= -->
  <g id="cheetah">
    <!-- 远侧前肢（举杯左爪） -->
    <path d="M798,416 C826,392 842,362 856,318 C864,292 866,272 864,256" fill="none" stroke="url(#furDark)" stroke-width="25" stroke-linecap="round"/>

    <path d="M742,392 C780,384 812,394 820,416 C812,442 776,456 744,456 C760,430 756,406 742,392 Z" fill="#cf8c2a" opacity=".55"/>
    <path d="M498,432 C526,424 552,430 560,452 C556,478 528,492 502,490 C486,474 486,450 498,432 Z" fill="#cf8c2a" opacity=".5"/>

    <path d="M512,452 C500,486 488,516 470,540" fill="none" stroke="#b97b22" stroke-width="8" opacity=".35"/>
    <!-- 蹬地草屑与草痕 -->

      <path d="M452,560 q-12,-8 -22,-8"/><path d="M472,540 q-14,-4 -24,0"/>
    </g>
    <!-- 头部（猫科） -->
    <g id="head">
      <path d="M845,292 C845,262 872,250 894,256 C918,262 932,282 933,302 C934,320 922,332 904,336 C878,341 851,324 845,305 Z" fill="url(#fur)"/>
      <path d="M862,262 L852,234 L880,252 Z" fill="url(#fur)"/><path d="M866,258 L861,243 L875,253 Z" fill="#8a5a17"/>
      <path d="M895,254 L906,228 L916,258 Z" fill="url(#fur)"/><path d="M899,254 L905,240 L910,255 Z" fill="#8a5a17"/>
      <path d="M918,300 C928,300 934,306 933,313 C932,321 922,324 912,321 Z" fill="#fbe4b8"/>

      <circle cx="902" cy="289" r="5.4" fill="#2f9e44"/>

      <path d="M887,300 C889,309 895,316 902,321" fill="none" stroke="#17130c" stroke-width="3.2" stroke-linecap="round" opacity=".8"/>
      <g fill="#5b431f" opacity=".8"><circle cx="876" cy="272" r="1.6"/><circle cx="886" cy="268" r="1.5"/><circle cx="896" cy="270" r="1.4"/><circle cx="912" cy="272" r="1.5"/><circle cx="866" cy="282" r="1.4"/></g>
      <g stroke="#e8d9bd" stroke-width="1.4" opacity=".7"><path d="M920,312 L934,308"/><path d="M920,316 L934,316"/></g>
    </g>
    <!-- 颈部 -->
    <path d="M806,398 C796,378 800,352 818,336 C836,320 856,318 866,330 C852,342 842,362 840,382 C836,398 822,406 806,398 Z" fill="url(#fur)"/>
    <!-- 近侧前肢（举杯右爪） -->

      <circle cx="776" cy="398" r="4.6"/><circle cx="746" cy="388" r="4"/><circle cx="718" cy="402" r="4.4"/><circle cx="688" cy="394" r="3.8"/>
      <circle cx="660" cy="408" r="4.4"/><circle cx="630" cy="400" r="3.8"/><circle cx="602" cy="414" r="4.4"/><circle cx="574" cy="404" r="3.6"/>

      <circle cx="624" cy="440" r="3.8"/><circle cx="588" cy="452" r="4.2"/><circle cx="542" cy="468" r="3.6"/><circle cx="510" cy="462" r="3.4"/>
      <circle cx="758" cy="440" r="3.8"/><circle cx="790" cy="424" r="4.2"/><circle cx="806" cy="446" r="3.6"/>
      <circle cx="492" cy="446" r="3.2"/><circle cx="506" cy="478" r="3.2"/>
