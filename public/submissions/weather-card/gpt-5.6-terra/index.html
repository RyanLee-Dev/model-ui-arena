<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Weather</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;font-family:system-ui;color:white;background:#101c38}.card{width:min(94vw,620px);padding:25px;border-radius:30px;background:linear-gradient(135deg,#3586d4,#1760ad);position:relative;overflow:hidden;box-shadow:0 25px 70px #0006;transition:.5s}.card.rain{background:linear-gradient(135deg,#31475e,#142334)}.sun{position:absolute;width:180px;height:180px;border-radius:50%;background:#ffe28b;right:-35px;top:-55px;box-shadow:0 0 60px #ffdf7188;animation:p 3s infinite alternate}.rain .sun{display:none}.drops{position:absolute;inset:0;pointer-events:none;opacity:0}.rain .drops{opacity:1}.drops i{position:absolute;width:2px;height:24px;background:#d5efff;animation:r 1s linear infinite;left:var(--x);animation-delay:var(--d)}header{display:flex;justify-content:space-between;position:relative;z-index:1}select{border:0;border-radius:20px;padding:8px 14px;font:inherit}.temp{font-size:clamp(80px,18vw,128px);font-weight:200;line-height:1;margin:35px 0 5px;position:relative}.desc{font-size:22px;position:relative}.stats{display:flex;gap:25px;margin:25px 0;position:relative;color:#d9edff}.forecast{display:flex;justify-content:space-between;gap:5px;position:relative;background:#ffffff1b;padding:16px 8px;border-radius:18px}.day{text-align:center;font-size:12px;flex:1}.day b{display:block;font-size:20px;margin:9px 0}.chart{position:absolute;bottom:74px;left:6%;width:88%;height:45px;opacity:.55;fill:none;stroke:#fff;stroke-width:3}@keyframes p{to{transform:scale(1.15);filter:brightness(1.2)}}@keyframes r{to{transform:translateY(400px)}}</style><main class="card" id="card"><div class="sun"></div><div class="drops" id="drops"></div><header><span>LIVE WEATHER</span><select id="city"><option>上海</option><option>北京</option><option>成都</option></select></header><div class="temp" id="temp">26°</div><div class="desc" id="desc">晴朗 · 空气清新</div><div class="stats">💨 <span id="wind">东南风 12 km/h</span>　💧 <span id="hum">湿度 63%</span></div><svg class="chart" viewBox="0 0 500 50"><path d="M0 35L100 20 200 27 300 8 400 19 500 12"/></svg><section class="forecast" id="fc"></section></main><script>for(let i=0;i<32;i++)drops.innerHTML+=`<i style="--x:${Math.random()*100}%;--d:${Math.random()}s"></i>`;let data={上海:[26,'晴朗 · 空气清新',12,63,0],北京:[18,'阵雨 · 记得带伞',18,72,1],成都:[22,'多云 · 微风',8,58,0]},days=['今天','周二','周三','周四','周五'];function show(){let x=data[city.value];temp.textContent=x[0]+'°';desc.textContent=x[1];wind.textContent='风速 '+x[2]+' km/h';hum.textContent='湿度 '+x[3]+'%';card.classList.toggle('rain',x[4]);fc.innerHTML=days.map((d,i)=>`<div class=day>${d}<b>${x[4]&&i<2?'☔':'☀'}</b>${x[0]+i}°<small> / ${x[0]-5+i}°</small></div>`).join('')}city.onchange=show;show()</script></html>
