<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Skyline · 天气卡片</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{min-height:100svh;display:grid;place-items:center;padding:18px;background:#0a0d14;color:#fff;
  font-family:-apple-system,"SF Pro Text","PingFang SC","Microsoft YaHei",system-ui,sans-serif}
.card{position:relative;width:min(354px,100%);border-radius:28px;overflow:hidden;isolation:isolate;
  box-shadow:0 28px 60px rgba(0,0,0,.55);border:1px solid rgba(255,255,255,.14)}
.bg{position:absolute;inset:0;opacity:0;transition:opacity .7s ease;z-index:0}
.bg.on{opacity:1}
canvas{position:absolute;inset:0;width:100%;height:100%;z-index:1;pointer-events:none}
.ui{position:relative;z-index:2;padding:16px 18px 18px;display:flex;flex-direction:column;gap:14px;min-height:520px}
header{display:flex;align-items:center;justify-content:space-between;gap:8px}
.tabs{display:flex;gap:4px;background:rgba(255,255,255,.14);padding:3px;border-radius:99px;backdrop-filter:blur(8px)}
.tabs button{appearance:none;border:0;background:transparent;color:rgba(255,255,255,.72);font:inherit;font-size:12px;
  padding:6px 11px;border-radius:99px;cursor:pointer;transition:.28s;white-space:nowrap}
.tabs button.on{background:rgba(255,255,255,.92);color:#12203a;font-weight:700}
#unit{appearance:none;border:1px solid rgba(255,255,255,.35);background:rgba(255,255,255,.12);color:#fff;font:inherit;
  font-size:12px;font-weight:700;width:44px;height:30px;border-radius:99px;cursor:pointer;backdrop-filter:blur(8px)}
.now{flex:1;display:flex;flex-direction:column;justify-content:center;transition:opacity .32s ease,transform .32s ease}
.now.out{opacity:0;transform:translateY(10px)}
.cond{display:flex;align-items:center;gap:8px;font-size:15px;letter-spacing:.06em;color:rgba(255,255,255,.92)}
.ic{width:26px;height:26px}
.temp{display:flex;align-items:flex-start;font-size:88px;font-weight:200;line-height:.94;letter-spacing:-.045em;margin:6px 0 2px;
  font-variant-numeric:tabular-nums;text-shadow:0 8px 30px rgba(0,0,0,.35)}
.temp i{font-size:26px;font-style:normal;font-weight:400;margin-top:8px;opacity:.85}
.place{font-size:12px;color:rgba(255,255,255,.7);letter-spacing:.1em}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:16px}
.stats div{background:rgba(255,255,255,.13);border:1px solid rgba(255,255,255,.16);border-radius:14px;padding:9px 10px;backdrop-filter:blur(10px)}
.stats span{display:block;font-size:10px;letter-spacing:.16em;color:rgba(255,255,255,.68);text-transform:uppercase}
.stats b{font-size:15px;font-weight:600}
.fc{background:rgba(10,16,30,.30);border:1px solid rgba(255,255,255,.16);border-radius:18px;padding:12px 10px 8px;backdrop-filter:blur(14px)}
.fc h4{font-size:10px;letter-spacing:.2em;color:rgba(255,255,255,.7);margin:0 4px 6px;text-transform:uppercase}
#chart{width:100%;height:56px;display:block}
.days{display:grid;grid-template-columns:repeat(5,1fr);text-align:center;gap:2px;margin-top:4px}
.days div{font-size:11px;color:rgba(255,255,255,.78);line-height:1.55}
.days .d{font-weight:700;color:#fff;font-size:11px;letter-spacing:.04em}
.days .t{font-variant-numeric:tabular-nums}
.days .t b{color:#fff}
.days svg{width:20px;height:20px;margin:1px 0}
@media(max-width:390px){.temp{font-size:76px}.ui{min-height:498px}}
</style>
</head>
<body>
<main class="card">
  <div class="bg" id="bgA"></div><div class="bg" id="bgB"></div>
  <canvas id="fx"></canvas>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
    <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="5" fill="#ffd85e"/>
      <g stroke="#ffd85e" stroke-width="1.8" stroke-linecap="round"><path d="M12 1.5v3M12 19.5v3M1.5 12h3M19.5 12h3M4.5 4.5l2 2M17.5 17.5l2 2M19.5 4.5l-2 2M6.5 17.5l-2 2"/></g></symbol>
    <symbol id="i-rain" viewBox="0 0 24 24"><path d="M7 15a4 4 0 010-8 5.5 5.5 0 0110.5 1.5A3.5 3.5 0 0117 15z" fill="#dbe6f5"/>
      <g stroke="#7fd0ff" stroke-width="2" stroke-linecap="round"><path d="M8 17.5l-1 3M13 17.5l-1 3M18 17.5l-1 3"/></g></symbol>
    <symbol id="i-snow" viewBox="0 0 24 24"><path d="M7 14a4 4 0 010-8 5.5 5.5 0 0110.5 1.5A3.5 3.5 0 0117 14z" fill="#e8f1ff"/>
      <g stroke="#bfe4ff" stroke-width="1.6" stroke-linecap="round"><path d="M8 17l0 4M6.3 18l3.4 2M9.7 18l-3.4 2M16 17l0 4M14.3 18l3.4 2M17.7 18l-3.4 2"/></g></symbol>
    <symbol id="i-cloud" viewBox="0 0 24 24"><path d="M7 18a4.5 4.5 0 01-.4-9A6 6 0 0118 9.6 4.2 4.2 0 0117.6 18z" fill="#d7e2f2"/>
      <path d="M4 7.5a3 3 0 013.6-2.9" stroke="#fff" stroke-width="1.4" fill="none" stroke-linecap="round" opacity=".7"/></symbol>
  </defs></svg>
  <div class="ui">
    <header>
      <div class="tabs" id="tabs"></div>
      <button id="unit">°C</button>
    </header>
    <section class="now" id="now">
      <div class="cond"><svg class="ic"><use id="bigIcon" href="#i-sun"/></svg><span id="desc">晴朗</span></div>
      <div class="temp"><span id="temp">0</span><i id="deg">°C</i></div>
      <div class="place" id="place">—</div>
      <div class="stats">
        <div><span>风速</span><b id="wind">—</b></div>
        <div><span>湿度</span><b id="hum">—</b></div>
        <div><span>体感</span><b id="feel">—</b></div>
      </div>
    </section>
    <section class="fc">
      <h4>未来 5 天 · 高低温走势</h4>
      <svg id="chart" viewBox="0 0 300 56"></svg>
      <div class="days" id="days"></div>
    </section>
  </div>
</main>
<script>
(function(){
  const $=id=>document.getElementById(id), NS="http://www.w3.org/2000/svg";
  const hour=new Date().getHours(), night=hour<6||hour>=18;   // 6-18 白天，其余夜间
  const SKY={
    sun:night?["#101a3a","#2b3a6b","#4b3c72"]:["#38a3ff","#7fc9ff","#ffd9a0"],
    rain:night?["#0d1522","#1e2c3f","#2c4152"]:["#4a5c72","#7b90a8","#a9bccd"],
    snow:night?["#141b2e","#2a3550","#46567a"]:["#8fb3d9","#c3d8ee","#eaf3ff"],
    cloud:night?["#131a2b","#293350","#3d4a6b"]:["#6d8cb0","#9db6d2","#d6e4f2"]
  };
  const CITIES=[
    {n:"深圳",c:"sun",d:"晴朗",t:29,w:12,h:58,f:[[32,25,"sun"],[33,26,"sun"],[30,25,"cloud"],[27,24,"rain"],[29,24,"sun"]]},
    {n:"伦敦",c:"rain",d:"小雨转阵雨",t:11,w:23,h:87,f:[[12,7,"rain"],[10,6,"rain"],[13,8,"cloud"],[15,9,"cloud"],[14,9,"rain"]]},
    {n:"哈尔滨",c:"snow",d:"中雪",t:-14,w:17,h:74,f:[[-11,-19,"snow"],[-9,-17,"snow"],[-6,-14,"cloud"],[-8,-16,"snow"],[-12,-20,"snow"]]},
    {n:"东京",c:"cloud",d:"多云",t:18,w:9,h:63,f:[[19,13,"cloud"],[21,14,"sun"],[18,13,"rain"],[17,12,"cloud"],[20,14,"sun"]]}
  ];
  const WK=["周日","周一","周二","周三","周四","周五","周六"];
  let idx=0, useF=false, curTemp=0, layer=0, parts=[], cond="sun";

  const cv=$("fx"), ctx=cv.getContext("2d");
  function fit(){const r=cv.getBoundingClientRect(),d=Math.min(devicePixelRatio||1,2);
    cv.width=r.width*d;cv.height=r.height*d;ctx.setTransform(d,0,0,d,0,0);}
  addEventListener("resize",fit);

  const conv=t=>useF?Math.round(t*9/5+32):t;
  function seed(){                                    // 按天气类型重建粒子池（数量固定，无增长）
    const w=cv.clientWidth||340,h=cv.clientHeight||520;parts=[];
    const n=cond==="rain"?90:cond==="snow"?70:cond==="cloud"?14:34;
    for(let i=0;i<n;i++)parts.push({x:Math.random()*w,y:Math.random()*h,
      v:cond==="rain"?520+Math.random()*380:cond==="snow"?34+Math.random()*36:14+Math.random()*26,
      r:cond==="cloud"?46+Math.random()*54:1+Math.random()*2.2,o:.25+Math.random()*.6,p:Math.random()*6.28});
  }
  let t0=performance.now();
  function frame(now){
    const dt=Math.min(.05,(now-t0)/1000);t0=now;
    const w=cv.clientWidth,h=cv.clientHeight;ctx.clearRect(0,0,w,h);
    if(cond==="sun"){                                 // 晴：光晕呼吸 + 漂浮金色微粒（夜间转为星点）
      const g=ctx.createRadialGradient(w*.78,72,6,w*.78,72,150+Math.sin(now/900)*12);
      g.addColorStop(0,night?"rgba(215,230,255,.5)":"rgba(255,236,168,.85)");g.addColorStop(1,"rgba(255,236,168,0)");
      ctx.fillStyle=g;ctx.beginPath();ctx.arc(w*.78,72,170,0,6.283);ctx.fill();
    }
    for(const p of parts){
      if(cond==="rain"){
        p.y+=p.v*dt;p.x+=p.v*dt*.18;if(p.y>h){p.y=-20;p.x=Math.random()*w;}
        ctx.strokeStyle="rgba(200,229,255,"+p.o*.75+")";ctx.lineWidth=1.1;
        ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(p.x-2.6,p.y-14);ctx.stroke();
      }else if(cond==="snow"){
        p.p+=dt*1.6;p.y+=p.v*dt;p.x+=Math.sin(p.p)*.5;if(p.y>h){p.y=-8;p.x=Math.random()*w;}
        ctx.fillStyle="rgba(255,255,255,"+p.o+")";ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,6.283);ctx.fill();
      }else if(cond==="cloud"){
        p.x+=p.v*dt*.5;if(p.x-p.r>w)p.x=-p.r;
        ctx.fillStyle="rgba(255,255,255,"+p.o*.14+")";ctx.beginPath();ctx.arc(p.x,p.y*.5,p.r,0,6.283);ctx.fill();
      }else{
        p.p+=dt;p.y-=p.v*dt*.35;p.x+=Math.sin(p.p)*.35;if(p.y<-6){p.y=h+6;p.x=Math.random()*w;}
        ctx.fillStyle=(night?"rgba(220,235,255,":"rgba(255,226,150,")+(p.o*(.55+.45*Math.sin(p.p*2)))+")";
        ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,6.283);ctx.fill();
      }
    }
    requestAnimationFrame(frame);
  }

  function countUp(el,from,to){                        // 切城市时温度数字滚动
    const s=performance.now();
    (function step(n){const k=Math.min(1,(n-s)/620),e=1-Math.pow(1-k,3);
      el.textContent=Math.round(from+(to-from)*e);if(k<1)requestAnimationFrame(step);})(s);
  }
  function chart(f){
    const svg=$("chart");svg.innerHTML="";
    const hi=f.map(d=>d[0]),lo=f.map(d=>d[1]),max=Math.max(...hi),min=Math.min(...lo),span=Math.max(1,max-min);
    const X=i=>30+i*60, Y=v=>48-((v-min)/span)*34;
    const line=(vals,color,w,dash)=>{const p=document.createElementNS(NS,"polyline");
      p.setAttribute("points",vals.map((v,i)=>X(i)+","+Y(v)).join(" "));p.setAttribute("fill","none");
      p.setAttribute("stroke",color);p.setAttribute("stroke-width",w);p.setAttribute("stroke-linecap","round");
      p.setAttribute("stroke-linejoin","round");if(dash)p.setAttribute("stroke-dasharray","4 4");svg.appendChild(p);};
    const area=document.createElementNS(NS,"path");
    area.setAttribute("d","M"+hi.map((v,i)=>X(i)+" "+Y(v)).join(" L ")+" L "+X(4)+" "+Y(lo[4])+" L "+
      lo.slice().reverse().map((v,i)=>X(4-i)+" "+Y(v)).join(" L ")+" Z");
    area.setAttribute("fill","rgba(255,255,255,.12)");svg.appendChild(area);
    line(hi,"#ffd06b",2.4);line(lo,"rgba(190,220,255,.95)",2,true);
    hi.forEach((v,i)=>{const c=document.createElementNS(NS,"circle");
      c.setAttribute("cx",X(i));c.setAttribute("cy",Y(v));c.setAttribute("r",2.8);c.setAttribute("fill","#fff");svg.appendChild(c);});
  }
  function render(first){
    const c=CITIES[idx];cond=c.c;
    const a=$("bgA"),b=$("bgB"),to=layer?a:b,from=layer?b:a;
    to.style.background="linear-gradient(160deg,"+SKY[c.c].join(",")+")";
    to.classList.add("on");from.classList.remove("on");layer^=1;
    $("bigIcon").setAttribute("href","#i-"+c.c);$("desc").textContent=c.d;
    countUp($("temp"),first?0:curTemp,conv(c.t));curTemp=conv(c.t);
    $("deg").textContent=useF?"°F":"°C";
    $("place").textContent=c.n+" · 更新于 "+new Date().toTimeString().slice(0,5)+(night?" · 夜间模式":"");
    $("wind").textContent=c.w+" km/h";$("hum").textContent=c.h+"%";
    $("feel").textContent=conv(c.t+(c.h>75?2:c.w>18?-2:1))+"°";
    const days=$("days");days.innerHTML="";
    c.f.forEach((d,i)=>{const wd=new Date(Date.now()+(i+1)*864e5);
      days.insertAdjacentHTML("beforeend","<div><div class='d'>"+(i?WK[wd.getDay()]:"明天")+"</div>"+
        "<svg><use href='#i-"+d[2]+"'/></svg><div class='t'><b>"+conv(d[0])+"°</b> / "+conv(d[1])+"°</div></div>");});
    chart(useF?c.f.map(d=>[Math.round(d[0]*9/5+32),Math.round(d[1]*9/5+32),d[2]]):c.f);
    seed();
  }
  function switchTo(i){                                 // 内容淡出→换数据→淡入，背景两层交叉溶解，无闪白
    if(i===idx)return;idx=i;
    [...$("tabs").children].forEach((b,k)=>b.classList.toggle("on",k===i));
    const now=$("now");now.classList.add("out");
    setTimeout(()=>{render(false);now.classList.remove("out");},280);
  }
  CITIES.forEach((c,i)=>{const b=document.createElement("button");b.textContent=c.n;
    if(!i)b.className="on";b.onclick=()=>switchTo(i);$("tabs").appendChild(b);});
  $("unit").onclick=()=>{useF=!useF;$("unit").textContent=useF?"°F":"°C";render(false);};
  fit();render(true);requestAnimationFrame(frame);
})();
</script>
</body>
</html>
