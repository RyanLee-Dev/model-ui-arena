<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>天气 · Weather</title>
<!--
设计说明：
1. 三城切换（杭州晴 / 上海雨 / 哈尔滨雪），每次切换整卡淡出滑入 + 温度数字 countUp，绝不硬切闪白。
2. 信息层级：大号温度 → 天气描述 → 风速/湿度胶囊 → 5 天预报（SVG 温度折线 + 高低温与渐变带）。
3. 动态视觉三套：晴天光晕旋转 + 上浮光尘；雨天多层雨滴下落带尾迹；雪花飘落带左右摇摆，全部 CSS 动画驱动。
4. 附加：本地时间 6-18 点自动白天/夜间形态、°C/°F 单位切换（含折线联动重绘）、390px 下单列不溢出。
-->
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{min-height:100vh;display:grid;place-items:center;padding:18px;font-family:"SF Pro Text","PingFang SC",system-ui,sans-serif;color:#f3f7fd;overflow-x:hidden}
.bg{position:fixed;inset:0;z-index:-2;transition:background 1.2s ease}
.m4{background:linear-gradient(168deg,#2e8bc9,#63b3e6 55%,#bfe0f2)}
.m4.rain{background:linear-gradient(165deg,#31415e,#4a5c7d 60%,#7e93ab)}
.m4.snow{background:linear-gradient(168deg,#5d7fa8,#8fb0cd 60%,#d7e5f0)}
body.night .bg{filter:brightness(.55) saturate(.85)}
.card{position:relative;width:min(92vw,560px);border-radius:28px;padding:24px 24px 20px;background:rgba(12,20,38,.42);border:1px solid rgba(255,255,255,.22);box-shadow:0 30px 80px rgba(8,16,38,.45);backdrop-filter:blur(20px);overflow:hidden;transition:opacity .28s,transform .28s}
.card.out{opacity:0;transform:translateY(14px) scale(.985)}
#fx{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.sun{position:absolute;top:-70px;right:-60px;width:210px;height:210px;border-radius:50%;background:radial-gradient(circle,#ffe9a8 0%,#ffd166 38%,rgba(255,190,80,0) 70%);animation:spin 26s linear infinite}
.sun::after{content:"";position:absolute;inset:-30px;border-radius:50%;background:conic-gradient(from 0deg,rgba(255,235,170,.35),transparent 25%,rgba(255,235,170,.3) 50%,transparent 75%,rgba(255,235,170,.35));animation:spin 40s linear infinite reverse}
@keyframes spin{to{transform:rotate(360deg)}}
.mote{position:absolute;bottom:-10px;width:5px;height:5px;border-radius:50%;background:rgba(255,240,190,.75);animation:rise 7s linear infinite}
@keyframes rise{to{transform:translateY(-110vh)}}
.drop{position:absolute;top:-14%;width:1.6px;height:16%;border-radius:2px;background:linear-gradient(rgba(190,215,255,0),rgba(190,215,255,.8));animation:fall 1s linear infinite}
@keyframes fall{to{transform:translateY(125vh)}}
.flake{position:absolute;top:-6%;color:#eef6ff;animation:fall 9s linear infinite}
@keyframes drift{0%,100%{transform:translateX(0)}50%{transform:translateX(22px)}}
.tabs{display:flex;gap:8px;margin-bottom:18px}
.tab{flex:1;padding:9px 0;border-radius:12px;border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.08);color:#eef4fc;font-size:14px;letter-spacing:.15em;cursor:pointer;transition:.25s}
.tab.on{background:rgba(255,255,255,.92);color:#1d3461;font-weight:700;border-color:transparent}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.temp{font-size:86px;font-weight:200;line-height:1;font-variant-numeric:tabular-nums}
.temp sub{font-size:30px;font-weight:300;bottom:0}
.desc{font-size:17px;letter-spacing:.3em;opacity:.92;margin-top:6px}
.unit{border:1px solid rgba(255,255,255,.35);background:none;color:#eef4fc;border-radius:10px;padding:6px 12px;font-size:13px;cursor:pointer;letter-spacing:.1em}
.chips{display:flex;gap:10px;margin:16px 0 18px;flex-wrap:wrap}
.chip{font-size:13px;padding:7px 14px;border-radius:99px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.18);letter-spacing:.08em}
.fore{border-top:1px solid rgba(255,255,255,.2);padding-top:14px}
svg.line{width:100%;height:74px;display:block}
.days{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;text-align:center;font-size:12px}
.days b{display:block;font-size:13px;margin-bottom:3px;letter-spacing:.1em}
.days .ic{height:26px;display:grid;place-items:center;margin:2px 0}
.days .hl{opacity:.9}.days .hl i{font-style:normal;opacity:.55}
svg.line polyline{fill:none;stroke:url(#lg);stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
svg line.gline{stroke:rgba(255,255,255,.14);stroke-width:1}
</style>
</head>
<body>
<div class="bg m4" id="bg"></div>
<div class="card" id="card">
  <div id="fx"></div>
  <div class="tabs" id="tabs"></div>
  <div class="top">
    <div><div class="temp"><span id="tv">28</span><sub id="tu">°C</sub></div><div class="desc" id="desc">--</div></div>
    <button class="unit" id="unit">°F</button>
  </div>
  <div class="chips"><span class="chip" id="wind">--</span><span class="chip" id="hum">--</span><span class="chip" id="upd">--</span></div>
  <div class="fore">
    <svg class="line" id="svg" viewBox="0 0 340 74" preserveAspectRatio="none">
      <defs><linearGradient id="lg" x1="0" x2="1"><stop offset="0" stop-color="#ffd166"/><stop offset=".5" stop-color="#ff8fa3"/><stop offset="1" stop-color="#8fd0ff"/></linearGradient></defs>
    </svg>
    <div class="days" id="days"></div>
  </div>
</div>
<script>
const C=[
 {name:"杭州",t:32,type:"sun",desc:"晴 · 阳光正好",wind:"东南风 3 级",hum:"湿度 42%",days:[["周五","sun",34,25],["周六","sun",35,26],["周日","rain",29,23],["周一","sun",31,24],["周二","sun",33,25]]},
 {name:"上海",t:26,type:"rain",desc:"雷阵雨 · 注意带伞",wind:"东风 4 级",hum:"湿度 88%",days:[["周五","rain",27,22],["周六","rain",25,21],["周日","sun",28,22],["周一","rain",24,20],["周二","sun",27,21]]},
 {name:"哈尔滨",t:-6,type:"snow",desc:"小雪 · 出行保暖",wind:"西北风 2 级",hum:"湿度 71%",days:[["周五","snow",-5,-13],["周六","snow",-3,-11],["周日","snow",-6,-14],["周一","sun",-2,-10],["周二","snow",-4,-12]]}];
let ci=0,unit="C",raf;
const $=id=>document.getElementById(id);
const icon=t=>t==="sun"
 ?'<svg width="22" height="22" viewBox="0 0 24 24"><circle cx="12" cy="12" r="5" fill="#ffd166"/><g stroke="#ffd166" stroke-width="2" stroke-linecap="round"><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M19.1 4.9L17 7M7 17l-2.1 2.1"/></g></svg>'
 :t==="rain"
 ?'<svg width="22" height="22" viewBox="0 0 24 24"><path d="M7 15a5 5 0 1 1 1-9.9A6 6 0 1 1 18 12H7z" fill="#cfe0f5"/><g stroke="#9fc4ff" stroke-width="2" stroke-linecap="round"><path d="M9 17.5l-1 3M13 17.5l-1 3M17 17.5l-1 3"/></g></svg>'
 :'<svg width="22" height="22" viewBox="0 0 24 24"><g stroke="#e8f4ff" stroke-width="2" stroke-linecap="round"><path d="M12 4v16M5.1 8l13.8 8M18.9 8L5.1 16M12 4l-2.5 3M12 4l2.5 3M12 20l-2.5-3M12 20l2.5-3"/></g></svg>';
const fx=$("fx");
function buildFx(type){
  fx.innerHTML="";
  if(type==="sun"){
    const s=document.createElement("div");s.className="sun";fx.appendChild(s);
    for(let i=0;i<14;i++){const m=document.createElement("i");m.className="mote";
      m.style.cssText=`left:${Math.random()*100}%;animation-delay:${-Math.random()*7}s;animation-duration:${6+Math.random()*5}s;opacity:${.3+Math.random()*.6}`;
      m.setAttribute("class","mote");fx.appendChild(m)}
  }else{
    const cls=type==="rain"?"drop":"flake",n=type==="rain"?52:34;
    for(let i=0;i<n;i++){const d=document.createElement("i");d.className=cls;
      if(type==="rain")d.style.cssText=`left:${Math.random()*100}%;animation-delay:${-Math.random()}s;animation-duration:${.7+Math.random()*.6}s;opacity:${.35+Math.random()*.5}`;
      else{d.textContent="✳";d.style.cssText=`left:${Math.random()*100}%;animation-delay:${-Math.random()*9}s;animation-duration:${7+Math.random()*5}s;font-size:${8+Math.random()*8}px;animation-name:fall,drift;animation-duration:${8+Math.random()*4}s,3s;animation-timing-function:linear,ease-in-out;animation-iteration-count:infinite,infinite`}
      fx.appendChild(d)}
  }
}
const toF=c=>Math.round(c*9/5+32),T=c=>unit==="C"?c:toF(c);
function countUp(el,from,to){
  cancelAnimationFrame(raf);const t0=performance.now();
  const step=t=>{const p=Math.min(1,(t-t0)/520),v=Math.round(from+(to-from)*(1-Math.pow(1-p,3)));
    el.textContent=v;if(p<1)raf=requestAnimationFrame(step)};
  raf=requestAnimationFrame(step);
}
function drawDays(c){
  const svg=$("svg"),old=svg.querySelectorAll("polyline,text");old.forEach(e=>e.remove());
  const hs=c.days.map(d=>T(d[2])),ls=c.days.map(d=>T(d[3])),mn=Math.min(...ls),mx=Math.max(...hs),rg=Math.max(1,mx-mn);
  const pts=hs.map((h,i)=>[34+i*68,56-(h-mn)/rg*40]);
  const pl=document.createElementNS("http://www.w3.org/2000/svg","polyline");
  pl.setAttribute("points",pts.map(p=>p.join(",")).join(" "));svg.appendChild(pl);
  pts.forEach((p,i)=>{const t=document.createElementNS("http://www.w3.org/2000/svg","text");
    t.setAttribute("x",p[0]);t.setAttribute("y",p[1]-9);t.setAttribute("text-anchor","middle");
    t.setAttribute("fill","rgba(255,255,255,.92)");t.setAttribute("font-size","12");t.textContent=hs[i]+"°";svg.appendChild(t)});
  $("days").innerHTML=c.days.map(d=>`<div><b>${d[0]}</b><div class="ic">${icon(d[1])}</div><div class="hl">${T(d[2])}° <i>/${T(d[3])}°</i></div></div>`).join("");
}
function render(i,anim){
  const c=C[i];
  $("bg").className="bg m4 "+c.type;
  buildFx(c.type);
  const prev=parseInt($("tv").textContent)||T(c.t);
  $("tu").textContent="°"+unit;
  countUp($("tv"),anim?prev:T(c.t),T(c.t));
  $("desc").textContent=c.desc;$("wind").textContent=c.wind;$("hum").textContent=c.hum;
  $("upd").textContent="更新于 "+new Date().getHours()+":"+String(new Date().getMinutes()).padStart(2,"0");
  drawDays(c);
  document.querySelectorAll(".tab").forEach((t,j)=>t.classList.toggle("on",j===i));
}
C.forEach((c,i)=>{const b=document.createElement("button");b.className="tab"+(i===0?" on":"");
  b.textContent=c.name;b.onclick=()=>{if(i===ci)return;ci=i;
    $("card").classList.add("out");
    setTimeout(()=>{render(i,true);$("card").classList.remove("out")},280)};
  $("tabs").appendChild(b)});
$("unit").onclick=()=>{unit=unit==="C"?"F":"C";$("unit").textContent=unit==="C"?"°F":"°C";render(ci,false)};
const h=new Date().getHours();document.body.classList.add(h>=6&&h<18?"":"night");
render(0,false);
</script>
</body>
</html>
