<!DOCTYPE html>
<!-- 设计说明：Apple Weather 级天气卡片。天空按天气分层：晴/雨/雷暴三套渐变 + 漂移云朵 + canvas 粒子（晴光尘升腾/雨滴斜落/闪电爆闪），夜间自动叠暗幕与月牙；当前天气大号细字温度 + 内联 SVG 天气图标 + 风/湿度/UV 信息胶囊；城市切换整块淡入位移过渡、温度 countUp；5 天预报横向条（图标+高低温色条）+ Catmull-Rom 平滑温度曲线；°C/°F 分段开关。 -->
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>天气卡片</title>
<style>
*{margin:0;box-sizing:border-box}
body{min-height:100vh;display:grid;place-items:center;background:linear-gradient(180deg,#0b1220,#141c2e);font-family:"SF Pro Display",-apple-system,"PingFang SC",sans-serif;padding:14px}
.card{width:min(96vw,366px);border-radius:34px;overflow:hidden;box-shadow:0 36px 90px rgba(2,6,16,.6);background:#fff;color:#1d2733}
.sky{position:relative;height:188px;overflow:hidden;transition:filter .8s}
.sky .grad{position:absolute;inset:0;transition:background 1s}
.sky.sunny .grad{background:linear-gradient(180deg,#2f7cf6 0%,#66b2f7 48%,#bfe3fd 100%)}
.sky.rain .grad{background:linear-gradient(180deg,#3d4b63 0%,#5a6c86 55%,#8fa3ba 100%)}
.sky.storm .grad{background:linear-gradient(180deg,#20293d 0%,#38415c 55%,#565f78 100%)}
body.night .sky{filter:brightness(.62) saturate(.85)}
.cloud{position:absolute;background:rgba(255,255,255,.9);border-radius:999px;filter:blur(5px);animation:drift linear infinite;opacity:.85}
.cloud::before,.cloud::after{content:"";position:absolute;background:inherit;border-radius:50%}
.cloud::before{width:60%;height:130%;left:8%;bottom:8%}
.cloud::after{width:46%;height:100%;right:10%;bottom:16%}
.c1{width:120px;height:34px;top:38px;left:-140px;animation-duration:34s}
.c2{width:86px;height:26px;top:88px;left:-110px;animation-duration:26s;opacity:.6}
.c3{width:150px;height:40px;top:132px;left:-170px;animation-duration:44s;opacity:.4}
@keyframes drift{to{transform:translateX(560px)}}
.sun{position:absolute;top:26px;right:34px;width:64px;height:64px;border-radius:50%;background:radial-gradient(circle at 38% 34%,#fff8e1 0%,#ffd76a 58%,rgba(255,200,80,0) 74%);box-shadow:0 0 52px 18px rgba(255,214,110,.55);animation:rot 46s linear infinite}
.moon{position:absolute;top:30px;right:44px;width:42px;height:42px;border-radius:50%;background:radial-gradient(circle at 36% 32%,#ffffff,#dbe7fa 72%);box-shadow:0 0 30px 10px rgba(210,225,250,.4)}
@keyframes rot{to{transform:rotate(360deg)}}
.sky canvas{position:absolute;inset:0;width:100%;height:100%}
.flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}
.flash.on{animation:fz .6s}@keyframes fz{0%,100%{opacity:0}16%{opacity:.9}38%{opacity:0}}
.panel{padding:18px 18px 20px}
.cities{display:flex;gap:5px;background:#eef2f7;border-radius:999px;padding:4px;margin-bottom:16px}
.city{flex:1;padding:8px 0;border:0;border-radius:999px;background:transparent;color:#718096;font-size:13px;font-weight:600;cursor:pointer;transition:.3s}
.city.on{background:#fff;color:#1d2733;box-shadow:0 3px 10px rgba(30,40,60,.16)}
.main{display:flex;align-items:center;gap:18px;transition:opacity .22s,transform .22s}
.main.out{opacity:0;transform:translateY(12px)}
.temp{font-size:66px;font-weight:200;letter-spacing:-2px;line-height:.95;font-variant-numeric:tabular-nums}
.temp .unit{font-size:22px;font-weight:400;vertical-align:40px;margin-left:2px}
.desc{font-size:17px;font-weight:600;margin-top:2px}
.meta{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.meta i{font-style:normal;font-size:11px;color:#5a6b7f;background:#eef2f7;padding:5px 10px;border-radius:999px;display:inline-flex;gap:4px;align-items:center}
.fhead{display:flex;justify-content:space-between;align-items:center;margin:20px 0 4px;font-size:12px;color:#8a97a8;font-weight:600;letter-spacing:1px}
.seg{display:flex;border:1px solid #dfe6ee;border-radius:999px;overflow:hidden}
.seg b{padding:3px 12px;font-size:11px;color:#8a97a8;cursor:pointer;font-weight:600}
.seg b.on{background:#1d2733;color:#fff}
.chart{width:100%;height:72px;display:block;margin-top:2px}
.days{display:flex;gap:5px;margin-top:10px}
.day{flex:1;text-align:center;font-size:11px;color:#8a97a8;padding:8px 2px;border-radius:14px;transition:.25s}
.day:hover{background:#f4f7fb}
.day b{display:block;font-size:12px;color:#1d2733;margin:5px 0 3px;font-variant-numeric:tabular-nums}
.bar{height:3px;border-radius:3px;background:linear-gradient(90deg,#ff9d5c,var(--hc,#ffd24d));margin:0 4px;position:relative}
.bar::before{content:"";position:absolute;left:0;top:-2px;width:3px;height:7px;border-radius:3px;background:#ff9d5c}
.day svg{width:22px;height:22px}
</style>
</head>
<body>
<div class="card">
  <div class="sky sunny" id="sky">
    <div class="grad"></div>
    <div class="cloud c1"></div><div class="cloud c2"></div><div class="cloud c3"></div>
    <div class="sun" id="orbsun"></div>
    <canvas id="pc" width="366" height="188"></canvas>
    <div class="flash" id="flash"></div>
  </div>
  <div class="panel">
    <div class="cities" id="cities"></div>
    <div class="main" id="main">
      <div id="wicon"></div>
      <div><div class="temp"><span id="temp">31</span><span class="unit" id="unit">°C</span></div>
      <div class="desc" id="desc">晴</div>
      <div class="meta" id="meta"></div></div>
    </div>
    <div class="fhead"><span>未来 5 天</span><span class="seg" id="seg"><b data-u="C" class="on">°C</b><b data-u="F">°F</b></span></div>
    <svg class="chart" viewBox="0 0 300 72" id="chart"><defs><linearGradient id="ag" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2f7cf6" stop-opacity=".5"/><stop offset="1" stop-color="#2f7cf6" stop-opacity="0"/></linearGradient></defs></svg>
    <div class="days" id="days"></div>
  </div>
</div>
<script>
const NS="http://www.w3.org/2000/svg",W=366,H=188,pc=document.getElementById("pc"),ctx=pc.getContext("2d");
const C={
北京:{w:"晴",t:31,wind:"西南风 3级",hum:38,uv:"中",icon:"sunny",f:[[36,25,"晴"],[35,24,"晴"],[33,23,"多云"],[31,21,"雷阵雨"],[30,20,"小雨"]]},
上海:{w:"小雨",t:27,wind:"东南风 4级",hum:82,uv:"低",icon:"rain",f:[[28,24,"小雨"],[29,25,"多云"],[31,26,"晴"],[30,24,"阵雨"],[29,23,"多云"]]},
广州:{w:"雷阵雨",t:30,wind:"南风 3级",hum:76,uv:"中",icon:"storm",f:[[32,26,"雷阵雨"],[33,27,"晴"],[34,27,"多云"],[32,25,"阵雨"],[31,25,"晴"]]}};
const keys=Object.keys(C);let cur=0,deg=true,parts=[];
const sky=document.getElementById("sky"),orbsun=document.getElementById("orbsun"),flash=document.getElementById("flash");
const week=["周日","周一","周二","周三","周四","周五","周六"];
const fmtT=c=>deg?c:Math.round(c*9/5+32);
function ic(t,s){const u=` stroke="#7b8794" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"`;
if(t==="sunny")return `<svg viewBox="0 0 24 24" width="${s}" height="${s}"><circle cx="12" cy="12" r="4.6" fill="#ffb63e" stroke="none"/><g ${u}><path d="M12 2.5v2.4M12 19.1v2.4M2.5 12h2.4M19.1 12h2.4M4.9 4.9l1.7 1.7M17.4 17.4l1.7 1.7M19.1 4.9l-1.7 1.7M6.6 17.4l-1.7 1.7"/></g></svg>`;
if(t==="rain")return `<svg viewBox="0 0 24 24" width="${s}" height="${s}"><path d="M7 15.2a4.2 4.2 0 1 1 .9-8.3 5.2 5.2 0 0 1 10 1.3A3.6 3.6 0 0 1 17 15.2z" fill="#aab6c6" stroke="none"/><g ${u}><path d="M9 16.5l-1.2 3M13 16.5l-1.2 3M17 16.5l-1.2 3"/></g></svg>`;
if(t==="cloud")return `<svg viewBox="0 0 24 24" width="${s}" height="${s}"><path d="M7 15.2a4.2 4.2 0 1 1 .9-8.3 5.2 5.2 0 0 1 10 1.3A3.6 3.6 0 0 1 17 15.2z" fill="#b8c4d2" stroke="none"/></svg>`;
return `<svg viewBox="0 0 24 24" width="${s}" height="${s}"><path d="M7 13.4a4 4 0 1 1 .8-7.8 4.9 4.9 0 0 1 9.5 1.2A3.4 3.4 0 0 1 17 13.4z" fill="#9aa6b6" stroke="none"/><path d="M12 13.5l-1.4 4.6M15.6 13.5l-1.4 4.6" stroke="#ffb63e" stroke-width="1.8" stroke-linecap="round" fill="none"/></svg>`}
const icType=w=>w.includes("晴")?"sunny":w.includes("雨")?(w.includes("雷")?"storm":"rain"):"cloud";
document.getElementById("cities").innerHTML=keys.map((k,i)=>`<button class="city${i===0?" on":""}" data-i="${i}">${k}</button>`).join("");
document.querySelectorAll(".city").forEach(b=>b.onclick=()=>switchCity(+b.dataset.i));
document.querySelectorAll("#seg b").forEach(b=>b.onclick=()=>{deg=b.dataset.u==="C";document.querySelectorAll("#seg b").forEach(x=>x.classList.toggle("on",x===b));document.getElementById("unit").textContent=deg?"°C":"°F";render()});
function countUp(el,to){const from=+el.textContent,t0=performance.now();(function st(t){const k=Math.min(1,(t-t0)/500),e=1-(1-k)*(1-k);el.textContent=Math.round(from+(to-from)*e);k<1&&requestAnimationFrame(st)})(performance.now())}
function smoothPath(pts){let d=`M${pts[0][0]},${pts[0][1]}`;for(let i=0;i<pts.length-1;i++){const p0=pts[Math.max(0,i-1)],p1=pts[i],p2=pts[i+1],p3=pts[Math.min(pts.length-1,i+2)];
d+=`C${p1[0]+(p2[0]-p0[0])/6},${p1[1]+(p2[1]-p0[1])/6} ${p2[0]-(p3[0]-p1[0])/6},${p2[1]-(p3[1]-p1[1])/6} ${p2[0]},${p2[1]}`}return d}
function render(){
const d=C[keys[cur]],hs=d.f.map(x=>x[0]);
sky.className="sky "+d.icon;
document.getElementById("wicon").innerHTML=ic(d.icon,64);
document.getElementById("desc").textContent=d.w+" · "+keys[cur];
document.getElementById("meta").innerHTML=`<i>风 ${d.wind.split(" ")[1]}</i><i>湿度 ${d.hum}%</i><i>UV ${d.uv}</i>`;
const dt=new Date();document.getElementById("days").innerHTML=d.f.map((f,i)=>{const h=f[0],l=f[1],r=(h-l)/2;
return `<div class="day">${week[(dt.getDay()+i)%7]}${ic(icType(f[2]),22)}<b>${fmtT(h)}° / ${fmtT(l)}°</b><div class="bar" style="--hc:${h>=32?"#ff8a3d":h>=26?"#ffd24d":"#7fb8e8"}"></div></div>`}).join("");
const ch=document.getElementById("chart");ch.innerHTML=ch.querySelector("defs").outerHTML;
const min=Math.min(...d.f.map(x=>x[1]))-2,max=Math.max(...hs)+2,pad=14,w=300,h=72;
const pts=hs.map((v,i)=>[pad+i*(w-2*pad)/4,h-pad-((v-min)/(max-min))*(h-2*pad)]);
const mk=(tag,at)=>{const e=document.createElementNS(NS,tag);for(const k in at)e.setAttribute(k,at[k]);return e};
const p=smoothPath(pts);
ch.appendChild(mk("path",{d:p+`L${pts[3][0]},${h}L${pts[0][0]},${h}Z`,fill:"url(#ag)"}));
ch.appendChild(mk("path",{d:p,fill:"none",stroke:"#2f7cf6","stroke-width":2.5,"stroke-linecap":"round"}));
pts.forEach((pt,i)=>ch.appendChild(mk("circle",{cx:pt[0],cy:pt[1],r:i===4?4:3,fill:"#fff",stroke:"#2f7cf6","stroke-width":2})));
countUp(document.getElementById("temp"),fmtT(d.t));}
function switchCity(i){if(i===cur)return;document.querySelector(".city.on").classList.remove("on");document.querySelectorAll(".city")[i].classList.add("on");cur=i;
document.getElementById("main").classList.add("out");setTimeout(()=>{render();document.getElementById("main").classList.remove("out")},230)}
function spawn(){const ic=C[keys[cur]].icon;
if(ic==="sunny"&&parts.length<24)parts.push({x:Math.random()*W,y:H+Math.random()*30,s:.5+Math.random()*1.4,r:.8+Math.random()*1.6,a:Math.random()*7});
else if(ic==="rain"&&parts.length<64)parts.push({x:Math.random()*W,y:-20,s:8+Math.random()*5,r:1.3,a:.28});
else if(ic==="storm"){if(parts.length<70)parts.push({x:Math.random()*W,y:-20,s:10+Math.random()*5,r:1.5,a:.3});if(Math.random()<.005){flash.classList.remove("on");void flash.offsetWidth;flash.classList.add("on")}}}
function anim(){ctx.clearRect(0,0,W,H);const ic=C[keys[cur]].icon;
for(let i=parts.length-1;i>=0;i--){const p=parts[i];
if(ic==="sunny"){p.y-=p.s;p.x+=Math.sin(p.a)*.3;ctx.fillStyle=`rgba(255,241,190,${Math.max(0,p.y/H)*.9})`;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,7);ctx.fill()}
else{ctx.strokeStyle="rgba(196,220,245,.85)";ctx.lineWidth=p.r;ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(p.x-p.s*.6,p.y+8);ctx.stroke()}
if(p.y<-24||p.y>H+24)parts.splice(i,1)}
requestAnimationFrame(anim)}
spawn();setInterval(spawn,150);requestAnimationFrame(anim);
const hr=new Date().getHours();
if(hr<6||hr>=18){document.body.classList.add("night");orbsun.classList.add("moon")}
render();
</script>
</body>
</html>
