<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gravity Field</title><style>html,body,canvas{margin:0;width:100%;height:100%;background:#030711;overflow:hidden}aside{position:fixed;left:18px;top:18px;color:#b9d9ff;font:12px ui-monospace;background:#0b1833aa;border:1px solid #315d8d;padding:12px;line-height:1.8}b{color:#66f3ff}</style><canvas id="c"></canvas><aside>GRAVITY FIELD<br>PARTICLES <b id="count"></b><br>ENERGY <b id="energy">100%</b><br><small>移动 / 点击投放引力波</small></aside><script>let g=c.getContext('2d'),w,h,pts=[],well={x:0,y:0,p:1};function rs(){w=c.width=innerWidth;h=c.height=innerHeight;well.x=w/2;well.y=h/2}rs();onresize=rs;for(let i=0;i<220;i++){let a=Math.random()*7,r=30+Math.random()*Math.min(innerWidth,innerHeight)*.45;pts.push({x:well.x+Math.cos(a)*r,y:well.y+Math.sin(a)*r,vx:Math.random()-0.5,vy:Math.random()-.5})}count.textContent=pts.length;addEventListener('pointermove',e=>{well.x=e.clientX;well.y=e.clientY;well.p=1.6});addEventListener('pointerdown',e=>{well={x:e.clientX,y:e.clientY,p:3}});function draw(){g.fillStyle='rgba(3,7,17,.18)';g.fillRect(0,0,w,h);for(let p of pts){let dx=well.x-p.x,dy=well.y-p.y,d=Math.max(60,Math.hypot(dx,dy)),f=.26*well.p/d;p.vx+=dx*f;p.vy+=dy*f;p.vx*=.99;p.vy*=.99;p.x+=p.vx;p.y+=p.vy;if(p.x<0||p.x>w||p.y<0||p.y>h){p.x=Math.random()*w;p.y=Math.random()*h}g.fillStyle='#66eaff';g.shadowBlur=8;g.shadowColor='#5af';g.fillRect(p.x,p.y,2,2)}g.beginPath();g.arc(well.x,well.y,20+well.p*8,0,7);g.strokeStyle='#a277ff';g.stroke();g.shadowBlur=0;well.p+= (1-well.p)*.025;energy.textContent=Math.round(well.p/3*100)+'%';requestAnimationFrame(draw)}draw()</script></html>
