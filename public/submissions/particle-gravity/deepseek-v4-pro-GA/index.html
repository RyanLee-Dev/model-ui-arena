<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>引力星井 · Gravity Well</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden;background:#03040a}
body{font-family:ui-sans-serif,system-ui,"PingFang SC","Microsoft YaHei",sans-serif;color:#dce9ff}
canvas{position:fixed;inset:0;display:block;touch-action:none;cursor:crosshair}
.hud{position:fixed;top:14px;left:14px;z-index:2;display:grid;gap:4px;padding:12px 15px;border-radius:14px;
  background:rgba(7,12,28,.72);border:1px solid rgba(120,170,255,.2);backdrop-filter:blur(8px);
  font-size:12px;letter-spacing:.06em;font-variant-numeric:tabular-nums;pointer-events:none}
.hud b{color:#7cd7ff;font-weight:700;margin-left:6px}
.hud .m{color:#ffd27a}
.tip{position:fixed;bottom:16px;left:0;right:0;text-align:center;font-size:11px;letter-spacing:.22em;
  color:rgba(190,210,255,.5);pointer-events:none}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<aside class="hud" id="hud">
  <span>粒子<b id="n">0</b></span>
  <span>能量<b id="e">0</b></span>
  <span>帧率<b id="f">0</b></span>
  <span class="m" id="m">模式 · 环绕</span>
</aside>
<div class="tip">悬停排斥 · 按住吸引 · 点击释放冲击波</div>
<script>
const cv=document.getElementById('cv'),ctx=cv.getContext('2d');
let W=0,H=0,DPR=Math.min(devicePixelRatio||1,2);
let P=[],shock=null,px=-9e3,py=-9e3,press=false,mode='环绕';
const CAP=300,soft=34,G=1700;
let fps=60,lastT=performance.now(),frames=0,fpsT=0;
const hue=()=>180+Math.random()*90;
const core=document.createElement('canvas');core.width=core.height=220;
const cg=core.getContext('2d');
const g=cg.createRadialGradient(110,110,4,110,110,108);
g.addColorStop(0,'rgba(190,240,255,.95)');
g.addColorStop(.28,'rgba(86,180,255,.55)');
g.addColorStop(1,'rgba(60,120,255,0)');
cg.fillStyle=g;cg.fillRect(0,0,220,220);
function resize(){
  DPR=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;
  cv.width=W*DPR;cv.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0);
}
function spawn(x,y){
  const a=Math.random()*Math.PI*2;
  const r=90+Math.random()*Math.min(W,H)*.32;
  const d=Math.hypot(W/2-x,H/2-y)+1;
  const k=Math.min(1,220/d);
  const v=Math.sqrt(G/Math.max(r,60))*.95;
  return{x,y,vx:Math.cos(a)*v*k,vy:Math.sin(a)*v*k,h:hue(),s:.55+Math.random()*.45,life:1};
}
function init(){
  P=Array.from({length:Math.min(CAP,Math.max(120,W*H/9000|0))},()=>{
    const a=Math.random()*Math.PI*2,r=70+Math.random()*Math.min(W,H)*.38;
    const v=Math.sqrt(G/Math.max(r,60))*.95;
    return{x:W/2+Math.cos(a)*r,y:H/2+Math.sin(a)*r,vx:-Math.sin(a)*v,vy:Math.cos(a)*v,h:hue(),s:.55+Math.random()*.45,life:1};
  });
}
function step(dt){
  ctx.fillStyle='rgba(3,5,12,.16)';ctx.fillRect(0,0,W,H);
  const cx=W/2,cy=H/2;
  let energy=0;
  for(const p of P){
    let dx=cx-p.x,dy=cy-p.y;
    let d2=dx*dx+dy*dy+soft*soft,d=Math.sqrt(d2);
    const a=G/d2;
    p.vx+=dx/d*a*dt;p.vy+=dy/d*a*dt;
    const mdx=px-p.x,mdy=py-p.y,md2=mdx*mdx+mdy*mdy;
    if(md2<19600){
      const md=Math.sqrt(md2)+1,f=(press?900:-620)/md*dt;
      p.vx+=mdx/md*f;p.vy+=mdy/md*f;
    }
    const sp=Math.hypot(p.vx,p.vy),max=7.4;
    if(sp>max){p.vx*=max/sp;p.vy*=max/sp;}
    p.vx*=.9985;p.vy*=.9985;
    p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt/5200;
    if(p.life<=0)Object.assign(p,spawn(p.x,p.y));
    energy+=sp*sp;
  }
  if(shock){
    shock.r+=5.2*dt;shock.life-=dt/55;
    for(const p of P){
      const dx=p.x-shock.x,dy=p.y-shock.y,d=Math.hypot(dx,dy)+1;
      if(d<shock.r&&d>shock.r-16){
        const f=shock.k/dt/(d*.08+1);
        p.vx+=dx/d*f;p.vy+=dy/d*f;
      }
    }
    if(shock.life<=0)shock=null;
  }
  ctx.drawImage(core,cx-70+Math.sin(performance.now()/300)*2,cy-70,140,140);
  for(const p of P){
    const sp=Math.hypot(p.vx,p.vy);
    ctx.strokeStyle=`hsla(${p.h},85%,62%,.18)`;
    ctx.lineWidth=1;
    ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(p.x-p.vx*2.4,p.y-p.vy*2.4);ctx.stroke();
    ctx.fillStyle=`hsla(${p.h},${p.s*100}%,${58+Math.min(22,sp*5)}%,.9)`;
    ctx.beginPath();ctx.arc(p.x,p.y,.7+Math.min(1.7,sp*.28),0,7);ctx.fill();
  }
  if(shock){
    ctx.strokeStyle=`rgba(150,220,255,${shock.life*.6})`;
    ctx.lineWidth=2;
    ctx.beginPath();ctx.arc(shock.x,shock.y,shock.r,0,7);ctx.stroke();
  }
  const e=document.getElementById('e');
  if(frames%12===0){
    document.getElementById('n').textContent=P.length;
    e.textContent=Math.round(energy*10);
    document.getElementById('f').textContent=Math.round(fps);
  }
}
function frame(t){
  const dt=Math.min(2,(t-lastT)/16.7)||1;lastT=t;
  frames++;if(t-fpsT>=800){fps=frames*1000/(t-fpsT);fpsT=t;frames=0;}
  step(dt);requestAnimationFrame(frame);
}
function setMode(m){
  mode=m;document.getElementById('m').textContent='模式 · '+m;
}
addEventListener('pointermove',e=>{px=e.clientX;py=e.clientY;if(!press)setMode('排斥');});
addEventListener('pointerdown',e=>{
  press=true;px=e.clientX;py=e.clientY;
  setMode('吸引');
  shock={x:e.clientX,y:e.clientY,r:4,k:9,life:1};
});
addEventListener('pointerup',()=>{press=false;setMode('环绕');});
addEventListener('pointerleave',()=>{px=-9e3;py=-9e3;if(!press)setMode('环绕');});
addEventListener('resize',()=>{resize();});
resize();init();requestAnimationFrame(frame);
</script>
</body>
</html>
