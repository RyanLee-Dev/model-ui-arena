<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>粒子引力场 · Particle Gravity</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{background:linear-gradient(165deg,#070a24 0%,#02030c 52%,#050716 100%);font-family:-apple-system,"SF Pro Display","PingFang SC","Helvetica Neue",sans-serif;color:#dfe7ff;-webkit-font-smoothing:antialiased;user-select:none;-webkit-user-select:none;overscroll-behavior:none}
body::before{content:"";position:fixed;inset:-14px;pointer-events:none;transform:translate3d(var(--px,0px),var(--py,0px),0);transition:transform .9s cubic-bezier(.2,.6,.2,1);background-image:radial-gradient(1px 1px at 22px 34px,rgba(205,220,255,.85) 50%,transparent 51%),radial-gradient(1px 1px at 118px 152px,rgba(190,205,255,.55) 50%,transparent 51%),radial-gradient(1.6px 1.6px at 214px 74px,rgba(222,233,255,.65) 50%,transparent 51%),radial-gradient(1px 1px at 301px 201px,rgba(180,200,255,.45) 50%,transparent 51%),radial-gradient(1.3px 1.3px at 265px 238px,rgba(200,215,255,.5) 50%,transparent 51%);background-size:340px 260px;animation:twk 7s ease-in-out infinite}
body::after{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(125% 95% at 50% 44%,transparent 52%,rgba(1,2,9,.62))}
@keyframes twk{0%,100%{opacity:.95}50%{opacity:.5}}
@media(prefers-reduced-motion:reduce){body::before{animation:none;transition:none}}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:crosshair}
#hud{position:fixed;top:14px;left:14px;z-index:5;min-width:172px;padding:11px 14px 9px;border-radius:13px;background:linear-gradient(150deg,rgba(16,24,54,.7),rgba(8,12,32,.55));border:1px solid rgba(130,165,255,.22);backdrop-filter:blur(14px) saturate(1.3);-webkit-backdrop-filter:blur(14px) saturate(1.3);box-shadow:0 10px 34px rgba(0,0,0,.42),inset 0 1px 0 rgba(180,205,255,.14)}
#hud .r{display:flex;justify-content:space-between;align-items:baseline;gap:20px;padding:2.5px 0}
#hud .r b{font-size:13px;font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:.02em;color:#eef3ff;transition:color .25s}
#hud .r span{font-size:9px;letter-spacing:.16em;color:#7f8dbf;text-transform:uppercase;white-space:nowrap}
#hud .r:hover b{color:#9fd8ff}
#hud .r+.r{border-top:1px solid rgba(120,150,230,.09)}
#mode{position:fixed;top:14px;right:14px;z-index:5;display:flex;align-items:center;gap:8px;padding:9px 15px;border-radius:999px;border:1px solid rgba(130,165,255,.25);background:linear-gradient(150deg,rgba(16,24,54,.7),rgba(8,12,32,.55));backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);color:#dfe7ff;font:600 11px/1 -apple-system,"SF Pro Display","PingFang SC",sans-serif;letter-spacing:.14em;cursor:pointer;transition:transform .18s,border-color .25s,box-shadow .25s}
#mode:hover{transform:translateY(-1px);border-color:rgba(150,200,255,.55);box-shadow:0 6px 24px rgba(60,120,255,.22)}
#mode:active{transform:scale(.95)}
#mode i{width:7px;height:7px;border-radius:50%;background:#6fe3ff;box-shadow:0 0 10px #6fe3ff;transition:background .25s,box-shadow .25s}
body.repel #mode i{background:#ff9ecb;box-shadow:0 0 10px #ff9ecb}
#tag{position:fixed;left:16px;bottom:14px;z-index:5;font-size:9px;letter-spacing:.22em;color:#6d7cae;text-transform:uppercase;line-height:2}
#tag b{display:block;font-size:11px;font-weight:600;letter-spacing:.32em;color:#a9b9ea}
@media(max-width:480px){#hud{min-width:0;padding:8px 11px 7px;top:10px;left:10px;border-radius:11px}#hud .r b{font-size:11.5px}#hud .r span{font-size:8px;letter-spacing:.08em}#mode{padding:8px 12px;top:10px;right:10px}#tag{bottom:10px;left:12px}#tag b{font-size:9.5px}}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="hud">
 <div class="r"><b id="vN">—</b><span>粒子 Particles</span></div>
 <div class="r"><b id="vE">—</b><span>动能 Energy</span></div>
 <div class="r"><b id="vF">—</b><span>帧率 FPS</span></div>
 <div class="r"><b id="vM">—</b><span>模式 Mode</span></div>
</div>
<button id="mode" aria-pressed="false"><i></i><span id="modeTxt">引力场</span></button>
<div id="tag"><b>Particle Gravity</b>拖动扰动场 · 点击冲击波 · Space 切换模式</div>
<script>
'use strict';
const cv=document.getElementById('cv'),ctx=cv.getContext('2d');
const vN=document.getElementById('vN'),vE=document.getElementById('vE'),vF=document.getElementById('vF'),vM=document.getElementById('vM'),modeBtn=document.getElementById('mode'),modeTxt=document.getElementById('modeTxt');
const N=420,DT=1/60,GRAV=2.4e6,SOFT=2400,TWO=6.28318;
const px=new Float32Array(N),py=new Float32Array(N),vx=new Float32Array(N),vy=new Float32Array(N),pz=new Float32Array(N),life=new Float32Array(N),age=new Float32Array(N);
const rings=[],STOPS=[[68,78,224],[64,148,255],[112,226,255],[236,249,255]],RAMP=24,AB=6,pal=[];
let W=0,H=0,cx=0,cy=0,maxR2=1,t=0,repel=false,mx=-999,my=-999,pAct=false,coreKick=0,fps=60,avgKE=0;
for(let i=0;i<RAMP;i++){const f=i/(RAMP-1)*3,s=f<1?0:f<2?1:2,u=f-s,A=STOPS[s],B=STOPS[s+1],r=A[0]+(B[0]-A[0])*u|0,g=A[1]+(B[1]-A[1])*u|0,b=A[2]+(B[2]-A[2])*u|0;
 for(let j=0;j<AB;j++)pal.push('rgba('+r+','+g+','+b+','+(0.22+0.78*j/(AB-1)).toFixed(2)+')');}
function respawn(i){const m=Math.min(W,H)||640,r0=m*(0.14+Math.random()*0.34),a=Math.random()*TWO,vt=Math.sqrt(GRAV/(r0+60))*(0.82+Math.random()*0.4);
 px[i]=cx+Math.cos(a)*r0;py[i]=cy+Math.sin(a)*r0*0.94;vx[i]=-Math.sin(a)*vt;vy[i]=Math.cos(a)*vt;pz[i]=0.35+Math.random()*0.65;life[i]=12+Math.random()*26;age[i]=0;}
function shock(x,y){rings.push({x,y,r:4,a:1});coreKick=Math.min(1,coreKick+0.45);
 for(let i=0;i<N;i++){const dx=px[i]-x,dy=py[i]-y,d=Math.sqrt(dx*dx+dy*dy)+1e-4,k=150*Math.exp(-d/165);
 vx[i]+=dx/d*k-dy/d*k*0.4;vy[i]+=dy/d*k+dx/d*k*0.4;}}
function step(dt){t+=dt;coreKick=Math.max(0,coreKick-2.2*dt);const sgn=repel?-1:1,pf=pAct?1:0;let ke=0;
 for(let i=0;i<N;i++){let dx=cx-px[i],dy=cy-py[i],r2=dx*dx+dy*dy,d=Math.sqrt(r2)+1e-4,q=GRAV/(r2+SOFT),ax=q*dx/d,ay=q*dy/d;
  if(pf){dx=mx-px[i];dy=my-py[i];r2=dx*dx+dy*dy;d=Math.sqrt(r2)+1e-4;q=sgn*3e6/(r2+12000);ax+=q*dx/d;ay+=q*dy/d;}
  vx[i]+=ax*dt;vy[i]+=ay*dt;const dm=1-0.05*dt;vx[i]*=dm;vy[i]*=dm;px[i]+=vx[i]*dt;py[i]+=vy[i]*dt;
  life[i]-=dt;age[i]+=dt;ke+=vx[i]*vx[i]+vy[i]*vy[i];
  const rx=px[i]-cx,ry=py[i]-cy,rr=rx*rx+ry*ry;if(life[i]<0||rr<81||rr>maxR2)respawn(i);}
 avgKE=ke/(2*N);
 for(let i=rings.length-1;i>=0;i--){const r=rings[i];r.r+=(880-r.r*1.15)*dt;r.a=1-r.r/(Math.max(W,H)*0.46);if(r.a<=0)rings.splice(i,1);}}
function ring(rad,sq,rot,dash,col){ctx.save();ctx.rotate(rot);ctx.scale(1,sq);ctx.strokeStyle=col;ctx.lineWidth=1.1;ctx.setLineDash([3,24]);ctx.lineDashOffset=dash;ctx.beginPath();ctx.arc(0,0,rad,0,TWO);ctx.stroke();ctx.restore();}
function drawCore(){const pulse=1+0.055*Math.sin(t*2.2)+coreKick*0.35,R0=30*pulse;
 let g=ctx.createRadialGradient(cx,cy,0,cx,cy,R0*5.4);
 g.addColorStop(0,'rgba(110,160,255,'+(0.24+coreKick*0.3).toFixed(2)+')');g.addColorStop(0.45,'rgba(70,105,255,0.09)');g.addColorStop(1,'rgba(0,0,0,0)');
 ctx.fillStyle=g;ctx.beginPath();ctx.arc(cx,cy,R0*5.4,0,TWO);ctx.fill();
 g=ctx.createRadialGradient(cx,cy,0,cx,cy,R0);
 g.addColorStop(0,'rgba(245,251,255,0.95)');g.addColorStop(0.4,'rgba(150,205,255,0.7)');g.addColorStop(1,'rgba(90,140,255,0)');
 ctx.fillStyle=g;ctx.beginPath();ctx.arc(cx,cy,R0,0,TWO);ctx.fill();
 ctx.save();ctx.translate(cx,cy);
 ring(R0*2.15,0.34,t*0.42,-t*70,'rgba(140,190,255,0.55)');
 ring(R0*2.9,0.3,-t*0.26,t*52,'rgba(120,170,255,0.3)');
 ctx.restore();}
function drawParticles(){for(let i=0;i<N;i++){const sp=Math.sqrt(vx[i]*vx[i]+vy[i]*vy[i]);
  let ci=((sp-40)*0.1045)|0;if(ci<0)ci=0;else if(ci>23)ci=23;
  let ai=(Math.min(1,age[i]*1.4)*pz[i]*(AB-1))|0;if(ai>AB-1)ai=AB-1;
  ctx.fillStyle=pal[ci*AB+ai];const s=0.7+2*pz[i];ctx.fillRect(px[i]-s*0.5,py[i]-s*0.5,s,s);
  if(ci>15){ctx.fillStyle=pal[ci*AB+2];const s2=s*2.8;ctx.fillRect(px[i]-s2*0.5,py[i]-s2*0.5,s2,s2);}}}
function drawRings(){const col=repel?'255,158,203':'130,220,255';
 for(let i=0;i<rings.length;i++){const r=rings[i];
  ctx.strokeStyle='rgba('+col+','+(r.a*0.85).toFixed(2)+')';ctx.lineWidth=1+2.4*r.a;
  ctx.beginPath();ctx.arc(r.x,r.y,r.r,0,TWO);ctx.stroke();
  ctx.strokeStyle='rgba(255,255,255,'+(r.a*0.28).toFixed(2)+')';ctx.lineWidth=1;
  ctx.beginPath();ctx.arc(r.x,r.y,r.r*0.86,0,TWO);ctx.stroke();}}
function drawPointer(){if(!pAct)return;const col=repel?'255,158,203':'110,227,255',g=ctx.createRadialGradient(mx,my,0,mx,my,95);
 g.addColorStop(0,'rgba('+col+',0.22)');g.addColorStop(1,'rgba('+col+',0)');
 ctx.fillStyle=g;ctx.beginPath();ctx.arc(mx,my,95,0,TWO);ctx.fill();
 ctx.strokeStyle='rgba('+col+',0.6)';ctx.lineWidth=1;ctx.setLineDash([2,7]);ctx.lineDashOffset=-t*30;
 ctx.beginPath();ctx.arc(mx,my,16,0,TWO);ctx.stroke();ctx.setLineDash([]);}
function render(){ctx.globalCompositeOperation='destination-out';ctx.fillStyle='rgba(0,0,0,0.18)';ctx.fillRect(0,0,W,H);
 ctx.globalCompositeOperation='lighter';drawCore();drawParticles();drawRings();drawPointer();}
let last=performance.now(),acc=0,fc=0;
function frame(now){requestAnimationFrame(frame);let d=(now-last)/1000;last=now;if(d>0.1)d=0.1;
 if(d>0)fps+=(1/d-fps)*0.06;acc+=d;let n=0;while(acc>=DT&&n<3){step(DT);acc-=DT;n++;}
 render();if(++fc%12===0){vN.textContent=N;vF.textContent=Math.round(fps);vE.textContent=avgKE>=1000?(avgKE/1000).toFixed(1)+'k':avgKE|0;}}
function setMode(r){repel=r;document.body.classList.toggle('repel',r);modeTxt.textContent=r?'斥力场':'引力场';modeBtn.setAttribute('aria-pressed',String(r));vM.textContent=r?'斥力 REPEL':'引力 ATTRACT';coreKick=1;}
modeBtn.addEventListener('click',()=>setMode(!repel));
addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();setMode(!repel);}});
let dX=0,dY=0,dT=0;
cv.addEventListener('pointermove',e=>{mx=e.clientX;my=e.clientY;pAct=true;
 document.body.style.setProperty('--px',((e.clientX/W)-0.5)*-10+'px');document.body.style.setProperty('--py',((e.clientY/H)-0.5)*-8+'px');});
cv.addEventListener('pointerdown',e=>{mx=dX=e.clientX;my=dY=e.clientY;dT=performance.now();pAct=true;try{cv.setPointerCapture(e.pointerId);}catch(_){}});
cv.addEventListener('pointerup',e=>{const dx=e.clientX-dX,dy=e.clientY-dY;if(dx*dx+dy*dy<144&&performance.now()-dT<400)shock(e.clientX,e.clientY);if(e.pointerType!=='mouse')pAct=false;});
cv.addEventListener('pointercancel',()=>pAct=false);
cv.addEventListener('pointerleave',()=>pAct=false);
cv.addEventListener('contextmenu',e=>e.preventDefault());
function resize(){const d=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;cv.width=Math.round(W*d);cv.height=Math.round(H*d);ctx.setTransform(d,0,0,d,0,0);cx=W/2;cy=H/2;maxR2=Math.pow(Math.hypot(W,H)*0.6,2);}
addEventListener('resize',resize);
resize();for(let i=0;i<N;i++)respawn(i);
setMode(false);vN.textContent=N;vE.textContent='0';vF.textContent='60';requestAnimationFrame(frame);
</script>
</body>
</html>
