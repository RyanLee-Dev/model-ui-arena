<body><div id="view"></div><div id="fallback" role="alert"><div><h2>IK 工作站无法加载</h2><p>Three.js 模块不可用或 WebGL 未启用。请允许固定版本模块并检查硬件加速。</p></div></div><div class="head"><div class="logo"><strong>AXIS—6 <small>IK</small></strong><span>ROBOTICS TRAINING CELL / DLS-JACOBIAN</span></div><aside class="card"><h2>SOLVER HEALTH</h2><div class="metrics"><div class="metric">误差 mm<b id="err">0</b></div><div class="metric">奇异指标<b id="sing">0.00</b></div><div class="metric">迭代<b id="iters">0</b></div><div class="metric">路径点<b id="points">0</b></div></div><h2>JOINTS / LIMITS</h2><div id="joints"></div><h2>TARGET POSITION</h2><div id="targets"></div><p class="small">拖拽发光目标在水平工作平面移动；滚轮改变目标高度。手动模式可直接调节六个关节。</p></aside></div><div id="status" role="status" aria-live="polite">IK 就绪 · 目标位于安全工作区</div><div class="bar"><button id="mode" class="primary">IK MODE</button><select id="solver" aria-label="求解器"><option>Damped Jacobian</option><option>CCD hybrid</option></select><button id="record">+ 记录路径点</button><button id="play">▶ 插值播放</button><button id="pause">暂停</button><button id="clear">清空</button><button id="home">回零</button><span class="hint">拖拽目标 · 滚轮 Z · R 记录 · Space 播放</span></div>

const host=document.getElementById('view'),scene=new THREE.Scene();scene.background=new THREE.Color(0x05090d);scene.fog=new THREE.Fog(0x05090d,9,21);const camera=new THREE.PerspectiveCamera(43,innerWidth/innerHeight,.05,50);camera.position.set(6.4,4.8,7.2);const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,1.7));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;renderer.outputColorSpace=THREE.SRGBColorSpace;host.appendChild(renderer.domElement);const orbit=new OrbitControls(camera,renderer.domElement);orbit.target.set(0,1.7,0);orbit.enableDamping=true;orbit.maxPolarAngle=1.5;
scene.add(new THREE.HemisphereLight(0xbdeeff,0x14171c,1.4));const dl=new THREE.DirectionalLight(0xffffff,3);dl.position.set(5,9,4);dl.castShadow=true;dl.shadow.mapSize.set(1024,1024);scene.add(dl);const floor=new THREE.Mesh(new THREE.PlaneGeometry(16,16),new THREE.MeshStandardMaterial({color:0x091117,metalness:.3,roughness:.65}));floor.rotation.x=-Math.PI/2;floor.receiveShadow=true;scene.add(floor);scene.add(new THREE.GridHelper(16,32,0x3e7080,0x17313b));

const base=new THREE.Group();scene.add(base);const pedestal=new THREE.Mesh(new THREE.CylinderGeometry(.72,.9,.38,32),black);pedestal.position.y=.19;pedestal.castShadow=true;base.add(pedestal);const flange=new THREE.Mesh(new THREE.CylinderGeometry(.58,.58,.18,32),mat);flange.position.y=.47;base.add(flange);
const lengths=[.52,1.35,1.22,.6,.43,.35],limits=[[-170,170],[-105,105],[-145,145],[-180,180],[-120,120],[-360,360]].map(v=>v.map(THREE.MathUtils.degToRad)),angles=[0,.35,-.65,0,.4,0];const axes=[new THREE.Vector3(0,1,0),new THREE.Vector3(0,0,1),new THREE.Vector3(0,0,1),new THREE.Vector3(1,0,0),new THREE.Vector3(0,0,1),new THREE.Vector3(1,0,0)];let jointPos=[],jointAxes=[],end=new THREE.Vector3();
const segmentMeshes=[],jointMeshes=[];for(let i=0;i<6;i++){const seg=new THREE.Mesh(new THREE.CylinderGeometry(i<3?.16:.1,i<3?.19:.12,1,18),i%2?mat:steel);seg.castShadow=true;scene.add(seg);segmentMeshes.push(seg);const j=new THREE.Mesh(new THREE.CylinderGeometry(i<3?.25:.16,i<3?.25:.16,.2,20),black);j.castShadow=true;scene.add(j);jointMeshes.push(j)}const grip=new THREE.Group();scene.add(grip);for(let s of[-1,1]){const finger=new THREE.Mesh(new THREE.BoxGeometry(.08,.32,.1),steel);finger.position.set(0,s*.17,0);grip.add(finger)}const target=new THREE.Mesh(new THREE.IcosahedronGeometry(.15,1),glow);scene.add(target);target.position.set(2.25,1.65,.45);const halo=new THREE.Mesh(new THREE.SphereGeometry(.28,18,12),new THREE.MeshBasicMaterial({color:0x4ee9ff,wireframe:true,transparent:true,opacity:.35}));target.add(halo);
function fk(a=angles){jointPos=[];jointAxes=[];let p=new THREE.Vector3(0,.52,0),q=new THREE.Quaternion();for(let i=0;i<6;i++){jointPos.push(p.clone());const aw=axes[i].clone().applyQuaternion(q);jointAxes.push(aw);q.multiply(new THREE.Quaternion().setFromAxisAngle(axes[i],a[i]));const next=p.clone().add(new THREE.Vector3(lengths[i],0,0).applyQuaternion(q));placeLink(segmentMeshes[i],p,next);jointMeshes[i].position.copy(p);jointMeshes[i].quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),aw);p=next}end.copy(p);grip.position.copy(end);grip.quaternion.copy(q);return p}

const jointHost=document.getElementById('joints');limits.forEach((l,i)=>{jointHost.insertAdjacentHTML('beforeend',`<label class="joint"><b>J${i+1}</b><input id="j${i}" type="range" min="${THREE.MathUtils.radToDeg(l[0])}" max="${THREE.MathUtils.radToDeg(l[1])}" value="${THREE.MathUtils.radToDeg(angles[i])}" step="1"><output id="jo${i}">0°</output></label>`)});const targetHost=document.getElementById('targets');['X','Y','Z'].forEach((n,i)=>targetHost.insertAdjacentHTML('beforeend',`<label class="target">${n}<input id="t${i}" type="range" min="${i===1?.25:-3.2}" max="${i===1?3.7:3.2}" step=".02"><output id="to${i}">0</output></label>`));
let ik=true,drag=false,paths=[],playing=false,playT=0,paused=false;document.getElementById('mode').onclick=()=>{ik=!ik;mode.textContent=ik?'IK MODE':'MANUAL';mode.classList.toggle('primary',ik);status.textContent=ik?'IK 解算已启用':'手动关节控制'};for(let i=0;i<6;i++)document.getElementById('j'+i).oninput=e=>{if(!ik)angles[i]=THREE.MathUtils.degToRad(+e.target.value)};for(let i=0;i<3;i++)document.getElementById('t'+i).oninput=e=>{target.position.setComponent(i,+e.target.value)};

let last=performance.now();function frame(now){requestAnimationFrame(frame);const dt=Math.min(.04,(now-last)/1000);last=now;if(playing&&!paused&&paths.length>1){playT+=dt*.45;const n=paths.length-1,u=(playT%n),i=Math.floor(u),f=u-i;target.position.lerpVectors(paths[i],paths[i+1],f);if(playT>=n){playing=false;status.textContent='路径播放完成'}}let its=0;if(ik)its=solve();else fk();const error=target.position.distanceTo(end),reach=target.position.distanceTo(new THREE.Vector3(0,.52,0));const singular=Math.abs(Math.sin(angles[2]))*.78+Math.abs(Math.sin(angles[4]))*.22;const atLimit=angles.some((a,i)=>Math.min(a-limits[i][0],limits[i][1]-a)<.025);const bad=reach>lengths.reduce((a,b)=>a+b,0)||error>.16||atLimit;status.classList.toggle('warning',bad);status.textContent=bad?(reach>4.2?'目标不可达 · 已投影至解算边界':atLimit?'关节触及限位':'IK 残差偏高'):playing?'路径插值播放中':'IK 稳定 · 目标位于安全工作区';err.textContent=(error*1000).toFixed(0);sing.textContent=singular.toFixed(2);iters.textContent=its;angles.forEach((a,i)=>{jo(i).textContent=THREE.MathUtils.radToDeg(a).toFixed(0)+'°';if(ik)document.getElementById('j'+i).value=THREE.MathUtils.radToDeg(a)});[target.position.x,target.position.y,target.position.z].forEach((v,i)=>{document.getElementById('t'+i).value=v;document.getElementById('to'+i).textContent=v.toFixed(2)});target.rotation.y+=dt;orbit.update();renderer.render(scene,camera)}function jo(i){return document.getElementById('jo'+i)}fk();requestAnimationFrame(frame);addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});window.__arenaReady=true;
