<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>SCHWARZSCHILD · 施瓦西黑洞实时测地线渲染器</title>
<style>
  :root{
    --ink:#dfe9f5;--sub:#7d8ca3;--acc:#ffb454;--cy:#6fd6ff;
    --panel:rgba(10,14,22,.82);--line:rgba(120,170,255,.16);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;overflow:hidden}
  body{background:#000;color:var(--ink);touch-action:none;
    font-family:"Avenir Next",system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
  canvas#gl{position:fixed;inset:0;width:100vw;height:100vh;display:block;cursor:grab}
  canvas#gl:active{cursor:grabbing}
  /* —— 顶部标题栏 —— */
  #topbar{position:fixed;top:0;left:0;right:0;display:flex;align-items:baseline;gap:14px;
    padding:14px 20px;pointer-events:none;
    background:linear-gradient(180deg,rgba(4,6,10,.75),transparent)}
  #topbar .brand{font-size:15px;font-weight:700;letter-spacing:.34em;color:#f4f7fb}
  #topbar .brand em{font-style:normal;color:var(--acc);font-weight:600}
  #topbar .sub{font-size:10px;letter-spacing:.26em;color:var(--sub)}
  /* —— 控制面板 —— */
  #panel{position:fixed;left:16px;top:56px;width:262px;border-radius:14px;z-index:5;
    background:var(--panel);border:1px solid var(--line);backdrop-filter:blur(12px);
    box-shadow:0 18px 50px rgba(0,0,0,.55);overflow:hidden}
  #panel h2{font-size:10px;letter-spacing:.3em;color:var(--sub);font-weight:600;
    padding:11px 14px 8px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px}
  #panel h2::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--cy);
    box-shadow:0 0 8px var(--cy);animation:pulse 2s infinite}
  @keyframes pulse{50%{opacity:.4}}
  .tele{padding:10px 14px 4px}
  .trow{display:flex;align-items:baseline;gap:6px;padding:4.5px 0;font-size:11px;color:var(--sub);
    border-bottom:1px dashed rgba(120,170,255,.09)}
  .trow:last-child{border-bottom:none}
  .trow label{flex:1;letter-spacing:.02em}
  .trow b{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px;color:var(--cy);
    font-weight:600;font-variant-numeric:tabular-nums}
  .trow b.warm{color:var(--acc)}
  .trow span{font-size:9px;color:var(--sub)}
  .ctrl{padding:10px 14px 13px;border-top:1px solid var(--line)}
  .slider{margin:9px 0}
  .slider label{display:flex;justify-content:space-between;font-size:10.5px;color:var(--sub);
    letter-spacing:.06em;margin-bottom:5px}
  .slider label b{color:var(--ink);font-family:ui-monospace,Menlo,monospace;font-weight:500}
  input[type=range]{width:100%;height:4px;-webkit-appearance:none;appearance:none;border-radius:99px;
    background:linear-gradient(90deg,var(--acc),rgba(255,180,84,.15));outline:none}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;border-radius:50%;
    background:#ffd9a0;border:2px solid #7a4c12;box-shadow:0 0 10px rgba(255,180,84,.7);cursor:pointer}
  .tiers{display:flex;align-items:center;gap:6px;margin-top:12px;font-size:10.5px;color:var(--sub)}
  .tiers button{flex:1;padding:6px 0;border-radius:8px;border:1px solid var(--line);cursor:pointer;
    background:rgba(255,255,255,.03);color:var(--sub);font:inherit;font-size:11px;transition:.25s}
  .tiers button.on{background:linear-gradient(180deg,#2c81c4,#1d5a92);color:#fff;
    border-color:rgba(140,200,255,.5);box-shadow:0 0 14px rgba(90,170,255,.4)}
  .note{font-size:9px;color:#55637c;line-height:1.7;margin-top:9px;letter-spacing:.03em}
  /* —— 提示与通知 —— */
  #hint{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);font-size:10.5px;
    letter-spacing:.22em;color:rgba(160,180,210,.6);pointer-events:none;white-space:nowrap;
    background:rgba(6,9,15,.5);padding:7px 16px;border-radius:99px;backdrop-filter:blur(6px)}
  #toast{position:fixed;top:64px;left:50%;transform:translate(-50%,-12px);opacity:0;z-index:9;
    background:rgba(20,26,38,.94);border:1px solid rgba(255,180,84,.4);color:#ffd9a0;
    font-size:12px;letter-spacing:.08em;padding:10px 20px;border-radius:10px;pointer-events:none;
    transition:.4s;box-shadow:0 12px 30px rgba(0,0,0,.5)}
  #toast.show{opacity:1;transform:translate(-50%,0)}
  /* —— 错误界面 —— */
  #err{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;
    background:radial-gradient(100% 100% at 50% 30%,#101624,#05070c)}
  #err[hidden]{display:none}
  .ebox{width:min(90vw,460px);text-align:center;padding:38px 30px;border-radius:18px;
    background:rgba(14,18,28,.9);border:1px solid rgba(255,120,120,.25)}
  .ebox h2{font-size:17px;letter-spacing:.14em;color:#ffb0b8;margin-bottom:12px}
  .ebox p{font-size:12px;color:#93a0b8;line-height:1.8}
  .ebox pre{margin:14px 0;font-size:9.5px;color:#66748e;max-height:110px;overflow:auto;
    text-align:left;background:rgba(0,0,0,.4);padding:10px;border-radius:8px;white-space:pre-wrap}
  .ebox button{margin-top:16px;padding:10px 34px;border-radius:99px;border:1px solid rgba(140,200,255,.4);
    background:linear-gradient(180deg,#2c81c4,#1d5a92);color:#fff;font-size:13px;letter-spacing:.2em;cursor:pointer}
  @media (max-width:560px){
    #panel{width:224px;left:10px;top:50px}
    #topbar .sub{display:none}
    #hint{font-size:9px;letter-spacing:.12em}
  }
</style>
</head>
<body>
<canvas id="gl"></canvas>

<header id="topbar">
  <div class="brand">SCHWARZSCHILD <em>r<sub>s</sub> = 1</em></div>
  <div class="sub">广义相对论 · 片元测地线积分 · HDR 渲染管线</div>
</header>

<aside id="panel">
  <h2>遥测 TELEMETRY</h2>
  <section class="tele">
    <div class="trow"><label>相机距离 R</label><b id="tR">—</b><span>r<sub>s</sub></span></div>
    <div class="trow"><label>引力时间膨胀 √(1−r<sub>s</sub>/R)</label><b class="warm" id="tDil">—</b></div>
    <div class="trow"><label>圆轨道速度 β = √(r<sub>s</sub>/2R)</label><b class="warm" id="tBeta">—</b></div>
    <div class="trow"><label>帧率 / 积分步数</label><b id="tFps">—</b><span id="tSteps">—</span></div>
    <div class="trow"><label>缓冲格式</label><b id="tFmt" style="font-size:10.5px">—</b></div>
  </section>
  <section class="ctrl">
    <div class="slider"><label>吸积率 · 盘亮度 <b id="vBright">1.20</b></label>
      <input type="range" id="cBright" min="0.2" max="3" step="0.05" value="1.2"></div>
    <div class="slider"><label>曝光 EXPOSURE <b id="vExp">1.00</b></label>
      <input type="range" id="cExp" min="0.4" max="2.6" step="0.05" value="1"></div>
    <div class="tiers">画质档位
      <button data-t="0" class="on">高</button><button data-t="1">中</button><button data-t="2">低</button>
    </div>
    <p class="note">积分方案：守恒角动量形式 a = −1.5·h²·r/r⁵，蛙跳（KDK）辛积分，步长 Δλ = clamp(0.055·r, 0.0035, 0.30) 随半径自适应。多普勒集束 δ³ 与引力红移 √(1−1/r) 在盘着色函数 diskShade() 中实现。</p>
  </section>
</aside>

<div id="hint">拖拽旋转（带惯性） · 滚轮 / 双指捏合缩放</div>
<div id="toast"></div>

<div id="err" hidden>
  <div class="ebox">
    <h2>渲染器无法启动</h2>
    <p id="errmsg">—</p>
    <pre id="errlog" hidden></pre>
    <button onclick="location.reload()">重 新 加 载</button>
  </div>
</div>

<script>
/* =====================================================================
 * 施瓦西黑洞实时渲染器（单文件 · 零依赖 · WebGL2）
 *
 * 【物理与数值方案】
 *  - 几何单位制 r_s = 1。光线（零测地线）在片元着色器中数值积分：
 *      d²x/dλ² = -1.5 * |h|² * x / |x|^5 ,  h = x × v（守恒角动量向量）
 *    这是施瓦西度规下零测地线的守恒量约化形式，光线弯曲完全由积分
 *    产生（无屏幕空间扭曲）。
 *  - 积分器：蛙跳（Kick-Drift-Kick）辛格式，能量漂移小；
 *    步长自适应 Δλ = clamp(0.055·r, 0.0035, 0.30)：近视界步长加密，
 *    远场放大步长；步数上限按画质档位 260 / 170 / 110。
 *  - 终止条件：r < 1 落入视界（纯黑阴影）；r > 46 且向外 → 采样星空。
 *    r ≈ 1.5 的光子球自然产生阴影边缘细亮环与盘的次级像（多重像）。
 *  - 吸积盘：赤道面（y=0）薄盘，内缘 ISCO r=3，外缘 12.5。
 *    diskShade() 中同时实现：
 *      ① 相对论多普勒集束 I ∝ δ³（δ = 1/(γ(1−β·μ))），
 *         且黑体温度按 T→T·δ 偏移（近侧更亮更蓝，远侧更暗更红）；
 *      ② 引力红移因子 √(1 − 1/r)；
 *      ③ 温度随半径黑体着色 T ∝ (r/r_in)^(−3/4)；
 *      ④ 开普勒差速旋转条纹 φ − Ω(r)·t，Ω ∝ r^(−3/2)（内快外慢）。
 *
 * 【后期管线（多 pass）】
 *  Pass 1  scene    → 浮点 FBO（RGBA16F，不支持时降级 RGBA8）
 *  Pass 2  bright   → 高亮提取（阈值软过渡），半分辨率
 *  Pass 3  blurH    → 9 tap 线性采样高斯模糊（水平）
 *  Pass 4  blurV    → 高斯模糊（垂直）
 *  Pass 5  composite→ scene + bloom → 曝光 → ACES 色调映射 → 屏幕
 * ===================================================================== */
"use strict";
const canvas = document.getElementById("gl");
const errBox = document.getElementById("err");
function showErr(msg, log) {
  document.getElementById("errmsg").textContent = msg;
  if (log) { const p = document.getElementById("errlog"); p.hidden = false; p.textContent = log.slice(0, 1500); }
  errBox.hidden = false;
}
let gl = null;
try { gl = canvas.getContext("webgl2", { antialias: false, alpha: false }); } catch (e) {}
if (!gl) { showErr("当前浏览器或设备不支持 WebGL2，无法运行本渲染器。请使用最新版 Chrome / Edge / Firefox / Safari。"); throw new Error("no webgl2"); }

/* ---------- 着色器源码 ---------- */
const VS = `#version 300 es
layout(location=0) in vec2 aP;
void main(){ gl_Position = vec4(aP, 0.0, 1.0); }`;

const FS_SCENE = `#version 300 es
precision highp float;
uniform vec2  uRes;
uniform float uTime;
uniform vec3  uCam;
uniform mat3  uBasis;
uniform float uK;          // 视场系数 tan(fov/2)
uniform float uBright;     // 吸积率 / 盘亮度
uniform int   uSteps;      // 最大积分步数（画质档位）
out vec4 frag;

const float DISK_IN  = 3.0;    // ISCO 内缘（r_s=1 时 ISCO = 3 r_s）
const float DISK_OUT = 12.5;   // 盘外缘
const float ESC      = 46.0;   // 逃逸半径

float hash13(vec3 p){ p = fract(p*0.1031); p += dot(p, p.yzx+33.33); return fract((p.x+p.y)*p.z); }

/* 黑体颜色近似：T 从 ~0.3（外缘，暗红）到 ~1（内缘，暖白） */
vec3 blackbody(float T){
  T = clamp(T, 0.05, 2.5);
  vec3 c;
  c.r = smoothstep(0.02, 0.42, T);
  c.g = pow(smoothstep(0.18, 1.05, T), 1.25);
  c.b = pow(smoothstep(0.55, 1.55, T), 1.5);
  return c * (0.30 + 0.85*T*T);
}

/* 程序化星空背景（被透镜偏折后由积分末端采样） */
vec3 bgStars(vec3 d){
  vec3 col = vec3(0.010, 0.014, 0.026);
  float mw = exp(-pow(dot(d, normalize(vec3(0.35, 0.9, -0.2)))*3.0, 2.0));
  col += vec3(0.05, 0.06, 0.09) * mw * (0.55 + 0.45*hash13(floor(d*24.0)));
  vec3 g = floor(d*150.0);
  float h = hash13(g);
  if (h > 0.9956) {
    vec3 f = fract(d*150.0) - 0.5;
    float s = exp(-dot(f, f)*26.0);
    float tw = 0.7 + 0.3*sin(uTime*2.2 + h*97.0);
    col += vec3(0.92, 0.95, 1.0) * s * tw * smoothstep(0.9956, 1.0, h) * 2.6;
  }
  return col;
}

/* 相对论吸积盘着色。
 * 多普勒因子 delta、引力红移 grav、黑体温度 T∝r^(-3/4)、
 * 差速旋转条纹 均在此函数内（见文件头注释）。返回 rgb=发射，a=不透明度。 */
vec4 diskShade(vec3 hp, vec3 vdir){
  float r = length(hp.xz);
  float edge = smoothstep(DISK_IN, DISK_IN+0.55, r) * (1.0 - smoothstep(DISK_OUT-2.8, DISK_OUT, r));
  if (edge <= 0.002) return vec4(0.0);
  float phi   = atan(hp.z, hp.x);
  float omega = 0.7071 * pow(r, -1.5);            // Ω ∝ r^(-3/2)，内快外慢
  float pat   = phi - omega * uTime;               // 随盘旋转的条纹坐标
  float stripes = 0.70 + 0.30 * sin(pat*6.0 + 1.7*sin(pat*2.0 + r*2.2));
  float T     = pow(r / DISK_IN, -0.75);           // ③ 温度 ∝ r^(-3/4)
  float beta  = sqrt(0.5 / r);                     // 圆轨道速度 β=√(r_s/2r)
  vec3  tang  = vec3(-hp.z, 0.0, hp.x) / r;        // 切向（逆时针）
  float mu    = dot(tang, -normalize(vdir));       // 朝观察者方向夹角
  float gam   = inversesqrt(max(1e-5, 1.0 - beta*beta));
  float delta = 1.0 / (gam * (1.0 - beta*mu));     // ① 多普勒因子
  float grav  = sqrt(max(0.0, 1.0 - 1.0/r));       // ② 引力红移因子
  vec3 emit = blackbody(T * delta)                 // 温度按 δ 偏移（蓝移/红移）
            * pow(delta, 3.0)                      // ① 集束 I ∝ δ³
            * grav;                                // ② 引力红移衰减
  float alpha = edge * (0.42 + 0.42*stripes);
  return vec4(emit * stripes * edge * uBright, alpha);
}

void main(){
  vec2 uv = (2.0*gl_FragCoord.xy - uRes) / uRes.y;
  vec3 rd = normalize(uBasis * vec3(uv*uK, 1.0));
  vec3 p = uCam, v = rd;
  vec3 h = cross(p, v);
  float h2 = dot(h, h);                            // 守恒量 |h|²
  vec3 acc = vec3(0.0);
  float trans = 1.0;
  vec3 prev = p;
  bool trapped = false;
  for (int i = 0; i < 320; i++) {
    if (i >= uSteps) break;
    float r2 = dot(p, p), r = sqrt(r2);
    if (r < 1.0) { trapped = true; break; }        // 视界：纯黑阴影
    if (r > ESC && dot(p, v) > 0.0) {              // 逃逸：采样星空
      acc += trans * bgStars(normalize(v));
      trans = 0.0;
      break;
    }
    /* KDK 蛙跳：半步 kick → drift → 半步 kick（新位置加速度） */
    float dt = clamp(0.055*r, 0.0035, 0.30);
    vec3 a1 = -1.5 * h2 * p / (r2*r2*r);
    vec3 vm = v + a1 * (0.5*dt);
    vec3 np = p + vm * dt;
    float nr2 = dot(np, np), nr = sqrt(nr2);
    vec3 a2 = -1.5 * h2 * np / (nr2*nr2*max(nr, 0.05));
    vec3 nv = vm + a2 * (0.5*dt);
    /* 赤道面穿越 → 盘前后向累积（允许多次穿越，得到次级像） */
    if (prev.y * np.y < 0.0) {
      float tt = prev.y / (prev.y - np.y);
      vec3 hp = mix(prev, np, tt);
      vec4 dc = diskShade(hp, vm);
      if (dc.a > 0.0) {
        acc += trans * dc.rgb;
        trans *= 1.0 - dc.a;
        if (trans < 0.02) break;
      }
    }
    prev = np; p = np; v = nv;
  }
  frag = vec4(acc, 1.0);
}`;

const FS_BRIGHT = `#version 300 es
precision highp float;
uniform sampler2D uTex; uniform vec2 uRes;
out vec4 frag;
void main(){
  vec3 c = texture(uTex, gl_FragCoord.xy / uRes).rgb;
  float l = max(max(c.r, c.g), c.b);
  frag = vec4(c * smoothstep(0.85, 1.7, l), 1.0);   // 高亮提取（软阈值）
}`;

const FS_BLUR = `#version 300 es
precision highp float;
uniform sampler2D uTex; uniform vec2 uDir; uniform vec2 uRes;  // uDir 为归一化 texel 步长
out vec4 frag;
void main(){
  vec2 uv = gl_FragCoord.xy / uRes;
  vec3 s = texture(uTex, uv).rgb * 0.2270270;
  s += (texture(uTex, uv + uDir*1.3846154).rgb
      + texture(uTex, uv - uDir*1.3846154).rgb) * 0.3162162;
  s += (texture(uTex, uv + uDir*3.2307692).rgb
      + texture(uTex, uv - uDir*3.2307692).rgb) * 0.0702703;
  frag = vec4(s, 1.0);
}`;

const FS_COMP = `#version 300 es
precision highp float;
uniform sampler2D uScene; uniform sampler2D uBloom;
uniform vec2 uRes; uniform float uExposure;
out vec4 frag;
vec3 aces(vec3 x){ return clamp((x*(2.51*x+0.03))/(x*(2.43*x+0.59)+0.14), 0.0, 1.0); }
float hash21(vec2 p){ return fract(sin(dot(p, vec2(12.9898,78.233)))*43758.5453); }
void main(){
  vec2 uv = gl_FragCoord.xy / uRes;
  vec3 c = texture(uScene, uv).rgb + texture(uBloom, uv).rgb * 1.15;
  c *= uExposure;
  c = aces(c);
  vec2 q = uv - 0.5;                                   // 轻微暗角
  c *= 1.0 - 0.34 * pow(dot(q, q)*1.6, 1.4);
  c += (hash21(gl_FragCoord.xy) - 0.5) / 255.0;        // 抖动去色带
  frag = vec4(c, 1.0);
}`;

/* ---------- 编译与程序 ---------- */
function sh(type, src) {
  const s = gl.createShader(type);
  gl.shaderSource(s, src); gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) {
    const log = gl.getShaderInfoLog(s);
    showErr("着色器编译失败（Shader Compile Error），请查看日志。", log);
    throw new Error("shader compile: " + log);
  }
  return s;
}
function prog(fs) {
  const p = gl.createProgram();
  gl.attachShader(p, sh(gl.VERTEX_SHADER, VS));
  gl.attachShader(p, sh(gl.FRAGMENT_SHADER, fs));
  gl.linkProgram(p);
  if (!gl.getProgramParameter(p, gl.LINK_STATUS)) {
    const log = gl.getProgramInfoLog(p);
    showErr("着色器链接失败（Program Link Error）。", log);
    throw new Error("link: " + log);
  }
  return p;
}
const pScene = prog(FS_SCENE), pBright = prog(FS_BRIGHT), pBlur = prog(FS_BLUR), pComp = prog(FS_COMP);
const U = (p, n) => gl.getUniformLocation(p, n);

/* 全屏三角形 */
const vao = gl.createVertexArray();
gl.bindVertexArray(vao);
const vb = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, vb);
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
gl.enableVertexAttribArray(0);
gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);

/* ---------- HDR 帧缓冲（浮点，自动降级） ---------- */
let fmtName = "RGBA8";
const extCBF = gl.getExtension("EXT_color_buffer_float") || gl.getExtension("EXT_color_buffer_half_float");
function makeTarget(w, h, wantFloat) {
  const tex = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, tex);
  let ok = false;
  if (wantFloat && extCBF) {
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA16F, w, h, 0, gl.RGBA, gl.HALF_FLOAT, null);
    ok = true;
  } else {
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA8, w, h, 0, gl.RGBA, gl.UNSIGNED_BYTE, null);
  }
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  const fbo = gl.createFramebuffer();
  gl.bindFramebuffer(gl.FRAMEBUFFER, fbo);
  gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, tex, 0);
  if (gl.checkFramebufferStatus(gl.FRAMEBUFFER) !== gl.FRAMEBUFFER_COMPLETE) {
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    return makeTarget(w, h, false);                    // 降级 RGBA8 而非黑屏
  }
  if (ok) fmtName = "RGBA16F HDR";
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  return { tex, fbo, w, h };
}
let tgtScene, tgtBloomA, tgtBloomB, sceneW = 0, sceneH = 0, bw = 0, bh = 0;

/* ---------- 画质档位 ---------- */
const TIERS = [
  { name: "高", scale: 1.0,  steps: 260 },
  { name: "中", scale: 0.72, steps: 170 },
  { name: "低", scale: 0.5,  steps: 110 }
];
let tier = 0;
const dpr = Math.min(2, window.devicePixelRatio || 1);

function rebuildTargets() {
  const t = TIERS[tier];
  sceneW = Math.max(2, Math.round(canvas.width * t.scale / 2) * 2);
  sceneH = Math.max(2, Math.round(canvas.height * t.scale / 2) * 2);
  bw = Math.max(2, Math.round(sceneW / 2)); bh = Math.max(2, Math.round(sceneH / 2));
  [tgtScene, tgtBloomA, tgtBloomB].forEach(o => {
    if (o) { gl.deleteTexture(o.tex); gl.deleteFramebuffer(o.fbo); }
  });
  tgtScene  = makeTarget(sceneW, sceneH, true);
  tgtBloomA = makeTarget(bw, bh, false);
  tgtBloomB = makeTarget(bw, bh, false);
  document.getElementById("tFmt").textContent = fmtName;
  document.getElementById("tSteps").textContent = "/ " + t.steps + " 步";
}
function sizeCanvas() {
  canvas.width = Math.round(innerWidth * dpr);
  canvas.height = Math.round(innerHeight * dpr);
  rebuildTargets();
}
sizeCanvas();
addEventListener("resize", sizeCanvas);

/* ---------- 相机与交互（拖拽惯性 + 滚轮 + 双指捏合） ---------- */
let yaw = 0.72, pitch = 0.30, dist = 14.0;
let vyaw = 0, vpitch = 0;
const DIST_MIN = 2.4, DIST_MAX = 40;                  // 不允许穿入视界
const pointers = new Map();
let pinchD = 0;
canvas.addEventListener("pointerdown", e => {
  canvas.setPointerCapture(e.pointerId);
  pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (pointers.size === 2) {
    const [a, b] = [...pointers.values()];
    pinchD = Math.hypot(a.x - b.x, a.y - b.y);
  }
  vyaw = vpitch = 0;
});
canvas.addEventListener("pointermove", e => {
  if (!pointers.has(e.pointerId)) return;
  const p0 = pointers.get(e.pointerId);
  const dx = e.clientX - p0.x, dy = e.clientY - p0.y;
  pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (pointers.size === 1) {
    yaw += dx * 0.0052; vyaw = dx * 0.0052;
    pitch = Math.max(-1.35, Math.min(1.35, pitch + dy * 0.0052));
    vpitch = dy * 0.0052;
  } else if (pointers.size === 2) {
    const [a, b] = [...pointers.values()];
    const d = Math.hypot(a.x - b.x, a.y - b.y);
    if (pinchD > 0) dist = Math.max(DIST_MIN, Math.min(DIST_MAX, dist * pinchD / d));
    pinchD = d;
  }
});
const upHandler = e => { pointers.delete(e.pointerId); pinchD = 0; };
canvas.addEventListener("pointerup", upHandler);
canvas.addEventListener("pointercancel", upHandler);
canvas.addEventListener("wheel", e => {
  e.preventDefault();
  dist = Math.max(DIST_MIN, Math.min(DIST_MAX, dist * Math.exp(e.deltaY * 0.0011)));
}, { passive: false });

/* ---------- 控件 ---------- */
let uBrightVal = 1.2, uExpVal = 1.0;
document.getElementById("cBright").addEventListener("input", e => {
  uBrightVal = +e.target.value;
  document.getElementById("vBright").textContent = uBrightVal.toFixed(2);
});
document.getElementById("cExp").addEventListener("input", e => {
  uExpVal = +e.target.value;
  document.getElementById("vExp").textContent = uExpVal.toFixed(2);
});
const tierBtns = document.querySelectorAll(".tiers button");
function setTier(i, silent) {
  tier = i; rebuildTargets();
  tierBtns.forEach(b => b.classList.toggle("on", +b.dataset.t === i));
  if (!silent) toast("画质档位：" + TIERS[i].name);
}
tierBtns.forEach(b => b.addEventListener("click", () => setTier(+b.dataset.t, false)));
let toastTimer = 0;
function toast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg; t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove("show"), 2600);
}

/* ---------- context lost 容错 ---------- */
canvas.addEventListener("webglcontextlost", e => {
  e.preventDefault();
  showErr("WebGL 上下文丢失（Context Lost）。可能是显存不足或驱动重置，请重新加载。");
});

/* ---------- 遥测 ---------- */
const tR = document.getElementById("tR"), tDil = document.getElementById("tDil"),
      tBeta = document.getElementById("tBeta"), tFps = document.getElementById("tFps");
let hudAt = 0;
function updateHUD(fps) {
  tR.textContent = dist.toFixed(2);
  tDil.textContent = Math.sqrt(1 - 1 / dist).toFixed(4);   // √(1 − r_s/R)
  tBeta.textContent = Math.sqrt(1 / (2 * dist)).toFixed(4); // β = √(r_s/2R)
  tFps.textContent = Math.round(fps) + " fps";
}

/* ---------- 主循环 ---------- */
let slowFrames = 0, lastT = performance.now(), fpsEMA = 60, cooldown = 0;
function frame(now) {
  const rawDt = now - lastT; lastT = now;
  fpsEMA += (1000 / Math.max(1, rawDt) - fpsEMA) * 0.06;

  /* 惯性旋转 */
  if (pointers.size === 0) {
    yaw += vyaw; pitch = Math.max(-1.35, Math.min(1.35, pitch + vpitch));
    vyaw *= 0.94; vpitch *= 0.94;
  }
  const cp = Math.cos(pitch), camPos = [dist * cp * Math.sin(yaw), dist * Math.sin(pitch), dist * cp * Math.cos(yaw)];
  const fwd = [-camPos[0] / dist, -camPos[1] / dist, -camPos[2] / dist];
  const up0 = [0, 1, 0];
  let right = [fwd[1] * up0[2] - fwd[2] * up0[1], fwd[2] * up0[0] - fwd[0] * up0[2], fwd[0] * up0[1] - fwd[1] * up0[0]];
  const rl = Math.hypot(...right); right = right.map(v => v / rl);
  const up = [right[1] * fwd[2] - right[2] * fwd[1], right[2] * fwd[0] - right[0] * fwd[2], right[0] * fwd[1] - right[1] * fwd[0]];
  const basis = new Float32Array([right[0], right[1], right[2], up[0], up[1], up[2], fwd[0], fwd[1], fwd[2]]);

  /* Pass 1: 场景 → HDR FBO */
  gl.bindFramebuffer(gl.FRAMEBUFFER, tgtScene.fbo);
  gl.viewport(0, 0, sceneW, sceneH);
  gl.useProgram(pScene);
  gl.uniform2f(U(pScene, "uRes"), sceneW, sceneH);
  gl.uniform1f(U(pScene, "uTime"), now * 0.001);
  gl.uniform3fv(U(pScene, "uCam"), camPos);
  gl.uniformMatrix3fv(U(pScene, "uBasis"), false, basis);
  gl.uniform1f(U(pScene, "uK"), 0.62);
  gl.uniform1f(U(pScene, "uBright"), uBrightVal);
  gl.uniform1i(U(pScene, "uSteps"), TIERS[tier].steps);
  gl.bindVertexArray(vao);
  gl.drawArrays(gl.TRIANGLES, 0, 3);

  /* Pass 2: 高亮提取 */
  gl.bindFramebuffer(gl.FRAMEBUFFER, tgtBloomA.fbo);
  gl.viewport(0, 0, bw, bh);
  gl.useProgram(pBright);
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, tgtScene.tex);
  gl.uniform1i(U(pBright, "uTex"), 0);
  gl.uniform2f(U(pBright, "uRes"), bw, bh);
  gl.drawArrays(gl.TRIANGLES, 0, 3);

  /* Pass 3/4: 高斯模糊 H / V */
  gl.useProgram(pBlur);
  gl.uniform1i(U(pBlur, "uTex"), 0);
  gl.uniform2f(U(pBlur, "uRes"), bw, bh);
  gl.bindFramebuffer(gl.FRAMEBUFFER, tgtBloomB.fbo);
  gl.uniform2f(U(pBlur, "uDir"), 1 / bw, 0);
  gl.bindTexture(gl.TEXTURE_2D, tgtBloomA.tex);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
  gl.bindFramebuffer(gl.FRAMEBUFFER, tgtBloomA.fbo);
  gl.uniform2f(U(pBlur, "uDir"), 0, 1 / bh);
  gl.bindTexture(gl.TEXTURE_2D, tgtBloomB.tex);
  gl.drawArrays(gl.TRIANGLES, 0, 3);

  /* Pass 5: 合成 + ACES 色调映射 */
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  gl.viewport(0, 0, canvas.width, canvas.height);
  gl.useProgram(pComp);
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, tgtScene.tex);
  gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D, tgtBloomA.tex);
  gl.uniform1i(U(pComp, "uScene"), 0);
  gl.uniform1i(U(pComp, "uBloom"), 1);
  gl.uniform2f(U(pComp, "uRes"), canvas.width, canvas.height);
  gl.uniform1f(U(pComp, "uExposure"), uExpVal);
  gl.drawArrays(gl.TRIANGLES, 0, 3);

  /* HUD + 自适应降档 */
  if (now - hudAt > 150) { hudAt = now; updateHUD(fpsEMA); }
  cooldown = Math.max(0, cooldown - rawDt);
  if (rawDt > 34) slowFrames++; else slowFrames = Math.max(0, slowFrames - 2);
  if (slowFrames > 140 && tier < 2 && cooldown === 0) {
    slowFrames = 0; cooldown = 4000;
    setTier(tier + 1, true);
    toast("检测到帧率过低，已自动降至「" + TIERS[tier].name + "」画质");
  }
  requestAnimationFrame(frame);
}
updateHUD(60);
requestAnimationFrame(frame);
</script>
</body>
</html>
