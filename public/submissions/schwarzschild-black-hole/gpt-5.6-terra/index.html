<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Schwarzschild / RS-1</title><style>html,body,canvas{margin:0;width:100%;height:100%;background:#020207;overflow:hidden;font-family:ui-monospace;color:#dce9ff}aside{position:fixed;top:18px;left:18px;padding:15px;border:1px solid #574a83;background:#090817c9;line-height:1.7;font-size:12px;backdrop-filter:blur(8px)}b{color:#ffca72}label{display:block;margin-top:6px}input,select{width:130px;accent-color:#f9a44a}#err{display:none;position:fixed;inset:0;place-items:center;text-align:center;background:#080811;color:#fff;padding:40px}</style><canvas id="c"></canvas><aside>RS-1 · SCHWARZSCHILD OBSERVATORY<br>r camera <b id="r"></b> rₛ<br>time dilation <b id="td"></b><br>orbital β <b id="be"></b><label>盘亮度 <input id="disk" type="range" min=".2" max="2" step=".1" value="1"></label><label>曝光 <input id="exp" type="range" min=".4" max="2" step=".1" value="1"></label><label>质量 <select id="quality"><option value="1">HIGH</option><option value=".65">ECO</option></select></label><small>拖拽旋转 · 滚轮缩放</small></aside><div id="err"><div><h2>无法启动实时渲染器</h2><p>此浏览器未提供 WebGL，或图形上下文已丢失。</p></div></div><script>let gl=c.getContext('webgl');if(!gl){err.style.display='grid';throw Error('no webgl')}let vs='attribute vec2 p;void main(){gl_Position=vec4(p,0,1);}';let fs=`precision highp float;uniform vec2 R;uniform float yaw,dist,bright,exposure;/* Geodesic: symplectic Euler in polar form. r_s=1, 160 fixed steps; acceleration = -1.5*h²*r/r⁵. */vec3 rot(vec3 p){float a=yaw;return vec3(cos(a)*p.x+sin(a)*p.z,p.y,-sin(a)*p.x+cos(a)*p.z);}vec3 disk(vec3 p,vec3 d){float t=-p.y/d.y;if(t<0.)return vec3(0.);vec3 q=p+d*t;float rr=length(q.xz);if(rr<3.||rr>18.)return vec3(0.);float phi=atan(q.z,q.x);float beta=sqrt(.5/rr);float dop=1./(1.-beta*sin(phi));float red=sqrt(1.-1./rr);float stripes=.65+.35*sin(phi*9.+rr*5.);float T=pow(3./rr,.75);vec3 col=mix(vec3(1.,.06,.01),vec3(1.,.78,.35),T)*red*pow(dop,3.)*stripes;return col*bright;}void main(){vec2 uv=(gl_FragCoord.xy-.5*R)/R.y;vec3 pos=rot(vec3(0.,2.2,dist));vec3 dir=normalize(rot(vec3(uv.x,uv.y,-1.5)));float h=length(cross(pos,dir));vec3 col=vec3(0.);for(int i=0;i<160;i++){float rr=length(pos);if(rr<1.){col=vec3(0.);break;}float step=.055*clamp(rr*.18,1.,4.);vec3 a=-1.5*h*h*pos/(rr*rr*rr*rr*rr);dir=normalize(dir+a*step);vec3 before=pos;pos+=dir*step;float y0=before.y,y1=pos.y;if(y0*y1<0.)col+=disk(before,dir);if(rr<1.65&&rr>1.45)col+=vec3(.8,.5,.16)*.045; if(i==159){float stars=fract(sin(dot(dir.xy,vec2(91.,37.)))*43758.);col+=vec3(step(.997,stars)*.8);}}/* tone mapping pass approximation: HDR color enters ACES curve */col*=exposure;col=(col*(2.51*col+.03))/(col*(2.43*col+.59)+.14);gl_FragColor=vec4(col,1.);}`;function sh(t,s){let q=gl.createShader(t);gl.shaderSource(q,s);gl.compileShader(q);if(!gl.getShaderParameter(q,gl.COMPILE_STATUS))throw Error(gl.getShaderInfoLog(q));return q}let pr=gl.createProgram();gl.attachShader(pr,sh(gl.VERTEX_SHADER,vs));gl.attachShader(pr,sh(gl.FRAGMENT_SHADER,fs));gl.linkProgram(pr);let b=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,b);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,3,-1,-1,3]),gl.STATIC_DRAW);gl.useProgram(pr);let a=gl.getAttribLocation(pr,'p');gl.enableVertexAttribArray(a);gl.vertexAttribPointer(a,2,gl.FLOAT,false,0,0);let yaw=.25,D=11,drag;function resize(){c.width=innerWidth*(+quality.value);c.height=innerHeight*(+quality.value);gl.viewport(0,0,c.width,c.height)}resize();onresize=resize;c.onpointerdown=e=>drag=e.clientX;c.onpointermove=e=>{if(drag!=null){yaw+=(e.clientX-drag)*.006;drag=e.clientX}};onpointerup=()=>drag=null;c.onwheel=e=>{D=Math.max(4,Math.min(25,D+e.deltaY*.01));e.preventDefault()};c.addEventListener('webglcontextlost',e=>{e.preventDefault();err.style.display='grid'});function frame(){gl.uniform2f(gl.getUniformLocation(pr,'R'),c.width,c.height);gl.uniform1f(gl.getUniformLocation(pr,'yaw'),yaw);gl.uniform1f(gl.getUniformLocation(pr,'dist'),D);gl.uniform1f(gl.getUniformLocation(pr,'bright'),+disk.value);gl.uniform1f(gl.getUniformLocation(pr,'exposure'),+exp.value);gl.drawArrays(gl.TRIANGLES,0,3);r.textContent=D.toFixed(2);td.textContent=Math.sqrt(1-1/D).toFixed(4);be.textContent=Math.sqrt(1/(2*D)).toFixed(4);requestAnimationFrame(frame)}frame()</script></html>
